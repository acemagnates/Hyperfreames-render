<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>OriginalSpot Clip 03 — The Crystallized Resolution</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Courier+Prime:wght@400&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/OriginalSpot/originalspot-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#070709}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;--g-x:50%;--g-y:58%}
    .solid-bg{position:absolute;inset:0;background:#070709;z-index:0}
    .plate-stage{position:absolute;inset:0;z-index:1;opacity:0.1;mix-blend-mode:overlay;pointer-events:none}
    .plate-stage img{width:100%;height:100%;object-fit:cover}
    #vault-bg{position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse 85% 55% at var(--g-x) var(--g-y),rgba(14,194,221,0.09),#070709 65%,#020203 100%)}
    #carry-flash{position:absolute;inset:0;z-index:3;background:#fff;opacity:0.92;pointer-events:none}
    .camera-rig{position:absolute;inset:0;z-index:4;perspective:1400px;transform-style:preserve-3d;will-change:transform}
    .z-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    #monolith-wrap{position:relative;width:min(82vw,780px);height:min(62vh,900px);opacity:0;transform-origin:50% 52%;will-change:transform}
    .monolith-geom{position:relative;width:100%;height:100%;filter:drop-shadow(0 28px 48px rgba(0,0,0,0.88))}
    #monolith-wrap .geom-svg{width:100%;height:100%;display:block}
    #monolith-spec{position:absolute;inset:12% 18% 28% 22%;background:linear-gradient(135deg,rgba(255,255,255,0.14),transparent 55%);mix-blend-mode:overlay;opacity:0;pointer-events:none;border-radius:2px}
    #survey-overlay{position:absolute;inset:-4%;pointer-events:none;z-index:2}
    #survey-overlay svg{width:100%;height:100%}
    .survey-path{fill:none;stroke:#0ec2dd;vector-effect:non-scaling-stroke}
    .facet-line{stroke-width:1;opacity:0.9}
    .seismo{stroke-width:1.2;stroke-dasharray:1200;stroke-dashoffset:1200}
    .z-mg{position:absolute;inset:0;z-index:6;pointer-events:none}
    #dust-particles{position:absolute;inset:0}
    .debris{position:absolute;opacity:0}
    .z-fg{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;align-items:center;justify-content:center}
    #readout-layer{position:absolute;width:min(82vw,780px);height:min(62vh,900px);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
    .readout{font-family:"Courier Prime",monospace;font-size:12px;letter-spacing:0.28em;color:rgba(110,110,115,0.78);position:absolute;opacity:0;text-transform:uppercase}
    #read-dt{left:8px;top:18%}
    #read-rho{left:8px;bottom:26%}
    #read-lam{right:8px;top:42%}
    .chapter{position:absolute;left:52px;bottom:168px;font-family:"Cormorant Garamond",serif;font-size:38px;font-weight:600;letter-spacing:0.12em;color:rgba(110,110,115,0.55);opacity:0}
    #vault-fade{position:absolute;inset:0;z-index:25;background:#070709;opacity:0;pointer-events:none}
    #vig{position:absolute;inset:0;z-index:18;background:radial-gradient(ellipse 72% 52% at 50% 44%,transparent 16%,rgba(0,0,0,0.76) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:22;mix-blend-mode:overlay;opacity:0.2;pointer-events:none;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="root" data-composition-id="OriginalSpot-clip-03" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="10" data-track-index="0"></div>
    <div class="plate-stage clip" data-start="0" data-duration="10" data-track-index="1">
      <img src="assets/OriginalSpot/plates/ref-void-glass.jpg" alt="" />
    </div>
    <div id="vault-bg" class="clip" data-start="0" data-duration="10" data-track-index="2"></div>
    <div id="carry-flash" class="clip" data-start="0" data-duration="10" data-track-index="3"></div>
    <div class="camera-rig grade-target clip" data-start="0" data-duration="10" data-track-index="4" id="cam03">
      <div class="z-bg clip" data-start="0" data-duration="10" data-track-index="5">
        <div id="monolith-wrap" class="clip" data-start="0" data-duration="10" data-track-index="6">
          <div class="monolith-geom" id="monolith-geom"></div>
          <div id="monolith-spec" class="clip" data-start="0" data-duration="10" data-track-index="7"></div>
          <div id="survey-overlay" aria-hidden="true">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
              <line class="survey-path facet-line" x1="50" y1="5" x2="50" y2="95" />
              <line class="survey-path facet-line" x1="10" y1="25" x2="50" y2="45" />
              <line class="survey-path facet-line" x1="90" y1="25" x2="50" y2="45" />
              <line class="survey-path facet-line" x1="10" y1="75" x2="50" y2="45" />
              <line class="survey-path facet-line" x1="90" y1="75" x2="50" y2="45" />
              <path class="survey-path seismo" d="M 6 82 L 18 80 L 32 84 L 48 79 L 64 83 L 78 78 L 94 81" />
            </svg>
          </div>
        </div>
      </div>
      <div class="z-mg clip" data-start="0" data-duration="10" data-track-index="8">
        <div id="dust-particles"></div>
      </div>
      <div class="z-fg clip" data-start="0" data-duration="10" data-track-index="9">
        <div id="readout-layer">
          <span class="readout clip" id="read-dt" data-start="0" data-duration="10" data-track-index="10">Δt</span>
          <span class="readout clip" id="read-rho" data-start="0" data-duration="10" data-track-index="11">ρ</span>
          <span class="readout clip" id="read-lam" data-start="0" data-duration="10" data-track-index="12">λ</span>
        </div>
        <p class="chapter clip" data-start="0" data-duration="10" data-track-index="13">RESOLUTION</p>
      </div>
    </div>
    <div id="vault-fade" class="clip" data-start="0" data-duration="10" data-track-index="14"></div>
    <div id="vig" class="clip" data-start="0" data-duration="10" data-track-index="15"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="10" data-track-index="16" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    function init03() {
      var OS = window.OriginalSpot;
      var CID = "OriginalSpot-clip-03";
      var D = 10;
      if (!OS) return;
      OS.registerEases(gsap);
      var geomEl = document.getElementById("monolith-geom");
      var dust = document.getElementById("dust-particles");
      var grain = document.getElementById("grain");
      var vault = document.getElementById("vault-bg");
      if (!geomEl || !dust || !grain) return;
      geomEl.innerHTML = OS.crystalGeometricSVGs.monolith;
      var debris = OS.spawnDebris(dust, 36, 4303);
      OS.initGrain(grain, 0.2, 4303);
      var tl = OS.makeTimeline(CID);
      var seismo = document.querySelector(".seismo");
      var facets = document.querySelectorAll(".facet-line");
      gsap.set("#cam03", { scale: 1.12, y: 40 });
      gsap.set("#monolith-wrap", { autoAlpha: 0, rotationY: -6, rotationX: 4 });
      gsap.set("#monolith-spec", { autoAlpha: 0 });
      gsap.set(".chapter", { autoAlpha: 0, y: 18 });
      gsap.set(".readout", { autoAlpha: 0 });
      facets.forEach(function (line) {
        gsap.set(line, { strokeDasharray: 72, strokeDashoffset: 72 });
      });
      tl.to("#carry-flash", { opacity: 0, duration: 0.72, ease: "power4.out" }, 0);
      tl.to("#monolith-wrap", { autoAlpha: 1, duration: 0.8, ease: "crystalLock" }, 0.08);
      tl.to("#monolith-spec", { autoAlpha: 0.35, duration: 1.1, ease: "breathEase" }, 0.35);
      tl.to("#cam03", { scale: 1, y: 0, duration: 2.6, ease: "breathEase" }, 0.75);
      tl.to("#monolith-wrap", { rotationY: 0, rotationX: 0, duration: 3.2, ease: "sine.inOut" }, 0.9);
      if (seismo) {
        tl.fromTo(seismo, { strokeDashoffset: 1200 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 1.05);
      }
      tl.to(facets, { strokeDashoffset: 0, duration: 1.05, stagger: 0.07, ease: "power3.out" }, 1.12);
      tl.to(".readout", { autoAlpha: 1, duration: 0.55, stagger: 0.1, ease: "breathEase" }, 2.15);
      tl.to(".chapter", { autoAlpha: 1, y: 0, duration: 0.95, ease: "breathEase" }, 1.95);
      OS.wireDebrisDrift(gsap, tl, debris, D, 0.35);
      if (vault) {
        tl.to(vault, { "--g-x": "48%", "--g-y": "54%", duration: 3.5, ease: "sine.inOut" }, 2.5);
        tl.to(vault, { "--g-x": "52%", "--g-y": "62%", duration: 3.8, ease: "sine.inOut" }, 5.8);
      }
      OS.sineBreathe(tl, "#monolith-wrap", D, { delay: 3.6, scaleAmp: 0.008, yAmp: 5, period: 2.45 });
      tl.to("#monolith-spec", { opacity: 0.22, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, 4);
      tl.to(".chapter", { autoAlpha: 0.4, duration: 0.7, ease: "sine.in" }, 8.6);
      tl.to("#vault-fade", { opacity: 1, duration: 1.05, ease: "power3.in" }, 8.92);
      tl.to("#cam03", { scale: 0.98, duration: 1.05, ease: "power3.in" }, 8.92);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init03);
    else init03();
  </script>
</body>
</html>
