<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Chrono-Fracture Clip 01 — The Compression</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/OriginalSpot/originalspot-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070709; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    
    /* Background L0 */
    #vault-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--g-x, 50%) var(--g-y, 45%), #1e150f 0%, #070709 70%, #020203 100%);
      z-index: 1;
    }
    
    /* Integration Plate L1 */
    .plate-stage {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      mix-blend-mode: overlay;
      z-index: 2;
      pointer-events: none;
    }
    .plate {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Tectonic Plates L1 */
    #tectonic-container {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      perspective: 1200px;
    }
    .plate-panel {
      width: 50%;
      height: 100%;
      background: #232326;
      border: 1px solid rgba(243, 63, 11, 0.15);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.95);
      position: relative;
    }
    #plate-left {
      transform-origin: 0% 50%;
    }
    #plate-right {
      transform-origin: 100% 50%;
    }
    
    /* Molten Core Fissure */
    #fissure-light {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 100px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, #f33f0b 45%, #ffffff 50%, #f33f0b 55%, transparent);
      box-shadow: 0 0 60px #f33f0b, 0 0 120px #f33f0b;
      opacity: 0;
      z-index: 3;
      pointer-events: none;
    }
    
    /* Volumetric Dust L3 */
    #dust-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .debris {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
    }
    
    /* Vignette L3 */
    #vig {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(2, 2, 3, 0.9) 100%);
      pointer-events: none;
      z-index: 5;
    }
    
    /* Typography & UI L4 */
    .hero-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 84px;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.1;
      letter-spacing: -0.02em;
      z-index: 6;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.95), 0 0 40px rgba(243, 63, 11, 0.3);
      opacity: 0;
    }
    
    .blueprint-ui {
      position: absolute;
      bottom: 120px;
      left: 90px;
      right: 90px;
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      color: #6e6e73;
      z-index: 6;
      border-top: 1px solid rgba(243, 63, 11, 0.2);
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    .blueprint-ui-side {
      border-left: 2px solid #f33f0b;
      padding-left: 12px;
    }
    
    #grain {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="OriginalSpot-clip-01" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="30">
    <div id="vault-bg" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
    
    <div class="plate-stage clip" data-start="0" data-duration="10" data-track-index="1">
      <img class="plate" src="assets/OriginalSpot/ref-eclipse-gold.jpg" alt="" width="1080" height="1920" />
    </div>

    <div id="tectonic-container" class="clip" data-start="0" data-duration="10" data-track-index="2">
      <div id="plate-left" class="plate-panel"></div>
      <div id="plate-right" class="plate-panel"></div>
    </div>
    
    <div id="fissure-light" class="clip" data-start="0" data-duration="10" data-track-index="3"></div>
    <div id="dust-particles" class="clip" data-start="0" data-duration="10" data-track-index="4"></div>
    <div id="vig" class="clip" data-start="0" data-duration="10" data-track-index="5"></div>
    
    <h1 class="hero-title clip" data-start="0" data-duration="10" data-track-index="6">GEOLOGICAL<br><span style="color:#f33f0b; font-style:italic;">COMPRESSION</span></h1>
    
    <div class="blueprint-ui clip" data-start="0" data-duration="10" data-track-index="7">
      <div class="blueprint-ui-side">
        <div>SYS.SYS: CHRONO-FRACTURE_V1</div>
        <div>PRESSURE_INDEX: 4.882 TPa</div>
      </div>
      <div>
        <div>SYS.LOC: L0_COMPRESSION</div>
        <div>TIME_ELAPSED: 0.00s - 10.00s</div>
      </div>
    </div>
    
    <div class="leak-layer clip" data-start="0" data-duration="10" data-track-index="8" style="position:absolute;inset:0;background:linear-gradient(120deg,transparent 60%,rgba(243,63,11,0.08));pointer-events:none;z-index:4"></div>

    <canvas id="grain" class="clip" data-start="0" data-duration="10" data-track-index="10" width="540" height="960"></canvas>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    function initClip01() {
      const CID = "OriginalSpot-clip-01", S = window.OriginalSpot;
      S.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });

      const dustBox = document.getElementById("dust-particles");
      if (dustBox) {
        const debris = S.spawnDebris(dustBox, 25, 44102);
        debris.forEach((el, i) => {
          gsap.set(el, { opacity: 0, scale: 0 });
          tl.to(el, { opacity: 0.5 + ((i % 3) * 0.1), scale: 1, duration: 1.5, ease: "sine.out" }, 0.2 + i * 0.06);
          tl.to(el, { y: -Number(el.dataset.drift), rotation: Number(el.dataset.rot), duration: 8.8, ease: "none" }, 0.8 + i * 0.04);
        });
      }

      const grain = document.getElementById("grain");
      if (grain) {
        S.initGrain(grain, 0.16, 77312);
      }

      // ACT 1: ENTRANCE (0.00s - 2.50s)
      gsap.set("#plate-left", { x: "-100%" });
      gsap.set("#plate-right", { x: "100%" });
      gsap.set(".hero-title", { opacity: 0, scale: 0.8, y: 30 });
      gsap.set(".blueprint-ui", { opacity: 0 });

      tl.to("#plate-left", { x: "0%", duration: 2.2, ease: "tectonicSlam" }, 0);
      tl.to("#plate-right", { x: "0%", duration: 2.2, ease: "tectonicSlam" }, 0);
      
      tl.to("#fissure-light", { opacity: 0.8, width: "30px", duration: 0.15, ease: "power2.out" }, 2.0);
      tl.to("#fissure-light", { opacity: 0.45, width: "12px", duration: 0.5, ease: "sine.inOut" }, 2.15);

      tl.to(".hero-title", { opacity: 1, scale: 1, y: 0, duration: 1.8, ease: "tectonicSlam" }, 2.2);
      tl.to(".blueprint-ui", { opacity: 0.65, duration: 1.2 }, 2.5);

      // ACT 2: EVOLUTION/HOLD (2.50s - 8.50s)
      tl.to("#vault-bg", {
        "--g-x": "55%",
        "--g-y": "47%",
        duration: 7.5,
        ease: "sine.inOut"
      }, 0);
      
      tl.to("#fissure-light", {
        width: "2px",
        opacity: 0.95,
        duration: 6.0,
        ease: "none"
      }, 2.5);

      // ACT 3: EXIT (8.50s - 10.00s)
      tl.to("#root", {
        filter: "blur(20px)",
        opacity: 0,
        duration: 1.5,
        ease: "power2.inOut"
      }, 8.5);

      window.addEventListener("hf-seek", e => tl.seek(e.detail.time));
      tl.seek(0);
      window.__timelines[CID] = tl;
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initClip01);
    else initClip01();
  </script>
</body>
</html>
