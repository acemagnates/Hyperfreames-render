<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Chrono-Fracture Clip 02 — The Refraction</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/OriginalSpot/originalspot-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070709; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; filter: blur(20px); opacity: 0; }
    
    /* Background L0: Tectonic Shale & Vault */
    #vault-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #10151a 0%, #070709 75%, #020203 100%);
      z-index: 1;
    }
    
    /* Integration Plate L1 */
    .plate-stage {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      mix-blend-mode: overlay;
      z-index: 2;
      pointer-events: none;
    }
    .plate {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* 3D Glass Stage L2 */
    #glass-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1400px;
    }
    #glass-prism-container {
      width: 600px;
      height: 600px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(10deg) rotateY(-5deg) translateZ(0px);
    }
    .geom-svg {
      width: 100%;
      height: 100%;
    }
    
    /* Chromatic Aberration flares */
    .optical-flare {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 194, 221, 0.4) 0%, transparent 60%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 3;
      filter: blur(10px);
      opacity: 0;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.2);
    }
    #flare-white {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 50%);
      width: 250px;
      height: 250px;
    }
    
    /* Volumetric dust */
    #dust-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .debris {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
    }
    
    /* Typography L4 */
    .hero-title {
      position: absolute;
      left: 50%;
      top: 260px;
      transform: translateX(-50%);
      font-family: 'Oswald', sans-serif;
      font-size: 78px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 0.95;
      letter-spacing: 0.15em;
      z-index: 5;
      text-shadow: 0 0 20px rgba(14, 194, 221, 0.5), 0 4px 8px rgba(0,0,0,0.8);
      opacity: 0;
    }
    
    .blueprint-ui {
      position: absolute;
      bottom: 120px;
      left: 90px;
      right: 90px;
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      color: #6e6e73;
      z-index: 5;
      border-top: 1px solid rgba(14, 194, 221, 0.2);
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    .blueprint-ui-side {
      border-left: 2px solid #0ec2dd;
      padding-left: 12px;
    }
    
    /* Blinding Flash Overlay */
    #flash-wipe {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 9;
    }
    
    #grain {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="OriginalSpot-clip-02" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="30">
    <div id="vault-bg" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
    
    <div class="plate-stage clip" data-start="0" data-duration="10" data-track-index="1">
      <img class="plate" src="assets/OriginalSpot/ref-void-glass.jpg" alt="" width="1080" height="1920" />
    </div>

    <div id="glass-stage" class="clip" data-start="0" data-duration="10" data-track-index="2">
      <div id="glass-prism-container">
        <!-- SVG will be injected by script -->
      </div>
    </div>
    
    <div id="flare-cyan" class="optical-flare clip" data-start="0" data-duration="10" data-track-index="3"></div>
    <div id="flare-white" class="optical-flare clip" data-start="0" data-duration="10" data-track-index="4"></div>
    
    <div id="dust-particles" class="clip" data-start="0" data-duration="10" data-track-index="5"></div>
    <div id="flash-wipe" class="clip" data-start="0" data-duration="10" data-track-index="6"></div>
    
    <h1 class="hero-title clip" data-start="0" data-duration="10" data-track-index="7">REFRACTIVE<br>TIME</h1>
    
    <div class="blueprint-ui clip" data-start="0" data-duration="10" data-track-index="8">
      <div class="blueprint-ui-side">
        <div>SYS.SYS: CHRONO-FRACTURE_V1</div>
        <div>OPTICAL_ANGLE: 42.14 deg</div>
      </div>
      <div>
        <div>SYS.LOC: L1_REFRACTION</div>
        <div>TIME_ELAPSED: 10.00s - 20.00s</div>
      </div>
    </div>
    
    <canvas id="grain" class="clip" data-start="0" data-duration="10" data-track-index="10" width="540" height="960"></canvas>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    function initClip02() {
      const CID = "OriginalSpot-clip-02", S = window.OriginalSpot;
      S.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });

      const prismBox = document.getElementById("glass-prism-container");
      if (prismBox) {
        prismBox.innerHTML = S.crystalGeometricSVGs.prism;
      }

      const dustBox = document.getElementById("dust-particles");
      if (dustBox) {
        const debris = S.spawnDebris(dustBox, 20, 201103);
        debris.forEach((el, i) => {
          gsap.set(el, { opacity: 0, scale: 0 });
          tl.to(el, { opacity: 0.6 + ((i % 3) * 0.1), scale: 1.2, duration: 1.6, ease: "sine.out" }, 0.1 + i * 0.08);
          tl.to(el, { y: -Number(el.dataset.drift) * 1.2, rotation: Number(el.dataset.rot), duration: 8.5, ease: "none" }, 0.6 + i * 0.05);
        });
      }

      const grain = document.getElementById("grain");
      if (grain) {
        S.initGrain(grain, 0.15, 99401);
      }

      // ACT 1: ENTRANCE (10.00s - 12.00s)
      tl.to("#root", {
        filter: "blur(0px)",
        opacity: 1,
        duration: 1.8,
        ease: "power2.out"
      }, 0);

      gsap.set("#glass-prism-container", { scale: 0.3, rotateZ: -30 });
      tl.to("#glass-prism-container", {
        scale: 1,
        rotateZ: 0,
        duration: 2.0,
        ease: "crystalLock"
      }, 0);

      tl.to("#flare-cyan", { opacity: 0.75, scale: 1.6, duration: 1.4, ease: "power2.out" }, 0.2);
      tl.to("#flare-white", { opacity: 0.9, scale: 1.4, duration: 1.0, ease: "power1.out" }, 0.4);

      tl.to(".hero-title", { opacity: 1, scale: 1, duration: 1.5, ease: "crystalLock" }, 1.2);
      tl.to(".blueprint-ui", { opacity: 0.6, duration: 1.0 }, 1.5);

      // ACT 2: EVOLUTION/HOLD (12.00s - 18.00s)
      tl.to("#glass-prism-container", {
        rotateX: -15,
        rotateY: 25,
        z: 80,
        duration: 6.0,
        ease: "sine.inOut"
      }, 2.0);

      tl.to("#flare-cyan", {
        scale: 1.8,
        opacity: 0.5,
        duration: 3.0,
        repeat: 1,
        yoyo: true,
        ease: "sine.inOut"
      }, 2.0);

      // ACT 3: EXIT & SHATTER-WIPE (18.00s - 20.00s)
      tl.to("#glass-prism-container", {
        scale: 1.6,
        rotateZ: 45,
        filter: "brightness(3)",
        duration: 1.8,
        ease: "power2.in"
      }, 8.0);

      tl.to("#flare-cyan", { scale: 3.5, opacity: 1, duration: 1.8, ease: "power2.in" }, 8.0);
      tl.to("#flare-white", { scale: 3.0, opacity: 1, duration: 1.8, ease: "power2.in" }, 8.0);

      tl.to("#flash-wipe", {
        opacity: 1,
        backgroundColor: "#e6faff",
        duration: 0.8,
        ease: "power3.in"
      }, 9.2);

      window.addEventListener("hf-seek", e => tl.seek(e.detail.time));
      tl.seek(0);
      window.__timelines[CID] = tl;
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initClip02);
    else initClip02();
  </script>
</body>
</html>
