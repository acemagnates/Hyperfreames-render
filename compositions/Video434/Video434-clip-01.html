<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 01 — The Hook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #eae5d9; /* Warm Botanical Cardboard */
        color: #1b1915; /* Charcoal */
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(ellipse 70% 55% at 50% 45%, rgba(45, 62, 51, 0.08), transparent 75%),
          linear-gradient(180deg, #eae5d9 0%, #d8d1c0 100%);
      }
      .grid-lines {
        position: absolute;
        inset: -20%;
        opacity: 0.05;
        background-image:
          linear-gradient(rgba(27, 25, 21, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(27, 25, 21, 0.3) 1px, transparent 1px);
        background-size: 80px 80px;
        transform: rotateX(78deg);
        transform-origin: center 85%;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
        pointer-events: none;
      }
      .hud-header {
        border-bottom: 2px dashed rgba(27, 25, 21, 0.15);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #7d7568;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.05em;
        color: #1b1915;
        font-weight: 700;
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.15em;
        margin-top: 6px;
        text-transform: uppercase;
      }
      .hud-footer {
        border-top: 2px dashed rgba(27, 25, 21, 0.15);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #7d7568;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(150px) scale(0.85);
        pointer-events: none;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        opacity: 0.4;
      }
      .bracket {
        position: absolute;
        width: 50px;
        height: 50px;
        border: 2px solid #1b1915;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

      .hero-stack {
        position: absolute;
        left: 50%;
        top: 26%;
        transform: translateX(-50%) translateZ(60px);
        width: 960px;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .hero-word {
        opacity: 0;
      }
      #hw-1991 {
        font-family: 'Oswald', sans-serif;
        font-size: 130px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #1b1915;
        text-shadow: 0 4px 15px rgba(27, 25, 21, 0.08);
      }
      #hw-150m {
        font-family: 'Playfair Display', serif;
        font-size: 90px;
        font-style: italic;
        color: #c83a2a; /* Archival Red Stamp Color */
        text-shadow: 0 2px 10px rgba(200, 58, 42, 0.08);
      }
      #hw-escape {
        font-family: 'Courier Prime', monospace;
        font-size: 60px;
        font-weight: 700;
        letter-spacing: 0.15em;
        border: 3px solid #1b1915;
        padding: 10px 40px;
        background: #eae5d9;
        text-shadow: none;
        text-transform: uppercase;
      }
      
      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      #chrom-r { background: rgba(200, 50, 50, 0.05); }
      #chrom-b { background: rgba(50, 50, 200, 0.05); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(27,25,21,0.2) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .organic-particle {
        position: absolute;
        background: #7d7568;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-01"
      data-start="0"
      data-duration="10.00"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <!-- SINGLE LEVEL class="clip" TO PREVENT CHROMIUM RENDER BUG -->
        <div id="depth-stage" class="clip" data-start="0" data-duration="10.00" data-track-index="0">
          <div id="stage-tilt">
            <!-- L0 Background Parallax (no class="clip" to avoid suppression) -->
            <div class="z-bg">
              <div class="grid-lines"></div>
            </div>
            
            <div class="god-ray" style="position: absolute; top: -300px; left: -100px; width: 600px; height: 2400px; background: linear-gradient(105deg, transparent, rgba(27,25,21,0.03) 25%, rgba(27,25,21,0.01) 55%, transparent); transform: skewX(-15deg); pointer-events: none; z-index: 2;"></div>
            
            <!-- L2 Mid Ground Content -->
            <div class="z-mg">
              <div class="hud-header">
                <div>
                  <h1 class="hud-title">MISSION INITIALIZATION</h1>
                  <div class="hud-subtitle">BIOSPHERE 2 // ARCHIVAL SURVEY</div>
                </div>
                <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                  <div>SECTOR // <span style="font-weight: 700; color: #1b1915;">AZ_DESERT</span></div>
                  <div>ATMOSPHERE // <span>SURVEYING</span></div>
                </div>
              </div>
              
              <div class="hud-footer">
                <div>SYS_DOME_SEALED // DETECTED</div>
                <div style="font-weight: 700; letter-spacing: 0.15em; color: #1b1915;">PHASE_01 // THE_HOOK</div>
              </div>
            </div>
            
            <!-- L3 Foreground Brackets & Elements -->
            <div class="z-fg">
              <div class="hud-brackets">
                <div class="bracket tl"></div>
                <div class="bracket tr"></div>
                <div class="bracket bl"></div>
                <div class="bracket br"></div>
              </div>
            </div>

            <!-- Hero stack text items (no nested clips!) -->
            <div class="hero-stack">
              <span id="hw-1991" class="hero-word">1991</span>
              <span id="hw-150m" class="hero-word">$150M</span>
              <span id="hw-escape" class="hero-word">ESCAPE</span>
            </div>
          </div>
        </div>

        <!-- Post-Processing layers (no nested clips) -->
        <div id="chrom-wrap">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette"></div>
        <canvas id="grain" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-01";
      const D = 10.00;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400001);

      // Initialize Grain Canvas (procedurally generated on 540x960 stretch)
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4341);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 32) | 0; // softer noise
            data[i] = data[i+1] = data[i+2] = 200 + n;
            data[i+3] = 45; // softer overlay
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Generate procedural dirt/paper organic particles drifting
      const dynamicContainer = document.getElementById("stage-tilt");
      if (dynamicContainer) {
        for (let i = 0; i < 15; i++) {
          const part = document.createElement("div");
          part.className = "organic-particle";
          const size = 3 + rng() * 4;
          part.style.cssText = `position:absolute;left:${rng()*1080}px;top:${rng()*1920}px;width:${size}px;height:${size}px;opacity:${0.15+rng()*0.3};`;
          dynamicContainer.appendChild(part);

          tl.to(part, {
            x: "+=" + ((rng() - 0.5) * 80),
            y: "-=" + (100 + rng() * 120),
            duration: D,
            ease: "none"
          }, 0);
        }
      }

      // Initial positions and styles
      gsap.set("#hw-1991", { y: 60, opacity: 0 });
      gsap.set("#hw-150m", { y: 40, opacity: 0 });
      gsap.set("#hw-escape", { scale: 0.8, opacity: 0 });
      gsap.set(".hud-brackets", { inset: "80px", opacity: 0 });
      gsap.set(".bracket", { scale: 0.6, opacity: 0 });

      // Camera orbital reveal and steady drift
      H.orbitalReveal(tl, "#stage-tilt", 0, 1.4);
      tl.to("#stage-tilt .z-bg", { scale: 1.07, x: 20, y: -10, rotateY: 3, rotateX: -1, duration: D, ease: "sine.inOut" }, 0);

      // Corner brackets opening
      tl.to(".hud-brackets", { inset: "60px", opacity: 1, duration: 1.2, ease: "power3.out" }, 0.1);
      tl.to(".bracket", { scale: 1, opacity: 1, duration: 0.8, ease: "springSnappy", stagger: 0.08 }, 0.1);

      // 1991 entry (0.29s)
      tl.to("#hw-1991", { y: 0, opacity: 1, duration: 0.5, ease: "springHeavy" }, 0.29);
      tl.to("#depth-stage", { perspective: 680, duration: 0.15, ease: "power2.out" }, 0.29);
      tl.to("#depth-stage", { perspective: 1200, duration: 0.4, ease: "sine.inOut" }, 0.44);
      H.bracketPulse(tl, ".bracket", 0.29);
      H.screenShake(tl, "#root-inner", 0.29, 1.2);
      
      // Particle burst on first impact
      H.particleBurst(tl, dynamicContainer, 540, 960, 0.29, 15, "#7d7568", 4341);

      // $150M entry (5.40s)
      tl.to("#hw-150m", { y: 0, opacity: 1, duration: 0.55, ease: "springHeavy" }, 5.40);
      tl.to("#depth-stage", { perspective: 720, duration: 0.15, ease: "power2.out" }, 5.40);
      tl.to("#depth-stage", { perspective: 1200, duration: 0.45, ease: "sine.inOut" }, 5.55);
      H.bracketPulse(tl, ".bracket", 5.40);
      H.screenShake(tl, "#root-inner", 5.40, 0.85);

      // ESCAPE entry (8.15s)
      tl.to("#hw-escape", { scale: 1, opacity: 1, duration: 0.4, ease: "springSnappy" }, 8.15);
      H.bracketPulse(tl, ".bracket", 8.15);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 9.60s
      tl.to("#stage-tilt", { scale: 1.15, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hud-brackets", { scale: 1.2, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
