<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 01 — The Hook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(ellipse 70% 55% at 50% 45%, rgba(201, 168, 76, 0.08), transparent 70%),
          linear-gradient(180deg, #12100d 0%, #0a0a0a 100%);
      }
      .grid-lines {
        position: absolute;
        inset: -20%;
        opacity: 0.12;
        background-image:
          linear-gradient(rgba(201, 168, 76, 0.2) 1px, transparent 1px),
          linear-gradient(90deg, rgba(201, 168, 76, 0.2) 1px, transparent 1px);
        background-size: 80px 80px;
        transform: rotateX(78deg);
        transform-origin: center 85%;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
        pointer-events: none;
      }
      .hud-header {
        border-bottom: 1px solid rgba(201, 168, 76, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #c9a84c;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(201, 168, 76, 0.4);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(201, 168, 76, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #c9a84c;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .god-ray {
        position: absolute;
        top: -200px;
        left: 300px;
        width: 480px;
        height: 2200px;
        background: linear-gradient(105deg, transparent, rgba(255, 215, 0, 0.07) 30%, rgba(255, 215, 0, 0.03) 60%, transparent);
        transform: skewX(-15deg);
        pointer-events: none;
        z-index: 2;
      }
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(150px) scale(0.85);
        pointer-events: none;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        opacity: 0;
      }
      .bracket {
        position: absolute;
        width: 50px;
        height: 50px;
        border: 2px solid #c9a84c;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 24%;
        transform: translateX(-50%) translateZ(60px);
        width: 960px;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .hero-word {
        font-family: 'Oswald', sans-serif;
        font-weight: 900;
        color: #c9a84c;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 4px 20px rgba(0, 0, 0, 0.95);
        opacity: 0;
      }
      #hw-1991 {
        font-size: 160px;
        line-height: 1.1;
      }
      #hw-150m {
        font-family: 'Playfair Display', serif;
        font-size: 90px;
        color: #ffffff;
        text-shadow: 0 0 25px rgba(255, 215, 0, 0.35), 0 4px 15px rgba(0, 0, 0, 0.85);
      }
      #hw-escape {
        font-family: 'Courier Prime', monospace;
        font-size: 56px;
        letter-spacing: 0.25em;
        background: rgba(0, 0, 0, 0.8);
        padding: 10px 30px;
        border: 1px solid #c9a84c;
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.12); }
      #chrom-b { background: rgba(0, 100, 255, 0.12); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-01"
      data-start="0"
      data-duration="10.00"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="10.00" data-track-index="0">
          <div id="stage-tilt">
            <!-- L0 Background Parallax -->
            <div class="z-bg clip" data-start="0" data-duration="10.00" data-track-index="1">
              <div class="grid-lines"></div>
            </div>
            
            <div class="god-ray clip" data-start="0" data-duration="10.00" data-track-index="2"></div>
            
            <!-- L2 Mid Ground Content -->
            <div class="z-mg clip" data-start="0" data-duration="10.00" data-track-index="3">
              <div class="hud-header">
                <div>
                  <h1 class="hud-title">MISSION INITIALIZATION</h1>
                  <div class="hud-subtitle">BIOSPHERE 2 // PROJECT_VAULT</div>
                </div>
                <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                  <div>SECTOR // <span style="font-weight: 700;">AZ_DESERT</span></div>
                  <div>ATMOSPHERE // <span>STABLE</span></div>
                </div>
              </div>
              
              <div class="hud-footer">
                <div>SYS_DOME_SEALED // OK</div>
                <div style="font-weight: 700; letter-spacing: 0.15em;">PHASE_01 // THE_HOOK</div>
              </div>
            </div>
            
            <!-- L3 Foreground Brackets & Elements -->
            <div class="z-fg clip" data-start="0" data-duration="10.00" data-track-index="4">
              <div class="hud-brackets">
                <div class="bracket tl"></div>
                <div class="bracket tr"></div>
                <div class="bracket bl"></div>
                <div class="bracket br"></div>
              </div>
            </div>

            <div class="hero-stack clip" data-start="0" data-duration="10.00" data-track-index="5">
              <span id="hw-1991" class="hero-word clip" data-start="0.29" data-duration="9.71" data-track-index="6">1991</span>
              <span id="hw-150m" class="hero-word clip" data-start="5.40" data-duration="4.60" data-track-index="7">$150M</span>
              <span id="hw-escape" class="hero-word clip" data-start="8.15" data-duration="1.85" data-track-index="8">ESCAPE</span>
            </div>
          </div>
        </div>

        <!-- Post-Processing -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="10.00" data-track-index="9">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="10.00" data-track-index="10"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="10.00" data-track-index="11" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-01";
      const D = 10.00;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400001);

      // Initialize Grain Canvas (procedurally generated on 540x960 stretch)
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4341);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 64) | 0;
            data[i] = data[i+1] = data[i+2] = n;
            data[i+3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Initial positions and styles
      gsap.set("#hw-1991", { y: 60, opacity: 0 });
      gsap.set("#hw-150m", { y: 40, opacity: 0 });
      gsap.set("#hw-escape", { scale: 0.8, opacity: 0 });
      gsap.set(".hud-brackets", { inset: "80px", opacity: 0 });
      gsap.set(".bracket", { scale: 0.6, opacity: 0 });

      // Camera orbital reveal and steady drift
      H.orbitalReveal(tl, "#stage-tilt", 0, 1.4);
      tl.to("#stage-tilt .z-bg", { scale: 1.07, x: 20, y: -10, rotateY: 3, rotateX: -1, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".god-ray", { x: 50, duration: D, ease: "sine.inOut" }, 0);

      // Corner brackets opening
      tl.to(".hud-brackets", { inset: "60px", opacity: 1, duration: 1.2, ease: "power3.out" }, 0.1);
      tl.to(".bracket", { scale: 1, opacity: 1, duration: 0.8, ease: "springSnappy", stagger: 0.08 }, 0.1);

      // 1991 entry (0.29s)
      tl.to("#hw-1991", { y: 0, opacity: 1, duration: 0.5, ease: "springHeavy" }, 0.29);
      tl.to("#depth-stage", { perspective: 680, duration: 0.15, ease: "power2.out" }, 0.29);
      tl.to("#depth-stage", { perspective: 1200, duration: 0.4, ease: "sine.inOut" }, 0.44);
      H.bracketPulse(tl, ".bracket", 0.29);
      H.screenShake(tl, "#root-inner", 0.29, 1.2);
      
      // Particle burst on first impact
      const dynamicContainer = document.getElementById("stage-tilt");
      H.particleBurst(tl, dynamicContainer, 540, 960, 0.29, 15, "#c9a84c", 4341);

      // $150M entry (5.40s)
      tl.to("#hw-150m", { y: 0, opacity: 1, duration: 0.55, ease: "springHeavy" }, 5.40);
      tl.to("#depth-stage", { perspective: 720, duration: 0.15, ease: "power2.out" }, 5.40);
      tl.to("#depth-stage", { perspective: 1200, duration: 0.45, ease: "sine.inOut" }, 5.55);
      H.bracketPulse(tl, ".bracket", 5.40);
      H.screenShake(tl, "#root-inner", 5.40, 0.85);

      // ESCAPE entry (8.15s)
      tl.to("#hw-escape", { scale: 1, opacity: 1, duration: 0.4, ease: "springSnappy" }, 8.15);
      H.bracketPulse(tl, ".bracket", 8.15);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 9.60s
      tl.to("#stage-tilt", { scale: 1.15, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hud-brackets", { scale: 1.2, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
