<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 03 — The Crisis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050608;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(circle at 30% 30%, rgba(0, 212, 255, 0.12) 0%, transparent 60%),
          linear-gradient(180deg, #090b10 0%, #050608 100%);
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
        pointer-events: none;
      }
      .hud-header {
        border-bottom: 1px solid rgba(226, 241, 231, 0.2);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #e2f1e7;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.35);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(226, 241, 231, 0.2);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #e2f1e7;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      
      .chart-container {
        position: absolute;
        top: 240px;
        left: 80px;
        width: 320px;
        height: 380px;
        border: 1.5px solid rgba(226, 241, 231, 0.18);
        background-color: rgba(10, 12, 16, 0.8);
        transform: rotateY(20deg) rotateX(15deg) translateZ(40px);
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        font-family: 'Courier Prime', monospace;
      }
      .chart-header {
        border-bottom: 1px solid rgba(226, 241, 231, 0.25);
        padding-bottom: 8px;
        font-size: 16px;
        color: #ffffff;
        letter-spacing: 0.1em;
      }
      .chart-value {
        margin-top: 15px;
        font-size: 26px;
        font-weight: bold;
        color: #e5b05c;
      }
      .chart-svg-wrap {
        position: relative;
        width: 100%;
        height: 180px;
        border-left: 1px solid rgba(226, 241, 231, 0.25);
        border-bottom: 1px solid rgba(226, 241, 231, 0.25);
        margin-top: 20px;
      }

      .red-alert-overlay {
        position: absolute;
        inset: 0;
        background: rgba(139, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
      
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 25%;
        transform: translateX(-50%) translateZ(60px);
        width: 960px;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hero-word {
        font-family: 'Oswald', sans-serif;
        font-weight: 900;
        color: red;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-shadow: 0 0 30px rgba(139, 0, 0, 0.8), 0 4px 15px rgba(0, 0, 0, 0.95);
        opacity: 0;
      }
      #hw-suffocating {
        font-size: 100px;
        line-height: 1.1;
      }
      #hw-apnea {
        font-family: 'Courier Prime', monospace;
        font-size: 70px;
        color: #ffffff;
        letter-spacing: 0.25em;
        margin-top: 30px;
        background: rgba(139, 0, 0, 0.8);
        padding: 5px 25px;
        border: 1.5px solid red;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      }
      .phrase-row {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .phrase-part {
        font-family: 'Playfair Display', serif;
        font-weight: 900;
        font-size: 60px;
        opacity: 0;
      }
      #hw-clouded {
        color: #e2f1e7;
      }
      #hw-fog {
        color: rgba(255, 255, 255, 0.35);
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.2); }
      #chrom-b { background: rgba(0, 100, 255, 0.2); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .condensation-fleck {
        position: absolute;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50%;
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-03"
      data-start="0"
      data-duration="8.50"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="8.50" data-track-index="0">
          <div id="stage-tilt">
            <!-- L0 Background -->
            <div class="z-bg clip" data-start="0" data-duration="8.50" data-track-index="1"></div>
            
            <div class="red-alert-overlay clip" data-start="0" data-duration="8.50" data-track-index="2"></div>
            
            <!-- L2 Mid Ground Chart & HUD -->
            <div class="chart-container clip" data-start="0" data-duration="8.50" data-track-index="3">
              <div class="chart-header">BIO_OXYGEN_ANALYSIS</div>
              <div class="chart-value" id="oxygen-text">20.9% <span style="font-size: 12px; color: red;">▼ CRITICAL</span></div>
              <div class="chart-svg-wrap">
                <svg width="280" height="180">
                  <path id="chart-path" d="M 0 20 L 80 40 L 160 90 L 240 150 L 280 170" fill="none" stroke="red" stroke-width="4.5" stroke-linecap="round" />
                  <circle id="chart-marker" cx="0" cy="20" r="6" fill="red" />
                </svg>
              </div>
            </div>
            
            <div class="z-mg clip" data-start="0" data-duration="8.50" data-track-index="4">
              <div class="hud-header">
                <div>
                  <h1 class="hud-title">BIOLOGICAL FAILURE</h1>
                  <div class="hud-subtitle">SYS_ERROR // REPLICA_FRACTURE</div>
                </div>
                <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                  <div>STATUS // <span style="font-weight: 700; color: red;">ALERT</span></div>
                  <div>DRIFT // <span style="color: red;">CRITICAL</span></div>
                </div>
              </div>
              
              <div class="hud-footer">
                <div>SYS_O2_LEVELS // FAILING</div>
                <div style="font-weight: 700; letter-spacing: 0.15em;">PHASE_03 // RESPIRATION_CRISIS</div>
              </div>
            </div>

            <!-- Condensation droplets layer (Z: 150px) -->
            <div class="z-fg clip" data-start="0" data-duration="8.50" data-track-index="5">
              <!-- Procedural drops generated by script -->
              <div id="drop-host"></div>
            </div>

            <div class="hero-stack clip" data-start="0" data-duration="8.50" data-track-index="6">
              <span id="hw-suffocating" class="hero-word clip" data-start="2.46" data-duration="6.04" data-track-index="7">SUFFOCATING</span>
              <span id="hw-apnea" class="hero-word clip" data-start="5.22" data-duration="3.28" data-track-index="8">APNEA</span>
              <div class="phrase-row">
                <span id="hw-clouded" class="phrase-part clip" data-start="6.71" data-duration="1.79" data-track-index="9">Clouded</span>
                <span id="hw-fog" class="phrase-part clip" data-start="7.76" data-duration="0.74" data-track-index="10">Fog.</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Post-Processing -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="8.50" data-track-index="11">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="8.50" data-track-index="12"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="8.50" data-track-index="13" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-03";
      const D = 8.50;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400003);

      // Initialize Grain Canvas
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4343);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 64) | 0;
            data[i] = data[i+1] = data[i+2] = n;
            data[i+3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Generate procedural water droplets
      const host = document.getElementById("drop-host");
      if (host) {
        for (let i = 0; i < 40; i++) {
          const x = rng() * 1080;
          const y = rng() * 1920;
          const size = 3 + rng() * 6;
          const drop = document.createElement("div");
          drop.className = "condensation-fleck";
          drop.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${0.4+rng()*0.4};`;
          host.appendChild(drop);
        }
      }

      // Initial positions
      gsap.set("#hw-suffocating", { y: 40, opacity: 0 });
      gsap.set("#hw-apnea", { scale: 0.8, opacity: 0 });
      gsap.set("#hw-clouded", { y: 20, opacity: 0 });
      gsap.set("#hw-fog", { scale: 1.3, opacity: 0 });

      // Chart values
      const chartPath = document.getElementById("chart-path");
      const pathLen = 400;
      gsap.set(chartPath, { strokeDasharray: pathLen, strokeDashoffset: pathLen });

      // Dolly Zoom simulation (perspective contracts, scale increases)
      tl.to("#depth-stage", { perspective: 720, duration: D, ease: "sine.inOut" }, 0);
      tl.to("#stage-tilt .z-bg", { scale: 1.25, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".chart-container", { scale: 1.15, translateZ: 60, duration: D, ease: "sine.inOut" }, 0);

      // Pulse red warning light
      const pulseReps = H.repeatCount(D, 2.0);
      tl.to(".red-alert-overlay", { opacity: 0.22, yoyo: true, repeat: pulseReps, duration: 1.0, ease: "sine.inOut" }, 0);

      // Animate Chart Draw & Values
      const roll = { v: 20.9 };
      tl.to(chartPath, { strokeDashoffset: 0, duration: D, ease: "none" }, 0);
      tl.to(roll, {
        v: 14.2,
        duration: D,
        ease: "none",
        onUpdate() {
          document.getElementById("oxygen-text").innerHTML = `${roll.v.toFixed(1)}% <span style="font-size:12px;color:red;">▼ CRITICAL</span>`;
          // Move chart marker dot in sync along path
          const progress = (D - tl.time()) / D; // 0 to 1
          const mx = progress * 280;
          const my = 20 + (progress * 150);
          const marker = document.getElementById("chart-marker");
          if (marker) {
            marker.setAttribute("cx", mx);
            marker.setAttribute("cy", my);
          }
        }
      }, 0);

      // SUFFOCATING entry (2.46s)
      const localSuffocating = 2.46;
      tl.to("#hw-suffocating", { y: 0, opacity: 1, duration: 0.5, ease: "springHeavy" }, localSuffocating);
      tl.to("#depth-stage", { perspective: 660, duration: 0.15, ease: "power2.out" }, localSuffocating);
      tl.to("#depth-stage", { perspective: 720, duration: 0.45, ease: "sine.inOut" }, localSuffocating + 0.15);
      H.screenShake(tl, "#root-inner", localSuffocating, 1.3);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", localSuffocating, 1.4);

      // APNEA entry (5.22s)
      const localApnea = 5.22;
      tl.to("#hw-apnea", { scale: 1, opacity: 1, duration: 0.45, ease: "springSnappy" }, localApnea);
      H.screenShake(tl, "#root-inner", localApnea, 0.8);

      // Clouded entry (6.71s)
      const localClouded = 6.71;
      tl.to("#hw-clouded", { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, localClouded);

      // Fog. entry (7.76s)
      const localFog = 7.76;
      tl.to("#hw-fog", { scale: 1, opacity: 1, duration: 0.35, ease: "springSnappy" }, localFog);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 8.10s
      tl.to("#stage-tilt", { scale: 1.25, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".chart-container", { scale: 1.3, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
