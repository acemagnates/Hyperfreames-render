<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 03 — The Crisis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #121b18; /* deep clinical teal/grey */
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(circle at 30% 30%, rgba(200, 50, 50, 0.12) 0%, transparent 60%),
          linear-gradient(180deg, #121b18 0%, #080d0b 100%);
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
        pointer-events: none;
      }
      .hud-header {
        border-bottom: 1px solid rgba(226, 241, 231, 0.15);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #e2f1e7;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.35);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(226, 241, 231, 0.15);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #e2f1e7;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      
      .chart-container {
        position: absolute;
        top: 240px;
        left: 80px;
        width: 320px;
        height: 380px;
        border: 1.5px solid rgba(226, 241, 231, 0.18);
        background-color: rgba(18, 27, 24, 0.95);
        transform: rotateY(20deg) rotateX(15deg) translateZ(40px);
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        font-family: 'Courier Prime', monospace;
      }
      .chart-header {
        border-bottom: 1px solid rgba(226, 241, 231, 0.25);
        padding-bottom: 8px;
        font-size: 16px;
        color: #ffffff;
        letter-spacing: 0.1em;
      }
      .chart-value {
        margin-top: 15px;
        font-size: 26px;
        font-weight: bold;
        color: #ff6b6b;
      }
      .chart-svg-wrap {
        position: relative;
        width: 100%;
        height: 180px;
        border-left: 1px solid rgba(226, 241, 231, 0.25);
        border-bottom: 1px solid rgba(226, 241, 231, 0.25);
        margin-top: 20px;
      }

      .red-alert-overlay {
        position: absolute;
        inset: 0;
        background: rgba(139, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
      
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 25%;
        transform: translateX(-50%) translateZ(60px);
        width: 960px;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hero-word {
        font-family: 'Oswald', sans-serif;
        font-weight: 900;
        color: #ff3b3b;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-shadow: 0 0 30px rgba(139, 0, 0, 0.8), 0 4px 15px rgba(0, 0, 0, 0.95);
        opacity: 0;
      }
      #hw-suffocating {
        font-size: 100px;
        line-height: 1.1;
      }
      #hw-apnea {
        font-family: 'Courier Prime', monospace;
        font-size: 70px;
        color: #ffffff;
        letter-spacing: 0.25em;
        margin-top: 30px;
        background: rgba(139, 0, 0, 0.8);
        padding: 5px 25px;
        border: 1.5px solid #ff3b3b;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      }
      .phrase-row {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .phrase-part {
        font-family: 'Playfair Display', serif;
        font-weight: 900;
        font-size: 60px;
        opacity: 0;
      }
      #hw-clouded {
        color: #e2f1e7;
      }
      #hw-fog {
        color: rgba(255, 255, 255, 0.35);
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.2); }
      #chrom-b { background: rgba(0, 100, 255, 0.2); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .condensation-fleck {
        position: absolute;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50%;
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-03"
      data-start="0"
      data-duration="8.50"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <!-- SINGLE LEVEL class="clip" ON DEPTH-STAGE -->
        <div id="depth-stage" class="clip" data-start="0" data-duration="8.50" data-track-index="0">
          <div id="stage-tilt">
            <!-- L0 Background Parallax -->
            <div class="z-bg"></div>
            
            <div class="red-alert-overlay"></div>
            
            <!-- Technical sensor dashboard showing oxygen collapse (no clip) -->
            <div class="chart-container">
              <div class="chart-header">O2 SENSOR COLLAPSE</div>
              <div class="chart-value" id="o2-val">20.9%</div>
              <div class="chart-svg-wrap">
                <!-- Glowing falling chart line -->
                <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                  <path id="chart-path" d="M 0 10 L 25 10 L 40 10 L 60 45 L 80 85 L 100 95" fill="none" stroke="#ff3b3b" stroke-width="2.5" style="filter: drop-shadow(0 0 4px #ff0000);" />
                </svg>
              </div>
            </div>

            <!-- L2 Mid Ground Content -->
            <div class="z-mg">
              <div class="hud-header">
                <div>
                  <h1 class="hud-title">ATMOSPHERIC COLLAPSE</h1>
                  <div class="hud-subtitle">CRISIS RECON // PRESSURE_SECTOR_4</div>
                </div>
                <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                  <div>STATUS // <span style="font-weight: 700; color: #ff3b3b;">HYPOXIA_DREAD</span></div>
                  <div>LEVELS // <span style="color: #ff3b3b;">CRITICAL</span></div>
                </div>
              </div>
              
              <div class="hud-footer">
                <div>SYS_O2_ALARM // RED_ACTIVE</div>
                <div style="font-weight: 700; letter-spacing: 0.15em; color: #ff3b3b;">PHASE_03 // THE_CRISIS</div>
              </div>
            </div>
            
            <!-- L3 Foreground Condensation Flecks -->
            <div class="z-fg">
              <!-- Drifting moisture particles (condensation overlay) -->
              <div id="condensation-overlay" style="position: absolute; inset: 0; pointer-events: none;"></div>
            </div>

            <div class="hero-stack">
              <span id="hw-suffocating" class="hero-word">SUFFOCATING</span>
              <span id="hw-apnea" class="hero-word">APNEA</span>
              <div class="phrase-row">
                <span id="hw-clouded" class="phrase-part">Clouded</span>
                <span id="hw-fog" class="phrase-part">Fog.</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Post-Processing -->
        <div id="chrom-wrap">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette"></div>
        <canvas id="grain" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-03";
      const D = 8.50;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400003);

      // Initialize Grain Canvas
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4343);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 48) | 0;
            data[i] = data[i+1] = data[i+2] = n;
            data[i+3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Generate procedural condensed moisture droplets
      const condHost = document.getElementById("condensation-overlay");
      if (condHost) {
        const cRng = H.mulberry32(0x9ace4343);
        for (let i = 0; i < 40; i++) {
          const droplet = document.createElement("div");
          droplet.className = "condensation-fleck";
          const x = cRng() * 1080;
          const y = cRng() * 1920;
          const size = 2 + cRng() * 6;
          droplet.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${0.05 + cRng() * 0.15};`;
          condHost.appendChild(droplet);

          // Droplets slowly slide down under gravity
          tl.to(droplet, {
            y: "+=" + (15 + cRng() * 30),
            duration: D,
            ease: "none"
          }, 0);
        }
      }

      // Initial positions
      gsap.set("#hw-suffocating", { y: 60, opacity: 0 });
      gsap.set("#hw-apnea", { scale: 0.7, opacity: 0 });
      gsap.set("#hw-clouded", { x: -30, opacity: 0 });
      gsap.set("#hw-fog", { x: 30, opacity: 0 });
      
      // Chart Drawing Setup
      const pathLen = 250;
      gsap.set("#chart-path", { strokeDasharray: pathLen, strokeDashoffset: pathLen });

      // Camera dolly zoom effect (Dolly-in and scale down background tilt)
      tl.to("#stage-tilt", { scale: 0.96, duration: D, ease: "sine.inOut" }, 0);
      tl.to("#stage-tilt .z-bg", { scale: 1.15, translateZ: 30, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".chart-container", { rotateY: 15, rotateX: 10, translateZ: 15, duration: D, ease: "sine.inOut" }, 0);

      // Heartbeat Pulsing Red warning light overlays
      const pulsePeriods = 4;
      for (let i = 0; i < pulsePeriods; i++) {
        const time = i * 2.1;
        if (time < D) {
          tl.to(".red-alert-overlay", { opacity: 0.22, duration: 0.22, ease: "power2.out" }, time);
          tl.to(".red-alert-overlay", { opacity: 0, duration: 0.8, ease: "power2.in" }, time + 0.22);
        }
      }

      // Draw sensor collapse chart
      tl.to("#chart-path", { strokeDashoffset: 0, duration: 4.5, ease: "power1.inOut" }, 0.5);

      // Animate oxygen drop counter
      const o2Obj = { value: 20.9 };
      tl.to(o2Obj, {
        value: 14.2,
        duration: 5.5,
        ease: "power2.out",
        onUpdate: () => {
          const valEl = document.getElementById("o2-val");
          if (valEl) valEl.textContent = o2Obj.value.toFixed(1) + "%";
        }
      }, 0.5);

      // SUFFOCATING entry (2.46s)
      const localSuffocating = 2.46;
      tl.to("#hw-suffocating", { y: 0, opacity: 1, duration: 0.52, ease: "springHeavy" }, localSuffocating);
      H.screenShake(tl, "#root-inner", localSuffocating, 0.9);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", localSuffocating, 0.65);

      // APNEA entry (5.22s, extreme warning)
      const localApnea = 5.22;
      tl.to("#hw-apnea", { scale: 1, opacity: 1, duration: 0.45, ease: "springSnappy" }, localApnea);
      H.screenShake(tl, "#root-inner", localApnea, 1.4);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", localApnea, 1.15);

      // Clouded (6.71s)
      tl.to("#hw-clouded", { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 6.71);

      // Fog. (7.76s)
      tl.to("#hw-fog", { x: 0, opacity: 1, duration: 0.4, ease: "springHeavy" }, 7.76);
      H.screenShake(tl, "#root-inner", 7.76, 0.6);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 8.10s
      tl.to("#stage-tilt", { scale: 1.15, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".chart-container", { scale: 0.85, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
