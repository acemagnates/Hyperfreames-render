<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 06 — Pristine Prison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #100501; /* Burning Sunset Void */
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(circle at 15% 85%, #d95d1e 0%, rgba(43, 20, 8, 0.8) 50%, #100501 100%),
          linear-gradient(180deg, #1b0e06 0%, #100501 100%);
      }
      .sunset-glare {
        position: absolute;
        bottom: -250px;
        left: -250px;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 93, 30, 0.25) 0%, rgba(217, 93, 30, 0.04) 50%, transparent 70%);
        pointer-events: none;
        z-index: 2;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
        pointer-events: none;
      }
      .hud-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #d95d1e; /* Sunset Orange */
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(217, 93, 30, 0.35);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #d95d1e;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .archival-frame {
        position: absolute;
        bottom: 160px;
        right: 80px;
        width: 440px;
        height: 660px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        background: rgba(16, 5, 1, 0.75);
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        transform: rotateY(-18deg) rotateX(10deg) translateZ(40px);
        transform-style: preserve-3d;
        overflow: hidden;
      }
      .glass-pane-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px);
        background-size: 110px 110px;
        z-index: 10;
        pointer-events: none;
      }
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(150px) scale(0.85);
        pointer-events: none;
      }

      .hero-stack {
        position: absolute;
        left: 80px;
        top: 24%;
        transform: translateZ(60px);
        width: 480px;
        text-align: left;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .hero-word {
        opacity: 0;
      }
      
      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.14); }
      #chrom-b { background: rgba(0, 100, 255, 0.14); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .dust-particle {
        position: absolute;
        background: rgba(217, 93, 30, 0.4);
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-06"
      data-start="0"
      data-duration="5.01"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <!-- SINGLE LEVEL class="clip" ON DEPTH-STAGE -->
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.01" data-track-index="0">
          <div id="stage-tilt">
            <!-- L0 Background Parallax -->
            <div class="z-bg">
              <div class="sunset-glare"></div>
            </div>
            
            <!-- Archival biospherian photo frame -->
            <div class="archival-frame">
              <div class="glass-pane-grid"></div>
              <!-- Procedural vector biospherian silhouette looking out window -->
              <svg viewBox="0 0 440 660" style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 100%;">
                <!-- Head -->
                <circle cx="220" cy="300" r="55" fill="#120e0a" />
                <!-- Shoulders and Body silhouette -->
                <path d="M 80 660 C 80 500, 130 420, 220 420 C 310 420, 360 500, 360 660 Z" fill="#120e0a" />
                <!-- Subtle glowing silhouette edge highlight -->
                <path d="M 218 420 Q 308 420 358 660" fill="none" stroke="rgba(217,93,30,0.35)" stroke-width="3" />
                <path d="M 218 245 A 55 55 0 0 1 273 300" fill="none" stroke="rgba(217,93,30,0.35)" stroke-width="2.5" />
              </svg>
            </div>

            <!-- L2 Mid Ground Content -->
            <div class="z-mg">
              <div class="hud-header">
                <div>
                  <h1 class="hud-title">MISSION ABANDONMENT PLAN</h1>
                  <div class="hud-subtitle">HUMAN_FACTORS // DOME_PRISON_1991</div>
                </div>
                <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                  <div>ISOLATION // <span style="font-weight: 700; color: #ffffff;">CRITICAL_LEVEL</span></div>
                  <div>SURVIVAL // <span style="color: #ff6b6b;">FAILING</span></div>
                </div>
              </div>
              
              <div class="hud-footer">
                <div>SYS_ESCAPE_STATUS // PREPARING</div>
                <div style="font-weight: 700; letter-spacing: 0.15em; color: #d95d1e;">PHASE_06 // STORY_LANDS</div>
              </div>
            </div>
            
            <!-- L3 Foreground Dust Elements -->
            <div class="z-fg">
              <!-- Drifting warm dust -->
              <div id="sunset-dust" style="position: absolute; inset: 0; transform-style: preserve-3d;"></div>
            </div>

            <div class="hero-stack">
              <span id="hw-scientists" class="hero-word" style="font-family: 'Playfair Display', serif; font-size: 40px; font-style: italic; color: #ffffff; text-shadow: 0 3px 10px rgba(0,0,0,0.95); line-height: 1.3;">The scientists were</span>
              <span id="hw-dying" class="hero-word" style="font-family: 'Oswald', sans-serif; font-size: 80px; font-weight: 900; letter-spacing: 0.05em; color: #ff6b6b; text-shadow: 0 0 25px rgba(255,0,0,0.45), 0 4px 15px rgba(0,0,0,0.95); margin-top: 10px; text-transform: uppercase;">DYING</span>
              <span id="hw-inside" class="hero-word" style="font-family: 'Courier Prime', monospace; font-size: 32px; letter-spacing: 0.15em; color: #ffffff; opacity: 0.8; text-shadow: 0 2px 10px rgba(0,0,0,0.9); margin-top: 25px;">INSIDE THEIR</span>
              <span id="hw-pristine" class="hero-word" style="font-family: 'Playfair Display', serif; font-size: 52px; font-style: italic; font-weight: 700; color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.35), 0 4px 15px rgba(0,0,0,0.95); margin-top: 15px;">pristine</span>
              <span id="hw-prison" class="hero-word" style="font-family: 'Oswald', sans-serif; font-size: 90px; font-weight: 900; letter-spacing: 0.08em; color: #ffffff; text-shadow: 0 0 30px rgba(255,255,255,0.3), 0 5px 25px rgba(0,0,0,0.95); text-transform: uppercase; margin-top: 2px;">PRISON.</span>
            </div>
          </div>
        </div>

        <!-- Post-Processing -->
        <div id="chrom-wrap">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette"></div>
        <canvas id="grain" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-06";
      const D = 5.01;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400006);

      // Initialize Grain Canvas
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4346);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 48) | 0;
            data[i] = data[i+1] = data[i+2] = n;
            data[i+3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Generate procedural warm drifting dust particles
      const dustHost = document.getElementById("sunset-dust");
      if (dustHost) {
        const sRng = H.mulberry32(0x43400006);
        for (let i = 0; i < 15; i++) {
          const particle = document.createElement("div");
          particle.className = "dust-particle";
          const x = sRng() * 1080;
          const y = 600 + sRng() * 1000;
          const size = 3 + sRng() * 5;
          particle.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${0.25+sRng()*0.45};transform:translateZ(80px);`;
          dustHost.appendChild(particle);

          // Pan drift leftwards and slightly upwards
          tl.to(particle, {
            x: "-=" + (100 + sRng() * 120),
            y: "-=" + (50 + sRng() * 80),
            duration: D,
            ease: "none"
          }, 0);
        }
      }

      // Initial positions
      gsap.set(".hero-word", { x: -20, opacity: 0 });

      // Ken Burns Pan Left (slowly scaling and moving camera)
      tl.to("#stage-tilt", { scale: 1.08, duration: D, ease: "none" }, 0);
      tl.to("#stage-tilt .z-bg", { scale: 1.12, x: -20, duration: D, ease: "none" }, 0);
      tl.to(".archival-frame", { x: -35, rotateY: -12, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".sunset-glare", { x: -40, duration: D, ease: "sine.inOut" }, 0);

      // Revealing text relative to timeline start (45.99s)
      // The scientists were (0.31s)
      tl.to("#hw-scientists", { opacity: 1, x: 0, duration: 0.45, ease: "springLight" }, 0.31);

      // DYING (1.69s)
      tl.fromTo("#hw-dying", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "springHeavy" }, 1.69);
      H.screenShake(tl, "#root-inner", 1.69, 0.75);

      // INSIDE THEIR (2.47s)
      tl.to("#hw-inside", { opacity: 0.8, x: 0, duration: 0.4, ease: "power2.out" }, 2.47);

      // pristine (3.30s)
      tl.to("#hw-pristine", { opacity: 1, x: 0, duration: 0.4, ease: "springHeavy" }, 3.30);

      // PRISON. (4.09s, major climax reveal)
      tl.fromTo("#hw-prison", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "springHeavy" }, 4.09);
      H.snapZoomWithRecover(tl, "#hw-prison", 4.09, { peakScale: 1.15, peakZ: 40, peakDur: 0.14, recoverDur: 0.42 });
      H.screenShake(tl, "#root-inner", 4.09, 1.1);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 4.09, 1.0);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 4.61s
      tl.to("#stage-tilt", { scale: 1.15, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
