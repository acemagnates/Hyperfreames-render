<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 04 — The Turn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #14110e; /* Soil Loam Brown */
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(ellipse 65% 55% at 50% 50%, rgba(201, 168, 76, 0.08), transparent 70%),
          linear-gradient(180deg, #1b1713 0%, #14110e 100%);
      }
      /* Custom Botanical / Soil-Layer Blueprint Split Panel */
      .soil-layers-panel {
        position: absolute;
        top: 240px;
        left: 80px;
        width: 320px;
        height: 520px;
        border: 2px solid rgba(226, 230, 220, 0.25);
        background: rgba(20, 17, 14, 0.95);
        padding: 24px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.85);
        font-family: 'Courier Prime', monospace;
        color: #e2e6dc;
        transform: rotateY(15deg) rotateX(10deg) translateZ(40px);
        transform-style: preserve-3d;
      }
      .panel-header {
        border-bottom: 2px dashed rgba(226, 230, 220, 0.35);
        padding-bottom: 12px;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 0.12em;
        color: #c5a059; /* Sepia Clay */
      }
      .layer-bar {
        margin-top: 20px;
        height: 18px;
        background: rgba(226, 230, 220, 0.1);
        border: 1px solid rgba(226, 230, 220, 0.25);
        position: relative;
        overflow: hidden;
      }
      .layer-fill {
        height: 100%;
        background: #8b7355; /* Peat Moss Clay */
        width: 85%;
      }
      
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 24%;
        transform: translateX(-50%) translateZ(60px);
        width: 960px;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(0,0,0,0.78) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      
      /* Organic Seed-Spore swarm rods */
      .spore-rod {
        position: absolute;
        border-radius: 12px;
        background: #8b7355; /* Organic Sand */
        border: 1px solid rgba(226, 230, 220, 0.4);
        box-shadow: 0 4px 15px rgba(0,0,0,0.85);
        transform-origin: 50% 50%;
        pointer-events: none;
      }
      
      /* Botanical sketch textures */
      .foliage-sketch {
        position: absolute;
        bottom: 120px;
        right: 80px;
        width: 380px;
        height: 520px;
        border: 1.5px solid rgba(226, 230, 220, 0.2);
        background: rgba(25, 22, 19, 0.85);
        box-shadow: 0 20px 45px rgba(0,0,0,0.9);
        transform: rotateY(-15deg) rotateX(10deg) translateZ(40px);
        transform-style: preserve-3d;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-04"
      data-start="0"
      data-duration="12.00"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <div id="depth-stage">
          <div id="stage-tilt">
            <!-- L0 Background Parallax -->
            <div class="z-bg"></div>
            
            <!-- Mid Ground Panels & Vector sketches (NO class=clip) -->
            <div class="soil-layers-panel">
              <div class="panel-header">FIELD JOURNAL // 1991</div>
              <div style="margin-top: 18px; font-size: 13px; line-height: 1.6; opacity: 0.85;">
                LOC: SOIL EXPORT 2A<br>
                TAXONOMY: ACTIVE COMPOST<br>
                RESPIRATION: ABNORMAL
              </div>
              <div style="margin-top: 24px; font-size: 12px; font-weight: bold; color: #c5a059;">MICROBES DENSITY DATA:</div>
              <div class="layer-bar"><div class="layer-fill" id="pb-1" style="width: 15%;"></div></div>
              <div style="margin-top: 12px; font-size: 11px; opacity: 0.6;">DENSITY: <span id="density-val">10^9 / g</span></div>
            </div>

            <div class="foliage-sketch">
              <!-- Scientific grid sketch of active soil layer -->
              <svg viewBox="0 0 380 520" style="position: absolute; inset: 0; width: 100%; height: 100%; stroke: rgba(226, 230, 220, 0.25); fill: none; stroke-width: 1.5;">
                <line x1="40" y1="40" x2="340" y2="40" stroke-dasharray="5" />
                <line x1="40" y1="120" x2="340" y2="120" stroke-dasharray="5" />
                <line x1="40" y1="220" x2="340" y2="220" stroke-dasharray="5" />
                <line x1="40" y1="360" x2="340" y2="360" stroke-dasharray="5" />
                <!-- Procedural sketch layers -->
                <path d="M 60 500 Q 120 420 180 480 T 320 400" />
                <path d="M 120 420 Q 200 320 280 380" />
                <!-- Lab annotation label -->
                <text x="60" y="80" font-family="Courier Prime" font-size="12" fill="#c5a059" stroke="none">SAMPLE_B2 // CRITICAL</text>
              </svg>
            </div>

            <!-- Procedural microbe rods host -->
            <div id="spore-swarm" style="position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none;"></div>

            <div class="hero-stack">
              <!-- Act 1: 0.27s -> 4.5s -->
              <div id="para-1" style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 40px; transform-style: preserve-3d;">
                <span id="p1-line1" style="font-family: 'Playfair Display', serif; font-size: 52px; font-style: italic; color: #e2e6dc; text-shadow: 0 4px 15px rgba(0,0,0,0.95); transform: translateZ(20px);">Obsessed with engineering nature,</span>
                <span id="p1-line2" style="font-family: 'Playfair Display', serif; font-size: 52px; font-style: italic; color: #e2e6dc; text-shadow: 0 4px 15px rgba(0,0,0,0.95); transform: translateZ(20px);">they forgot the mud.</span>
              </div>
              
              <!-- Act 2: 4.79s -> 12.0s -->
              <div id="para-2" style="display: flex; flex-direction: column; align-items: center; gap: 20px; transform-style: preserve-3d; opacity: 0; position: absolute; top: 12%;">
                <span id="hw-beneath" style="font-family: 'Courier Prime', monospace; font-size: 38px; letter-spacing: 0.18em; color: #c5a059; text-shadow: 0 3px 12px rgba(0,0,0,0.95);">BENEATH THEIR FEET,</span>
                <span id="hw-trillions" style="font-family: 'Oswald', sans-serif; font-size: 130px; font-weight: 900; letter-spacing: 0.08em; color: #ffffff; text-shadow: 0 0 40px rgba(197, 160, 89, 0.45), 0 5px 25px rgba(0,0,0,0.95); margin-top: -10px;">TRILLIONS</span>
                <span id="hw-microbes" style="font-family: 'Courier Prime', monospace; font-size: 34px; letter-spacing: 0.12em; color: #e2e6dc; background: rgba(20, 17, 14, 0.85); border: 2px solid rgba(226, 230, 220, 0.35); padding: 10px 24px; margin-top: 10px;">SOIL MICROBES</span>
                <span id="hw-frenzy" style="font-family: 'Playfair Display', serif; font-size: 42px; color: #ffffff; text-shadow: 0 3px 12px rgba(0,0,0,0.95); margin-top: 15px; font-style: italic;">went on an oxygen-devouring frenzy.</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Post-Processing (NO class=clip) -->
        <div id="chrom-wrap">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette"></div>
        <canvas id="grain" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-04";
      const D = 12.00;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400004);

      // Initialize Grain Canvas
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4344);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 64) | 0;
            data[i] = data[i+1] = data[i+2] = n;
            data[i+3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Generate procedural organic sand/clay swarm particles
      const swarm = document.getElementById("spore-swarm");
      if (swarm) {
        const mRng = H.mulberry32(0x43400004);
        for (let i = 0; i < 20; i++) {
          const rod = document.createElement("div");
          rod.className = "spore-rod";
          const x = 100 + mRng() * 880;
          const y = 300 + mRng() * 1200;
          const w = 12 + mRng() * 14;
          const h = 28 + mRng() * 32;
          const rot = mRng() * 360;
          rod.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);opacity:0;`;
          swarm.appendChild(rod);

          // Reveal drift
          tl.to(rod, { opacity: 0.82, duration: 0.8, ease: "power2.out" }, 0.2 + (i * 0.05));
          
          tl.to(rod, {
            x: (mRng() - 0.5) * 180,
            y: (mRng() - 0.5) * 180,
            rotation: "+=" + ((mRng() > 0.5 ? 1 : -1) * (90 + mRng() * 180)),
            duration: D,
            ease: "none"
          }, 0);
        }
      }

      // Initial layouts
      gsap.set("#p1-line1", { y: 25, opacity: 0 });
      gsap.set("#p1-line2", { y: 25, opacity: 0 });
      gsap.set("#hw-beneath", { opacity: 0, y: 15 });
      gsap.set("#hw-trillions", { opacity: 0, scale: 0.8 });
      gsap.set("#hw-microbes", { opacity: 0, y: 15 });
      gsap.set("#hw-frenzy", { opacity: 0, y: 15 });

      // Continuous visual Pan-Drift
      tl.to("#stage-tilt", { scale: 1.06, duration: D, ease: "none" }, 0);
      tl.to("#stage-tilt .z-bg", { scale: 1.1, x: -20, y: 20, rotateY: -3, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".soil-layers-panel", { x: -30, rotateY: 10, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".foliage-sketch", { x: 30, rotateY: -10, duration: D, ease: "sine.inOut" }, 0);

      // Microbe density data progress bar
      tl.to("#pb-1", { width: "95%", duration: D * 0.8, ease: "sine.inOut" }, 0);
      
      const roll = { v: 9 };
      tl.to(roll, {
        v: 14,
        duration: D * 0.8,
        ease: "sine.inOut",
        onUpdate() {
          const valEl = document.getElementById("density-val");
          if (valEl) valEl.innerHTML = `10^${Math.floor(roll.v)} / g <span style="color:#ff6b6b;">➔ CRITICAL</span>`;
        }
      }, 0);

      // Revealing text locally
      // Line 1: 0.27s
      tl.to("#p1-line1", { y: 0, opacity: 1, duration: 0.6, ease: "springLight" }, 0.27);
      
      // Line 2: 2.76s
      tl.to("#p1-line2", { y: 0, opacity: 1, duration: 0.6, ease: "springLight" }, 2.76);

      // Fade out paragraph 1 at 4.30s
      tl.to("#para-1", { opacity: 0, y: -20, duration: 0.45, ease: "power2.in" }, 4.3);

      // Beneath their feet (4.79s)
      tl.to("#para-2", { opacity: 1, duration: 0.1 }, 4.79);
      tl.to("#hw-beneath", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.79);

      // TRILLIONS snap-zoom reveal (6.03s)
      tl.to("#hw-trillions", { opacity: 1, duration: 0.1 }, 6.03);
      H.snapZoomWithRecover(tl, "#hw-trillions", 6.03, { peakScale: 1.4, peakZ: 60, peakDur: 0.15, recoverDur: 0.45 });
      H.screenShake(tl, "#root-inner", 6.03, 1.35);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 6.03, 1.2);
      
      // Seeded particle burst at center
      H.particleBurst(tl, document.getElementById("stage-tilt"), 540, 960, 6.03, 18, "#c5a059", 4344);

      // Microbes label (6.97s)
      tl.to("#hw-microbes", { opacity: 1, y: 0, duration: 0.4, ease: "springSnappy" }, 6.97);

      // Frenzy went on (9.00s)
      tl.to("#hw-frenzy", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 9.00);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 11.60s
      tl.to("#stage-tilt", { scale: 1.15, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
