<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 Clip 02 — Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/_shared/ace-recipes.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1000px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      #stage-tilt {
        position: absolute;
        inset: -5%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        transform-style: preserve-3d;
        background:
          radial-gradient(circle at 50% 50%, rgba(201, 168, 76, 0.06), transparent 65%),
          linear-gradient(180deg, #0e0d0b 0%, #050505 100%);
      }
      .grid-lines {
        position: absolute;
        inset: -10%;
        opacity: 0.08;
        background-image:
          linear-gradient(rgba(201, 168, 76, 0.15) 1px, transparent 1px),
          linear-gradient(90deg, rgba(201, 168, 76, 0.15) 1px, transparent 1px);
        background-size: 60px 60px;
        transform: rotateX(70deg);
        transform-origin: center 80%;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
        pointer-events: none;
      }
      .hud-header {
        border-bottom: 1px solid rgba(201, 168, 76, 0.2);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #c9a84c;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(201, 168, 76, 0.3);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(201, 168, 76, 0.2);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #c9a84c;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .center-dome-wrap {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%) translateZ(30px);
        width: 600px;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .dome-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
      }
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(150px) scale(0.85);
        pointer-events: none;
      }
      .center-orbit-wrap {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%) translateZ(-40px);
        width: 480px;
        height: 480px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .orbit-ring {
        width: 100%;
        height: 100%;
        border: 1.5px dashed rgba(201, 168, 76, 0.35);
        border-radius: 50%;
        transform: rotateX(72deg);
        box-shadow: 0 0 12px rgba(201, 168, 76, 0.15);
      }
      
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 60%;
        transform: translateX(-50%) translateZ(60px);
        width: 960px;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .hero-word {
        font-family: 'Oswald', sans-serif;
        font-weight: 900;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.45), 0 4px 15px rgba(0, 0, 0, 0.85);
        opacity: 0;
      }
      #hw-perfect {
        font-size: 110px;
        line-height: 1.1;
      }
      #hw-replica {
        font-family: 'Playfair Display', serif;
        font-size: 70px;
        color: #c9a84c;
        text-shadow: 0 0 15px rgba(201, 168, 76, 0.5);
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.12); }
      #chrom-b { background: rgba(0, 100, 255, 0.12); }
      
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 35;
        background: radial-gradient(ellipse 72% 78% at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="Video434-clip-02"
      data-start="0"
      data-duration="4.50"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="4.50" data-track-index="0">
          <div id="stage-tilt">
            <!-- L0 Background -->
            <div class="z-bg clip" data-start="0" data-duration="4.50" data-track-index="1">
              <div class="grid-lines"></div>
            </div>
            
            <!-- L2 Mid Ground Wireframe & HUD -->
            <div class="center-dome-wrap clip" data-start="0" data-duration="4.50" data-track-index="2">
              <svg class="dome-svg" viewBox="0 0 600 600">
                <!-- Main outer hemisphere dome -->
                <path id="dome-base" d="M 100 450 A 200 200 0 0 1 500 450 Z" fill="none" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" />
                <line id="dome-floor" x1="50" y1="450" x2="550" y2="450" stroke="#c9a84c" stroke-width="3" />
                <!-- Inner structural arcs -->
                <path id="dome-arc-1" d="M 170 450 A 130 200 0 0 1 430 450 Z" fill="none" stroke="rgba(201, 168, 76, 0.7)" stroke-width="1.5" />
                <path id="dome-arc-2" d="M 230 450 A 70 200 0 0 1 370 450 Z" fill="none" stroke="rgba(201, 168, 76, 0.7)" stroke-width="1.5" />
                <!-- Horizontal structural bars -->
                <line id="dome-bar-1" x1="130" y1="350" x2="470" y2="350" stroke="rgba(201, 168, 76, 0.5)" stroke-width="1" />
                <line id="dome-bar-2" x1="200" y1="250" x2="400" y2="250" stroke="rgba(201, 168, 76, 0.5)" stroke-width="1" />
              </svg>
            </div>
            
            <div class="z-mg clip" data-start="0" data-duration="4.50" data-track-index="3">
              <div class="hud-header">
                <div>
                  <h1 class="hud-title">SYSTEM PRESETS</h1>
                  <div class="hud-subtitle">STRUCTURAL ARCHITECTURE</div>
                </div>
                <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                  <div>CO2 // <span style="font-weight: 700;">0.03%</span></div>
                  <div>O2 // <span>20.9%</span></div>
                </div>
              </div>
              
              <div class="hud-footer">
                <div>SYS_DESIGN // PERFECT</div>
                <div style="font-weight: 700; letter-spacing: 0.15em;">PHASE_02 // SYSTEM_PRESETS</div>
              </div>
            </div>
            
            <!-- L3 Foreground Orbit Ring -->
            <div class="z-fg clip" data-start="0" data-duration="4.50" data-track-index="4">
              <div class="center-orbit-wrap">
                <div class="orbit-ring"></div>
              </div>
            </div>

            <div class="hero-stack clip" data-start="0" data-duration="4.50" data-track-index="5">
              <span id="hw-perfect" class="hero-word clip" data-start="1.48" data-duration="3.02" data-track-index="6">PERFECT</span>
              <span id="hw-replica" class="hero-word clip" data-start="2.87" data-duration="1.63" data-track-index="7">REPLICA</span>
            </div>
          </div>
        </div>

        <!-- Post-Processing -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="4.50" data-track-index="8">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="4.50" data-track-index="9"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="4.50" data-track-index="10" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video434-clip-02";
      const D = 4.50;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0x43400002);

      // Initialize Grain Canvas
      const grain = document.getElementById("grain");
      if (grain) {
        const ctx = grain.getContext("2d");
        if (ctx) {
          const img = ctx.createImageData(540, 960);
          const data = img.data;
          const gRng = H.mulberry32(0x9ace4342);
          for (let i = 0; i < data.length; i += 4) {
            const n = (gRng() * 64) | 0;
            data[i] = data[i+1] = data[i+2] = n;
            data[i+3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }
      }

      // Initial positions
      gsap.set("#hw-perfect", { y: 40, opacity: 0 });
      gsap.set("#hw-replica", { y: 30, opacity: 0 });
      
      // Wireframe drawing values
      const baseLen = 1600;
      const floorLen = 500;
      const arc1Len = 1000;
      const arc2Len = 800;
      const bar1Len = 340;
      const bar2Len = 200;

      gsap.set("#dome-base", { strokeDasharray: baseLen, strokeDashoffset: baseLen });
      gsap.set("#dome-floor", { strokeDasharray: floorLen, strokeDashoffset: floorLen });
      gsap.set("#dome-arc-1", { strokeDasharray: arc1Len, strokeDashoffset: arc1Len });
      gsap.set("#dome-arc-2", { strokeDasharray: arc2Len, strokeDashoffset: arc2Len });
      gsap.set("#dome-bar-1", { strokeDasharray: bar1Len, strokeDashoffset: bar1Len });
      gsap.set("#dome-bar-2", { strokeDasharray: bar2Len, strokeDashoffset: bar2Len });

      // Camera dolly-in and slight tilt drift
      tl.to("#stage-tilt .z-bg", { scale: 1.15, translateZ: 20, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".center-dome-wrap", { scale: 1.12, translateZ: 40, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".center-orbit-wrap", { rotationZ: 120, duration: D, ease: "none" }, 0);

      // Wireframe drawing animations
      const drawDur = 1.5;
      tl.to("#dome-base", { strokeDashoffset: 0, duration: drawDur, ease: "power2.inOut" }, 0);
      tl.to("#dome-floor", { strokeDashoffset: 0, duration: drawDur * 0.8, ease: "power2.inOut" }, 0.15);
      tl.to("#dome-arc-1", { strokeDashoffset: 0, duration: drawDur, ease: "power2.out" }, 0.3);
      tl.to("#dome-arc-2", { strokeDashoffset: 0, duration: drawDur, ease: "power2.out" }, 0.45);
      tl.to("#dome-bar-1", { strokeDashoffset: 0, duration: drawDur * 0.7, ease: "power2.out" }, 0.6);
      tl.to("#dome-bar-2", { strokeDashoffset: 0, duration: drawDur * 0.7, ease: "power2.out" }, 0.75);

      // PERFECT entry (1.48s)
      const localPerfect = 1.48;
      tl.to("#hw-perfect", { y: 0, opacity: 1, duration: 0.5, ease: "springHeavy" }, localPerfect);
      tl.to("#depth-stage", { perspective: 700, duration: 0.15, ease: "power2.out" }, localPerfect);
      tl.to("#depth-stage", { perspective: 1000, duration: 0.4, ease: "sine.inOut" }, localPerfect + 0.15);

      // REPLICA entry (2.87s)
      const localReplica = 2.87;
      tl.to("#hw-replica", { y: 0, opacity: 1, duration: 0.5, ease: "springHeavy" }, localReplica);

      // Outro transition matching next clip (last 12 frames)
      const transitionStart = D - 0.4; // 4.10s
      tl.to("#stage-tilt", { scale: 1.15, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".center-dome-wrap", { scale: 1.25, opacity: 0, duration: 0.4, ease: "power2.in" }, transitionStart);
      tl.to(".hero-stack", { y: -50, opacity: 0, duration: 0.35, ease: "power3.in" }, transitionStart);

      // Continuous breathing micro-motion
      H.lifePulse(tl, ".center-dome-wrap", D, { scaleAmp: 0.015, yAmp: 6, rotAmp: 0.3 });

      // Seek connection
      window.addEventListener("hf-seek", (event) => {
        tl.seek(event.detail.time);
      });

      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
