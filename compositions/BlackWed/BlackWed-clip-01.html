    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- MAIN SCRIPT                                                 -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script>
    (function() {
      "use strict";

      /* ═══════════════════════════════════════════════════════════ */
      /* CONSTANTS                                                   */
      /* ═══════════════════════════════════════════════════════════ */
      var COMP_ID = "BlackWed-clip-01";
      var D = 9.5;           // total clip duration in seconds
      var FPS = 30;
      var W = 1080, H = 1920;

      /* ═══════════════════════════════════════════════════════════ */
      /* MULBERRY32 SEEDED PRNG                                      */
      /* ═══════════════════════════════════════════════════════════ */
      function mulberry32(seed) {
        return function() {
          var t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rng = mulberry32(88888);

      /* ═══════════════════════════════════════════════════════════ */
      /* DUST PARTICLES (Z-FG-2)                                     */
      /* ═══════════════════════════════════════════════════════════ */
      var dustContainer = document.getElementById("dust-container");
      var DUST_COUNT = 28;
      for (var i = 0; i < DUST_COUNT; i++) {
        var p = document.createElement("div");
        p.className = "dust-particle";
        var sz = 1.5 + rng() * 3.5;
        var px = rng() * (W + 200) - 100;
        var py = rng() * (H + 400) - 200;
        var alpha = 0.08 + rng() * 0.18;
        p.style.cssText =
          "width:" + sz + "px;" +
          "height:" + sz + "px;" +
          "left:" + px + "px;" +
          "top:" + py + "px;" +
          "background:rgba(210,180,120," + alpha + ");" +
          "box-shadow:0 0 " + (sz * 1.5) + "px rgba(210,180,120," + (alpha * 0.4) + ");";
        p.setAttribute("data-speed", (0.4 + rng() * 0.8).toFixed(3));
        p.setAttribute("data-drift", (-0.3 + rng() * 0.6).toFixed(3));
        dustContainer.appendChild(p);
      }

      /* ═══════════════════════════════════════════════════════════ */
      /* FILM GRAIN (540×960)                                        */
      /* ═══════════════════════════════════════════════════════════ */
      var grainCanvas = document.getElementById("film-grain");
      var grainCtx = grainCanvas.getContext("2d");
      grainCanvas.width = 540;
      grainCanvas.height = 960;

      var grainRng = mulberry32(77777);
      var grainData = grainCtx.createImageData(540, 960);
      var grainPixels = grainData.data;
      for (var gi = 0; gi < grainPixels.length; gi += 4) {
        var v = (grainRng() * 255) | 0;
        grainPixels[gi] = v;
        grainPixels[gi + 1] = v;
        grainPixels[gi + 2] = v;
        grainPixels[gi + 3] = 38;
      }
      grainCtx.putImageData(grainData, 0, 0);

      /* ═══════════════════════════════════════════════════════════ */
      /* THREE.JS DEALING ROOM — INLINE SCENE                       */
      /* ═══════════════════════════════════════════════════════════ */
      var threeCanvas = document.getElementById("three-canvas");
      var renderer, scene, camera;
      var deskMeshes = [];
      var crtScreens = [];
      var deskLamp;

      try {
        renderer = new THREE.WebGLRenderer({
          canvas: threeCanvas,
          alpha: true,
          antialias: true,
          premultipliedAlpha: false
        });
        renderer.setSize(W, H, false);
        renderer.setPixelRatio(1);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.85;

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x090703, 0.075);

        camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
        camera.position.set(7.5, 6.8, 10.5);
        camera.lookAt(0, 1.5, 0);

        /* Institutional Lighting Rig */
        // Overhead tungsten banks
        var overhead1 = new THREE.SpotLight(0xffd080, 12);
        overhead1.position.set(2, 8, 3);
        overhead1.angle = Math.PI / 5;
        overhead1.penumbra = 0.9;
        overhead1.decay = 2;
        overhead1.target.position.set(0, 0, 0);
        scene.add(overhead1);
        scene.add(overhead1.target);

        var overhead2 = new THREE.SpotLight(0xffe0a0, 8);
        overhead2.position.set(-3, 7.5, -1);
        overhead2.angle = Math.PI / 4.5;
        overhead2.penumbra = 0.85;
        overhead2.decay = 2;
        scene.add(overhead2);

        // Ambient institutional fill
        var ambientLight = new THREE.AmbientLight(0x1a1008, 0.6);
        scene.add(ambientLight);

        // CRT glow fill (green cast)
        var crtFill = new THREE.PointLight(0x4aff4a, 1.2, 12, 2);
        crtFill.position.set(0, 2.8, 1);
        scene.add(crtFill);

        // Desk lamp (warm directional, animatable)
        deskLamp = new THREE.SpotLight(0xffcc66, 18);
        deskLamp.position.set(2.2, 4.5, 2);
        deskLamp.angle = Math.PI / 7;
        deskLamp.penumbra = 0.7;
        deskLamp.decay = 2;
        deskLamp.target.position.set(0, 0.8, 1);
        scene.add(deskLamp);
        scene.add(deskLamp.target);

        /* Floor */
        var floorGeo = new THREE.PlaneGeometry(30, 30);
        var floorMat = new THREE.MeshStandardMaterial({
          color: 0x0c0804,
          roughness: 0.92,
          metalness: 0.05
        });
        var floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        scene.add(floor);

        /* Desk Material */
        var deskMat = new THREE.MeshStandardMaterial({
          color: 0x2a1a08,
          roughness: 0.7,
          metalness: 0.15
        });

        /* CRT Screen Material */
        var crtMat = new THREE.MeshStandardMaterial({
          color: 0x0a2a0a,
          emissive: 0x1a5a1a,
          emissiveIntensity: 0.6,
          roughness: 0.3,
          metalness: 0.4
        });

        var crtBodyMat = new THREE.MeshStandardMaterial({
          color: 0x2a2820,
          roughness: 0.85,
          metalness: 0.2
        });

        /* Build 3 Desks with CRT monitors */
        var deskPositions = [
          { x: -3.2, z: 0.5, ry: 0.3 },
          { x: 0, z: -0.8, ry: 0 },
          { x: 3.5, z: 0.2, ry: -0.25 }
        ];

        for (var di = 0; di < deskPositions.length; di++) {
          var dp = deskPositions[di];
          var deskGroup = new THREE.Group();

          // Desk surface
          var deskGeo = new THREE.BoxGeometry(2.4, 0.08, 1.2);
          var desk = new THREE.Mesh(deskGeo, deskMat);
          desk.position.y = 1.05;
          deskGroup.add(desk);

          // Desk legs
          var legGeo = new THREE.BoxGeometry(0.06, 1.05, 0.06);
          var legMat = new THREE.MeshStandardMaterial({ color: 0x1a1008, roughness: 0.9, metalness: 0.1 });
          var legOffsets = [[-1.1, -0.5], [-1.1, 0.5], [1.1, -0.5], [1.1, 0.5]];
          for (var li = 0; li < 4; li++) {
            var leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(legOffsets[li][0], 0.525, legOffsets[li][1]);
            deskGroup.add(leg);
          }

          // CRT Monitor body
          var crtBodyGeo = new THREE.BoxGeometry(0.65, 0.55, 0.58);
          var crtBody = new THREE.Mesh(crtBodyGeo, crtBodyMat);
          crtBody.position.set(-0.3 + di * 0.2, 1.38, -0.15);
          deskGroup.add(crtBody);

          // CRT Screen (emissive face)
          var screenGeo = new THREE.PlaneGeometry(0.52, 0.40);
          var screen = new THREE.Mesh(screenGeo, crtMat.clone());
          screen.position.set(-0.3 + di * 0.2, 1.38, 0.14);
          deskGroup.add(screen);
          crtScreens.push(screen);

          // Paper stacks
          var paperGeo = new THREE.BoxGeometry(0.4, 0.06, 0.3);
          var paperMat = new THREE.MeshStandardMaterial({ color: 0xd8c8a0, roughness: 0.95, metalness: 0 });
          var papers = new THREE.Mesh(paperGeo, paperMat);
          papers.position.set(0.7, 1.12, 0.2);
          papers.rotation.y = 0.15 + di * 0.1;
          deskGroup.add(papers);

          deskGroup.position.set(dp.x, 0, dp.z);
          deskGroup.rotation.y = dp.ry;
          scene.add(deskGroup);
          deskMeshes.push(deskGroup);
        }

        /* Ceiling panels */
        var ceilGeo = new THREE.PlaneGeometry(30, 30);
        var ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1610, roughness: 0.95, metalness: 0.05, side: THREE.DoubleSide });
        var ceiling = new THREE.Mesh(ceilGeo, ceilMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 9;
        scene.add(ceiling);

        /* Wall behind */
        var wallGeo = new THREE.PlaneGeometry(30, 10);
        var wallMat = new THREE.MeshStandardMaterial({ color: 0x14100a, roughness: 0.88, metalness: 0.08 });
        var wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(0, 4.5, -6);
        scene.add(wall);

        // Initial render
        renderer.render(scene, camera);
      } catch(e) {
        // Three.js not available — graceful degradation
        console.warn("Three.js scene creation skipped:", e);
      }

      /* ═══════════════════════════════════════════════════════════ */
      /* THREE.JS RENDER FUNCTION (seek-driven)                      */
      /* ═══════════════════════════════════════════════════════════ */
      function renderThreeAt(localTime) {
        if (!renderer || !scene || !camera) return;

        // Camera orbital arrive: (7.5,6.8,10.5) → (2.8,3.4,8.2) over 2.4s
        var camProgress = Math.min(localTime / 2.4, 1.0);
        // Smooth ease out
        var camEase = 1 - Math.pow(1 - camProgress, 3);
        camera.position.x = 7.5 + (2.8 - 7.5) * camEase;
        camera.position.y = 6.8 + (3.4 - 6.8) * camEase;
        camera.position.z = 10.5 + (8.2 - 10.5) * camEase;

        // Beat 2 transition: camera pushes toward desk (t=4.7–9.5)
        if (localTime > 4.7) {
          var pushProgress = Math.min((localTime - 4.7) / 4.8, 1.0);
          var pushEase = 1 - Math.pow(1 - pushProgress, 2);
          camera.position.z -= (8.2 - 5.5) * pushEase;
          camera.position.y -= 0.8 * pushEase;
        }

        camera.lookAt(0, 1.5, 0);

        // Fog clears with camera arrival
        if (scene.fog) {
          var fogDensity = 0.075 - 0.045 * camEase;
          scene.fog.density = Math.max(0.03, fogDensity);
        }

        // Desk lamp sweep: x 2.2 → -1.6 over 4.0s starting at t=5.5
        if (deskLamp && localTime > 5.5) {
          var lampProgress = Math.min((localTime - 5.5) / 4.0, 1.0);
          deskLamp.position.x = 2.2 + (-1.6 - 2.2) * lampProgress;
        }

        // CRT screen flicker (seeded)
        for (var ci = 0; ci < crtScreens.length; ci++) {
          var flicker = 0.4 + 0.3 * Math.sin(localTime * 4.7 + ci * 2.1) + 0.1 * Math.sin(localTime * 11.3 + ci * 5.3);
          crtScreens[ci].material.emissiveIntensity = flicker;
        }

        renderer.render(scene, camera);
      }

      /* ═══════════════════════════════════════════════════════════ */
      /* GSAP TIMELINE                                               */
      /* ═══════════════════════════════════════════════════════════ */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var compRoot = document.querySelector('[data-composition-id="' + COMP_ID + '"]');

      /* ───────────────────────────────────────────────────────── */
      /* INDEPENDENT ORBITAL MOTION (all layers, full duration)    */
      /* ───────────────────────────────────────────────────────── */
      tl.fromTo(".z-bg",
        { rotateY: -2.5, rotateX: 1.2 },
        { rotateY: 3.0, rotateX: -1.0, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo(".z-mg-ui",
        { rotateY: 1.4, rotateX: -0.6 },
        { rotateY: -1.8, rotateX: 0.7, duration: D * 0.73, ease: "sine.inOut" }, 0);
      tl.fromTo(".z-fg-1",
        { rotateY: -3.2, rotateX: 1.8 },
        { rotateY: 4.1, rotateX: -2.2, duration: D * 0.54, ease: "sine.inOut" }, 0);
      tl.fromTo(".z-fg-2",
        { rotateY: 3.5, rotateX: -2.0 },
        { rotateY: -4.2, rotateX: 2.6, duration: D * 0.39, ease: "sine.inOut" }, 0);

      /* ───────────────────────────────────────────────────────── */
      /* BEAT 1: THE ROOM (local 0:00 – 5.5s)                     */
      /* ───────────────────────────────────────────────────────── */

      // t=0.00: Fade from black
      tl.to("#fade-overlay", {
        opacity: 0,
        duration: 0.8,
        ease: "power2.out"
      }, 0.0);

      // t=0.60: Sepia gradient radial fade in
      tl.to("#sepia-atmos", {
        opacity: 1,
        duration: 1.4,
        ease: "power1.inOut"
      }, 0.6);

      // t=1.20: Ghost text emerges
      tl.to(".ghost-text", {
        opacity: 1,
        duration: 2.0,
        ease: "sine.inOut",
        stagger: 0.3
      }, 1.2);

      // Ghost text life pulse: scale breathing
      var ghostBreathDur = 7.2;
      var ghostBreathRepeats = Math.ceil(D / ghostBreathDur) - 1;
      tl.to(".ghost-text", {
        scale: 1.015,
        duration: ghostBreathDur * 0.5,
        ease: "sine.inOut",
        yoyo: true,
        repeat: ghostBreathRepeats * 2 + 1,
        stagger: 0.8
      }, 0.5);

      // t=2.80: Corner brackets materialize
      tl.to("#cb-tl", { width: 65, height: 65, opacity: 0.85, duration: 0.7, ease: "back.out(1.4)" }, 2.8);
      tl.to("#cb-tr", { width: 65, height: 65, opacity: 0.85, duration: 0.7, ease: "back.out(1.4)" }, 2.95);
      tl.to("#cb-bl", { width: 65, height: 65, opacity: 0.85, duration: 0.7, ease: "back.out(1.4)" }, 3.1);
      tl.to("#cb-br", { width: 65, height: 65, opacity: 0.85, duration: 0.7, ease: "back.out(1.4)" }, 3.25);

      // Corner bracket life pulse: opacity breathing
      var bracketBreathDur = 3.4;
      var bracketBreathRepeats = Math.ceil((D - 2.8) / bracketBreathDur) - 1;
      tl.to(".corner-bracket", {
        opacity: 1.0,
        duration: bracketBreathDur * 0.5,
        ease: "sine.inOut",
        yoyo: true,
        repeat: Math.max(1, bracketBreathRepeats * 2 + 1),
        stagger: 0.2
      }, 3.5);

      // t=4.20: Date stamp masked reveal
      tl.to("#date-stamp", {
        yPercent: -100,
        duration: 0.65,
        ease: "power3.out"
      }, 4.2);

      /* ───────────────────────────────────────────────────────── */
      /* BEAT 1→2 TRANSITION (local t=4.7 – 5.5)                  */
      /* ───────────────────────────────────────────────────────── */

      // Dolly in: perspective 950→630
      tl.to("#depth-stage", {
        perspective: 630,
        duration: 0.85,
        ease: "power3.out"
      }, 4.7);

      // z-mg-ui layer fades in
      tl.to(".z-mg-ui", {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
      }, 5.0);

      /* ───────────────────────────────────────────────────────── */
      /* BEAT 2: THE TELEX (local 5.5 – 9.5s)                     */
      /* ───────────────────────────────────────────────────────── */

      // t=5.5: Telex drops from above
      tl.to("#telex-doc", {
        opacity: 1,
        duration: 0.1,
        ease: "none"
      }, 5.5);

      // Fall: y -280 → 0
      tl.to("#telex-doc", {
        y: 280,
        duration: 0.72,
        ease: "power3.in"
      }, 5.5);

      // Bounce: y +=8px then settle
      tl.to("#telex-doc", {
        y: 288,
        duration: 0.12,
        ease: "power2.out"
      }, 5.5 + 0.72);
      tl.to("#telex-doc", {
        y: 280,
        duration: 0.20,
        ease: "elastic.out(1, 0.35)"
      }, 5.5 + 0.72 + 0.12);

      // Landing impact: screen shake
      tl.to("#depth-stage", {
        x: 4, duration: 0.033, ease: "none"
      }, 5.5 + 0.72);
      tl.to("#depth-stage", {
        x: -3, duration: 0.033, ease: "none"
      }, 5.5 + 0.72 + 0.033);
      tl.to("#depth-stage", {
        x: 2.5, duration: 0.033, ease: "none"
      }, 5.5 + 0.72 + 0.066);
      tl.to("#depth-stage", {
        x: -1.5, duration: 0.033, ease: "none"
      }, 5.5 + 0.72 + 0.099);
      tl.to("#depth-stage", {
        x: 0.8, duration: 0.033, ease: "none"
      }, 5.5 + 0.72 + 0.132);
      tl.to("#depth-stage", {
        x: 0, duration: 0.033, ease: "none"
      }, 5.5 + 0.72 + 0.165);

      // t=7.0: Rate scramble effect (manual ScrambleText)
      var rateEl = document.getElementById("rate-value");
      var scrambleChars = "0123456789.";
      var scrambleFinalText = "2.9500";
      var scrambleRng = mulberry32(99999);

      tl.to({ progress: 0 }, {
        progress: 1,
        duration: 1.1,
        ease: "none",
        onUpdate: function() {
          var progress = this.targets()[0].progress;
          var revealed = Math.floor(progress * scrambleFinalText.length);
          var result = "";
          for (var si = 0; si < scrambleFinalText.length; si++) {
            if (si < revealed) {
              result += scrambleFinalText[si];
            } else {
              result += scrambleChars[(scrambleRng() * scrambleChars.length) | 0];
            }
          }
          if (rateEl) rateEl.textContent = result;
        }
      }, 7.0);

      /* ───────────────────────────────────────────────────────── */
      /* BEAT 2→3 TRANSITION (local t=9.0 – 9.5)                  */
      /* ───────────────────────────────────────────────────────── */

      // Perspective push: 630→420
      tl.to("#depth-stage", {
        perspective: 420,
        duration: 0.75,
        ease: "power3.out"
      }, 9.0);

      /* ───────────────────────────────────────────────────────── */
      /* DUST PARTICLE LIFE PULSE (persistent)                     */
      /* ───────────────────────────────────────────────────────── */
      var dustParticles = dustContainer.querySelectorAll(".dust-particle");
      for (var dpi = 0; dpi < dustParticles.length; dpi++) {
        var dp2 = dustParticles[dpi];
        var speed = parseFloat(dp2.getAttribute("data-speed"));
        var drift = parseFloat(dp2.getAttribute("data-drift"));
        var particleDur = 3.8 / speed;
        var particleRepeats = Math.ceil(D / particleDur) - 1;

        tl.to(dp2, {
          y: -12 * speed,
          x: drift * 8,
          duration: particleDur * 0.5,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.max(1, particleRepeats * 2 + 1)
        }, rng() * 1.5);

        // Subtle opacity pulse
        var opacityDur = 2.5 + rng() * 3;
        var opacityRepeats = Math.ceil(D / opacityDur) - 1;
        tl.fromTo(dp2,
          { opacity: 0.4 + rng() * 0.3 },
          {
            opacity: 0.1 + rng() * 0.2,
            duration: opacityDur * 0.5,
            ease: "sine.inOut",
            yoyo: true,
            repeat: Math.max(1, opacityRepeats * 2 + 1)
          }, rng() * 2);
      }

      /* ───────────────────────────────────────────────────────── */
      /* THREE.JS SEEK INTEGRATION                                 */
      /* ───────────────────────────────────────────────────────── */
      // Grain frame cycling via timeline callback
      var grainRng2 = mulberry32(55555);
      var grainFrameHelveticaval = 1 / 8; // refresh grain 8× per second
      var lastGrainFrame = -1;

      tl.to({ t: 0 }, {
        t: D,
        duration: D,
        ease: "none",
        onUpdate: function() {
          var localTime = this.targets()[0].t;

          // Render Three.js scene
          renderThreeAt(localTime);

          // Cycle grain every ~0.125s
          var grainFrame = Math.floor(localTime / grainFrameHelveticaval);
          if (grainFrame !== lastGrainFrame) {
            lastGrainFrame = grainFrame;
            for (var gfi = 0; gfi < grainPixels.length; gfi += 4) {
              var gv = (grainRng2() * 255) | 0;
              grainPixels[gfi] = gv;
              grainPixels[gfi + 1] = gv;
              grainPixels[gfi + 2] = gv;
            }
            grainCtx.putImageData(grainData, 0, 0);
          }
        }
      }, 0);

      /* ───────────────────────────────────────────────────────── */
      /* HF-SEEK INTEGRATION (for preview/render)                  */
      /* ───────────────────────────────────────────────────────── */
      window.addEventListener("hf-seek", function(e) {
        if (e.detail && typeof e.detail.time === "number") {
          renderThreeAt(e.detail.time);
        }
      });

      // Initial Three.js render
      renderThreeAt(0);

      /* ───────────────────────────────────────────────────────── */
      /* REGISTER TIMELINE                                         */
      /* ───────────────────────────────────────────────────────── */
      window.__timelines[COMP_ID] = tl;

    })();
    </script>

  </div>
</template>
