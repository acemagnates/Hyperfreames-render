    <!-- ═══════════════════════════════════════════════════════════
         SCRIPTS
    ═══════════════════════════════════════════════════════════ -->
    <script src="compositions/_shared/gsap.min.js"></script>
    <script src="compositions/_shared/three.min.js"></script>
    <script>
    (function() {
      "use strict";

      const COMP_ID = "BlackWed-clip-03";
      const D = 8.0; // local clip duration in seconds
      const W = 1080, H = 1920;
      const FPS = 30;

      // ─── MULBERRY32 SEEDED PRNG ───
      function mulberry32(seed) {
        return function() {
          var t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rng = mulberry32(88888);

      // ─── Scope selectors ───
      const root = document.querySelector('[data-composition-id="' + COMP_ID + '"]');
      function $(sel) { return root.querySelector(sel); }
      function $$(sel) { return root.querySelectorAll(sel); }

      // ═══════════════════════════════════════════════════════
      //  THREE.JS SCENE B — BANK OF ENGLAND EXTERIOR (INLINED)
      // ═══════════════════════════════════════════════════════

      const canvas = $('#three-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.setClearColor(0x030303, 1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.9;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070604, 0.018);

      // Camera — low angle looking up
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
      camera.position.set(0, 1.5, 16);
      camera.lookAt(0, 6, 0);

      // ─── GROUND: wet Threadneedle Street stone ───
      const groundGeo = new THREE.PlaneGeometry(60, 60);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x090805, roughness: 0.82, metalness: 0.06
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.5;
      scene.add(ground);

      // ─── STEPS: 4 risers leading up to colonnade ───
      for (let i = 0; i < 4; i++) {
        const stepGeo = new THREE.BoxGeometry(18, 0.35, 1.6);
        const stepMat = new THREE.MeshStandardMaterial({
          color: 0x8a7d6a, roughness: 0.88, metalness: 0.02
        });
        const step = new THREE.Mesh(stepGeo, stepMat);
        step.position.set(0, -0.3 + i * 0.35, 5.5 - i * 1.5);
        scene.add(step);
      }

      // ─── BUILDING FACADE (flat plane behind columns) ───
      const facadeGeo = new THREE.PlaneGeometry(20, 18);
      const facadeMat = new THREE.MeshStandardMaterial({
        color: 0x9e9280, roughness: 0.92, metalness: 0.01
      });
      const facade = new THREE.Mesh(facadeGeo, facadeMat);
      facade.position.set(0, 8, -1);
      scene.add(facade);

      // ─── PEDIMENT (triangular top) ───
      const pedimentShape = new THREE.Shape();
      pedimentShape.moveTo(-10, 0);
      pedimentShape.lineTo(0, 4);
      pedimentShape.lineTo(10, 0);
      pedimentShape.lineTo(-10, 0);
      const pedimentGeo = new THREE.ExtrudeGeometry(pedimentShape, { depth: 1.2, bevelEnabled: false });
      const pedimentMat = new THREE.MeshStandardMaterial({
        color: 0xb8a88a, roughness: 0.85, metalness: 0.01
      });
      const pediment = new THREE.Mesh(pedimentGeo, pedimentMat);
      pediment.position.set(0, 17, -1.5);
      scene.add(pediment);

      // ─── 6 PORTLAND LIMESTONE COLUMNS ───
      const columnPositions = [];
      const COL_SPACING = 3.0;
      for (let i = 0; i < 6; i++) {
        const x = (i - 2.5) * COL_SPACING;
        columnPositions.push(x);

        // Column shaft
        const colGeo = new THREE.CylinderGeometry(0.38, 0.44, 14, 16);
        const colMat = new THREE.MeshStandardMaterial({
          color: 0x9e9280, roughness: 0.90, metalness: 0.01
        });
        const col = new THREE.Mesh(colGeo, colMat);
        col.position.set(x, 6.5, 0);
        scene.add(col);

        // Column capital (wider top piece)
        const capGeo = new THREE.CylinderGeometry(0.55, 0.40, 1.0, 16);
        const capMat = new THREE.MeshStandardMaterial({
          color: 0xb8a88a, roughness: 0.85, metalness: 0.01
        });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.set(x, 13.8, 0);
        scene.add(cap);

        // Column base
        const baseGeo = new THREE.CylinderGeometry(0.52, 0.56, 0.6, 16);
        const baseMat = new THREE.MeshStandardMaterial({
          color: 0x8a7d6a, roughness: 0.88, metalness: 0.02
        });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.set(x, -0.2, 0);
        scene.add(base);
      }

      // ─── 6 WINDOWS ───
      const windowMeshes = [];
      const windowPositions2D = []; // track screen positions for CSS glows
      // Top row: 4 windows between column pairs
      const winTopY = 10;
      const winBotY = 5.5;
      const winXPositions = [
        (columnPositions[0] + columnPositions[1]) / 2,
        (columnPositions[1] + columnPositions[2]) / 2,
        (columnPositions[3] + columnPositions[4]) / 2,
        (columnPositions[4] + columnPositions[5]) / 2,
      ];
      // Top row: 4 windows
      for (let i = 0; i < 4; i++) {
        const winGeo = new THREE.PlaneGeometry(1.6, 2.4);
        const winMat = new THREE.MeshStandardMaterial({
          color: 0x040302,
          emissive: 0xd4820a,
          emissiveIntensity: 0, // starts OFF
          roughness: 0.3,
          metalness: 0.1
        });
        const win = new THREE.Mesh(winGeo, winMat);
        win.position.set(winXPositions[i], winTopY, -0.48);
        scene.add(win);
        windowMeshes.push(win);
      }
      // Bottom row: 2 windows at extremes
      for (let i = 0; i < 2; i++) {
        const bx = i === 0 ? winXPositions[0] : winXPositions[3];
        const winGeo = new THREE.PlaneGeometry(1.6, 2.4);
        const winMat = new THREE.MeshStandardMaterial({
          color: 0x040302,
          emissive: 0xd4820a,
          emissiveIntensity: 0,
          roughness: 0.3,
          metalness: 0.1
        });
        const win = new THREE.Mesh(winGeo, winMat);
        win.position.set(bx, winBotY, -0.48);
        scene.add(win);
        windowMeshes.push(win);
      }

      // ─── ENTABLATURE (horizontal beam above columns) ───
      const entGeo = new THREE.BoxGeometry(20, 1.2, 1.5);
      const entMat = new THREE.MeshStandardMaterial({
        color: 0xb8a88a, roughness: 0.85, metalness: 0.01
      });
      const entablature = new THREE.Mesh(entGeo, entMat);
      entablature.position.set(0, 14.6, -0.2);
      scene.add(entablature);

      // ─── LIGHTING ───
      // Sodium vapour street lamp
      const sodiumLight = new THREE.PointLight(0xd47208, 4.2, 28, 1.5);
      sodiumLight.position.set(-9, 7, 6);
      scene.add(sodiumLight);

      // Institutional spotlight
      const institutionalSpot = new THREE.SpotLight(0xeef0ff, 2.4);
      institutionalSpot.position.set(0, 28, 8);
      institutionalSpot.target.position.set(0, 4, 0);
      institutionalSpot.angle = Math.PI / 11;
      institutionalSpot.penumbra = 0.45;
      scene.add(institutionalSpot);
      scene.add(institutionalSpot.target);

      // Overcast sky glow
      const skyLight = new THREE.DirectionalLight(0x8090a8, 0.15);
      skyLight.position.set(0, 20, -5);
      scene.add(skyLight);

      // Ambient fill (very subtle)
      const ambLight = new THREE.AmbientLight(0x1a1510, 0.3);
      scene.add(ambLight);

      // ─── RENDER FUNCTION ───
      // State variables for animation
      let currentCamZ = 16;
      let currentSpotIntensity = 2.4;
      let windowIntensities = [0, 0, 0, 0, 0, 0];
      let threeCanvasOpacity = 0;

      function renderThreeAt(localTime) {
        // Update window emissive intensities
        for (let i = 0; i < 6; i++) {
          windowMeshes[i].material.emissiveIntensity = windowIntensities[i];
        }

        // Update spotlight intensity
        institutionalSpot.intensity = currentSpotIntensity;

        // Camera position updates (driven by GSAP, stored in currentCamZ)
        camera.position.z = currentCamZ;
        camera.lookAt(0, 6, 0);

        // Subtle camera breathing from time
        camera.position.x = Math.sin(localTime * 0.15) * 0.3;
        camera.position.y = 1.5 + Math.sin(localTime * 0.22) * 0.12;

        renderer.render(scene, camera);
      }

      // ─── HF-SEEK INTEGRATION ───
      window.addEventListener("hf-seek", function(e) {
        renderThreeAt(e.detail.time);
      });

      // ═══════════════════════════════════════════════════════
      //  "BASE RATE: 15%" CHARACTER STAGGER SETUP
      // ═══════════════════════════════════════════════════════

      const rateText = "BASE RATE: 15%";
      const rateCharsEl = $('#rate-chars');
      var charSpans = [];
      for (let i = 0; i < rateText.length; i++) {
        const ch = rateText[i];
        const wrap = document.createElement('div');
        wrap.className = 'rate-char-wrap';
        const span = document.createElement('span');
        span.className = 'rate-char';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        wrap.appendChild(span);
        rateCharsEl.appendChild(wrap);
        charSpans.push(span);
      }

      // ═══════════════════════════════════════════════════════
      //  SODIUM-TINTED ATMOSPHERIC PARTICLES
      // ═══════════════════════════════════════════════════════

      const particlesContainer = $('#particles-container');
      const PARTICLE_COUNT = 18;
      const particleEls = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = document.createElement('div');
        p.className = 'sodium-particle';
        const size = 1.5 + rng() * 3;
        const opacity = 0.08 + rng() * 0.15;
        const hue = 25 + rng() * 15; // sodium orange range
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = 'hsla(' + hue + ', 85%, 55%, ' + opacity + ')';
        p.style.transform = 'translate(' + (rng() * 1300) + 'px, ' + (rng() * 2200) + 'px)';
        particlesContainer.appendChild(p);
        particleEls.push({
          el: p,
          startX: rng() * 1300,
          startY: rng() * 2200,
          driftX: (rng() - 0.5) * 60,
          driftY: -20 - rng() * 40,
          sway: rng() * 2 + 0.5
        });
      }

      // ═══════════════════════════════════════════════════════
      //  FILM GRAIN (540×960 canvas)
      // ═══════════════════════════════════════════════════════

      const grainCanvas = $('#film-grain');
      const grainCtx = grainCanvas.getContext('2d');
      grainCanvas.width = 540;
      grainCanvas.height = 960;

      const grainRng = mulberry32(77777);
      const grainData = grainCtx.createImageData(540, 960);
      const grainPixels = grainData.data;

      function updateGrain(frame) {
        const seed = mulberry32(77777 + frame * 137);
        for (let i = 0; i < grainPixels.length; i += 4) {
          const v = seed() * 255;
          grainPixels[i] = v;
          grainPixels[i + 1] = v;
          grainPixels[i + 2] = v;
          grainPixels[i + 3] = 45;
        }
        grainCtx.putImageData(grainData, 0, 0);
      }
      updateGrain(0);

      // Update grain every 2 frames (~15fps grain flicker)
      const grainFrames = Math.ceil(D * FPS / 2);
      for (let f = 0; f < grainFrames; f++) {
        // We'll update grain in the seek handler instead for determinism
      }

      // ═══════════════════════════════════════════════════════
      //  GSAP TIMELINE (ALL LOCAL TIME)
      // ═══════════════════════════════════════════════════════

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ─── INDEPENDENT ORBITAL MOTION (mandatory, all layers) ───
      tl.fromTo(".z-bg",
        { rotateY: -2.5, rotateX: 1.2 },
        { rotateY: 3.0, rotateX: -1.0, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo(".z-mg-ui",
        { rotateY: 1.4, rotateX: -0.6 },
        { rotateY: -1.8, rotateX: 0.7, duration: D * 0.73, ease: "sine.inOut" }, 0);
      tl.fromTo(".z-fg-1",
        { rotateY: -3.2, rotateX: 1.8 },
        { rotateY: 4.1, rotateX: -2.2, duration: D * 0.54, ease: "sine.inOut" }, 0);
      tl.fromTo(".z-fg-2",
        { rotateY: 3.5, rotateX: -2.0 },
        { rotateY: -4.2, rotateX: 2.6, duration: D * 0.39, ease: "sine.inOut" }, 0);

      // ─── CROSSFADE: DOM column shards fade OUT ───
      tl.to("#column-shards", {
        opacity: 0, duration: 1.0, ease: "power1.inOut"
      }, 0);

      // ─── CROSSFADE: Three.js canvas fades IN ───
      tl.fromTo("#three-canvas",
        { opacity: 0 },
        { opacity: 1, duration: 1.2, ease: "power1.inOut" }, 0);

      // ─── CAMERA DOLLY: initial reveal z 16→22 ───
      tl.to(
        { value: 16 },
        {
          value: 22,
          duration: 1.6,
          ease: "power2.out",
          onUpdate: function() { currentCamZ = this.targets()[0].value; }
        }, 0
      );

      // ─── CAMERA: slow establishing dolly z 22→24 ───
      tl.to(
        { value: 22 },
        {
          value: 24,
          duration: 3.4,
          ease: "power1.inOut",
          onUpdate: function() { currentCamZ = this.targets()[0].value; }
        }, 1.6
      );

      // ─── CAMERA: slow push-in during silence z 24→18 ───
      tl.to(
        { value: 24 },
        {
          value: 18,
          duration: 3.0,
          ease: "power1.inOut",
          onUpdate: function() { currentCamZ = this.targets()[0].value; }
        }, 5.0
      );

      // ─── WINDOW LIGHT-UP SEQUENCE (local 0.5–3.2, stagger 0.45s) ───
      for (let i = 0; i < 6; i++) {
        const winStart = 0.5 + i * 0.45;
        // Window emissive via proxy object
        tl.to(
          windowIntensities,
          {
            [i]: 1.8,
            duration: 0.6,
            ease: "expo.out"
          }, winStart
        );
        // CSS glow overlay
        tl.to('.window-glow[data-win="' + i + '"]', {
          opacity: 1, duration: 0.6, ease: "expo.out"
        }, winStart);
      }

      // ─── "BASE RATE: 15%" CHARACTER STAGGER (local 1.7) ───
      for (let i = 0; i < charSpans.length; i++) {
        tl.fromTo(charSpans[i],
          { y: "100%", opacity: 0 },
          { y: "0%", opacity: 1, duration: 0.35, ease: "power3.out" },
          1.7 + i * 0.06
        );
      }

      // ─── Subtle rate text glow pulse during hold ───
      const glowCycles = Math.ceil((D - 2.5) / 2.5);
      tl.to('#rate-text', {
        textShadow: '0 0 12px rgba(255,195,125,0.7), 0 0 40px rgba(210,155,70,0.35), 2px 4px 12px rgba(0,0,0,0.75)',
        duration: 1.25,
        ease: "sine.inOut",
        yoyo: true,
        repeat: glowCycles * 2 - 1
      }, 2.5);

      // ─── CORNER BRACKETS animate in ───
      tl.to('.corner-bracket', {
        width: 55, height: 55, duration: 0.8, ease: "power2.out",
        stagger: { each: 0.08, from: "start" }
      }, 0.3);

      // ─── ACCENT LINE ───
      tl.to('#accent-line', {
        width: 500, duration: 1.2, ease: "power2.out"
      }, 0.6);

      // ─── INSTITUTIONAL SPOTLIGHT GOES OUT (local 3.0–6.0) ───
      tl.to(
        { value: 2.4 },
        {
          value: 0,
          duration: 3.0,
          ease: "power1.inOut",
          onUpdate: function() { currentSpotIntensity = this.targets()[0].value; }
        }, 3.0
      );

      // Window glows also dim slightly as institutional light fades
      tl.to('.window-glow', {
        opacity: 0.55, duration: 2.5, ease: "power1.inOut"
      }, 3.5);

      // ─── PARTICLES: slow sodium-tinted drift ───
      for (let i = 0; i < particleEls.length; i++) {
        const p = particleEls[i];
        tl.fromTo(p.el,
          { x: p.startX, y: p.startY, opacity: 0 },
          {
            x: p.startX + p.driftX,
            y: p.startY + p.driftY,
            opacity: 1,
            duration: D,
            ease: "sine.inOut"
          }, 0
        );
      }

      // ─── TRANSITION TO BEAT 6 (local 7.5–8.0): fly-through exit ───
      tl.to('.z-fg-1', {
        scale: 2.5, opacity: 0, duration: 0.38, ease: "power3.in"
      }, 7.5);
      tl.to('.z-fg-2', {
        scale: 2.5, opacity: 0, duration: 0.38, ease: "power3.in"
      }, 7.5);

      // Three.js canvas fade out
      tl.to('#three-canvas', {
        opacity: 0, duration: 0.6, ease: "power2.in"
      }, 7.4);

      // Rate text fades
      tl.to('#rate-text', {
        opacity: 0, duration: 0.4, ease: "power2.in"
      }, 7.4);

      // Window glows fade
      tl.to('.window-glow', {
        opacity: 0, duration: 0.4, ease: "power2.in"
      }, 7.4);

      // ─── GRAIN UPDATE via onUpdate callback ───
      tl.to({ frame: 0 }, {
        frame: D * FPS,
        duration: D,
        ease: "none",
        onUpdate: function() {
          var f = Math.floor(this.targets()[0].frame);
          if (f % 2 === 0) updateGrain(f);
          // Also trigger Three.js render
          renderThreeAt(tl.time());
        }
      }, 0);

      // ─── Register timeline ───
      window.__timelines[COMP_ID] = tl;

      // Initial render
      renderThreeAt(0);

    })();
    </script>
  </div>
</template>
