              <div class="rate-line-mask" style="overflow:hidden; height:42px; margin-bottom:2px;">

                  <span style="color:rgba(74,255,74,0.7);">GBP/DEM</span>

                  <span class="intervention-tag" style="color:#ff3030; font-size:13px; margin-left:10px; letter-spacing:1px; text-shadow:0 0 12px var(--rate-fall-glow);">[INTERVENTION: BASE RATE → 12%]</span>
                </div>
              </div>
              <div class="rate-line-mask" style="overflow:hidden; height:42px; margin-bottom:2px;">
                <div class="rate-line" data-idx="4" style="transform:translateY(105%); font-size:48px; font-variant-numeric:tabular-nums; white-space:nowrap;">
                  <span style="color:rgba(74,255,74,0.7);">GBP/DEM</span>
                  <span class="rate-num" style="color:rgba(74,255,74,0.95); margin-left:16px;">2.5200</span>
                  <span class="rate-arrow" style="color:var(--rate-fall-red); margin-left:12px; text-shadow:0 0 8px var(--rate-fall-glow);">↓</span>
                  <span class="intervention-tag" style="color:#ff3030; font-size:13px; margin-left:10px; letter-spacing:1px; text-shadow:0 0 12px var(--rate-fall-glow);">[INTERVENTION: BASE RATE → 15%]</span>
                </div>
              </div>
              <div class="rate-line-mask" style="overflow:hidden; height:30px; margin-bottom:2px;">
                <div class="rate-line rate-line-last" data-idx="5" style="transform:translateY(105%); font-size:48px; font-variant-numeric:tabular-nums; white-space:nowrap;">
                  <span style="color:rgba(74,255,74,0.4); letter-spacing:16px; margin-left:56px;">···</span>
                  <span id="cursor-blink" style="display:inline-block; width:12px; height:22px; background:rgba(74,255,74,0.8); margin-left:12px; vertical-align:middle;"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ SHARD CONTAINER (for terminal→columns morph) ═══ -->
        <div id="shard-container" style="position:absolute; left:230px; top:620px; width:620px; height:440px; pointer-events:none; opacity:0; will-change:transform;">
        </div>

        <!-- ═══ COLUMN FORMATION (target positions) ═══ -->
        <div id="column-formation" style="position:absolute; inset:0; pointer-events:none; opacity:0;">
        </div>

      </div>

      <!-- ── Z-FG-1: Framing brackets (Z:+160px) ── -->
      <div class="z-fg-1" style="position:absolute; inset:-5%; transform:translateZ(160px) scale(0.858); transform-style:preserve-3d;">
        <!-- Corner brackets -->
        <div id="bracket-tl" class="corner-bracket" style="position:absolute; top:80px; left:60px; width:60px; height:60px; border-top:2px solid var(--coin-border); border-left:2px solid var(--coin-border); opacity:0.7;"></div>
        <div id="bracket-tr" class="corner-bracket" style="position:absolute; top:80px; right:60px; width:60px; height:60px; border-top:2px solid var(--coin-border); border-right:2px solid var(--coin-border); opacity:0.7;"></div>
        <div id="bracket-bl" class="corner-bracket" style="position:absolute; bottom:80px; left:60px; width:60px; height:60px; border-bottom:2px solid var(--coin-border); border-left:2px solid var(--coin-border); opacity:0.7;"></div>
        <div id="bracket-br" class="corner-bracket" style="position:absolute; bottom:80px; right:60px; width:60px; height:60px; border-bottom:2px solid var(--coin-border); border-right:2px solid var(--coin-border); opacity:0.7;"></div>
      </div>

      <!-- ── Z-FG-2: Atmospheric foreground (Z:+280px) ── -->
      <div class="z-fg-2" style="position:absolute; inset:-8%; transform:translateZ(280px) scale(0.765); transform-style:preserve-3d;">
        <!-- Vignette -->
        <div style="position:absolute; inset:0; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%); pointer-events:none;"></div>
      </div>

      <!-- ── Chromatic Aberration Layer ── -->
      <div id="chromatic-layer" style="position:absolute; inset:0; pointer-events:none; opacity:0; z-index:95; mix-blend-mode:screen;">
        <div id="ch-red" style="position:absolute; inset:0; background:rgba(255,0,0,0.12); will-change:transform;"></div>
        <div id="ch-blue" style="position:absolute; inset:0; background:rgba(0,80,255,0.10); will-change:transform;"></div>
      </div>

      <!-- ── Film grain canvas ── -->
      <canvas id="film-grain" width="540" height="960" style="position:absolute; inset:0; width:1080px; height:1920px; z-index:98; pointer-events:none; mix-blend-mode:overlay; opacity:0.17;"></canvas>

    </div>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- STYLES                                                         -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <style>
      /* @property registrations for animatable custom properties */
      @property --paper-warm {
        syntax: '<color>';
        inherits: false;
        initial-value: #e8d9b5;
      }
      @property --phosphor-green {
        syntax: '<color>';
        inherits: false;
        initial-value: #040e04;
      }
      @property --shard-color {
        syntax: '<color>';
        inherits: false;
        initial-value: #040e04;
      }

      [data-composition-id="BlackWed-clip-02"] {
        /* INSTITUTIONAL WARMTH */
        --env-bg-center: rgba(48,31,12,0.96);
        --env-bg-edge: rgba(8,5,2,1.0);
        --tungsten-glow: rgba(210,155,70,0.11);
        --desk-surface: #170c04;
        --paper-texture: #e8d9b5;
        --paper-warm: #e8d9b5;
        --ink-struck: #1c0f05;
        --shadow-warm: rgba(0,0,0,0.62);

        /* PHOSPHOR TERMINAL */
        --crt-bg: #040e04;
        --crt-glow-near: rgba(74,255,74,0.48);
        --crt-glow-far: rgba(74,255,74,0.09);
        --crt-border: rgba(120,200,120,0.22);
        --crt-scanline: rgba(0,0,0,0.055);
        --rate-fall-red: #ff3030;
        --rate-fall-glow: rgba(255,48,48,0.45);

        /* LIMESTONE */
        --stone-warm: #c4b59a;
        --stone-shadow: rgba(18,12,5,0.82);
        --window-fire: rgba(255,195,125,0.90);
        --sodium-lamp: rgba(212,118,10,0.78);

        /* VOID */
        --void-bg: #030303;
        --ghost-type: rgba(195,160,100,0.025);
        --coin-gold: rgba(185,145,62,0.82);
        --coin-border: rgba(180,138,58,0.78);
        --payoff-text: rgba(200,170,110,0.55);

        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--void-bg);
        font-family: 'Courier Prime', monospace;
      }

      .rate-line {
        will-change: transform;
      }

      .rate-arrow {
        will-change: opacity, text-shadow;
      }

      .corner-bracket {
        will-change: transform;
      }

      .shard {
        position: absolute;
        background-color: var(--shard-color);
        background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.055) 0px, transparent 1px, transparent 3px);
        will-change: transform, clip-path;
        border: 1px solid rgba(120,200,120,0.12);
      }

      #cursor-blink {
        will-change: opacity;
      }
    </style>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- SCRIPTS                                                        -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <script src="compositions/_shared/gsap.min.js"></script>
    <script src="compositions/_shared/CustomEase.min.js"></script>

    <script>
    (function() {
      'use strict';

      /* ── PRNG (mulberry32, no Math.random) ── */
      function mulberry32(a) {
        return function() {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* ── Register custom eases ── */
      if (typeof CustomEase !== 'undefined' && gsap && gsap.registerPlugin) {
        gsap.registerPlugin(CustomEase);
        CustomEase.create('springHeavy', 'M0,0 C0.1,0 0.12,1.2 0.22,1.2 0.32,1.2 0.36,0.96 0.44,0.96 0.52,0.96 0.55,1.03 0.62,1.03 0.7,1.03 0.76,1 1,1');
        CustomEase.create('springSnappy', 'M0,0 C0.04,0 0.06,1.35 0.14,1.35 0.22,1.35 0.26,0.92 0.32,0.92 0.38,0.92 0.4,1.02 0.44,1.02 0.5,1.02 0.55,1 1,1');
      }

      /* ── Constants ── */
      const CID = 'BlackWed-clip-02';
      const D = 5.0; // local clip duration
      const FPS = 30;

      /* ── Utility ── */
      function repeatCount(dur, period) { return Math.max(0, Math.ceil(dur / period) - 1); }

      /* ── DOM refs ── */
      const root = document.querySelector('[data-composition-id="' + CID + '"]');
      const depthStage = root.querySelector('#depth-stage');
      const morphBox = root.querySelector('#telex-terminal-morph');
      const paperOverlay = root.querySelector('#paper-overlay');
      const crtScanlines = root.querySelector('#crt-scanlines');
      const telexText = root.querySelector('#telex-text');
      const terminalContent = root.querySelector('#terminal-content');
      const rateLines = root.querySelectorAll('.rate-line');
      const cursorBlink = root.querySelector('#cursor-blink');
      const shardContainer = root.querySelector('#shard-container');
      const chromaticLayer = root.querySelector('#chromatic-layer');
      const chRed = root.querySelector('#ch-red');
      const chBlue = root.querySelector('#ch-blue');
      const ghostText = root.querySelector('#ghost-text');

      /* ── Film Grain (540x960 canvas) ── */
      const grainCanvas = root.querySelector('#film-grain');
      const grainCtx = grainCanvas.getContext('2d');
      const grainRng = mulberry32(1992);
      const grainData = grainCtx.createImageData(540, 960);
      for (let i = 0; i < grainData.data.length; i += 4) {
        const v = (grainRng() * 255) | 0;
        grainData.data[i] = v;
        grainData.data[i+1] = v;
        grainData.data[i+2] = v;
        grainData.data[i+3] = 44; // ~0.17 * 255
      }
      grainCtx.putImageData(grainData, 0, 0);

      /* ── Simple Three.js ambient glow (inline, no external scene) ── */
      (function initThreeAmbient() {
        const canvas = root.querySelector('#three-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        // Paint a subtle warm radial glow — no full Three.js needed for this clip
        const grad = ctx.createRadialGradient(540, 760, 50, 540, 760, 600);
        grad.addColorStop(0, 'rgba(210,155,70,0.08)');
        grad.addColorStop(0.5, 'rgba(48,31,12,0.04)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1920);
      })();

      /* ══════════════════════════════════════════════════════════════ */
      /* GSAP TIMELINE (all times LOCAL, 0 = clip start = wall 9.5s)  */
      /* ══════════════════════════════════════════════════════════════ */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ────────────────────────────────────────────────────────────── */
      /* INDEPENDENT ORBITAL MOTION (mandatory, all layers)            */
      /* ────────────────────────────────────────────────────────────── */
      tl.fromTo('.z-bg',
        { rotateY: -2.5, rotateX: 1.2 },
        { rotateY: 3.0, rotateX: -1.0, duration: D, ease: 'sine.inOut' }, 0);
      tl.fromTo('.z-mg-ui',
        { rotateY: 1.4, rotateX: -0.6 },
        { rotateY: -1.8, rotateX: 0.7, duration: D * 0.73, ease: 'sine.inOut' }, 0);
      tl.fromTo('.z-fg-1',
        { rotateY: -3.2, rotateX: 1.8 },
        { rotateY: 4.1, rotateX: -2.2, duration: D * 0.54, ease: 'sine.inOut' }, 0);
      tl.fromTo('.z-fg-2',
        { rotateY: 3.5, rotateX: -2.0 },
        { rotateY: -4.2, rotateX: 2.6, duration: D * 0.39, ease: 'sine.inOut' }, 0);

      /* Ghost text slow drift */
      tl.fromTo(ghostText,
        { x: 0, y: 0 },
        { x: -60, y: -30, duration: D, ease: 'sine.inOut' }, 0);

      /* ════════════════════════════════════════════════════════════════ */
      /* BEAT 3 — THE CASCADE (local 0:00–2.5s)                         */
      /* ════════════════════════════════════════════════════════════════ */

      /* ── MORPHISM 1: TELEX → TERMINAL ── */

      /* Phase 1 — Expansion (0.0–0.45s) */
      tl.to(morphBox, {
        width: 620,
        duration: 0.45,
        ease: 'power3.inOut'
      }, 0);
      tl.to(morphBox, {
        scale: 1.55,
        duration: 0.45,
        ease: 'power2.inOut'
      }, 0);
      // Back to readable scale
      tl.to(morphBox, {
        scale: 1.0,
        duration: 0.35,
        ease: 'power2.out'
      }, 0.45);

      // Background color transition paper → CRT
      tl.to(morphBox, {
        backgroundColor: '#040e04',
        duration: 0.45,
        ease: 'power2.inOut'
      }, 0);

      // Box-shadow morph: warm → phosphor
      tl.to(morphBox, {
        boxShadow: '0 0 40px rgba(74,255,74,0.09), 0 0 80px rgba(74,255,74,0.04), inset 0 0 60px rgba(74,255,74,0.03)',
        duration: 0.45,
        ease: 'power2.inOut'
      }, 0);

      // RotateX settle
      tl.to(morphBox, {
        rotateX: 3,
        duration: 0.45,
        ease: 'power2.out'
      }, 0);

      /* Phase 2 — Texture Crossfade (0.25–0.65s, overlapping) */
      tl.to(paperOverlay, {
        opacity: 0,
        duration: 0.4,
        ease: 'power2.inOut'
      }, 0.25);
      tl.to(crtScanlines, {
        opacity: 1,
        duration: 0.4,
        ease: 'power2.inOut'
      }, 0.25);

      /* Phase 3 — Content Dissolve (0.4–0.75s) */
      tl.to(telexText, {
        opacity: 0,
        duration: 0.22,
        ease: 'power2.in'
      }, 0.40);
      tl.to(terminalContent, {
        opacity: 1,
        duration: 0.28,
        ease: 'power2.out'
      }, 0.47);

      /* Phase 4 — Border Morph (0.5–0.8s) */
      tl.to(morphBox, {
        borderColor: 'rgba(120,200,120,0.22)',
        duration: 0.3,
        ease: 'power2.out'
      }, 0.50);

      /* ── THE RATE CASCADE ── */
      const rateTimes = [0.35, 0.72, 1.08, 1.44, 1.80];
      const rateEases = ['expo.out', 'power3.out', 'expo.out', 'power3.out', 'springSnappy'];

      // Rate lines 0-4 masked reveal
      for (let i = 0; i < 5; i++) {
        const line = rateLines[i];
        if (!line) continue;
        tl.to(line, {
          yPercent: 0,
          y: 0,
          duration: 0.20,
          ease: rateEases[i]
        }, rateTimes[i]);

        // Arrow glow pulse on each appearance
        const arrow = line.querySelector('.rate-arrow');
        if (arrow) {
          tl.fromTo(arrow, {
            textShadow: '0 0 20px rgba(255,48,48,0.9), 0 0 40px rgba(255,48,48,0.6)'
          }, {
            textShadow: '0 0 8px rgba(255,48,48,0.45)',
            duration: 0.35,
            ease: 'expo.out'
          }, rateTimes[i]);
        }

        // CRT screen flicker on each ↓
        tl.to(morphBox, { opacity: 0.72, duration: 0.03, ease: 'none' }, rateTimes[i]);
        tl.to(morphBox, { opacity: 1, duration: 0.03, ease: 'none' }, rateTimes[i] + 0.03);
      }

      // Last line (···  cursor) at ~2.1s
      tl.to(rateLines[5], {
        yPercent: 0,
        y: 0,
        duration: 0.18,
        ease: 'power3.out'
      }, 2.10);

      // Cursor blink (finite repeats)
      const cursorCycles = repeatCount(0.5, 0.3); // blink for ~0.5s before stopping
      tl.to(cursorBlink, {
        opacity: 0,
        duration: 0.15,
        yoyo: true,
        repeat: cursorCycles * 2 + 1,
        ease: 'steps(1)'
      }, 2.10);

      // Cursor blink STOPS at local t=2.30
      tl.to(cursorBlink, {
        opacity: 0.8,
        duration: 0.01,
        ease: 'none'
      }, 2.28);
      tl.to(cursorBlink, {
        opacity: 0,
        duration: 0.05,
        ease: 'power2.in'
      }, 2.30);

      /* ── Corner bracket reactions during cascade ── */
      // Pulse brackets on each rate drop
      for (let i = 0; i < rateTimes.length; i++) {
        tl.to('.corner-bracket', {
          scale: 1.06,
          duration: 0.06,
          ease: 'expo.out'
        }, rateTimes[i]);
        tl.to('.corner-bracket', {
          scale: 1,
          duration: 0.25,
          ease: 'elastic.out(1, 0.4)'
        }, rateTimes[i] + 0.06);
      }

      /* ── Three.js canvas fade as terminal takes prominence ── */
      const threeCanvas = root.querySelector('#three-canvas');
      tl.to(threeCanvas, {
        opacity: 0.25,
        duration: 1.5,
        ease: 'power2.inOut'
      }, 0.5);


      /* ════════════════════════════════════════════════════════════════ */
      /* BEAT 4 — THE FRACTURE (local 2.5–5.0s) — THE TURN              */
      /* ════════════════════════════════════════════════════════════════ */

      /* ── Step 1: Freeze (2.30–2.35s) ── */
      tl.to(terminalContent, {
        opacity: 0,
        duration: 0.05,
        ease: 'power2.in'
      }, 2.30);

      /* ── Step 2: Shard Generation (instant, local 2.35s) ── */
      const shardPolygons = [
        'polygon(0% 0%, 36% 0%, 28% 44%, 0% 30%)',
        'polygon(36% 0%, 68% 0%, 72% 36%, 28% 44%)',
        'polygon(68% 0%, 100% 0%, 100% 26%, 72% 36%)',
        'polygon(0% 30%, 28% 44%, 18% 76%, 0% 62%)',
        'polygon(28% 44%, 72% 36%, 66% 70%, 18% 76%)',
        'polygon(72% 36%, 100% 26%, 100% 60%, 66% 70%)',
        'polygon(0% 62%, 18% 76%, 12% 100%, 0% 100%)',
        'polygon(18% 76%, 66% 70%, 60% 100%, 12% 100%)',
        'polygon(66% 70%, 100% 60%, 100% 100%, 60% 100%)',
        'polygon(40% 36%, 62% 32%, 58% 54%, 36% 58%)'
      ];

      const shardRng = mulberry32(3392);
      const shards = [];
      const shardW = 620, shardH = 440;

      for (let i = 0; i < shardPolygons.length; i++) {
        const shard = document.createElement('div');
        shard.className = 'shard';
        shard.style.cssText = 'position:absolute; left:0; top:0; width:' + shardW + 'px; height:' + shardH + 'px; clip-path:' + shardPolygons[i] + '; opacity:0; transform-origin:center center;';
        shardContainer.appendChild(shard);
        shards.push(shard);
      }

      // Show shard container and hide original terminal at t=2.35
      tl.set(shardContainer, { opacity: 1 }, 2.35);
      tl.set(morphBox, { opacity: 0 }, 2.35);

      // Show all shards
      for (let i = 0; i < shards.length; i++) {
        tl.set(shards[i], { opacity: 1 }, 2.35);
      }

      /* ── Step 3: Shard Scatter (2.5–3.15s, 0.65s) ── */
      const scatterData = [];
      for (let i = 0; i < shards.length; i++) {
        const angle = shardRng() * Math.PI * 2;
        const dist = 120 + shardRng() * 280;
        scatterData.push({
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist,
          rotation: (shardRng() - 0.5) * 90,
          scale: 0.6 + shardRng() * 0.5
        });
      }

      for (let i = 0; i < shards.length; i++) {
        const sd = scatterData[i];
        const stagger = i * 0.015;
        tl.to(shards[i], {
          x: sd.x,
          y: sd.y,
          rotation: sd.rotation,
          scale: sd.scale,
          duration: 0.65,
          ease: 'expo.out'
        }, 2.50 + stagger);
      }

      /* ── Step 4: Color Shift During Flight (2.6–3.5s) ── */
      for (let i = 0; i < shards.length; i++) {
        tl.to(shards[i], {
          backgroundColor: '#9e9280',
          borderColor: 'rgba(196,181,154,0.3)',
          duration: 0.9,
          ease: 'power2.inOut'
        }, 2.60 + i * 0.04);
      }

      /* ── Step 5: Column Formation (3.5–4.8s, 1.3s) ── */
      const columnX = [105, 270, 430, 600, 760, 915];
      // Map shards to columns: each shard → a column position
      // 10 shards → 6 columns (some shards merge)
      const shardColumnMap = [0, 1, 2, 3, 4, 5, 0, 2, 4, 3]; // which column each shard goes to
      const shardColumnY = [200, 200, 200, 200, 200, 200, 900, 900, 900, 650]; // target Y positions
      const columnHeights = [1400, 1300, 1450, 1350, 1400, 1250]; // target column heights

      for (let i = 0; i < shards.length; i++) {
        const col = shardColumnMap[i];
        const targetX = columnX[col] - 230; // relative to shard container left
        const targetY = shardColumnY[i] - 620; // relative to shard container top
        const colW = 85;
        const colH = columnHeights[col];

        // Navigate to column position
        tl.to(shards[i], {
          x: targetX,
          y: targetY,
          rotation: 0,
          scale: 1,
          duration: 1.3,
          ease: 'power3.inOut'
        }, 3.50);

        // Morph clip-path to rectangular columns
        tl.to(shards[i], {
          clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
          width: colW,
          height: colH,
          duration: 1.3,
          ease: 'power3.inOut'
        }, 3.50);
      }

      /* ── CAMERA DURING MORPH ── */
      // Snap zoom: perspective violence
      tl.to(depthStage, {
        perspective: 290,
        duration: 0.25,
        ease: 'power4.out'
      }, 2.50);
      // Recover perspective
      tl.to(depthStage, {
        perspective: 750,
        duration: 1.5,
        ease: 'power3.out'
      }, 2.75);

      // z-bg scale punch
      tl.to('.z-bg', {
        scale: 1.97,  // base is 1.88, so this is ~1.05x boost
        duration: 0.35,
        ease: 'expo.out'
      }, 2.50);
      tl.to('.z-bg', {
        scale: 1.88,
        duration: 0.8,
        ease: 'power2.inOut'
      }, 2.85);

      // z-fg-2 opacity flash
      tl.to('.z-fg-2', {
        opacity: 0.4,
        duration: 0.15,
        ease: 'power3.out'
      }, 2.50);
      tl.to('.z-fg-2', {
        opacity: 1,
        duration: 0.35,
        ease: 'power2.in'
      }, 2.65);

      /* ── CHROMATIC ABERRATION (local t=2.5) ── */
      // Intensity 1.5, channel split 22px
      tl.to(chromaticLayer, {
        opacity: 1,
        duration: 0.03,
        ease: 'none'
      }, 2.50);
      tl.to(chRed, {
        x: -22,
        duration: 0.08,
        ease: 'power3.out'
      }, 2.50);
      tl.to(chBlue, {
        x: 22,
        duration: 0.08,
        ease: 'power3.out'
      }, 2.50);
      // Decay
      tl.to(chRed, {
        x: 0,
        duration: 0.12,
        ease: 'power2.in'
      }, 2.58);
      tl.to(chBlue, {
        x: 0,
        duration: 0.12,
        ease: 'power2.in'
      }, 2.58);
      tl.to(chromaticLayer, {
        opacity: 0,
        duration: 0.04,
        ease: 'none'
      }, 2.68);

      /* ── SCREEN SHAKE (local t=2.5, 9px amp, 11-frame decay) ── */
      const shakeAmp = 9;
      const shakeDur = 11 / FPS; // ~0.367s
      const shakeT = 2.50;
      tl.to(depthStage, { x: shakeAmp, duration: 0.033, ease: 'none' }, shakeT);
      tl.to(depthStage, { x: -shakeAmp * 0.85, duration: 0.033, ease: 'none' }, shakeT + 0.033);
      tl.to(depthStage, { x: shakeAmp * 0.65, duration: 0.033, ease: 'none' }, shakeT + 0.066);
      tl.to(depthStage, { x: -shakeAmp * 0.45, duration: 0.033, ease: 'none' }, shakeT + 0.099);
      tl.to(depthStage, { x: shakeAmp * 0.3, duration: 0.033, ease: 'none' }, shakeT + 0.132);
      tl.to(depthStage, { x: -shakeAmp * 0.18, duration: 0.033, ease: 'none' }, shakeT + 0.165);
      tl.to(depthStage, { x: shakeAmp * 0.1, duration: 0.033, ease: 'none' }, shakeT + 0.198);
      tl.to(depthStage, { x: -shakeAmp * 0.05, duration: 0.033, ease: 'none' }, shakeT + 0.231);
      tl.to(depthStage, { x: shakeAmp * 0.02, duration: 0.033, ease: 'none' }, shakeT + 0.264);
      tl.to(depthStage, { x: 0, duration: 0.033, ease: 'none' }, shakeT + 0.297);
      tl.to(depthStage, { x: 0, duration: 0.07, ease: 'expo.out' }, shakeT + 0.330);

      /* ── BRACKET SCALE PULSE during fracture morph ── */
      tl.to('.corner-bracket', {
        scale: 1.18,
        duration: 0.1,
        ease: 'power3.out'
      }, 2.50);
      tl.to('.corner-bracket', {
        scale: 1,
        duration: 0.6,
        ease: 'elastic.out(1, 0.35)'
      }, 2.60);

      /* ── Bracket gentle breathe through remainder ── */
      const bracketBreathPeriod = 2.0;
      const bracketBreathReps = repeatCount(D - 3.2, bracketBreathPeriod);
      if (bracketBreathReps > 0) {
        tl.to('.corner-bracket', {
          scale: 1.04,
          yoyo: true,
          repeat: bracketBreathReps,
          duration: bracketBreathPeriod / 2,
          ease: 'sine.inOut'
        }, 3.20);
      }

      /* ── Background atmosphere subtle pulse during fracture ── */
      const bgAtmo = root.querySelector('#bg-atmosphere');
      tl.to(bgAtmo, {
        background: 'radial-gradient(ellipse 85% 65% at 50% 40%, rgba(58,38,16,0.98), rgba(8,5,2,1.0))',
        duration: 0.3,
        ease: 'power3.out'
      }, 2.50);
      tl.to(bgAtmo, {
        background: 'radial-gradient(ellipse 80% 60% at 50% 40%, rgba(48,31,12,0.96), rgba(8,5,2,1.0))',
        duration: 1.2,
        ease: 'power2.inOut'
      }, 2.80);

      /* ── Tungsten glow reacts to fracture ── */
      const bgTungsten = root.querySelector('#bg-tungsten');
      tl.to(bgTungsten, {
        opacity: 1.0,
        duration: 0.15,
        ease: 'expo.out'
      }, 2.50);
      tl.to(bgTungsten, {
        opacity: 0.5,
        duration: 1.0,
        ease: 'power2.in'
      }, 2.65);

      /* ── Three.js canvas dims further during fracture ── */
      tl.to(threeCanvas, {
        opacity: 0.1,
        duration: 0.5,
        ease: 'power2.in'
      }, 2.50);

      /* ── Film grain refresh cycle (seeded, finite) ── */
      const grainRefreshPeriod = 1.0 / 8; // 8 fps grain refresh
      const grainReps = repeatCount(D, grainRefreshPeriod);
      const grainSeeds = [];
      const seedRng = mulberry32(9216);
      for (let i = 0; i <= grainReps + 1; i++) {
        grainSeeds.push((seedRng() * 4294967296) >>> 0);
      }

      // Grain refresh via timeline callback
      let grainFrame = { idx: 0 };
      for (let g = 0; g < Math.min(grainReps + 1, 40); g++) {
        tl.call(function() {
          const rng = mulberry32(grainSeeds[grainFrame.idx % grainSeeds.length]);
          const d = grainData;
          for (let px = 0; px < d.data.length; px += 16) { // sparse update for perf
            const v = (rng() * 255) | 0;
            d.data[px] = v;
            d.data[px+1] = v;
            d.data[px+2] = v;
          }
          grainCtx.putImageData(d, 0, 0);
          grainFrame.idx++;
        }, null, g * grainRefreshPeriod);
      }


      /* ════════════════════════════════════════════════════════════ */
      /* REGISTER TIMELINE                                           */
      /* ════════════════════════════════════════════════════════════ */
      window.__timelines[CID] = tl;

    })();
    </script>

  </div>
</template>
