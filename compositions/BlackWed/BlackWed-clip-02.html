<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>BlackWed Clip 02 — Cascade & Fracture</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400&family=Oswald:wght@700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/BlackWed/blackwed-shared.js"></script>
  <style>
    @property --paper-warm { syntax: "<color>"; inherits: false; initial-value: #e8d9b5; }
    @property --shard-color { syntax: "<color>"; inherits: false; initial-value: #040e04; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#030303}
    #depth-stage{position:relative;width:1080px;height:1920px;overflow:hidden;perspective:420px;perspective-origin:50% 46%}
    .z-bg,.z-mg-ui,.z-fg-1,.z-fg-2{position:absolute;transform-style:preserve-3d}
    .z-bg{inset:-9%;transform:translateZ(-450px) scale(1.88);background:#030303}
    .z-mg-ui{inset:-3%;transform:translateZ(60px) scale(.944)}
    .morph-host{position:absolute;left:230px;top:620px;width:620px;height:440px;transform:translateZ(90px) rotateX(3deg)}
    .morph-host.terminal-screen{background:#040e04;border:2px solid rgba(120,200,120,.22);box-shadow:0 0 50px rgba(74,255,74,.09),inset 0 0 28px rgba(0,0,0,.55);background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.055) 3px,rgba(0,0,0,.055) 4px);padding:32px 36px;font-family:"Courier Prime",monospace;color:#4aff4a}
    .rate-line{overflow:visible;height:56px;margin-bottom:6px;padding-bottom:8px}
    .rate-line-inner{font-size:48px;text-shadow:0 0 12px rgba(74,255,74,.48)}
    .rate-line .arrow{color:#ff3030;text-shadow:0 0 8px rgba(255,48,48,.45)}
    .shard{position:absolute;left:230px;top:620px;width:620px;height:440px;background:#040e04;border:1px solid rgba(74,255,74,.15);--shard-color:#040e04;opacity:0;pointer-events:none}
    #chromatic{position:absolute;inset:0;z-index:50;background:linear-gradient(90deg,rgba(255,0,0,.12),transparent 40%,transparent 60%,rgba(0,80,255,.12));opacity:0;pointer-events:none}
    #flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:60;mix-blend-mode:overlay;pointer-events:none}
    #grain{position:absolute;inset:0;z-index:98;width:100%;height:100%;mix-blend-mode:overlay;opacity:.17;pointer-events:none}
  </style>
</head>
<body>
  <div id="depth-stage" class="clip" data-composition-id="BlackWed-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30" data-layout-allow-overflow>
    <div class="plate-stage clip" data-start="0" data-duration="5" data-track-index="0" style="position:absolute;inset:0;opacity:.1;mix-blend-mode:overlay;z-index:0"><img src="assets/BlackWed/plates/ref-dealing-room.jpg" alt="" style="width:100%;height:100%;object-fit:cover" /></div>
    <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1"></div>
    <div class="z-mg-ui clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="morph-host terminal-screen clip" id="morph-host" data-start="0" data-duration="5" data-track-index="2" data-layout-allow-overflow>
        <div class="rate-line clip" data-start="0" data-duration="5" data-track-index="3"><div class="rate-line-inner">GBP/DEM 2.9500 <span class="arrow">↓</span></div></div>
        <div class="rate-line clip" data-start="0" data-duration="5" data-track-index="4"><div class="rate-line-inner">GBP/DEM 2.8750 <span class="arrow">↓</span></div></div>
        <div class="rate-line clip" data-start="0" data-duration="5" data-track-index="5"><div class="rate-line-inner">GBP/DEM 2.7800 <span class="arrow">↓</span></div></div>
        <div class="rate-line clip" data-start="0" data-duration="5" data-track-index="6"><div class="rate-line-inner">GBP/DEM 2.6100 <span class="arrow">↓</span></div></div>
        <div class="rate-line clip" data-start="0" data-duration="5" data-track-index="7"><div class="rate-line-inner">GBP/DEM 2.5200 <span class="arrow">↓</span></div></div>
      </div>
      <div id="shard-layer"></div>
    </div>
    <div id="chromatic" class="clip" data-start="0" data-duration="5" data-track-index="8"></div>
    <div id="flash" class="clip" data-start="0" data-duration="5" data-track-index="9"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="10" width="540" height="960"></canvas>
  </div>
  <script>
    (function () {
      var BW = window.BlackWed;
      var CID = "BlackWed-clip-02";
      var D = 5;
      var rng = BW.mulberry32(3392);
      BW.registerEases(gsap);
      BW.initGrain(document.getElementById("grain"), 0.17, 88888);
      var tl = BW.makeTimeline(CID);
      window.__timelines[CID] = tl;
      BW.wireOrbitalLayers(tl, D);

      var host = document.getElementById("morph-host");
      gsap.set(host, { "--paper-warm": "#e8d9b5", width: 540, left: 270 });
      tl.to(host, { width: 620, left: 230, "--paper-warm": "#040e04", duration: 0.45, ease: "power2.inOut" }, 0);
      tl.to(host, { rotateX: 3, duration: 0.45, ease: "power2.inOut" }, 0);

      var lines = document.querySelectorAll(".rate-line-inner");
      var localRates = [0.35, 0.72, 1.08, 1.44, 1.8];
      var eases = ["expo.out", "power3.out", "expo.out", "power3.out", "springSnappy"];
      lines.forEach(function (line, i) {
        gsap.set(line.parentElement, { overflow: "hidden" });
        gsap.set(line, { yPercent: 105 });
        tl.to(line, { yPercent: 0, duration: 0.2, ease: eases[i] || "expo.out" }, localRates[i]);
      });

      var layer = document.getElementById("shard-layer");
      var shards = [];
      BW.shardPolygons.forEach(function (poly, i) {
        var s = document.createElement("div");
        s.className = "shard";
        s.style.clipPath = poly;
        s.style.opacity = "0";
        layer.appendChild(s);
        shards.push(s);
      });

      tl.to(".rate-line-inner", { opacity: 0, duration: 0.05 }, 2.35);
      tl.set(host, { opacity: 0 }, 2.35);
      shards.forEach(function (sh, i) {
        tl.set(sh, { opacity: 0.9 }, 2.35);
        var angle = (i / shards.length) * Math.PI * 2 + (rng() - 0.5) * 0.7;
        var dist = 100 + rng() * 220;
        tl.to(sh, {
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist,
          rotation: (rng() - 0.5) * 55,
          scale: 0.55 + rng() * 0.45,
          duration: 0.55,
          ease: "power3.out",
        }, 2.5 + i * 0.018);
        var col = BW.columnMap[i % BW.columnMap.length];
        tl.to(sh, {
          x: col.x - 230,
          y: col.y - 620,
          scaleY: col.scaleY,
          scaleX: col.scaleX,
          rotation: 0,
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          "--shard-color": "#9e9280",
          duration: 0.95,
          ease: "power2.inOut",
        }, 3.15 + i * 0.065);
      });

      tl.to("#depth-stage", { perspective: 290, duration: 0.25, ease: "power4.out" }, 2.5);
      tl.to("#chromatic", { opacity: 1, duration: 0.09, ease: "power4.out" }, 2.5);
      tl.to("#chromatic", { opacity: 0, duration: 0.12 }, 2.68);
      tl.to("#flash", { opacity: 0.7, duration: 0.06, ease: "power4.out" }, 2.5);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power3.in" }, 2.58);
      tl.to("#depth-stage", { x: "+=9", yoyo: true, repeat: 5, duration: 0.03, ease: "none" }, 2.5);
    })();
  </script>
</body>
</html>
