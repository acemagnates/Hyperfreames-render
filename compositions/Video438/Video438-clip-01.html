<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>Video438 Clip 01 — The Manhattan Icon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/Video438/video438-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020813;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        background: radial-gradient(circle at 50% 50%, rgba(0, 245, 212, 0.16), #020813 75%);
        transform-style: preserve-3d;
      }
      #grid-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
      }
      
      /* Citicorp Drawing Container */
      .tower-draw-wrap {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%) translateZ(60px);
        width: 600px;
        height: 1000px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #tower-canvas {
        width: 100%;
        height: 100%;
      }

      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(180px) scale(0.85);
        pointer-events: none;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 245, 212, 0.08);
      }
      .bracket {
        position: absolute;
        width: 45px;
        height: 45px;
        border: 2px solid #00f5d4;
        box-shadow: 0 0 10px rgba(0, 245, 212, 0.4);
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      
      /* HUD Interface components */
      .hud-header {
        border-bottom: 1px solid rgba(0, 245, 212, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #00f5d4;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 44px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(0, 245, 212, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #00f5d4;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      /* Volumetric light ray sweeps */
      .light-ray-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        mix-blend-mode: overlay;
        z-index: 2;
      }
      .light-ray {
        position: absolute;
        width: 300%;
        height: 500px;
        left: -100%;
        top: 20%;
        background: linear-gradient(90deg,
          transparent 30%,
          rgba(0, 245, 212, 0.02) 45%,
          rgba(0, 245, 212, 0.06) 50%,
          rgba(0, 245, 212, 0.02) 55%,
          transparent 70%
        );
        transform-origin: center center;
        opacity: 0.6;
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r { background: rgba(255, 0, 80, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #grain {
        position: absolute;
        inset: 0;
        z-index: 100;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video438-clip-01"
         data-start="0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.0" data-track-index="0">
          
          <!-- L0: Background Drafting Paper Parallax -->
          <div class="z-bg clip" data-start="0" data-duration="5.0" data-track-index="1">
            <canvas id="grid-canvas" width="1080" height="1920"></canvas>
            <div class="light-ray-container">
              <div class="light-ray" id="ray1"></div>
            </div>
          </div>
          
          <!-- L1: Middle Ground Content Layer -->
          <div class="z-mg clip" data-start="0" data-duration="5.0" data-track-index="2">
            
            <div class="hud-header">
              <div>
                <h1 class="hud-title" id="type-title">THE MANHATTAN ICON</h1>
                <div class="hud-subtitle">SYS_MODEL // CITICORP_CENTER</div>
              </div>
              <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                <div>STATUS // <span style="font-weight: 700;">CONSTRUCTED</span></div>
                <div>ESTABLISHED // <span>1977</span></div>
              </div>
            </div>
            
            <!-- Central Tower Blueprint Visual -->
            <div class="tower-draw-wrap clip" data-start="0" data-duration="5.0" data-track-index="3">
              <canvas id="tower-canvas" width="600" height="1000"></canvas>
            </div>
            
            <div class="hud-footer">
              <div>DIAGNOSTIC // MODEL_INITIALIZED</div>
              <div style="font-weight: 700; letter-spacing: 0.15em;">CHAPTER_01 // THE ARCHITECT'S VISION</div>
            </div>
            
          </div>
          
          <!-- L2: Foreground Overlay Bracket Frame -->
          <div class="z-fg clip" data-start="0" data-duration="5.0" data-track-index="4">
            <div class="hud-brackets">
              <div class="bracket tl"></div>
              <div class="bracket tr"></div>
              <div class="bracket bl"></div>
              <div class="bracket br"></div>
            </div>
          </div>
          
        </div>
        
        <!-- Post-Processing Elements -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="5.0" data-track-index="5">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5.0" data-track-index="6" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video438-clip-01";
      const D = 5.0;
      
      const H = window.VisualEngine;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      
      // Initialize Grain
      const grain = document.getElementById("grain");
      if (grain) {
        H.initFilmGrain(grain, 0.18, 43801);
      }
      
      const gridCanvas = document.getElementById("grid-canvas");
      const towerCanvas = document.getElementById("tower-canvas");
      
      // Set initial states
      gsap.set(".hud-brackets", { inset: "80px", opacity: 0 });
      gsap.set(".bracket", { scale: 0.65, opacity: 0 });
      gsap.set("#type-title", { opacity: 0 });
      gsap.set(".hud-subtitle", { opacity: 0, x: -30 });
      
      // Animations
      // 1. Ken Burns slow drift camera zoom
      tl.fromTo("#depth-stage", { scale: 0.95 }, { scale: 1.05, duration: D, ease: "sine.out" }, 0);
      tl.to(".z-bg", { rotateY: 3, rotateX: -1, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".z-mg", { rotateY: -2, rotateX: 2, duration: D, ease: "sine.inOut" }, 0);
      
      // 2. Corner brackets drawing in
      tl.to(".hud-brackets", { inset: "60px", opacity: 1, duration: 1.2, ease: "power3.out" }, 0.1);
      tl.to(".bracket", { scale: 1, opacity: 1, duration: 0.8, ease: "springSnappy", stagger: 0.08 }, 0.1);
      
      // 3. Volumetric light ray sweeps
      tl.fromTo("#ray1", { rotation: -35 }, { rotation: -20, duration: D, ease: "sine.inOut" }, 0);
      
      // 4. Blueprint draw progress
      const drawState = { progress: 0 };
      tl.to(drawState, { progress: 1.0, duration: 2.2, ease: "power2.out" }, 0.3);
      
      // 5. Typewriter reveal for title
      const titleStr = "THE MANHATTAN ICON";
      const titleEl = document.getElementById("type-title");
      if (titleEl) {
        tl.call(() => { titleEl.style.opacity = 1; }, null, 0.4);
        for (let i = 0; i < titleStr.length; i++) {
          tl.call(() => {
            titleEl.textContent = titleStr.substring(0, i + 1);
          }, null, 0.4 + (i / titleStr.length) * 1.2);
        }
      }
      tl.to(".hud-subtitle", { opacity: 0.85, x: 0, duration: 0.8, ease: "power2.out" }, 1.4);
      
      // 6. Heavy impact establish slam
      H.screenShake(tl, "#root-inner", 0.05, 1.4);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 0.05, 1.6);
      
      // Particle burst inside plexus on impact
      const bgContainer = document.querySelector(".z-bg");
      if (bgContainer) {
        H.particleBurst(tl, bgContainer, 540, 960, 0.05, 24, "#00f5d4", 4381);
      }
      
      // Continuous drifting movement
      H.lifePulse(tl, ".tower-draw-wrap", D, { scaleAmp: 0.015, yAmp: 10, rotAmp: 0.4 });
      
      // Seek logic
      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time);
        
        // Draw backgrounds & tower
        if (gridCanvas) {
          H.drawDraftGrid(gridCanvas, time, "rgba(0, 245, 212, 0.035)", 438101);
        }
        if (towerCanvas) {
          H.drawCiticorpTower(towerCanvas, drawState.progress, 0, -1);
        }
      });
      
      // Initial render
      if (gridCanvas) H.drawDraftGrid(gridCanvas, 0, "rgba(0, 245, 212, 0.035)", 438101);
      if (towerCanvas) H.drawCiticorpTower(towerCanvas, 0, 0, -1);
      
      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
