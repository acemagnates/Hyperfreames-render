<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>Video438 Clip 04 — The Approaching Storm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/Video438/video438-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020813;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        background: radial-gradient(circle at 50% 50%, rgba(255, 51, 102, 0.16), #020813 75%);
        transform-style: preserve-3d;
      }
      #grid-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
      }
      
      /* Radar Sweeper Visual */
      .radar-wrap {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%) translateZ(60px);
        width: 700px;
        height: 700px;
        pointer-events: none;
      }
      .radar-svg {
        width: 100%;
        height: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        border-radius: 50%;
        background: rgba(2, 8, 19, 0.8);
        border: 1px solid rgba(255, 51, 102, 0.25);
      }

      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(180px) scale(0.85);
        pointer-events: none;
      }
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(2, 8, 19, 0.75) 100%);
      }
      .crt-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.18) 0px,
          rgba(0, 0, 0, 0.18) 1px,
          transparent 1px,
          transparent 4px
        );
      }
      
      .hud-header {
        border-bottom: 1px solid rgba(255, 51, 102, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #ff3366;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 44px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(255, 51, 102, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #ff3366;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r { background: rgba(255, 0, 80, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #grain {
        position: absolute;
        inset: 0;
        z-index: 100;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video438-clip-04"
         data-start="15.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.0" data-track-index="0">
          
          <!-- L0: Background Draft Paper -->
          <div class="z-bg clip" data-start="0" data-duration="5.0" data-track-index="1">
            <canvas id="grid-canvas" width="1080" height="1920"></canvas>
          </div>
          
          <!-- L1: Radar Sweep Meteorological Visualization -->
          <div class="z-mg clip" data-start="0" data-duration="5.0" data-track-index="2">
            
            <div class="hud-header">
              <div>
                <h1 class="hud-title" id="type-title">HURRICANE ELLA</h1>
                <div class="hud-subtitle">SYS_MET // WEATHER_RADAR</div>
              </div>
              <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                <div>COORD // <span style="font-weight: 700; color: #ff3366;">38.9° N, 72.4° W</span></div>
                <div>ALERT // <span style="font-weight: 700;">CATEGORY 4</span></div>
              </div>
            </div>
            
            <!-- Radar SVG sweeps -->
            <div class="radar-wrap clip" data-start="0" data-duration="5.0" data-track-index="3">
              <svg class="radar-svg" viewBox="0 0 400 400">
                <!-- Concentric rings -->
                <circle cx="200" cy="200" r="50" fill="none" stroke="rgba(255, 51, 102, 0.15)" stroke-width="1" />
                <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(255, 51, 102, 0.15)" stroke-width="1" />
                <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(255, 51, 102, 0.15)" stroke-width="1" />
                
                <!-- Crosshairs -->
                <line x1="200" y1="20" x2="200" y2="380" stroke="rgba(255, 51, 102, 0.15)" stroke-width="1" />
                <line x1="20" y1="200" x2="380" y2="200" stroke="rgba(255, 51, 102, 0.15)" stroke-width="1" />
                
                <!-- Rotating Radar Line Sweep -->
                <line id="radar-sweep-line" x1="200" y1="200" x2="200" y2="40" stroke="url(#radarGlow)" stroke-width="2.5" />
                
                <!-- Storm spirals deforming -->
                <path id="storm-spiral" d="M200,200 Q230,190 250,220 T310,210" fill="none" stroke="#ff3366" stroke-width="3" stroke-dasharray="4, 4" opacity="0.8" />
                <circle cx="270" cy="215" r="12" fill="rgba(255,51,102,0.2)" stroke="#ff3366" stroke-width="1.5" />
                
                <defs>
                  <linearGradient id="radarGlow" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#ff3366" stop-opacity="0" />
                    <stop offset="100%" stop-color="#ff3366" stop-opacity="1" />
                  </linearGradient>
                </defs>
              </svg>
            </div>
            
            <div class="hud-footer">
              <div>PROJECTED IMPACT // LONG ISLAND // T-MINUS 24 HOURS</div>
              <div style="font-weight: 700; letter-spacing: 0.15em;">CHAPTER_04 // THE RACING CLOCK</div>
            </div>
            
          </div>
          
          <!-- L2: Foreground scanlines and crt overlays -->
          <div class="z-fg clip" data-start="0" data-duration="5.0" data-track-index="4">
            <div class="lens-vignette"></div>
            <div class="crt-scanlines"></div>
          </div>
          
        </div>
        
        <!-- Post-Processing Elements -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="5.0" data-track-index="5">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5.0" data-track-index="6" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video438-clip-04";
      const D = 5.0;
      
      const H = window.VisualEngine;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      
      // Initialize Grain Safely
      const grain = document.getElementById("grain");
      if (grain) {
        H.initFilmGrain(grain, 0.18, 43804);
      }
      
      const gridCanvas = document.getElementById("grid-canvas");
      
      // Initial States
      gsap.set(".radar-wrap", { scale: 0.85, opacity: 0 });
      gsap.set(".hud-header, .hud-footer", { opacity: 0 });
      gsap.set("#radar-sweep-line", { transformOrigin: "200px 200px" });
      
      // Animations
      // 1. Ken Burns slow camera zoom
      tl.fromTo("#depth-stage", { scale: 0.95 }, { scale: 1.05, duration: D, ease: "sine.out" }, 0);
      
      // 2. Panel Entry
      tl.to(".radar-wrap", { scale: 1.0, opacity: 1, duration: 1.2, ease: "springLight" }, 0.2);
      tl.to(".hud-header, .hud-footer", { opacity: 1, duration: 0.8 }, 0.4);
      
      // 3. Radar sweep rotation
      tl.fromTo("#radar-sweep-line", { rotation: 0 }, { rotation: 360, duration: D, ease: "none" }, 0);
      tl.fromTo("#storm-spiral", { scale: 0.9, rotation: 0, transformOrigin: "200px 200px" }, { scale: 1.1, rotation: 40, duration: D, ease: "sine.inOut" }, 0);
      
      // 4. Typewriter reveal for title
      const titleStr = "HURRICANE ELLA";
      const titleEl = document.getElementById("type-title");
      if (titleEl) {
        tl.call(() => { titleEl.style.opacity = 1; }, null, 0.4);
        for (let i = 0; i < titleStr.length; i++) {
          tl.call(() => {
            titleEl.textContent = titleStr.substring(0, i + 1);
          }, null, 0.4 + (i / titleStr.length) * 1.2);
        }
      }
      
      // 5. Heavy impact start
      H.screenShake(tl, "#root-inner", 0.05, 1.4);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 0.05, 1.5);
      
      const bgContainer = document.querySelector(".z-bg");
      if (bgContainer) {
        H.particleBurst(tl, bgContainer, 540, 960, 0.05, 20, "#ff3366", 4384);
      }
      
      // Continuous drifting movement
      H.lifePulse(tl, ".radar-wrap", D, { scaleAmp: 0.01, yAmp: 8, rotAmp: 0.3 });
      
      // Seek Logic
      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time);
        
        // Draw grid
        if (gridCanvas) {
          H.drawDraftGrid(gridCanvas, time, "rgba(255, 51, 102, 0.035)", 438402);
        }
      });
      
      // Initial render
      if (gridCanvas) H.drawDraftGrid(gridCanvas, 0, "rgba(255, 51, 102, 0.035)", 438402);
      
      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
