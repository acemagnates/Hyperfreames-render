<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>Video438 Clip 02 — The Kinetic Networks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/Video438/video438-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1000px;
        perspective-origin: 50% 45%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-300px) scale(1.5);
        background: radial-gradient(circle at 50% 45%, rgba(0, 212, 255, 0.18), #020306 75%);
      }
      #grid-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
      }
      
      /* Telemetry panel styling */
      .stats-panel-wrap {
        position: absolute;
        left: 50%;
        top: 25%;
        transform: translate(-50%, -50%) translateZ(60px);
        width: 720px;
        pointer-events: none;
      }
      .stats-panel {
        background: rgba(2, 3, 6, 0.75);
        border: 1px solid rgba(0, 212, 255, 0.25);
        border-radius: 8px;
        padding: 30px;
        font-family: 'Courier Prime', monospace;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        position: relative;
        overflow: hidden;
      }
      .panel-header {
        border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        padding-bottom: 12px;
        margin-bottom: 18px;
        color: #00d4ff;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.1em;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .stat-label {
        color: rgba(255, 255, 255, 0.6);
      }
      .stat-value {
        color: #ffffff;
      }
      
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(120px) scale(0.88);
        pointer-events: none;
      }
      .crt-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 4px
        );
      }
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.75) 100%);
      }
      .hud-header {
        border-bottom: 1px solid rgba(0, 212, 255, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 42px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(0, 212, 255, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #grain {
        position: absolute;
        inset: 0;
        z-index: 100;
        opacity: 0.15;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video438-clip-02"
         data-start="5.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.0" data-track-index="0">
          
          <!-- L0: Background Mesh Waving Terrain -->
          <div class="z-bg clip" data-start="0" data-duration="5.0" data-track-index="1">
            <canvas id="grid-canvas" width="1080" height="1920"></canvas>
          </div>
          
          <!-- L1: Interactive HUD Telemetry Stats -->
          <div class="z-mg clip" data-start="0" data-duration="5.0" data-track-index="2">
            
            <div class="hud-header">
              <div>
                <h1 class="hud-title">KINETIC NETWORKS</h1>
                <div class="hud-subtitle">SYS_GRID // PATHWAY_GROWTH</div>
              </div>
              <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                <div>LINKS // <span style="font-weight: 700;">ACTIVE</span></div>
                <div>NODES // <span id="node-count">1024</span></div>
              </div>
            </div>
            
            <!-- Sliding data sheet in 3D parallax -->
            <div class="stats-panel-wrap clip" data-start="0" data-duration="5.0" data-track-index="3">
              <div class="stats-panel" id="sheet-panel">
                <div class="panel-header">NEURAL FIELD ROUTING</div>
                <div class="stat-row">
                  <span class="stat-label">GRID TOPOLOGY:</span>
                  <span class="stat-value" id="val-deform">DENSE_P2P_MESH</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">SAMPLING RATE:</span>
                  <span class="stat-value">60 FPS REALTIME</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">BANDWIDTH FACTOR:</span>
                  <span class="stat-value" id="val-factor">1.024</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">INTEGRITY RATIO:</span>
                  <span class="stat-value" id="val-ratio">99.9%</span>
                </div>
              </div>
            </div>
            
            <div class="hud-footer">
              <div>GRID_ROUTER // CONVERGING</div>
              <div style="font-weight: 700; letter-spacing: 0.15em;">EPOCH_02 // PATHWAYS</div>
            </div>
            
          </div>
          
          <!-- L2: Foreground Scanlines / Letterbox overlay -->
          <div class="z-fg clip" data-start="0" data-duration="5.0" data-track-index="4">
            <div class="lens-vignette"></div>
            <div class="crt-scanlines"></div>
          </div>
          
        </div>
        
        <!-- Post-Processing Elements -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="5.0" data-track-index="5">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5.0" data-track-index="6" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video438-clip-02";
      const D = 5.0;
      
      const H = window.VisualEngine;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      
      // Initialize Grain Safely
      const grain = document.getElementById("grain");
      if (grain) {
        H.initFilmGrain(grain, 0.15, 43802);
      }
      
      const gridCanvas = document.getElementById("grid-canvas");
      
      // Set Initial States
      gsap.set("#sheet-panel", { rotateX: 12, rotateY: -8, y: -40, opacity: 0 });
      gsap.set(".hud-header, .hud-footer", { opacity: 0 });
      
      // Animations
      // 1. Ken Burns drift
      tl.fromTo("#depth-stage", { scale: 0.96 }, { scale: 1.0, duration: D, ease: "sine.out" }, 0);
      
      // 2. Sliding HUD Panel entry
      tl.to("#sheet-panel", { y: 0, opacity: 1, duration: 1.2, ease: "springLight" }, 0.2);
      tl.to(".hud-header, .hud-footer", { opacity: 1, duration: 0.8 }, 0.4);
      
      // 3. Dynamic Telemetry Counter Animation
      const countObj = { nodes: 1024, factor: 1.024, ratio: 99.9 };
      tl.to(countObj, {
        nodes: 4096,
        factor: 2.512,
        ratio: 100.0,
        duration: D,
        ease: "power2.out",
        onUpdate: () => {
          const elNodes = document.getElementById("node-count");
          const elFactor = document.getElementById("val-factor");
          const elRatio = document.getElementById("val-ratio");
          if (elNodes) elNodes.textContent = Math.floor(countObj.nodes).toString();
          if (elFactor) elFactor.textContent = countObj.factor.toFixed(3);
          if (elRatio) elRatio.textContent = countObj.ratio.toFixed(2) + "%";
        }
      }, 0);
      
      // 4. Panel light sweep effect (GSAP Custom CSS helper)
      tl.to("#sheet-panel", {
        boxShadow: "0 0 25px rgba(0, 212, 255, 0.35)",
        borderColor: "rgba(0, 212, 255, 0.4)",
        duration: 0.6,
        yoyo: true,
        repeat: 3,
        ease: "sine.inOut"
      }, 0.5);
      
      // 5. Slam effect on transition start (5.0s mark is 0s locally)
      H.screenShake(tl, "#root-inner", 0.05, 1.3);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 0.05, 1.4);
      
      // Particle burst inside plexus on impact
      const terrainContainer = document.querySelector(".z-bg");
      if (terrainContainer) {
        H.particleBurst(tl, terrainContainer, 540, 960, 0.05, 22, "#00d4ff", 4382);
      }
      
      // Drifting organic motion
      H.lifePulse(tl, ".stats-panel-wrap", D, { scaleAmp: 0.008, yAmp: 6, rotAmp: 0.3 });
      
      // Seek Logic
      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time);
        
        // Draw Waving Grid on canvas relative to time
        if (gridCanvas) {
          H.drawWavingGrid(gridCanvas, time, "#00d4ff", 438202);
        }
      });
      
      // Initial render
      if (gridCanvas) {
        H.drawWavingGrid(gridCanvas, 0, "#00d4ff", 438202);
      }
      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
