<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>Video438 Clip 03 — The Hurricane Wind Force</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/Video438/video438-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020813;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        background: radial-gradient(circle at 50% 50%, rgba(255, 51, 102, 0.12), #020813 75%);
        transform-style: preserve-3d;
      }
      #grid-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
      }
      
      /* Wind Forces Wrap */
      .wind-draw-wrap {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%) translateZ(60px);
        width: 680px;
        height: 900px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #wind-canvas {
        width: 100%;
        height: 100%;
      }

      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(180px) scale(0.85);
        pointer-events: none;
      }
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(2, 8, 19, 0.75) 100%);
      }
      .crt-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.18) 0px,
          rgba(0, 0, 0, 0.18) 1px,
          transparent 1px,
          transparent 4px
        );
      }
      
      .hud-header {
        border-bottom: 1px solid rgba(255, 51, 102, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #ff3366;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 44px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(255, 51, 102, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #ff3366;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r { background: rgba(255, 0, 80, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #grain {
        position: absolute;
        inset: 0;
        z-index: 100;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video438-clip-03"
         data-start="10.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.0" data-track-index="0">
          
          <!-- L0: Background Draft Paper -->
          <div class="z-bg clip" data-start="0" data-duration="5.0" data-track-index="1">
            <canvas id="grid-canvas" width="1080" height="1920"></canvas>
          </div>
          
          <!-- L1: Middle Ground Wind Forces Visual -->
          <div class="z-mg clip" data-start="0" data-duration="5.0" data-track-index="2">
            
            <div class="hud-header">
              <div>
                <h1 class="hud-title" id="type-title">THE CALCULATION</h1>
                <div class="hud-subtitle">SYS_AERO // WIND_TUNNEL_FORCE</div>
              </div>
              <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                <div>VELOCITY // <span id="wind-speed" style="font-weight: 700; color: #ff3366;">30 MPH</span></div>
                <div>STRESS RATIO // <span id="stress-pct">18%</span></div>
              </div>
            </div>
            
            <!-- Wind Tunnel drawing -->
            <div class="wind-draw-wrap clip" data-start="0" data-duration="5.0" data-track-index="3">
              <canvas id="wind-canvas" width="680" height="900"></canvas>
            </div>
            
            <div class="hud-footer">
              <div>CALCULATION // BOLTED CHEVRON LIMIT = 70 MPH</div>
              <div style="font-weight: 700; letter-spacing: 0.15em;">CHAPTER_03 // WIND SHEAR FAILURE</div>
            </div>
            
          </div>
          
          <!-- L2: Foreground Overlay bracket and crt overlays -->
          <div class="z-fg clip" data-start="0" data-duration="5.0" data-track-index="4">
            <div class="lens-vignette"></div>
            <div class="crt-scanlines"></div>
          </div>
          
        </div>
        
        <!-- Post-Processing Elements -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="5.0" data-track-index="5">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5.0" data-track-index="6" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video438-clip-03";
      const D = 5.0;
      
      const H = window.VisualEngine;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      
      // Initialize Grain Safely
      const grain = document.getElementById("grain");
      if (grain) {
        H.initFilmGrain(grain, 0.18, 43803);
      }
      
      const gridCanvas = document.getElementById("grid-canvas");
      const windCanvas = document.getElementById("wind-canvas");
      
      // Initial states
      gsap.set(".wind-draw-wrap", { scale: 0.9, opacity: 0 });
      gsap.set(".hud-header, .hud-footer", { opacity: 0 });
      
      // Animations
      // 1. Ken Burns slow camera push-in
      tl.fromTo("#depth-stage", { scale: 0.94 }, { scale: 1.03, duration: D, ease: "sine.out" }, 0);
      
      // 2. Panel Entry
      tl.to(".wind-draw-wrap", { scale: 1.0, opacity: 1, duration: 1.2, ease: "springLight" }, 0.2);
      tl.to(".hud-header, .hud-footer", { opacity: 1, duration: 0.8 }, 0.4);
      
      // 3. Ramping wind speed counters
      const windObj = { speed: 30, stress: 18 };
      tl.to(windObj, {
        speed: 135,
        stress: 198,
        duration: D,
        ease: "power2.inOut",
        onUpdate: () => {
          const elSpeed = document.getElementById("wind-speed");
          const elStress = document.getElementById("stress-pct");
          if (elSpeed) elSpeed.textContent = Math.floor(windObj.speed) + " MPH";
          if (elStress) elStress.textContent = Math.floor(windObj.stress) + "%";
        }
      }, 0.2);
      
      // 4. Typewriter reveal for title
      const titleStr = "THE CALCULATION";
      const titleEl = document.getElementById("type-title");
      if (titleEl) {
        tl.call(() => { titleEl.style.opacity = 1; }, null, 0.4);
        for (let i = 0; i < titleStr.length; i++) {
          tl.call(() => {
            titleEl.textContent = titleStr.substring(0, i + 1);
          }, null, 0.4 + (i / titleStr.length) * 1.2);
        }
      }
      
      // 5. Heavy impact start
      H.screenShake(tl, "#root-inner", 0.05, 1.3);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 0.05, 1.4);
      
      // Increase camera shake as speed reaches peak (towards end of clip)
      H.screenShake(tl, "#root-inner", 3.8, 1.8);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 3.8, 1.9);
      
      const bgContainer = document.querySelector(".z-bg");
      if (bgContainer) {
        H.particleBurst(tl, bgContainer, 540, 960, 0.05, 20, "#ff3366", 4383);
        H.particleBurst(tl, bgContainer, 540, 960, 3.8, 30, "#ff3366", 43832);
      }
      
      // Continuous drifting movement
      H.lifePulse(tl, ".wind-draw-wrap", D, { scaleAmp: 0.01, yAmp: 8, rotAmp: 0.3 });
      
      // Seek Logic
      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time);
        
        // Draw grid and wind forces
        if (gridCanvas) {
          H.drawDraftGrid(gridCanvas, time, "rgba(255, 51, 102, 0.03)", 438302);
        }
        if (windCanvas) {
          H.drawWindForces(windCanvas, time, windObj.speed / 135.0, false);
        }
      });
      
      // Initial render
      if (gridCanvas) H.drawDraftGrid(gridCanvas, 0, "rgba(255, 51, 102, 0.03)", 438302);
      if (windCanvas) H.drawWindForces(windCanvas, 0, 30.0 / 135.0, false);
      
      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
