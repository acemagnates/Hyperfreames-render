<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video436 Clip 03 — Logic Engine Matrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050403;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier Prime', monospace;
        color: #ffaa00;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(255, 170, 0, 0.25);
        padding-bottom: 20px;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 32px;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
      }
      .hud-stats {
        text-align: right;
        font-size: 14px;
        line-height: 1.6;
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(255, 170, 0, 0.25);
        padding-top: 20px;
      }
      .hud-status-block {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .status-active {
        color: #ff5500;
        font-weight: bold;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(255, 170, 0, 0.1);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid #ffaa00;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video436-clip-03"
         data-start="6.0"
         data-duration="3.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      
      <canvas id="canvas3d"></canvas>
      
      <div class="hud-brackets">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>

      <div id="hud-container">
        <div class="hud-header">
          <div>
            <div class="hud-title">CHRONOS CORE : PHASE 03</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">SYS.LOC: /SECTOR_03/ALGEBRAIC_MATRIX</div>
          </div>
          <div class="hud-stats">
            <div>CLOCK_SPD: <span class="status-active">4.88 GHz</span></div>
            <div>OPS_RATE: <span>6.12 TFLOPS</span></div>
          </div>
        </div>
        
        <div class="hud-footer">
          <div class="hud-status-block">
            <div>REGISTERS: <span style="color: #00ff88;">LOCKED</span></div>
            <div>|</div>
            <div>CORE_ERR: <span>0x000000</span></div>
          </div>
          <div style="font-size: 14px;">ALGE_ENGINE // RUNNING</div>
        </div>
      </div>
    </div>

    <script>
      const duration = 3.0;
      const canvas = document.getElementById("canvas3d");
      
      // Scene Setup
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050403, 0.02);
      
      // Camera Setup
      const camera = new THREE.PerspectiveCamera(55, 1080 / 1920, 0.1, 1000);
      
      // Renderer Setup
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      if (isWebGLAvailable()) {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Lights
      const ambientLight = new THREE.AmbientLight(0x1a120a, 2.0);
      scene.add(ambientLight);
      
      const orangeLight = new THREE.DirectionalLight(0xff7700, 4.0);
      orangeLight.position.set(12, 18, 10);
      scene.add(orangeLight);
      
      const ambientGlow = new THREE.PointLight(0xff5500, 15, 25);
      scene.add(ambientGlow);
      
      // Master Gyro Engine Group
      const engineGroup = new THREE.Group();
      scene.add(engineGroup);
      
      // 1. Central Plasma Core Sphere
      const coreGeo = new THREE.SphereGeometry(1.6, 32, 32);
      const coreMat = new THREE.MeshStandardMaterial({
        color: 0xff4400,
        emissive: 0xff3300,
        emissiveIntensity: 1.8,
        metalness: 0.1,
        roughness: 0.2
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      engineGroup.add(coreMesh);
      
      // 2. Nested Gyroscopic Rings
      const rings = [];
      const createGyroRing = (radius, tubeRadius, color, axis) => {
        const ringGeo = new THREE.TorusGeometry(radius, tubeRadius, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({
          color: color,
          metalness: 0.95,
          roughness: 0.1,
          emissive: color,
          emissiveIntensity: 0.2
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        engineGroup.add(ringMesh);
        
        // Add metallic teeth or nodes on the ring to make it look highly detailed
        const nodeGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const nodeMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9 });
        for (let i = 0; i < 8; i++) {
          const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
          const angle = (i / 8) * Math.PI * 2;
          nodeMesh.position.x = radius * Math.cos(angle);
          nodeMesh.position.y = radius * Math.sin(angle);
          ringMesh.add(nodeMesh);
        }
        
        rings.push({
          mesh: ringMesh,
          axis,
          speed: 1.0 + Math.random() * 1.5
        });
      };
      
      createGyroRing(2.6, 0.08, 0xffaa00, 'X');
      createGyroRing(3.4, 0.08, 0xff5500, 'Y');
      createGyroRing(4.2, 0.08, 0xffaa00, 'Z');
      createGyroRing(5.0, 0.08, 0x552200, 'Y');
      
      // 3. Cyber-Grid Floor
      const gridHelper = new THREE.GridHelper(80, 40, 0xff8800, 0x1f0f00);
      gridHelper.position.y = -10;
      scene.add(gridHelper);
      
      // Dynamic camera movement path
      function seek(p) {
        // Core breathing pulse
        const pulse = 1.0 + Math.sin(p * Math.PI * 6) * 0.12;
        coreMesh.scale.set(pulse, pulse, pulse);
        
        // Update Ring Rotations on separate axes
        rings.forEach((ring) => {
          const rotation = p * ring.speed * Math.PI * 2;
          if (ring.axis === 'X') {
            ring.mesh.rotation.x = rotation;
            ring.mesh.rotation.y = rotation * 0.2;
          } else if (ring.axis === 'Y') {
            ring.mesh.rotation.y = rotation;
            ring.mesh.rotation.z = rotation * 0.2;
          } else {
            ring.mesh.rotation.z = rotation;
            ring.mesh.rotation.x = rotation * 0.2;
          }
        });
        
        // Continuous slow orbit of the entire gyro engine group
        engineGroup.rotation.y = p * Math.PI * 0.8;
        engineGroup.rotation.x = Math.sin(p * Math.PI) * 0.2;
        
        // Camera flying path: descending swoop and then fly-under!
        let camRadius = 20.0 - p * 8.0; // Zooms from 20 to 12
        if (p > 0.8) {
          camRadius = 12.0 - ((p - 0.8) / 0.2) * 16.0; // Fly-under past the engine!
        }
        
        const camAngle = p * Math.PI * 1.2;
        camera.position.x = camRadius * Math.sin(camAngle);
        camera.position.z = camRadius * Math.cos(camAngle);
        camera.position.y = 8.0 - p * 12.0; // descend from 8 to -4
        
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      window.addEventListener("hf-seek", (event) => {
        seek(event.detail.time / duration);
      });
      
      // First frame render
      seek(0);
    </script>
  </body>
</html>
