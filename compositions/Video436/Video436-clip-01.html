<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video436 Clip 01 — Crystalline Accel-Lattice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #030508;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 212, 255, 0.25);
        padding-bottom: 20px;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 32px;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
      }
      .hud-stats {
        text-align: right;
        font-size: 14px;
        line-height: 1.6;
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 212, 255, 0.25);
        padding-top: 20px;
      }
      .hud-status-block {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .status-active {
        color: #00ff88;
        font-weight: bold;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 212, 255, 0.1);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid #00d4ff;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video436-clip-01"
         data-start="0"
         data-duration="3.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      
      <canvas id="canvas3d"></canvas>
      
      <div class="hud-brackets">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>

      <div id="hud-container">
        <div class="hud-header">
          <div>
            <div class="hud-title">CHRONOS CORE : PHASE 01</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">SYS.LOC: /SECTOR_01/ACCEL_LATTICE</div>
          </div>
          <div class="hud-stats">
            <div>CORE_TEMP: <span style="color: #ff6b35;">4.2K</span></div>
            <div>FIELD_GEN: <span class="status-active">98.4%</span></div>
          </div>
        </div>
        
        <div class="hud-footer">
          <div class="hud-status-block">
            <div>DIAG: <span class="status-active">STABLE</span></div>
            <div>|</div>
            <div>CELL_MASS: <span>1.042e6</span></div>
          </div>
          <div style="font-size: 14px;">LATTICE_INIT // GO</div>
        </div>
      </div>
    </div>

    <script>
      const duration = 3.0;
      const canvas = document.getElementById("canvas3d");
      
      // Scene Setup
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030508, 0.015);
      
      // Camera Setup
      const camera = new THREE.PerspectiveCamera(55, 1080 / 1920, 0.1, 1000);
      
      // Renderer Setup
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      if (isWebGLAvailable()) {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Lights
      const ambientLight = new THREE.AmbientLight(0x0c1324, 2.0);
      scene.add(ambientLight);
      
      const keyLight = new THREE.DirectionalLight(0x00d4ff, 5.0);
      keyLight.position.set(10, 20, 15);
      scene.add(keyLight);
      
      const rimLight = new THREE.DirectionalLight(0x00ff88, 3.0);
      rimLight.position.set(-15, 10, -10);
      scene.add(rimLight);
      
      const glowLight = new THREE.PointLight(0xffd700, 15, 30);
      glowLight.position.set(0, 0, 0);
      scene.add(glowLight);
      
      // Master Core Group
      const coreGroup = new THREE.Group();
      scene.add(coreGroup);
      
      // 1. Inner Golden Icosahedron Core
      const innerGeo = new THREE.IcosahedronGeometry(1.5, 2);
      const innerMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        roughness: 0.1,
        metalness: 0.9,
        emissive: 0xffa500,
        emissiveIntensity: 0.4
      });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);
      coreGroup.add(innerMesh);
      
      // 2. Middle Crystalline Glass Octahedron (Refracting Outer Core)
      const outerGeo = new THREE.IcosahedronGeometry(2.8, 1);
      const outerMat = new THREE.MeshPhysicalMaterial({
        color: 0x00d4ff,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.95,
        thickness: 1.5,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        transparent: true,
        opacity: 0.9,
        flatShading: true
      });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);
      coreGroup.add(outerMesh);
      
      // 3. Concentric Orbit Vector Rings (3D Circle scales)
      const ringGroup = new THREE.Group();
      coreGroup.add(ringGroup);
      
      const createOrbitRing = (radius, color, rotationX, rotationY) => {
        const ringGeo = new THREE.RingGeometry(radius, radius + 0.05, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: color,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.6
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = rotationX;
        ringMesh.rotation.y = rotationY;
        ringGroup.add(ringMesh);
      };
      
      createOrbitRing(4.0, 0x00d4ff, Math.PI / 2, 0);
      createOrbitRing(4.2, 0xffd700, 0, Math.PI / 4);
      createOrbitRing(4.5, 0x00ff88, Math.PI / 3, Math.PI / 6);
      
      // 4. Sweeping Particle Swarms (100 custom particles)
      const particlesCount = 80;
      const particlesGroup = new THREE.Group();
      scene.add(particlesGroup);
      
      const particleGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
      const particleMat = new THREE.MeshStandardMaterial({
        color: 0x00ff88,
        emissive: 0x00ff88,
        emissiveIntensity: 0.8,
        metalness: 0.9,
        roughness: 0.1
      });
      
      const particlesData = [];
      for (let i = 0; i < particlesCount; i++) {
        const mesh = new THREE.Mesh(particleGeo, particleMat);
        particlesGroup.add(mesh);
        
        // Mathematical orbits
        const radius = 5.0 + (i * 0.06);
        const speed = 1.0 + (i % 3) * 0.4;
        const angleOffset = (i / particlesCount) * Math.PI * 2;
        const phase = (i % 4) * (Math.PI / 4);
        
        particlesData.push({
          mesh,
          radius,
          speed,
          angleOffset,
          phase
        });
      }
      
      // 5. Ground Cyber-Grid
      const gridHelper = new THREE.GridHelper(80, 40, 0x00d4ff, 0x07111a);
      gridHelper.position.y = -12;
      scene.add(gridHelper);
      
      // Dynamic camera movement path
      function seek(p) {
        // Core animations
        const coreScale = p < 0.3 
          ? THREE.MathUtils.lerp(0.01, 1.0, p / 0.3) 
          : p > 0.8
            ? THREE.MathUtils.lerp(1.0, 0.01, (p - 0.8) / 0.2)
            : 1.0;
        coreGroup.scale.set(coreScale, coreScale, coreScale);
        
        // Core rotation
        coreGroup.rotation.y = p * Math.PI * 3;
        coreGroup.rotation.x = Math.sin(p * Math.PI) * 0.5;
        
        // Animate particles on dual orbital planes
        particlesData.forEach((pt) => {
          const angle = pt.angleOffset + p * pt.speed * Math.PI * 2;
          pt.mesh.position.x = pt.radius * Math.cos(angle);
          pt.mesh.position.y = Math.sin(angle + pt.phase) * 2.0;
          pt.mesh.position.z = pt.radius * Math.sin(angle);
          pt.mesh.rotation.y = angle * 2;
        });
        
        // SpotLight / Key Light orbit
        keyLight.position.x = 10 * Math.cos(p * Math.PI * 2);
        keyLight.position.z = 10 * Math.sin(p * Math.PI * 2);
        
        // Camera cinematic path: Spiral swoop in, continuous slow orbit, then fly-through!
        let camRadius = 22.0 - p * 12.0; // zoom from 22 to 10
        if (p > 0.8) {
          camRadius = 10.0 - ((p - 0.8) / 0.2) * 16.0; // fly straight past/through the core!
        }
        
        const camAngle = p * Math.PI * 1.5; // continuous orbital spin
        camera.position.x = camRadius * Math.sin(camAngle);
        camera.position.z = camRadius * Math.cos(camAngle);
        camera.position.y = 8.0 - p * 7.0; // descend from 8 to 1
        
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      window.addEventListener("hf-seek", (event) => {
        seek(event.detail.time / duration);
      });
      
      // First frame render
      seek(0);
    </script>
  </body>
</html>
