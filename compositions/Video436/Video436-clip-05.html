<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video436 Clip 05 — Hyperdimensional Database Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020406;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 212, 255, 0.35);
        padding-bottom: 20px;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 32px;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 16px rgba(0, 212, 255, 0.9), 0 0 40px rgba(0, 212, 255, 0.5);
      }
      .hud-stats {
        text-align: right;
        font-size: 14px;
        line-height: 1.6;
        color: #00d4ff;
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 212, 255, 0.35);
        padding-top: 20px;
      }
      .hud-status-block {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .status-active {
        color: #00ff88;
        font-weight: bold;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 212, 255, 0.15);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 36px;
        height: 36px;
        border: 2px solid #00d4ff;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video436-clip-05"
         data-start="0"
         data-duration="3.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">

      <canvas id="canvas3d" width="1080" height="1920"></canvas>

      <div class="hud-brackets">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>

      <div id="hud-container">
        <div class="hud-header">
          <div>
            <div class="hud-title">CHRONOS CORE : PHASE 05</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">SYS.LOC: /SECTOR_05/DATABASE_VAULT</div>
          </div>
          <div class="hud-stats">
            <div>VAULT_CAP: <span class="status-active">1.2 YB</span></div>
            <div>IO_SPEED: <span style="color: #ffd700;">84.2 TB/s</span></div>
          </div>
        </div>

        <div class="hud-footer">
          <div class="hud-status-block">
            <div>VAULT: <span class="status-active">STABLE</span></div>
            <div>|</div>
            <div>SECTORS: <span>16 parallel</span></div>
          </div>
          <div style="font-size: 14px;">DATA_VAULT // ENGAGED</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var duration = 3.0;

        function setup() {
          var canvas = document.getElementById("canvas3d");
          if (!canvas) return;
          var ctx = canvas.getContext("2d");
          var W = 1080, H = 1920;
          var cxC = W / 2, cyC = H / 2;

          var CYAN  = "#00d4ff";
          var GREEN = "#00ff88";
          var GOLD  = "#ffd700";

          var VP_Y       = H * 0.45;
          var RING_COUNT = 18;
          var MAX_RADIUS = 680;
          var MIN_RADIUS = 14;
          var SIDES      = 6;

          var RAIL_ANGLES = [];
          for (var ri = 0; ri < SIDES; ri++) {
            RAIL_ANGLES.push((Math.PI / 6) + (ri / SIDES) * Math.PI * 2);
          }

          var CELLS_PER_RAIL = 6;
          var cells = [];
          for (var r = 0; r < SIDES; r++) {
            for (var c = 0; c < CELLS_PER_RAIL; c++) {
              cells.push({
                rail:   r,
                offset: c / CELLS_PER_RAIL,
                color:  (r + c) % 3 === 0 ? GOLD : (r % 2 === 0 ? CYAN : GREEN),
                width:  28 + (c % 3) * 10
              });
            }
          }

          function depthToRadius(depth) {
            var t = Math.pow(1.0 - depth, 2.2);
            return MIN_RADIUS + t * (MAX_RADIUS - MIN_RADIUS);
          }

          function drawHexRing(radius, alpha, glowColor, lineW) {
            var pts = [];
            for (var i = 0; i < RAIL_ANGLES.length; i++) {
              pts.push({
                x: cxC + Math.cos(RAIL_ANGLES[i]) * radius,
                y: VP_Y + Math.sin(RAIL_ANGLES[i]) * radius
              });
            }
            ctx.save();
            ctx.globalAlpha  = alpha;
            ctx.lineWidth    = lineW;
            ctx.strokeStyle  = glowColor;
            ctx.shadowColor  = glowColor;
            ctx.shadowBlur   = 18;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j].x, pts[j].y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
          }

          function drawRails(outerRadius, alpha) {
            for (var i = 0; i < RAIL_ANGLES.length; i++) {
              var a  = RAIL_ANGLES[i];
              var ox = cxC + Math.cos(a) * outerRadius;
              var oy = VP_Y + Math.sin(a) * outerRadius;
              ctx.save();
              ctx.globalAlpha = alpha * 0.35;
              ctx.lineWidth   = 1;
              ctx.strokeStyle = i % 2 === 0 ? CYAN : GREEN;
              ctx.shadowColor = i % 2 === 0 ? CYAN : GREEN;
              ctx.shadowBlur  = 8;
              ctx.beginPath();
              ctx.moveTo(cxC, VP_Y);
              ctx.lineTo(ox, oy);
              ctx.stroke();
              ctx.restore();
            }
          }

          function seek(p) {
            var scrollOffset = p * 0.65;

            // Background
            var bgGrad = ctx.createRadialGradient(cxC, VP_Y, 0, cxC, VP_Y, MAX_RADIUS);
            bgGrad.addColorStop(0,   "rgba(2,18,36,1)");
            bgGrad.addColorStop(0.5, "rgba(2,10,20,1)");
            bgGrad.addColorStop(1,   "rgba(2,4,6,1)");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Vanishing point glow
            var vpGrad = ctx.createRadialGradient(cxC, VP_Y, 0, cxC, VP_Y, 280);
            vpGrad.addColorStop(0,   "rgba(0,212,255,0.28)");
            vpGrad.addColorStop(0.4, "rgba(0,255,136,0.10)");
            vpGrad.addColorStop(1,   "rgba(0,0,0,0)");
            ctx.fillStyle = vpGrad;
            ctx.fillRect(0, 0, W, H);

            drawRails(MAX_RADIUS * 0.92, 1.0);

            // Hex rings
            for (var i = 0; i < RING_COUNT; i++) {
              var rawDepth = ((i / RING_COUNT - scrollOffset) % 1.0 + 1.0) % 1.0;
              var radius   = depthToRadius(rawDepth);
              if (radius < 8) continue;
              var alpha = Math.min(1, rawDepth * 3.5) * (radius < 60 ? radius / 60 : 1);
              var color = i % 3 === 0 ? CYAN : (i % 3 === 1 ? GREEN : GOLD);
              var lineW = Math.max(0.5, 3.5 * (rawDepth * 0.8 + 0.2));
              drawHexRing(radius, alpha * 0.85, color, lineW);
            }

            // Data cells
            for (var ci = 0; ci < cells.length; ci++) {
              var cell      = cells[ci];
              var cellDepth = 1.0 - ((cell.offset + scrollOffset * 1.4) % 1.0);
              if (cellDepth < 0.02 || cellDepth > 0.98) continue;
              var angle = RAIL_ANGLES[cell.rail];
              var rr    = depthToRadius(cellDepth);
              var nx    = cxC + Math.cos(angle) * rr;
              var ny    = VP_Y + Math.sin(angle) * rr;
              var scale = Math.pow(1 - cellDepth, 1.5);
              var hw    = (cell.width * scale) / 2;
              var hh    = hw * 0.45;
              var ca    = Math.min(1, (1 - cellDepth) * 4) * Math.min(1, cellDepth * 5);
              ctx.save();
              ctx.globalAlpha = ca;
              ctx.translate(nx, ny);
              ctx.rotate(angle + Math.PI / 2);
              ctx.shadowColor = cell.color;
              ctx.shadowBlur  = 22 * scale;
              ctx.fillStyle   = cell.color;
              ctx.fillRect(-hw, -hh, hw * 2, hh * 2);
              ctx.globalAlpha = ca * 0.9;
              ctx.fillStyle   = "#ffffff";
              ctx.fillRect(-hw * 0.5, -hh * 0.3, hw, hh * 0.6);
              ctx.restore();
            }

            // Vignette
            var vig = ctx.createRadialGradient(cxC, cyC, H * 0.3, cxC, cyC, H * 0.85);
            vig.addColorStop(0, "rgba(0,0,0,0)");
            vig.addColorStop(1, "rgba(0,0,0,0.72)");
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            // Scan lines
            ctx.globalAlpha = 0.04;
            ctx.fillStyle = "#000";
            for (var y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
            ctx.globalAlpha = 1.0;

            // Center pulse
            var pulseR = 60 + Math.sin(p * Math.PI * 8) * 18;
            var cg = ctx.createRadialGradient(cxC, VP_Y, 0, cxC, VP_Y, pulseR);
            cg.addColorStop(0,   "rgba(0,255,136,0.9)");
            cg.addColorStop(0.5, "rgba(0,212,255,0.4)");
            cg.addColorStop(1,   "rgba(0,0,0,0)");
            ctx.fillStyle = cg;
            ctx.fillRect(cxC - pulseR, VP_Y - pulseR, pulseR * 2, pulseR * 2);

            // Data readout text
            ctx.save();
            ctx.font        = "bold 22px monospace";
            ctx.fillStyle   = CYAN;
            ctx.shadowColor = CYAN;
            ctx.shadowBlur  = 10;
            var sectors = ["SEC_01","SEC_02","SEC_03","SEC_04","SEC_05","SEC_06"];
            var reads   = ["READ: OK","READ: OK","READ: OK","READ: OK","READ: OK","READ: OK"];
            for (var si = 0; si < 6; si++) {
              var yy    = 820 + si * 80;
              var flash = 0.5 + 0.5 * Math.sin(p * Math.PI * 6 + si * 1.1);
              ctx.globalAlpha = 0.55 + flash * 0.3;
              ctx.fillText(sectors[si] + "  " + reads[si] + "  STATUS: ACTIVE", 100, yy);
            }
            ctx.restore();
          }

          // Initial frame
          seek(0);

          // HyperFrames seek handler
          window.addEventListener("hf-seek", function (event) {
            seek(event.detail.time / duration);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", setup);
        } else {
          setup();
        }
      })();
    </script>
  </body>
</html>
