<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video436 Clip 05 — Hyperdimensional Database Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020406;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 212, 255, 0.25);
        padding-bottom: 20px;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 32px;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
      }
      .hud-stats {
        text-align: right;
        font-size: 14px;
        line-height: 1.6;
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 212, 255, 0.25);
        padding-top: 20px;
      }
      .hud-status-block {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .status-active {
        color: #00ff88;
        font-weight: bold;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 212, 255, 0.1);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid #00d4ff;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video436-clip-05"
         data-start="0"
         data-duration="3.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      
      <canvas id="canvas3d"></canvas>
      
      <div class="hud-brackets">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>

      <div id="hud-container">
        <div class="hud-header">
          <div>
            <div class="hud-title">CHRONOS CORE : PHASE 05</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">SYS.LOC: /SECTOR_05/DATABASE_VAULT</div>
          </div>
          <div class="hud-stats">
            <div>VAULT_CAP: <span class="status-active">1.2 YB</span></div>
            <div>IO_SPEED: <span style="color: #ffd700;">84.2 TB/s</span></div>
          </div>
        </div>
        
        <div class="hud-footer">
          <div class="hud-status-block">
            <div>VAULT: <span class="status-active">STABLE</span></div>
            <div>|</div>
            <div>SECTORS: <span>16 parallel</span></div>
          </div>
          <div style="font-size: 14px;">DATA_VAULT // ENGAGED</div>
        </div>
      </div>
    </div>

    <script>
      const duration = 3.0;
      const canvas = document.getElementById("canvas3d");
      
      // Scene Setup
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020406, 0.025);
      
      // Camera Setup
      const camera = new THREE.PerspectiveCamera(60, 1080 / 1920, 0.1, 500);
      
      // Renderer Setup
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      if (isWebGLAvailable()) {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Lights
      const ambientLight = new THREE.AmbientLight(0x051324, 2.0);
      scene.add(ambientLight);
      
      const frontLight = new THREE.PointLight(0x00d4ff, 12, 45);
      scene.add(frontLight);
      
      // Vault Tunnel Group
      const tunnelGroup = new THREE.Group();
      scene.add(tunnelGroup);
      
      // 1. Hexagonal ring structures along the Z-axis
      const ringCount = 15;
      const ringSpacing = 10.0;
      const hexagonalRings = [];
      
      for (let i = 0; i < ringCount; i++) {
        // Hexagonal Ring using RingGeometry with 6 segments
        const hexGeo = new THREE.RingGeometry(5.2, 5.28, 6);
        const hexMat = new THREE.MeshBasicMaterial({
          color: 0x00d4ff,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.35
        });
        const hexMesh = new THREE.Mesh(hexGeo, hexMat);
        hexMesh.position.z = -i * ringSpacing;
        hexMesh.rotation.z = Math.PI / 6; // Orient cleanly
        tunnelGroup.add(hexMesh);
        hexagonalRings.push(hexMesh);
      }
      
      // 2. Long perspective rails connecting vertices of hexagons
      const railCount = 6;
      const railGeo = new THREE.CylinderGeometry(0.04, 0.04, ringCount * ringSpacing, 8);
      const railMat = new THREE.MeshStandardMaterial({
        color: 0x00ff88,
        emissive: 0x00ff88,
        emissiveIntensity: 0.6,
        metalness: 0.9,
        roughness: 0.1
      });
      
      for (let i = 0; i < railCount; i++) {
        const angle = (i / railCount) * Math.PI * 2 + Math.PI / 6;
        const rail = new THREE.Mesh(railGeo, railMat);
        rail.position.x = 5.2 * Math.cos(angle);
        rail.position.y = 5.2 * Math.sin(angle);
        rail.position.z = -(ringCount * ringSpacing) / 2;
        rail.rotation.x = Math.PI / 2;
        tunnelGroup.add(rail);
      }
      
      // 3. Database Hexagonal Sector Blocks on the tunnel walls (3D boxes)
      const cellCount = 36;
      const cells = [];
      // Flattened hexagon box
      const cellGeo = new THREE.BoxGeometry(1.5, 0.2, 2.5);
      const cellMat = new THREE.MeshStandardMaterial({
        color: 0x00ff88,
        metalness: 0.9,
        roughness: 0.1,
        emissive: 0x00ff88,
        emissiveIntensity: 0.2
      });
      
      const goldCellMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.9,
        roughness: 0.1,
        emissive: 0xffa500,
        emissiveIntensity: 0.3
      });
      
      for (let i = 0; i < cellCount; i++) {
        const wallIndex = i % 6;
        const angle = (wallIndex / 6) * Math.PI * 2 + Math.PI / 6;
        const isGold = i % 4 === 0;
        
        const mesh = new THREE.Mesh(cellGeo, isGold ? goldCellMat : cellMat);
        
        // Position exactly flat against one of the 6 flat hexagonal wall faces
        const radius = 5.1;
        mesh.position.x = radius * Math.cos(angle);
        mesh.position.y = radius * Math.sin(angle);
        mesh.position.z = -Math.random() * (ringCount * ringSpacing);
        mesh.rotation.z = angle + Math.PI / 2;
        
        tunnelGroup.add(mesh);
        cells.push({
          mesh,
          speed: 12.0 + Math.random() * 10.0,
          z: mesh.position.z,
          maxZ: ringCount * ringSpacing
        });
      }
      
      // Dynamic camera movement path
      function seek(p) {
        // Continuous slow rotation of the database tunnel
        tunnelGroup.rotation.z = p * Math.PI * 0.4;
        
        // Update database cells passing the camera
        cells.forEach((cell) => {
          // Travel progress along Z-axis
          let currentZ = cell.z + p * cell.speed;
          currentZ = currentZ % cell.maxZ;
          
          cell.mesh.position.z = -currentZ;
          
          // Glow intensely when close to camera
          const distance = Math.abs(cell.mesh.position.z - camera.position.z);
          const glow = Math.max(0.1, 1.2 - (distance / 30.0));
          cell.mesh.material.emissiveIntensity = glow;
        });
        
        // Camera zooming forward through database hexagonal grid tunnel!
        const flyDistance = ringCount * ringSpacing;
        const camZ = -p * (flyDistance * 0.7); // Zoom through 70% of the tunnel
        
        camera.position.x = Math.cos(p * Math.PI * 2) * 0.3;
        camera.position.y = Math.sin(p * Math.PI * 3) * 0.3;
        camera.position.z = camZ;
        
        // Front tracking light stays in front of camera
        frontLight.position.x = camera.position.x;
        frontLight.position.y = camera.position.y;
        frontLight.position.z = camera.position.z - 6.0;
        
        camera.rotation.z = p * Math.PI * 0.15;
        camera.rotation.x = Math.sin(p * Math.PI) * 0.04;
        camera.rotation.y = Math.cos(p * Math.PI) * 0.04;
        
        renderer.render(scene, camera);
      }
      
      window.addEventListener("hf-seek", (event) => {
        seek(event.detail.time / duration);
      });
      
      // First frame render
      seek(0);
    </script>
  </body>
</html>
