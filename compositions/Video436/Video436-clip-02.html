<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video436 Clip 02 — Neural Synapse Highway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier Prime', monospace;
        color: #00ff88;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 255, 136, 0.25);
        padding-bottom: 20px;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 32px;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
      }
      .hud-stats {
        text-align: right;
        font-size: 14px;
        line-height: 1.6;
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 255, 136, 0.25);
        padding-top: 20px;
      }
      .hud-status-block {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .status-active {
        color: #00d4ff;
        font-weight: bold;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 255, 136, 0.1);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid #00ff88;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video436-clip-02"
         data-start="0"
         data-duration="3.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      
      <canvas id="canvas3d"></canvas>
      
      <div class="hud-brackets">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>

      <div id="hud-container">
        <div class="hud-header">
          <div>
            <div class="hud-title">CHRONOS CORE : PHASE 02</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">SYS.LOC: /SECTOR_02/SYNAPSE_HIGHWAY</div>
          </div>
          <div class="hud-stats">
            <div>BANDWIDTH: <span class="status-active">984 Gbps</span></div>
            <div>STREAMS: <span style="color: #ffd700;">32 parallel</span></div>
          </div>
        </div>
        
        <div class="hud-footer">
          <div class="hud-status-block">
            <div>ROUTING: <span class="status-active">OPTIMIZED</span></div>
            <div>|</div>
            <div>PACKET_DROP: <span>0.000%</span></div>
          </div>
          <div style="font-size: 14px;">TRANS_INIT // FLOWING</div>
        </div>
      </div>
    </div>

    <script>
      const duration = 3.0;
      const canvas = document.getElementById("canvas3d");
      
      // Scene Setup
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020306, 0.025);
      
      // Camera Setup
      const camera = new THREE.PerspectiveCamera(65, 1080 / 1920, 0.1, 500);
      
      // Renderer Setup
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      if (isWebGLAvailable()) {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Lights
      const ambientLight = new THREE.AmbientLight(0x0a1c14, 2.0);
      scene.add(ambientLight);
      
      const frontLight = new THREE.PointLight(0x00ff88, 10, 50);
      scene.add(frontLight);
      
      // Synapse Highway Group
      const highwayGroup = new THREE.Group();
      scene.add(highwayGroup);
      
      // 1. Structural Concentric Fiber Brackets (The Tunnel Rings)
      const tunnelRings = [];
      const ringsCount = 20;
      const ringSpacing = 8.0;
      
      for (let i = 0; i < ringsCount; i++) {
        const ringGeo = new THREE.RingGeometry(5.0, 5.08, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x00ff88,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.3
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        // Distribute along Z-axis
        ringMesh.position.z = -i * ringSpacing;
        highwayGroup.add(ringMesh);
        tunnelRings.push(ringMesh);
      }
      
      // 2. Glowing Neon Data Tubes (Cylinder lines)
      const tubeCount = 8;
      const tubes = [];
      const tubeGeo = new THREE.CylinderGeometry(0.04, 0.04, ringsCount * ringSpacing, 8);
      const tubeMat = new THREE.MeshStandardMaterial({
        color: 0x00d4ff,
        emissive: 0x00d4ff,
        emissiveIntensity: 1.5,
        metalness: 0.9,
        roughness: 0.1
      });
      
      for (let i = 0; i < tubeCount; i++) {
        const angle = (i / tubeCount) * Math.PI * 2;
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        
        // Position on the perimeter of the cylinder
        tube.position.x = 5.0 * Math.cos(angle);
        tube.position.y = 5.0 * Math.sin(angle);
        tube.position.z = -(ringsCount * ringSpacing) / 2;
        tube.rotation.x = Math.PI / 2;
        
        highwayGroup.add(tube);
        tubes.push(tube);
      }
      
      // 3. Glowing Data Packet Nodes (Spheres flying down the tubes)
      const nodesCount = 40;
      const nodes = [];
      const nodeGeo = new THREE.SphereGeometry(0.18, 16, 16);
      const nodeMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        emissive: 0xffd700,
        emissiveIntensity: 1.2,
        metalness: 0.9,
        roughness: 0.05
      });
      
      for (let i = 0; i < nodesCount; i++) {
        const mesh = new THREE.Mesh(nodeGeo, nodeMat);
        highwayGroup.add(mesh);
        
        // Distribute on random tubes and starting positions along Z
        const tubeIndex = i % tubeCount;
        const tubeAngle = (tubeIndex / tubeCount) * Math.PI * 2;
        const radius = 5.0;
        
        const startZ = -Math.random() * (ringsCount * ringSpacing);
        const speed = 15.0 + Math.random() * 15.0;
        
        nodes.push({
          mesh,
          x: radius * Math.cos(tubeAngle),
          y: radius * Math.sin(tubeAngle),
          z: startZ,
          speed,
          maxZ: ringsCount * ringSpacing
        });
      }
      
      // Dynamic camera movement path
      function seek(p) {
        // Continuous rotation of the highway group
        highwayGroup.rotation.z = p * Math.PI * 0.5;
        
        // Loop the tunnel rings expanding size slightly to suggest air pressure / pulse
        tunnelRings.forEach((ring, idx) => {
          const distance = Math.abs(ring.position.z - camera.position.z);
          const pulse = Math.max(1.0, 1.3 - (distance / 40.0));
          ring.scale.set(pulse, pulse, 1);
        });
        
        // Update nodes flying down the tubes towards the camera (and looping back)
        nodes.forEach((nd) => {
          // Forward flight progress based on time
          let currentZ = nd.z + p * nd.speed * 8.0;
          currentZ = currentZ % nd.maxZ; // loop back
          
          nd.mesh.position.x = nd.x;
          nd.mesh.position.y = nd.y;
          nd.mesh.position.z = -currentZ;
          
          // scale pulse based on Z distance to screen
          const meshScale = 1.0 + Math.sin(p * Math.PI * 4 + nd.z) * 0.3;
          nd.mesh.scale.set(meshScale, meshScale, meshScale);
        });
        
        // Camera flying down the center of the cylinder synapse tunnel!
        const flyDistance = ringsCount * ringSpacing;
        const camZ = -p * (flyDistance * 0.7); // Travel 70% of the tunnel
        
        camera.position.x = Math.sin(p * Math.PI * 2) * 0.4;
        camera.position.y = Math.cos(p * Math.PI * 3) * 0.4;
        camera.position.z = camZ;
        
        // Point light moves exactly in front of the camera
        frontLight.position.x = camera.position.x;
        frontLight.position.y = camera.position.y;
        frontLight.position.z = camera.position.z - 5.0;
        
        // Slight tilt and sway to suggest organic movement through the cable
        camera.rotation.z = p * Math.PI * 0.2;
        camera.rotation.x = Math.sin(p * Math.PI) * 0.05;
        camera.rotation.y = Math.cos(p * Math.PI) * 0.05;
        
        renderer.render(scene, camera);
      }
      
      window.addEventListener("hf-seek", (event) => {
        seek(event.detail.time / duration);
      });
      
      // First frame render
      seek(0);
    </script>
  </body>
</html>
