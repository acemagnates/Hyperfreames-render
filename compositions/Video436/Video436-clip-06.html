<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video436 Clip 06 — Core Synchronization Ignition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #030508;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 212, 255, 0.25);
        padding-bottom: 20px;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 32px;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
      }
      .hud-stats {
        text-align: right;
        font-size: 14px;
        line-height: 1.6;
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 212, 255, 0.25);
        padding-top: 20px;
      }
      .hud-status-block {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .status-active {
        color: #00ff88;
        font-weight: bold;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 212, 255, 0.1);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid #00d4ff;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video436-clip-06"
         data-start="15.0"
         data-duration="3.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      
      <canvas id="canvas3d"></canvas>
      
      <div class="hud-brackets">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>

      <div id="hud-container">
        <div class="hud-header">
          <div>
            <div class="hud-title">CHRONOS CORE : PHASE 06</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">SYS.LOC: /SECTOR_06/SYNCHRONIZATION</div>
          </div>
          <div class="hud-stats">
            <div>CORE_SYNC: <span class="status-active">100.00%</span></div>
            <div>STATUS: <span style="color: #ffd700;">OPERATIONAL</span></div>
          </div>
        </div>
        
        <div class="hud-footer">
          <div class="hud-status-block">
            <div>SYSTEM: <span class="status-active">SYNCHRONIZED</span></div>
            <div>|</div>
            <div>UPTIME: <span>18.000s</span></div>
          </div>
          <div style="font-size: 14px;">SYS_LOCK // INITIALIZED</div>
        </div>
      </div>
    </div>

    <script>
      const duration = 3.0;
      const canvas = document.getElementById("canvas3d");
      
      // Scene Setup
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030508, 0.015);
      
      // Camera Setup
      const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 1000);
      
      // Renderer Setup
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      if (isWebGLAvailable()) {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Lights
      const ambientLight = new THREE.AmbientLight(0x0a1424, 2.0);
      scene.add(ambientLight);
      
      const keyLight = new THREE.DirectionalLight(0x00d4ff, 5.0);
      keyLight.position.set(10, 20, 15);
      scene.add(keyLight);
      
      // Volumetric Sweep Spotlight
      const spotLight = new THREE.SpotLight(0x00ff88, 15, 45, Math.PI / 4, 0.5, 1);
      spotLight.position.set(0, 15, 5);
      spotLight.castShadow = true;
      scene.add(spotLight);
      
      const fusionGlow = new THREE.PointLight(0x00d4ff, 15, 30);
      fusionGlow.position.set(0, 0, 0);
      scene.add(fusionGlow);
      
      // Reactor Center Fusion Group
      const reactorGroup = new THREE.Group();
      scene.add(reactorGroup);
      
      // 1. Central Fusion core (highly glowing double-sphere)
      const coreGeo = new THREE.SphereGeometry(1.6, 32, 32);
      const coreMat = new THREE.MeshStandardMaterial({
        color: 0x00d4ff,
        emissive: 0x00d4ff,
        emissiveIntensity: 2.0,
        metalness: 0.1,
        roughness: 0.1
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      reactorGroup.add(coreMesh);
      
      // 2. High-speed Concentric Gyroscopic rings
      const rings = [];
      const createFastRing = (radius, tubeRadius, color) => {
        const ringGeo = new THREE.TorusGeometry(radius, tubeRadius, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({
          color: color,
          metalness: 0.95,
          roughness: 0.05,
          emissive: color,
          emissiveIntensity: 0.4
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        reactorGroup.add(ringMesh);
        rings.push(ringMesh);
      };
      
      createFastRing(2.6, 0.05, 0x00ff88);
      createFastRing(3.2, 0.05, 0xffd700);
      createFastRing(4.0, 0.05, 0x00d4ff);
      
      // 3. Spatially Floating 3D Text Panels (3D canvas surfaces)
      const textCanvas1 = document.createElement("canvas");
      textCanvas1.width = 512;
      textCanvas1.height = 128;
      const ctx1 = textCanvas1.getContext("2d");
      ctx1.fillStyle = "rgba(0,0,0,0)";
      ctx1.fillRect(0,0,512,128);
      ctx1.font = "bold 52px 'Oswald', sans-serif";
      ctx1.fillStyle = "#ffffff";
      ctx1.textAlign = "center";
      ctx1.textBaseline = "middle";
      ctx1.shadowColor = "#00d4ff";
      ctx1.shadowBlur = 12;
      ctx1.fillText("CHRONOS ENGINE", 256, 64);
      
      const textTexture1 = new THREE.CanvasTexture(textCanvas1);
      const textMat1 = new THREE.MeshBasicMaterial({ map: textTexture1, transparent: true, side: THREE.DoubleSide });
      const textGeo1 = new THREE.PlaneGeometry(6.0, 1.5);
      const textMesh1 = new THREE.Mesh(textGeo1, textMat1);
      textMesh1.position.set(0, 2.5, 3.5);
      scene.add(textMesh1);
      
      const textCanvas2 = document.createElement("canvas");
      textCanvas2.width = 512;
      textCanvas2.height = 128;
      const ctx2 = textCanvas2.getContext("2d");
      ctx2.fillStyle = "rgba(0,0,0,0)";
      ctx2.fillRect(0,0,512,128);
      ctx2.font = "bold 44px 'Courier Prime', monospace";
      ctx2.fillStyle = "#00ff88";
      ctx2.textAlign = "center";
      ctx2.textBaseline = "middle";
      ctx2.shadowColor = "#00ff88";
      ctx2.shadowBlur = 10;
      ctx2.fillText("SYSTEM OPERATIONAL", 256, 64);
      
      const textTexture2 = new THREE.CanvasTexture(textCanvas2);
      const textMat2 = new THREE.MeshBasicMaterial({ map: textTexture2, transparent: true, side: THREE.DoubleSide });
      const textGeo2 = new THREE.PlaneGeometry(6.0, 1.5);
      const textMesh2 = new THREE.Mesh(textGeo2, textMat2);
      textMesh2.position.set(0, -2.5, 3.5);
      scene.add(textMesh2);
      
      // 4. Sweeping Particle Fields (100 custom particles)
      const particlesCount = 60;
      const particlesGroup = new THREE.Group();
      scene.add(particlesGroup);
      
      const particleGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const particleMat = new THREE.MeshStandardMaterial({
        color: 0x00ff88,
        emissive: 0x00ff88,
        emissiveIntensity: 0.8,
        metalness: 0.9,
        roughness: 0.1
      });
      
      const particlesData = [];
      for (let i = 0; i < particlesCount; i++) {
        const mesh = new THREE.Mesh(particleGeo, particleMat);
        particlesGroup.add(mesh);
        const radius = 4.5 + (i * 0.05);
        const speed = 2.0 + (i % 3) * 0.5;
        const angleOffset = (i / particlesCount) * Math.PI * 2;
        particlesData.push({ mesh, radius, speed, angleOffset });
      }
      
      // 5. Floor Cyber-Grid
      const gridHelper = new THREE.GridHelper(80, 40, 0x00d4ff, 0x07121d);
      gridHelper.position.y = -10;
      scene.add(gridHelper);
      
      // Dynamic camera movement path
      function seek(p) {
        // High speed rotations
        reactorGroup.rotation.y = p * Math.PI * 4;
        reactorGroup.rotation.x = Math.sin(p * Math.PI) * 0.3;
        
        rings[0].rotation.x = p * Math.PI * 6;
        rings[1].rotation.y = -p * Math.PI * 4;
        rings[2].rotation.z = p * Math.PI * 5;
        
        // Dynamic core breathing
        const coreScale = 1.0 + Math.sin(p * Math.PI * 8) * 0.12;
        coreMesh.scale.set(coreScale, coreScale, coreScale);
        
        // SpotLight sweeping
        spotLight.position.x = 15 * Math.sin(p * Math.PI * 3);
        spotLight.position.z = 5 + Math.cos(p * Math.PI * 2) * 5;
        
        // Dynamic particles swirling on orbital paths
        particlesData.forEach((pt) => {
          const angle = pt.angleOffset + p * pt.speed * Math.PI * 2;
          pt.mesh.position.x = pt.radius * Math.cos(angle);
          pt.mesh.position.y = Math.sin(angle) * 1.5;
          pt.mesh.position.z = pt.radius * Math.sin(angle);
        });
        
        // Floating 3D Text Panels
        textMesh1.position.y = 2.5 + Math.sin(p * Math.PI * 2) * 0.15;
        textMesh2.position.y = -2.5 - Math.sin(p * Math.PI * 2) * 0.15;
        
        // 3-Act camera path: Spiral swoop down, static hold alignment, and exit volumetric flare!
        let camRadius = 22.0 - p * 12.0; // Zooms from 22 to 10
        if (p > 0.8) {
          camRadius = 10.0 + ((p - 0.8) / 0.2) * 20.0; // fly straight back out to void!
        }
        
        const camAngle = p * Math.PI * 1.4;
        camera.position.x = camRadius * Math.sin(camAngle);
        camera.position.z = camRadius * Math.cos(camAngle);
        camera.position.y = 8.0 - p * 7.5;
        
        camera.lookAt(0, 0, 0);
        
        // Volumetric fade to black in the final act
        if (p > 0.85) {
          const exitFade = 1.0 - ((p - 0.85) / 0.15);
          textMat1.opacity = exitFade;
          textMat2.opacity = exitFade;
          renderer.toneMappingExposure = 1.3 * exitFade;
        } else {
          textMat1.opacity = 1.0;
          textMat2.opacity = 1.0;
          renderer.toneMappingExposure = 1.3;
        }
        
        renderer.render(scene, camera);
      }
      
      window.addEventListener("hf-seek", (event) => {
        seek(event.detail.time / duration);
      });
      
      // First frame render
      seek(0);
    </script>
  </body>
</html>
