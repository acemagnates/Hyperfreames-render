<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Meridian30 Clip 05 — Coordinates</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Meridian30/meridian30-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14100e; }
    #root { position: relative; width: 1080px; height: 1920px; }
    #depth-stage { position: absolute; inset: 0; perspective: 1100px; transform-style: preserve-3d; }
    .z-bg { position: absolute; inset: 0; transform: translateZ(-350px) scale(1.6); background: radial-gradient(circle at 50% 30%, rgba(229,107,111,0.08), #14100e 70%); }
    .z-mg { position: absolute; inset: 0; transform: translateZ(0); }
    #coord-canvas, #grid-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #grain { position: absolute; inset: 0; z-index: 100; opacity: 0.2; mix-blend-mode: overlay; }
    #chrom-wrap { position: absolute; inset: 0; z-index: 99; opacity: 0; }
    #chrom-r { position: absolute; inset: 0; background: rgba(229,107,111,0.14); mix-blend-mode: screen; }
    #chrom-b { position: absolute; inset: 0; background: rgba(187,148,87,0.1); mix-blend-mode: screen; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="Meridian30-clip-05" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="root-inner">
      <div id="depth-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1"><canvas id="grid-canvas" width="1080" height="1920"></canvas></div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="2"><canvas id="coord-canvas" width="1080" height="1920"></canvas></div>
      </div>
      <div id="chrom-wrap" class="clip" data-start="0" data-duration="5" data-track-index="3"><div id="chrom-r"></div><div id="chrom-b"></div></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="4" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const CID = "Meridian30-clip-05";
    const D = 5;
    const M = window.MeridianEngine;
    const tl = gsap.timeline({ paused: true });
    M.initFilmGrain(document.getElementById("grain"), 0.2, 305);
    const st = { p: 0 };
    tl.fromTo("#depth-stage", { scale: 0.9 }, { scale: 1.08, duration: D, ease: "none" }, 0);
    tl.to(st, { p: 1, duration: 3.8, ease: "power2.inOut" }, 0.1);
    M.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 1.8, 1.2);
    M.particleBurst(tl, document.querySelector(".z-bg"), 540, 700, 1.75, 16, M.PAL.coral, 3055);
    const grid = document.getElementById("grid-canvas");
    const coord = document.getElementById("coord-canvas");
    window.addEventListener("hf-seek", (e) => {
      const t = e.detail.time;
      tl.seek(t);
      if (grid) M.drawArchiveGrid(grid, t, 3051);
      if (coord) M.drawCoordinateRain(coord, st.p, t);
    });
    if (grid) M.drawArchiveGrid(grid, 0, 3051);
    if (coord) M.drawCoordinateRain(coord, 0, 0);
    tl.seek(0);
    window.__timelines[CID] = tl;
  </script>
</body>
</html>
