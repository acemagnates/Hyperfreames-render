<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Meridian30 Clip 02 — Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="compositions/Meridian30/meridian30-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14100e; }
    #root { position: relative; width: 1080px; height: 1920px; }
    #depth-stage { position: absolute; inset: 0; perspective: 1100px; transform-style: preserve-3d; }
    .z-bg { position: absolute; inset: 0; transform: translateZ(-360px) scale(1.62); background: radial-gradient(circle at 30% 20%, rgba(15,76,92,0.2), #14100e 65%); }
    .z-mg { position: absolute; inset: 0; transform: translateZ(0); }
    .z-fg { position: absolute; inset: 0; transform: translateZ(140px) scale(0.9); pointer-events: none; }
    #map-canvas, #grid-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    .caption { position: absolute; left: 72px; right: 72px; bottom: 160px; font-family: 'Playfair Display', serif; font-size: 36px; color: #F4F1EA; text-shadow: 0 4px 12px rgba(0,0,0,0.45); }
    .caption span { color: #E56B6F; font-style: italic; }
    #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.5) 100%); z-index: 90; }
    #grain { position: absolute; inset: 0; z-index: 100; opacity: 0.18; mix-blend-mode: overlay; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="Meridian30-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="root-inner">
      <div id="depth-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1"><canvas id="grid-canvas" width="1080" height="1920"></canvas></div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="2">
          <canvas id="map-canvas" width="1080" height="1920"></canvas>
          <p class="caption clip" data-start="0" data-duration="5" data-track-index="3" id="cap">They drew a line through <span>the world</span>.</p>
        </div>
        <div class="z-fg clip" data-start="0" data-duration="5" data-track-index="4"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="5"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="6" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const CID = "Meridian30-clip-02";
    const D = 5;
    const M = window.MeridianEngine;
    M.registerEases(gsap);
    const tl = gsap.timeline({ paused: true });
    M.initFilmGrain(document.getElementById("grain"), 0.18, 302);
    const drawState = { p: 0 };
    gsap.set("#cap", { opacity: 0, y: 30 });
    tl.fromTo("#depth-stage", { scale: 1.08, x: -20 }, { scale: 1, x: 0, duration: D, ease: "none" }, 0);
    tl.to(drawState, { p: 1, duration: 3.2, ease: "power2.inOut" }, 0.2);
    tl.to("#cap", { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 1.8);
    M.lifePulse(tl, "#depth-stage", D, { scaleAmp: 0.008, yAmp: 5 });
    const grid = document.getElementById("grid-canvas");
    const map = document.getElementById("map-canvas");
    window.addEventListener("hf-seek", (e) => {
      const t = e.detail.time;
      tl.seek(t);
      if (grid) M.drawArchiveGrid(grid, t, 3021);
      if (map) M.drawMeridianMap(map, drawState.p, t);
    });
    if (grid) M.drawArchiveGrid(grid, 0, 3021);
    if (map) M.drawMeridianMap(map, 0, 0);
    tl.seek(0);
    window.__timelines[CID] = tl;
  </script>
</body>
</html>
