<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CALENDAR-654 clip 05 — Machines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/CALENDAR-654/calendar654-shared.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #121212;
      }
      #root {
        position: relative;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 900px;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-200px);
        filter: blur(2px);
        background: radial-gradient(ellipse 80% 60% at 92% 8%, rgba(139, 0, 0, 0.45), transparent 55%),
          linear-gradient(165deg, #121212 0%, #0a0a0a 100%);
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      #nature {
        position: absolute;
        left: 8%;
        top: 44%;
        font-family: "Playfair Display", serif;
        font-size: 88px;
        color: #f4f1ea;
        transform: translateZ(-40px);
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        opacity: 0;
      }
      #machines {
        position: absolute;
        right: 6%;
        top: 46%;
        font-family: Oswald, sans-serif;
        font-size: 102px;
        font-weight: 700;
        color: #8b0000;
        transform: translateZ(80px);
        text-shadow:
          0 0 12px rgba(139, 0, 0, 0.55),
          0 6px 22px rgba(0, 0, 0, 0.55);
        opacity: 0;
      }
      #did {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%) translateZ(20px);
        font-family: Oswald, sans-serif;
        font-size: 72px;
        color: #e5b05c;
        opacity: 0;
      }
      .z-fg-1 {
        position: absolute;
        inset: 0;
        transform: translateZ(100px);
        pointer-events: none;
      }
      #scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        top: -2%;
        background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.5), transparent);
      }
      .bracket {
        position: absolute;
        width: 44px;
        height: 44px;
        border: 3px solid rgba(139, 0, 0, 0.75);
      }
      .br-tl {
        left: 40px;
        top: 160px;
        border-right: none;
        border-bottom: none;
      }
      .br-tr {
        right: 40px;
        top: 160px;
        border-left: none;
        border-bottom: none;
      }
      .br-bl {
        left: 40px;
        bottom: 160px;
        border-right: none;
        border-top: none;
      }
      .br-br {
        right: 40px;
        bottom: 160px;
        border-left: none;
        border-top: none;
      }
      .z-fg-2 {
        position: absolute;
        inset: 0;
        transform: translateZ(160px);
        pointer-events: none;
        filter: blur(1.5px);
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0, 0, 0, 0.72) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 35;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="CALENDAR-654-clip-05-MG"
      data-start="0"
      data-duration="3.49"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="3.49" data-track-index="0">
          <div id="pulse-proxy" class="z-bg clip" data-start="0" data-duration="3.49" data-track-index="1"></div>
          <div class="z-mg clip" data-start="0" data-duration="3.49" data-track-index="2">
            <div id="nature" class="clip" data-start="0" data-duration="0.85" data-track-index="3">NATURE</div>
            <div id="machines" class="clip" data-start="0.25" data-duration="3.24" data-track-index="4">MACHINES</div>
            <div id="did" class="clip" data-start="2.98" data-duration="0.51" data-track-index="5">DID</div>
          </div>
          <div class="z-fg-1 clip" data-start="0" data-duration="3.49" data-track-index="6">
            <div id="scanline"></div>
            <div class="bracket br-tl"></div>
            <div class="bracket br-tr"></div>
            <div class="bracket br-bl"></div>
            <div class="bracket br-br"></div>
          </div>
          <div id="dust" class="z-fg-2 clip" data-start="0" data-duration="3.49" data-track-index="7"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="3.49" data-track-index="8"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="3.49" data-track-index="9" width="540" height="960"></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "CALENDAR-654-clip-05-MG";
      const D = 3.49;
      const H = window.Calendar654;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0xc6540505);
      const dust = document.getElementById("dust");
      for (let i = 0; i < 8; i++) {
        const d = document.createElement("div");
        d.style.cssText =
          "position:absolute;left:" +
          rng() * 100 +
          "%;top:" +
          rng() * 100 +
          "%;width:3px;height:3px;background:rgba(139,0,0,0.25);border-radius:50%;";
        dust.appendChild(d);
        tl.to(d, { y: "-=" + (8 + rng() * 12), duration: D, ease: "sine.inOut" }, 0);
      }
      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const data = img.data;
      const gRng = H.mulberry32(0x65450006);
      for (let i = 0; i < data.length; i += 4) {
        const n = (gRng() * 65) | 0;
        data[i] = data[i + 1] = data[i + 2] = n;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      gsap.set("#pulse-proxy", { opacity: 0.92 });
      gsap.set("#nature", { x: -40, opacity: 0, rotation: -3 });
      gsap.set("#machines", { x: 120, opacity: 0 });
      gsap.set("#did", { y: 40, opacity: 0 });

      tl.to(
        "#pulse-proxy",
        {
          opacity: 0.78,
          duration: 0.125,
          ease: "none",
          yoyo: true,
          repeat: H.repeatCount(D, 0.25),
        },
        0
      );
      tl.to("#scanline", { top: "102%", duration: 2.8, ease: "none" }, 0.05);

      tl.to("#nature", { x: 0, opacity: 1, rotation: 0, duration: 0.8, ease: "sine.inOut" }, 0);

      tl.to("#machines", { x: 0, opacity: 1, duration: 0.2, ease: "springHeavy" }, 0.25);
      tl.to("#depth-stage", { perspective: 620, duration: 0.5, ease: "power3.out" }, 0.25);
      H.impactResponse(tl, "#nature", 0.25, 1);

      tl.to("#machines", { scale: 1.08, duration: 0.06, ease: "power2.out" }, 2.01);
      tl.to("#machines", { scale: 1, duration: 0.2, ease: "elastic.out(1, 0.4)" }, 2.07);
      tl.to("#depth-stage", { perspective: 580, duration: 0.2, ease: "power3.out" }, 2.01);

      tl.to("#did", { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 2.98);
      H.bracketPulse(tl, ".bracket", 2.98);

      tl.to(".z-fg-1", { scale: 1.4, filter: "blur(20px)", duration: 0.3, ease: "power3.in" }, 3.19);
      tl.to(".z-mg", { scale: 1.35, filter: "blur(20px)", duration: 0.3, ease: "power3.in" }, 3.19);
      tl.to("#pulse-proxy", { scale: 1.25, duration: 0.3, ease: "power3.in" }, 3.19);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
