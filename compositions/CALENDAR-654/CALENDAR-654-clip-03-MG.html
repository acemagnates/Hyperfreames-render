<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>CALENDAR-654 clip 03 — False peace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/CALENDAR-654/calendar654-shared.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1c1915;
      }
      #root {
        position: relative;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1100px;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: -6%;
        transform: translateZ(-400px) scale(1.35);
        background: repeating-linear-gradient(
            92deg,
            rgba(229, 176, 92, 0.06) 0 180px,
            transparent 180px 360px
          ),
          linear-gradient(90deg, #2a2218 0%, #1c1915 50%, #221c16 100%);
      }
      .corridor-sheet {
        position: absolute;
        top: 10%;
        bottom: 10%;
        width: 200px;
        left: calc(var(--i) * 140px - 200px);
        background: linear-gradient(180deg, #d4c4a8 0%, #a89472 100%);
        opacity: 0.35;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(0, 0, 0, 0.12);
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .ghost-era {
        font-family: "Playfair Display", serif;
        font-size: 72px;
        color: #f4f1ea;
        opacity: 0.4;
        letter-spacing: 0.06em;
        position: absolute;
        top: 36%;
      }
      #counter {
        font-family: "Courier Prime", monospace;
        font-size: 48px;
        color: #e5b05c;
        margin-top: 180px;
        text-shadow: 0 0 12px rgba(229, 176, 92, 0.3);
      }
      .z-fg-1 {
        position: absolute;
        inset: 0;
        transform: translateZ(80px);
        pointer-events: none;
      }
      #blue-leak {
        position: absolute;
        top: 0;
        right: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(180deg, transparent, #00d4ff, transparent);
        opacity: 0;
        box-shadow: 0 0 40px #00d4ff;
      }
      .bracket {
        position: absolute;
        width: 44px;
        height: 44px;
        border: 3px solid #e5b05c;
        opacity: 0.9;
      }
      .br-tl {
        left: 40px;
        top: 170px;
        border-right: none;
        border-bottom: none;
      }
      .br-tr {
        right: 40px;
        top: 170px;
        border-left: none;
        border-bottom: none;
      }
      .br-bl {
        left: 40px;
        bottom: 170px;
        border-right: none;
        border-top: none;
      }
      .br-br {
        right: 40px;
        bottom: 170px;
        border-left: none;
        border-top: none;
      }
      .z-fg-2 {
        position: absolute;
        inset: 0;
        transform: translateZ(160px);
        pointer-events: none;
      }
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 20%;
        transform: translateX(-50%) translateZ(140px);
        width: 960px;
        text-align: center;
        z-index: 20;
      }
      .hero-word {
        opacity: 0;
      }
      #hw-cent {
        font-family: "Playfair Display", serif;
        font-size: 88px;
        color: #f4f1ea;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      }
      #hw-fix {
        font-family: Oswald, sans-serif;
        font-size: 72px;
        color: #e5b05c;
        margin-top: 12px;
        text-shadow: 0 0 20px rgba(229, 176, 92, 0.35);
      }
      #hw-2012 {
        font-family: "Playfair Display", serif;
        font-size: 170px;
        font-weight: 700;
        color: #00d4ff;
        margin-top: 16px;
        text-shadow: 0 0 30px rgba(0, 212, 255, 0.55);
      }
      #chrom-wrap {
        position: absolute;
        inset: 0;
        z-index: 35;
        opacity: 0;
        pointer-events: none;
      }
      #chrom-r,
      #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r {
        background: rgba(255, 0, 0, 0.1);
      }
      #chrom-b {
        background: rgba(0, 100, 255, 0.12);
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 34;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0, 0, 0, 0.72) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 40;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="CALENDAR-654-clip-03-MG"
      data-start="0"
      data-duration="6.64"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="6.64" data-track-index="0">
          <div class="z-bg clip" data-start="0" data-duration="6.64" data-track-index="1" id="zbg-move">
            <div class="corridor-sheet" style="--i: 0"></div>
            <div class="corridor-sheet" style="--i: 1"></div>
            <div class="corridor-sheet" style="--i: 2"></div>
            <div class="corridor-sheet" style="--i: 3"></div>
            <div class="corridor-sheet" style="--i: 4"></div>
            <div class="corridor-sheet" style="--i: 5"></div>
            <div class="corridor-sheet" style="--i: 6"></div>
            <div class="corridor-sheet" style="--i: 7"></div>
          </div>
          <div class="z-mg clip" data-start="0" data-duration="6.64" data-track-index="2">
            <div class="ghost-era">FOUR CENTURIES</div>
            <div id="counter">1582</div>
          </div>
          <div class="z-fg-1 clip" data-start="0" data-duration="6.64" data-track-index="3">
            <div id="blue-leak"></div>
            <div class="bracket br-tl"></div>
            <div class="bracket br-tr"></div>
            <div class="bracket br-bl"></div>
            <div class="bracket br-br"></div>
          </div>
          <div id="part-host" class="z-fg-2 clip" data-start="0" data-duration="6.64" data-track-index="4"></div>
          <div class="hero-stack clip" data-start="0" data-duration="6.64" data-track-index="5">
            <div id="hw-cent" class="hero-word clip" data-start="0.56" data-duration="0.87" data-track-index="6">CENTURIES</div>
            <div id="hw-fix" class="hero-word clip" data-start="3.33" data-duration="0.55" data-track-index="7">FIXED</div>
            <div id="hw-2012" class="hero-word clip" data-start="4.88" data-duration="1.36" data-track-index="8">2012</div>
          </div>
        </div>
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="6.64" data-track-index="9">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="6.64" data-track-index="10"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="6.64" data-track-index="11" width="540" height="960"></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "CALENDAR-654-clip-03-MG";
      const D = 6.64;
      const H = window.Calendar654;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0xc6540303);
      const partHost = document.getElementById("part-host");
      for (let i = 0; i < 22; i++) {
        const d = document.createElement("div");
        d.style.cssText =
          "position:absolute;left:" +
          rng() * 100 +
          "%;top:" +
          rng() * 100 +
          "%;width:3px;height:3px;border-radius:50%;background:rgba(229,176,92,0.35);";
        partHost.appendChild(d);
        tl.to(
          d,
          {
            backgroundColor: "rgba(0,212,255,0.4)",
            y: "-=" + (20 + rng() * 40),
            duration: D,
            ease: "sine.inOut",
          },
          0
        );
      }
      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const data = img.data;
      const gRng = H.mulberry32(0x65430004);
      for (let i = 0; i < data.length; i += 4) {
        const n = (gRng() * 68) | 0;
        data[i] = data[i + 1] = data[i + 2] = n;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      gsap.set("#zbg-move", { scale: 1, x: 0 });
      gsap.set("#hw-cent", { y: 40, opacity: 0 });
      gsap.set("#hw-fix", { scale: 1.1, opacity: 0 });
      gsap.set("#hw-2012", { scale: 1.5, y: 60, opacity: 0 });
      gsap.set("#blue-leak", { opacity: 0, width: 4 });

      tl.to("#zbg-move", { scale: 1.04, x: -15, duration: D, ease: "sine.inOut" }, 0);
      const ctrState = { v: 1582 };
      tl.to(ctrState, {
        v: 1982,
        duration: D,
        ease: "sine.inOut",
        onUpdate: function () {
          document.getElementById("counter").textContent = String(Math.round(ctrState.v));
        },
      }, 0);
      tl.to("#blue-leak", { opacity: 0.3, width: 40, duration: 6.4, ease: "power1.out" }, 0);

      tl.to("#hw-cent", { y: 0, opacity: 1, duration: 0.9, ease: "sine.inOut" }, 0.56);
      tl.to("#hw-fix", { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 3.33);
      H.bracketPulse(tl, ".bracket", 3.33);

      const blurOthers = [".z-bg", ".z-mg", ".z-fg-1"];
      blurOthers.forEach(function (sel) {
        tl.to(sel, { opacity: 0.55, scale: 0.995, transformOrigin: "50% 50%", duration: 0.06, ease: "power2.out" }, 4.88);
      });
      tl.fromTo(
        "#hw-2012",
        { scale: 1.5, y: 60, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.22, ease: "springHeavy" },
        4.88
      );
      tl.to("#hw-2012", { z: 400, scale: 1.55, duration: 0.16, ease: "power4.out" }, 4.9);
      tl.to("#hw-2012", { z: 0, scale: 1, duration: 0.55, ease: "elastic.out(1, 0.38)" }, 5.06);
      blurOthers.forEach(function (sel) {
        tl.to(sel, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.55, ease: "power2.out" }, 5.06);
      });
      H.screenShake(tl, "#root-inner", 4.88, 1.6);
      H.particleBurst(tl, partHost, 540, 960, 4.88, 18, "#00D4FF", 0x20120001);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 4.88, 1.3);
      tl.to("#blue-leak", { opacity: 1, duration: 0.08, ease: "none" }, 4.88);
      tl.to("#blue-leak", { opacity: 0, duration: 1.0, ease: "power2.out" }, 4.96);

      tl.to(".z-fg-1", { scale: 2.5, opacity: 0.22, duration: 0.35, ease: "power3.in" }, 6.29);
      tl.to(".z-fg-2", { scale: 2.5, opacity: 0.18, duration: 0.35, ease: "power3.in" }, 6.29);
      tl.to("#zbg-move", { scale: 1.3, duration: 0.35, ease: "power3.in" }, 6.29);
      tl.to(".hero-stack", { opacity: 0, duration: 0.32, ease: "power3.in" }, 6.31);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
