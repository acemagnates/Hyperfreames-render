<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CALENDAR-654 clip 06 — Collapse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/CALENDAR-654/calendar654-shared.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b192c;
      }
      #root {
        position: relative;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 850px;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-300px) scale(1.45);
        filter: blur(2px);
        background:
          radial-gradient(ellipse 55% 50% at 50% 40%, rgba(139, 0, 0, 0.22), transparent 60%),
          repeating-linear-gradient(0deg, rgba(0, 212, 255, 0.05) 0 1px, transparent 1px 40px),
          linear-gradient(180deg, #0b192c 0%, #050810 100%);
        clip-path: polygon(0% 0%, 100% 0%, 98% 12%, 100% 35%, 96% 55%, 100% 78%, 99% 100%, 0% 100%, 2% 70%, 0% 40%);
        opacity: 0.95;
      }
      .z-mg {
        position: absolute;
        left: 6%;
        right: 6%;
        top: 14%;
        bottom: 12%;
        transform: translateZ(0);
        transform-style: preserve-3d;
      }
      #terminal {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        border: 1px solid rgba(0, 212, 255, 0.25);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
        background: linear-gradient(180deg, #0f2030 0%, #081018 100%);
        padding: 20px;
      }
      .term-head {
        font-family: "Courier Prime", monospace;
        font-size: 18px;
        color: rgba(244, 241, 234, 0.75);
        margin-bottom: 12px;
      }
      #chart {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
        align-items: end;
        padding: 12px 0;
        clip-path: inset(0 0 0 0);
      }
      .bar {
        background: linear-gradient(180deg, #00c853, #1b5e20);
        transform-origin: 50% 100%;
        min-height: 20%;
        box-shadow: 0 0 8px rgba(0, 200, 83, 0.25);
      }
      .bar:nth-child(odd) {
        background: linear-gradient(180deg, #ff5252, #8b0000);
      }
      .z-fg-1 {
        position: absolute;
        inset: 0;
        transform: translateZ(90px);
        pointer-events: none;
      }
      #scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        top: -2%;
        background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.55), transparent);
      }
      .bracket {
        position: absolute;
        width: 42px;
        height: 42px;
        border: 2px solid rgba(139, 0, 0, 0.7);
      }
      .br-tl {
        left: 32px;
        top: 140px;
        border-right: none;
        border-bottom: none;
      }
      .br-tr {
        right: 32px;
        top: 140px;
        border-left: none;
        border-bottom: none;
      }
      .br-bl {
        left: 32px;
        bottom: 140px;
        border-right: none;
        border-top: none;
      }
      .br-br {
        right: 32px;
        bottom: 140px;
        border-left: none;
        border-top: none;
      }
      .z-fg-2 {
        position: absolute;
        inset: 0;
        transform: translateZ(130px);
        pointer-events: none;
        filter: blur(1.5px);
      }
      #strobe {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 20%, rgba(139, 0, 0, 0.25), transparent 55%);
        opacity: 0.55;
        pointer-events: none;
      }
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 72%;
        transform: translateX(-50%) translateZ(100px);
        width: 960px;
        text-align: center;
        z-index: 20;
      }
      .type-line {
        font-family: "Courier Prime", monospace;
        font-size: 72px;
        color: #f4f1ea;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
      }
      .type-line span {
        display: inline-block;
        opacity: 0;
      }
      #hw-inst {
        font-family: Oswald, sans-serif;
        font-size: 88px;
        color: #e5b05c;
        margin-top: 12px;
        opacity: 0;
      }
      #hw-coll {
        font-family: Oswald, sans-serif;
        font-size: 155px;
        font-weight: 700;
        color: #8b0000;
        margin-top: 8px;
        text-shadow:
          0 0 14px rgba(139, 0, 0, 0.65),
          0 6px 24px rgba(0, 0, 0, 0.55);
        opacity: 0;
      }
      #chrom-wrap {
        position: absolute;
        inset: 0;
        z-index: 38;
        opacity: 0;
        pointer-events: none;
      }
      #chrom-r,
      #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r {
        background: rgba(255, 0, 0, 0.12);
      }
      #chrom-b {
        background: rgba(0, 80, 255, 0.12);
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 36;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0, 0, 0, 0.72) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 40;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="CALENDAR-654-clip-06-MG"
      data-start="0"
      data-duration="6.559"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="6.559" data-track-index="0">
          <div class="z-bg clip" data-start="0" data-duration="6.559" data-track-index="1"></div>
          <div class="z-mg clip" data-start="0" data-duration="6.559" data-track-index="2">
            <div id="terminal">
              <div class="term-head">TRADING SYSTEM — FLIGHT NETWORKS</div>
              <div id="chart">
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="3" style="height: 45%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="4" style="height: 72%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="5" style="height: 38%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="6" style="height: 95%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="7" style="height: 52%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="8" style="height: 68%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="9" style="height: 41%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="10" style="height: 88%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="11" style="height: 33%"></div>
                <div class="bar clip" data-start="0" data-duration="6.559" data-track-index="12" style="height: 76%"></div>
              </div>
            </div>
          </div>
          <div class="z-fg-1 clip" data-start="0" data-duration="6.559" data-track-index="13">
            <div id="scanline"></div>
            <div class="bracket br-tl"></div>
            <div class="bracket br-tr"></div>
            <div class="bracket br-bl"></div>
            <div class="bracket br-br"></div>
          </div>
          <div id="strobe" class="z-fg-2 clip" data-start="0" data-duration="6.559" data-track-index="14"></div>
          <div id="shard-host" class="z-fg-2 clip" data-start="0" data-duration="6.559" data-track-index="15"></div>
          <div class="hero-stack clip" data-start="0" data-duration="6.559" data-track-index="16">
            <div id="type-trading" class="type-line clip" data-start="1.76" data-duration="0.62" data-track-index="17"></div>
            <div id="type-net" class="type-line clip" data-start="4.14" data-duration="0.64" data-track-index="18"></div>
            <div id="hw-inst" class="clip" data-start="4.78" data-duration="0.34" data-track-index="19">INSTANTLY</div>
            <div id="hw-coll" class="clip" data-start="5.91" data-duration="0.65" data-track-index="20">COLLAPSED</div>
          </div>
        </div>
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="6.559" data-track-index="21">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="6.559" data-track-index="22"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="6.559" data-track-index="23" width="540" height="960"></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "CALENDAR-654-clip-06-MG";
      const D = 6.559;
      const H = window.Calendar654;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      function fillSpans(id, text) {
        const el = document.getElementById(id);
        for (let i = 0; i < text.length; i++) {
          const s = document.createElement("span");
          s.textContent = text[i];
          el.appendChild(s);
        }
      }
      fillSpans("type-trading", "TRADING");
      fillSpans("type-net", "NETWORKS");
      const tradingSpans = document.querySelectorAll("#type-trading span");
      const netSpans = document.querySelectorAll("#type-net span");
      tradingSpans.forEach(function (sp, idx) {
        tl.to(sp, { opacity: 1, x: 0, duration: 0.16, ease: "power2.out" }, 1.76 + idx * 0.025);
      });
      netSpans.forEach(function (sp, idx) {
        tl.to(sp, { opacity: 1, x: 0, duration: 0.18, ease: "expo.out" }, 4.14 + idx * 0.025);
      });
      gsap.set("#type-trading span, #type-net span", { x: -5, opacity: 0 });
      gsap.set("#hw-inst", { y: -50, opacity: 0 });
      gsap.set("#hw-coll", { scale: 0.9, opacity: 0 });

      const bars = document.querySelectorAll(".bar");
      bars.forEach(function (b, idx) {
        const off = idx * 0.11;
        const reps = H.repeatCount(D - off, 0.45 + (idx % 3) * 0.12);
        if (reps >= 0) {
          tl.fromTo(
            b,
            { scaleY: 1 },
            {
              scaleY: 1.75,
              duration: 0.22,
              ease: "power2.inOut",
              yoyo: true,
              repeat: reps,
            },
            off
          );
        }
      });

      const strobeReps = H.repeatCount(D, 0.25);
      if (strobeReps >= 0) {
        tl.fromTo(
          "#strobe",
          { opacity: 0.8 },
          { opacity: 0.32, duration: 0.125, ease: "none", yoyo: true, repeat: strobeReps },
          0
        );
      }

      tl.to("#depth-stage", { perspective: 1200, duration: 0.6, ease: "power2.out" }, 1.76);
      tl.to("#depth-stage", { rotateY: 1, duration: 0.3, ease: "power2.out" }, 4.14);

      tl.to("#hw-inst", { y: 0, opacity: 1, duration: 0.2, ease: "springSnappy" }, 4.78);
      tl.to("#depth-stage", { perspective: 900, duration: 0.12, ease: "power2.out" }, 4.78);

      tl.to("#hw-coll", { scale: 1, opacity: 1, duration: 0.22, ease: "springHeavy" }, 5.91);
      H.screenShake(tl, "#root-inner", 5.91, 1.8);
      H.particleBurst(tl, document.getElementById("shard-host"), 540, 960, 5.91, 24, "#8B0000", 0xc06be001);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 5.91, 1.4);
      H.rackFocus(tl, "#hw-coll, #chart", [".z-bg", ".term-head", ".z-fg-1"], 5.926, 0.12);
      tl.to(
        "#chart",
        {
          clipPath:
            "polygon(5% 8%, 45% 0%, 92% 12%, 100% 48%, 78% 100%, 22% 92%, 0% 55%, 12% 18%)",
          duration: 0.55,
          ease: "power3.out",
        },
        5.926
      );

      tl.to("#scanline", { top: "102%", duration: 2.5, ease: "none" }, 0.05);
      tl.to("#scanline", { top: "-2%", duration: 0.01, ease: "none" }, 2.56);
      tl.to("#scanline", { top: "102%", duration: 3.98, ease: "none" }, 2.57);

      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const data = img.data;
      const gRng = H.mulberry32(0x65460007);
      for (let i = 0; i < data.length; i += 4) {
        const n = (gRng() * 62) | 0;
        data[i] = data[i + 1] = data[i + 2] = n;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      tl.to(".z-fg-1", { scale: 1.35, filter: "blur(14px)", duration: 0.35, ease: "power3.in" }, 6.21);
      tl.to("#chart", { z: 80, duration: 0.35, ease: "power3.in" }, 6.21);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
