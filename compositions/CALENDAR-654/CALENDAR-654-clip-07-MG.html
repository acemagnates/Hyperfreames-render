<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CALENDAR-654 clip 07 — Panic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/CALENDAR-654/calendar654-shared.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        transform-style: preserve-3d;
      }
      .code-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: "Courier Prime", monospace;
        font-size: 16px;
        line-height: 1.35;
        white-space: pre;
        padding: 4%;
        pointer-events: none;
      }
      .layer-bg {
        transform: translateZ(-200px) scale(1.2);
        filter: blur(2px);
        color: rgba(0, 255, 120, 0.08);
      }
      .layer-mg {
        transform: translateZ(0);
        color: rgba(229, 176, 92, 0.25);
      }
      .layer-fg {
        transform: translateZ(120px);
        color: rgba(229, 176, 92, 0.45);
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.55);
      }
      #frozen-box {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%) translateZ(40px);
        border: 2px solid #8b0000;
        box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        background: rgba(28, 25, 21, 0.92);
        padding: 22px 28px;
        z-index: 15;
      }
      #frozen-time {
        font-family: "Courier Prime", monospace;
        font-size: 56px;
        color: #e5b05c;
      }
      .scan-h {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 3px);
        opacity: 0.08;
        pointer-events: none;
        z-index: 18;
      }
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%) translateZ(100px);
        width: 960px;
        text-align: center;
        z-index: 22;
      }
      #hw-pan {
        font-family: Oswald, sans-serif;
        font-size: 88px;
        color: #8b0000;
        opacity: 0;
      }
      #hw-stood,
      #hw-still {
        display: inline-block;
        font-family: "Playfair Display", serif;
        font-size: 100px;
        color: #e5b05c;
        opacity: 0;
        margin: 0 6px;
      }
      #type-led {
        font-family: "Courier Prime", monospace;
        font-size: 72px;
        color: #f4f1ea;
        margin-top: 20px;
      }
      #type-led span {
        display: inline-block;
        opacity: 0.85;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0, 0, 0, 0.72) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 35;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="CALENDAR-654-clip-07-MG"
      data-start="0"
      data-duration="7.599"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="7.599" data-track-index="0">
          <div id="c-bg" class="code-layer layer-bg clip" data-start="0" data-duration="7.599" data-track-index="1"></div>
          <div id="c-mg" class="code-layer layer-mg clip" data-start="0" data-duration="7.599" data-track-index="2"></div>
          <div id="frozen-box" class="clip" data-start="0" data-duration="7.599" data-track-index="3">
            <div id="frozen-time">23:59:59.000</div>
          </div>
          <div id="c-fg" class="code-layer layer-fg clip" data-start="0" data-duration="7.599" data-track-index="4"></div>
          <div class="scan-h clip" data-start="0" data-duration="7.599" data-track-index="5"></div>
          <div class="hero-stack clip" data-start="0" data-duration="7.599" data-track-index="6">
            <div id="hw-pan" class="clip" data-start="1.23" data-duration="0.56" data-track-index="7">PANICKED</div>
            <div style="margin-top: 16px">
              <span id="hw-stood" class="clip" data-start="3.9" data-duration="0.47" data-track-index="8">STOOD</span>
              <span id="hw-still" class="clip" data-start="4.47" data-duration="0.64" data-track-index="9">STILL</span>
            </div>
            <div id="type-led" class="clip" data-start="6.26" data-duration="1.34" data-track-index="10"></div>
          </div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="7.599" data-track-index="11"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="7.599" data-track-index="12" width="540" height="960"></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "CALENDAR-654-clip-07-MG";
      const D = 7.599;
      const H = window.Calendar654;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const rng = H.mulberry32(0xc6540707);
      function fillLayer(el, lines, tint) {
        let t = "";
        for (let r = 0; r < lines; r++) {
          let row = "";
          for (let c = 0; c < 42; c++) {
            row += String.fromCharCode(48 + ((rng() * 10) | 0));
          }
          t += row + (r < lines - 1 ? "\n" : "");
        }
        el.textContent = t;
      }
      fillLayer(document.getElementById("c-bg"), 80);
      fillLayer(document.getElementById("c-mg"), 70);
      fillLayer(document.getElementById("c-fg"), 60);

      const led = document.getElementById("type-led");
      const w = "LEDGERS";
      for (let i = 0; i < w.length; i++) {
        const s = document.createElement("span");
        s.textContent = w[i];
        s.style.opacity = "0";
        led.appendChild(s);
      }
      const ledSpans = led.querySelectorAll("span");

      tl.to("#depth-stage", { perspective: 750, duration: D, ease: "sine.inOut" }, 0);
      tl.to("#c-bg", { x: 10, duration: D, ease: "sine.inOut" }, 0);
      tl.to("#c-mg", { y: 120, duration: D, ease: "none" }, 0);
      tl.to("#c-fg", { y: 220, duration: D, ease: "none" }, 0);

      gsap.set("#hw-pan", { x: 65, opacity: 0 });
      tl.to("#hw-pan", { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 1.23);

      tl.fromTo("#hw-stood", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "springHeavy" }, 3.9);
      tl.fromTo("#hw-still", { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.22, ease: "springSnappy" }, 4.47);
      H.glowBleed(tl, "#root-inner", { x: 50, y: 46 }, 3.9, "139,0,0", 0.7);
      H.rackFocus(tl, "#frozen-box", ["#c-mg", "#c-fg", ".scan-h"], 3.92, 0.18);

      ledSpans.forEach(function (sp, idx) {
        tl.fromTo(sp, { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 6.26 + idx * 0.02);
      });
      tl.to("#c-mg", { opacity: 0.12, duration: 0.55, ease: "power2.in" }, 6.4);
      tl.to("#c-fg", { opacity: 0.15, duration: 0.55, ease: "power2.in" }, 6.45);

      tl.to("#depth-stage", { perspective: 1400, duration: 0.35, ease: "power4.out" }, 7.25);
      tl.to(".code-layer", { filter: "blur(16px)", opacity: 0.35, duration: 0.35, ease: "power3.in" }, 7.25);
      tl.to("#frozen-box", { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.28);
      tl.to(".hero-stack", { opacity: 0, y: -40, duration: 0.32, ease: "power3.in" }, 7.28);

      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const data = img.data;
      const gRng = H.mulberry32(0x65470008);
      for (let i = 0; i < data.length; i += 4) {
        const n = (gRng() * 60) | 0;
        data[i] = data[i + 1] = data[i + 2] = n;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
