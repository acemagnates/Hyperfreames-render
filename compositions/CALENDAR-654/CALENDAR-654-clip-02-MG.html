<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>CALENDAR-654 clip 02 — Papal cut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/CALENDAR-654/calendar654-shared.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1c1915;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1c1915;
      }
      #root-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1050px;
        perspective-origin: 50% 42%;
        transform-style: preserve-3d;
      }
      #stage-slide {
        position: absolute;
        inset: -2%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-280px) scale(1.45);
        background:
          radial-gradient(ellipse 70% 55% at 50% 35%, rgba(80, 20, 30, 0.35), transparent 55%),
          linear-gradient(180deg, #241a18 0%, #1c1915 100%);
      }
      .latin-ghost {
        position: absolute;
        inset: 6%;
        font-family: "Courier Prime", monospace;
        font-size: 14px;
        line-height: 1.45;
        color: #f4f1ea;
        opacity: 0.08;
        overflow: hidden;
      }
      .z-mg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 920px;
        height: 1180px;
        margin-left: -460px;
        margin-top: -590px;
        transform: translateZ(0) rotateY(2deg);
        transform-style: preserve-3d;
        background: linear-gradient(155deg, #e8dcc8 0%, #c9b89a 35%, #a08f72 100%);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.12);
        border-radius: 2px;
        padding: 56px 48px;
      }
      .decree-line {
        font-family: "Courier Prime", monospace;
        font-size: 22px;
        color: #1c1915;
        opacity: 0.88;
        margin-bottom: 10px;
      }
      .greg {
        font-family: "Playfair Display", serif;
        font-size: 72px;
        color: #e5b05c;
        margin: 24px 0;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      }
      .z-fg-1 {
        position: absolute;
        inset: 0;
        transform: translateZ(120px);
        pointer-events: none;
      }
      #scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        top: -2%;
        background: linear-gradient(90deg, transparent, rgba(229, 176, 92, 0.55), transparent);
        opacity: 0.85;
      }
      .bracket {
        position: absolute;
        width: 46px;
        height: 46px;
        border: 3px solid #e5b05c;
        opacity: 0.95;
      }
      .br-tl {
        left: 44px;
        top: 180px;
        border-right: none;
        border-bottom: none;
      }
      .br-tr {
        right: 44px;
        top: 180px;
        border-left: none;
        border-bottom: none;
      }
      .br-bl {
        left: 44px;
        bottom: 180px;
        border-right: none;
        border-top: none;
      }
      .br-br {
        right: 44px;
        bottom: 180px;
        border-left: none;
        border-top: none;
      }
      .z-fg-2 {
        position: absolute;
        inset: 0;
        transform: translateZ(180px);
        pointer-events: none;
      }
      .wax {
        position: absolute;
        right: 8%;
        bottom: 10%;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #a00000, #4a0000 70%);
        opacity: 0.3;
        box-shadow: 0 0 24px rgba(139, 0, 0, 0.45);
      }
      .hero-stack {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%) translateZ(100px);
        width: 960px;
        text-align: center;
        z-index: 25;
      }
      .hero-word {
        display: block;
        opacity: 0;
      }
      #hw-del {
        font-family: Oswald, sans-serif;
        font-size: 96px;
        font-weight: 700;
        color: #8b0000;
        text-shadow:
          0 0 8px rgba(139, 0, 0, 0.6),
          0 6px 22px rgba(0, 0, 0, 0.55);
      }
      #hw-ten {
        font-family: "Playfair Display", serif;
        font-size: 140px;
        font-weight: 700;
        color: #e5b05c;
        margin-top: 8px;
        text-shadow: 0 0 28px rgba(229, 176, 92, 0.35);
      }
      .type-row {
        font-family: "Courier Prime", monospace;
        font-size: 64px;
        color: #f4f1ea;
        margin-top: 18px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      .type-row span {
        display: inline-block;
        opacity: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0, 0, 0, 0.72) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 40;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="CALENDAR-654-clip-02-MG"
      data-start="0"
      data-duration="6.25"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="6.25" data-track-index="0">
          <div id="stage-slide" class="clip" data-start="0" data-duration="6.25" data-track-index="1">
            <div class="z-bg clip" data-start="0" data-duration="6.25" data-track-index="2">
              <div class="latin-ghost clip" data-start="0" data-duration="6.25" data-track-index="3">
                Lorem inter gravissimas dispositiones sanctae sedis apostolicae …
              </div>
            </div>
            <div class="z-mg clip" data-start="0" data-duration="6.25" data-track-index="4">
              <div class="decree-line">INTER GRAVISSIMAS — OCTOBER 1582</div>
              <div class="greg">GREGORIUS</div>
              <div class="decree-line">… praescriptione calendarij reformandi …</div>
            </div>
            <div class="z-fg-1 clip" data-start="0" data-duration="6.25" data-track-index="5">
              <div class="bracket br-tl"></div>
              <div class="bracket br-tr"></div>
              <div class="bracket br-bl"></div>
              <div class="bracket br-br"></div>
              <div id="scanline"></div>
            </div>
            <div class="z-fg-2 clip" data-start="0" data-duration="6.25" data-track-index="6">
              <div class="wax clip" data-start="0" data-duration="6.25" data-track-index="7"></div>
            </div>
            <div class="hero-stack clip" data-start="0" data-duration="6.25" data-track-index="8">
              <span id="hw-del" class="hero-word clip" data-start="1.49" data-duration="0.46" data-track-index="9">DELETED</span>
              <span id="hw-ten" class="hero-word clip" data-start="1.95" data-duration="0.61" data-track-index="10">10</span>
              <div id="type-math" class="type-row clip" data-start="4.86" data-duration="0.49" data-track-index="11">
                <span>M</span><span>A</span><span>T</span><span>H</span>
              </div>
              <div id="type-err" class="type-row clip" data-start="5.64" data-duration="0.61" data-track-index="12">
                <span>E</span><span>R</span><span>R</span><span>O</span><span>R</span>
              </div>
            </div>
          </div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="6.25" data-track-index="13"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="6.25" data-track-index="14" width="540" height="960"></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "CALENDAR-654-clip-02-MG";
      const D = 6.25;
      const H = window.Calendar654;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      const inkHost = document.querySelector(".z-fg-2");
      const rng = H.mulberry32(0xc6540202);
      for (let i = 0; i < 10; i++) {
        const d = document.createElement("div");
        const w = 3 + rng() * 5;
        const h = 8 + rng() * 18;
        d.style.cssText =
          "position:absolute;left:" +
          (rng() * 100) +
          "%;top:" +
          (rng() * 100) +
          "%;width:" +
          w +
          "px;height:" +
          h +
          "px;background:rgba(28,25,21,0.35);border-radius:1px;opacity:0.4;";
        inkHost.appendChild(d);
        tl.to(d, { y: "-=" + (4 + rng() * 8), duration: D, ease: "sine.inOut" }, 0);
      }
      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const data = img.data;
      const gRng = H.mulberry32(0x65420003);
      for (let i = 0; i < data.length; i += 4) {
        const n = (gRng() * 70) | 0;
        data[i] = data[i + 1] = data[i + 2] = n;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      gsap.set("#stage-slide", { x: 120, opacity: 0.62 });
      gsap.set("#hw-del", { x: -70, opacity: 0 });
      gsap.set("#hw-ten", { scale: 1.4, opacity: 0 });
      gsap.set("#type-math span", { opacity: 0, x: -6 });
      gsap.set("#type-err span", { opacity: 0, x: -6 });

      tl.to("#stage-slide", { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.to(".z-mg", { x: "-=28", y: "-=6", scale: 1.03, duration: D, ease: "sine.inOut" }, 0);
      tl.to("#scanline", { top: "102%", duration: 3.2, ease: "none" }, 0.1);
      tl.to("#scanline", { top: "-2%", duration: 0.01, ease: "none" }, 3.31);
      tl.to("#scanline", { top: "102%", duration: 2.93, ease: "none" }, 3.32);

      H.lifePulse(tl, ".wax", D, { scaleAmp: 0.04, scalePeriod: 2.8, yAmp: 0, rotAmp: 0 });

      tl.to("#depth-stage", { perspective: 880, duration: 0.5, ease: "power2.out" }, 1.49);
      tl.to("#hw-del", { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 1.49);
      H.glowBleed(tl, ".z-bg", { x: 22, y: 40 }, 1.49, "139,0,0", 0.55);

      tl.to("#hw-ten", { scale: 1, opacity: 1, duration: 0.3, ease: "springHeavy" }, 1.95);
      H.bracketPulse(tl, ".bracket", 1.95);

      const mathSpans = document.querySelectorAll("#type-math span");
      mathSpans.forEach(function (sp, idx) {
        tl.to(sp, { opacity: 1, x: 0, duration: 0.18, ease: "power2.out" }, 4.86 + idx * 0.03);
      });
      const errSpans = document.querySelectorAll("#type-err span");
      errSpans.forEach(function (sp, idx) {
        tl.to(sp, { opacity: 1, x: 0, duration: 0.22, ease: "expo.out" }, 5.64 + idx * 0.03);
      });
      tl.to("#depth-stage", { perspective: 1300, duration: 0.7, ease: "power1.inOut" }, 5.64);

      tl.to("#stage-slide", { x: -140, opacity: 0.42, scale: 0.97, transformOrigin: "50% 50%", duration: 0.35, ease: "power2.in" }, 5.9);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
