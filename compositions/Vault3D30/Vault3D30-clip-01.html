<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Vault3D30 Clip 01 — Descent</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Vault3D30/vault3d30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d{position:absolute;inset:0;width:1080px;height:1920px;z-index:1}
    #grain{position:absolute;inset:0;z-index:5;opacity:.2;mix-blend-mode:overlay;pointer-events:none;width:1080px;height:1920px}
    #hud{position:absolute;inset:0;z-index:10;pointer-events:none;padding:90px 70px;display:flex;flex-direction:column;justify-content:space-between;font-family:'Courier Prime',monospace;color:#BB9457}
    .title{font-family:'Oswald',sans-serif;font-size:34px;letter-spacing:.14em;color:#F4F1EA;text-shadow:0 4px 12px rgba(0,0,0,.45)}
    .sub{font-size:13px;letter-spacing:.2em;margin-top:8px;opacity:.85}
    #vignette{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.55) 100%);pointer-events:none}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Vault3D30-clip-01" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="2" width="540" height="960"></canvas>
    <div id="hud" class="clip" data-start="0" data-duration="5" data-track-index="3">
      <div id="hud-top"><div class="title">OBSIDIAN VAULT</div><div class="sub">SECTOR I // DESCENT VECTOR</div></div>
      <div class="sub">CAM_TRACE // ORBITAL_LOCK</div>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Vault3D30-clip-01",D=5,V=window.Vault3D;
    const tl=gsap.timeline({paused:true});
    gsap.set("#hud-top",{opacity:0,y:-24});
    tl.to("#hud-top",{opacity:1,y:0,duration:.9,ease:"power3.out"},.2);
    V.initGrainCanvas(document.getElementById("grain"),301);
    const canvas=document.getElementById("canvas3d");
    const renderer=V.createRenderer(canvas);
    const {scene,camera}=V.createSceneCamera();
    V.addCinematicLights(scene);
    V.addVaultFloor(scene);
    const group=new THREE.Group();
    scene.add(group);
    const obelisk=new THREE.Mesh(new THREE.CylinderGeometry(.9,1.4,7.5,6),V.goldMaterial(.35));
    obelisk.position.y=1.2;
    group.add(obelisk);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,.35,6),V.goldMaterial(.15));
    cap.position.y=4.9;
    group.add(cap);
    const plinth=new THREE.Mesh(new THREE.BoxGeometry(3.2,.6,3.2),new THREE.MeshStandardMaterial({color:0x3d342c,roughness:.95}));
    plinth.position.y=-2.85;
    group.add(plinth);
    function seek(p){
      const scale=p<.25?THREE.MathUtils.lerp(.05,1,p/.25):1;
      group.scale.setScalar(scale);
      group.rotation.y=p*Math.PI*1.2;
      V.orbitCamera(camera,p,{radius0:24,radius1:12,y0:9,y1:3,turns:.7});
      if(renderer)renderer.render(scene,camera);
    }
    window.addEventListener("hf-seek",e=>{const t=e.detail.time;tl.seek(t);seek(t/D);});
    seek(0);tl.seek(0);
    window.__timelines[CID]=tl;
  </script>
</body>
</html>
