<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Vault3D30 Clip 05 — Prism</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Vault3D30/vault3d30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d{position:absolute;inset:0;z-index:1}
    #grain{position:absolute;inset:0;z-index:5;opacity:.2;mix-blend-mode:overlay;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.6) 100%)}
    #cap{position:absolute;top:95px;left:70px;z-index:10;font-family:'Oswald',sans-serif;font-size:28px;color:#F4F1EA}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Vault3D30-clip-05" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="2" width="540" height="960"></canvas>
    <div id="cap" class="clip" data-start="0" data-duration="5" data-track-index="3">REFRACTION INDEX</div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Vault3D30-clip-05",D=5,V=window.Vault3D;
    const tl=gsap.timeline({paused:true});
    gsap.set("#cap",{opacity:0});tl.to("#cap",{opacity:1,duration:.6},.3);
    V.initGrainCanvas(document.getElementById("grain"),305);
    const renderer=V.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=V.createSceneCamera();
    const lights=V.addCinematicLights(scene);V.addVaultFloor(scene);
    const g=new THREE.Group();scene.add(g);
    const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,1),V.goldMaterial(.55));
    g.add(inner);
    const outer=new THREE.Mesh(new THREE.OctahedronGeometry(2.8,0),V.glassMaterial());
    g.add(outer);
    function seek(p){
      g.rotation.y=p*Math.PI*2.2;
      g.rotation.x=Math.sin(p*Math.PI)*.35;
      inner.rotation.y=-p*Math.PI*3;
      lights.key.position.x=6*Math.cos(p*Math.PI*2);
      lights.key.position.z=6*Math.sin(p*Math.PI*2);
      V.orbitCamera(camera,p,{radius0:14,radius1:9,y0:3.5,y1:2,turns:1.2});
      if(renderer)renderer.render(scene,camera);
    }
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
