<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Vault3D30 Clip 04 — Tablets</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Vault3D30/vault3d30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d{position:absolute;inset:0;z-index:1}
    #grain{position:absolute;inset:0;z-index:5;opacity:.22;mix-blend-mode:overlay;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.58) 100%)}
    #cap{position:absolute;bottom:120px;left:70px;right:70px;z-index:10;font-family:'Courier Prime',monospace;font-size:14px;letter-spacing:.22em;color:#BB9457}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Vault3D30-clip-04" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="2" width="540" height="960"></canvas>
    <div id="cap" class="clip" data-start="0" data-duration="5" data-track-index="3">SURVEY TABLETS // ORBITAL ARRAY</div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Vault3D30-clip-04",D=5,V=window.Vault3D;
    const tl=gsap.timeline({paused:true});
    gsap.set("#cap",{opacity:0});tl.to("#cap",{opacity:.9,duration:.8},1);
    V.initGrainCanvas(document.getElementById("grain"),304);
    const renderer=V.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=V.createSceneCamera();
    V.addCinematicLights(scene);V.addVaultFloor(scene);
    const tablets=[];const mat=new THREE.MeshStandardMaterial({color:0xF4F1EA,roughness:.88,metalness:.02});
    for(let i=0;i<10;i++){
      const m=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.6,.18),mat);
      m.userData.i=i;scene.add(m);tablets.push(m);
    }
    function seek(p){
      tablets.forEach((m,i)=>{
        const a=(i/10)*Math.PI*2+p*Math.PI*1.4;
        const r=5.5+Math.sin(p*Math.PI+i)*.3;
        m.position.set(Math.cos(a)*r,Math.sin(p*2+i)*.8,i*.05);
        m.position.z=Math.sin(a)*r;
        m.rotation.y=-a+Math.PI/2;
        m.rotation.x=Math.sin(p*3+i)*.12;
      });
      V.orbitCamera(camera,p,{radius0:20,radius1:13,y0:6,y1:3.5,turns:1});
      if(renderer)renderer.render(scene,camera);
    }
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
