<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Vault3D30 Clip 06 — Chamber</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Vault3D30/vault3d30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d{position:absolute;inset:0;z-index:1}
    #grain{position:absolute;inset:0;z-index:5;opacity:.2;mix-blend-mode:overlay;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,.62) 100%)}
    #payoff{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:10;text-align:center;pointer-events:none;max-width:880px}
    #payoff h1{font-family:'Playfair Display',serif;font-size:58px;color:#F4F1EA;line-height:1.05;text-shadow:0 4px 16px rgba(0,0,0,.5)}
    #payoff em{font-style:italic;color:#E56B6F}
    #payoff p{margin-top:20px;font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:.24em;color:#BB9457}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Vault3D30-clip-06" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="2" width="540" height="960"></canvas>
    <div id="payoff" class="clip" data-start="0" data-duration="5" data-track-index="3">
      <h1 id="l1">Buried in<br><em>three dimensions.</em></h1>
      <p id="l2">VAULT3D30</p>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Vault3D30-clip-06",D=5,V=window.Vault3D;
    const tl=gsap.timeline({paused:true});
    gsap.set("#l1,#l2",{opacity:0,y:30});
    tl.to("#l1",{opacity:1,y:0,duration:.9,ease:"power3.out"},.9);
    tl.to("#l2",{opacity:.85,y:0,duration:.6},1.4);
    V.initGrainCanvas(document.getElementById("grain"),306);
    const renderer=V.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=V.createSceneCamera();
    V.addCinematicLights(scene);V.addVaultFloor(scene);
    const chamber=new THREE.Group();scene.add(chamber);
    for(let i=0;i<4;i++){
      const col=new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,9,8),new THREE.MeshStandardMaterial({color:0x3d342c,roughness:.95}));
      const a=(i/4)*Math.PI*2+Math.PI/4;
      col.position.set(Math.cos(a)*7,-.2,Math.sin(a)*7);
      chamber.add(col);
    }
    const artifact=new THREE.Mesh(new THREE.TorusKnotGeometry(1.4,.32,120,16),V.goldMaterial(.4));
    artifact.position.y=1.5;chamber.add(artifact);
    function seek(p){
      const reveal=p<.35?THREE.MathUtils.lerp(.2,1,p/.35):1;
      chamber.scale.setScalar(reveal);
      chamber.rotation.y=p*Math.PI*.6;
      artifact.rotation.x=p*Math.PI*3;
      V.orbitCamera(camera,p,{radius0:26,radius1:16,y0:8,y1:4.5,turns:.55});
      if(renderer)renderer.render(scene,camera);
    }
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
