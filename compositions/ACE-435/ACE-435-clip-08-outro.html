<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ACE-435 clip 08 — Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700;800&family=Playfair+Display:ital,wght@0,1;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/ACE-435/ace435-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #121212;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #121212;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1100px;
        perspective-origin: 50% 48%;
        transform-style: preserve-3d;
      }
      #outro-tilt {
        position: absolute;
        inset: -1%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-260px) scale(1.48);
        background:
          radial-gradient(ellipse 55% 45% at 20% 82%, rgba(232, 168, 74, 0.12), transparent 55%),
          radial-gradient(ellipse 100% 100% at 50% 50%, #121212, #0a0a0a 100%);
      }
      .ghost-dict {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 420px;
        height: 560px;
        margin-left: -210px;
        margin-top: -280px;
        opacity: 0.08;
        border-radius: 6px;
        background: linear-gradient(145deg, #4a3528, #1a1410);
        border: 1px solid rgba(212, 175, 55, 0.15);
      }
      .z-mg {
        position: absolute;
        left: 50%;
        top: 54%;
        width: 320px;
        height: 380px;
        margin-left: -160px;
        margin-top: -190px;
        transform: translateZ(0) rotateY(-2deg);
        filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.9));
      }
      .shackle {
        position: absolute;
        left: 50%;
        top: 0;
        width: 200px;
        height: 220px;
        margin-left: -100px;
        border: 14px solid #3a2a22;
        border-radius: 100px 100px 0 0;
        border-bottom: none;
        background: radial-gradient(circle at 40% 30%, #5c4338, #2a1e18 75%);
      }
      .body {
        position: absolute;
        left: 50%;
        top: 200px;
        width: 260px;
        height: 200px;
        margin-left: -130px;
        border-radius: 18px;
        background: linear-gradient(180deg, #4a362c 0%, #2a1e18 100%);
        box-shadow: inset 0 -20px 40px rgba(0, 0, 0, 0.45);
      }
      .keyhole {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 36px;
        height: 52px;
        margin-left: -18px;
        margin-top: -26px;
        border-radius: 18px;
        background: radial-gradient(circle at 50% 30%, #0a0a0a, #1a1410 70%);
        box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.85);
      }
      .z-fg-1 {
        position: absolute;
        inset: 0;
        transform: translateZ(100px) scale(0.92);
        pointer-events: none;
      }
      .bracket {
        position: absolute;
        width: 42px;
        height: 42px;
        border: 2px solid rgba(212, 175, 55, 0.6);
        opacity: 0.6;
      }
      .br-tl {
        left: 44px;
        top: 150px;
        border-right: none;
        border-bottom: none;
      }
      .br-tr {
        right: 44px;
        top: 150px;
        border-left: none;
        border-bottom: none;
      }
      .br-bl {
        left: 44px;
        bottom: 150px;
        border-right: none;
        border-top: none;
      }
      .br-br {
        right: 44px;
        bottom: 150px;
        border-left: none;
        border-top: none;
      }
      #scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        top: 12%;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.22), transparent);
        opacity: 0.4;
      }
      #hero-crime {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translate(-50%, 0) translateZ(90px);
        font-family: Oswald, sans-serif;
        font-weight: 800;
        font-size: 152px;
        color: #8b0000;
        text-shadow:
          0 8px 32px rgba(0, 0, 0, 0.85),
          0 0 40px rgba(139, 0, 0, 0.35);
        opacity: 0;
      }
      #hero-speak {
        position: absolute;
        left: 50%;
        top: 32%;
        transform: translate(-50%, 0) translateZ(65px);
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-style: italic;
        font-size: 104px;
        color: #f4f1ea;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        opacity: 0;
      }
      #burst-host {
        position: absolute;
        inset: 0;
        z-index: 22;
        pointer-events: none;
      }
      #chrom-wrap {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        opacity: 0;
      }
      #chrom-r,
      #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r {
        background: rgba(255, 0, 0, 0.12);
      }
      #chrom-b {
        background: rgba(0, 80, 255, 0.12);
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 35;
        pointer-events: none;
        background: radial-gradient(ellipse 70% 72% at 50% 50%, transparent 28%, rgba(0, 0, 0, 0.88) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.25;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ACE-435-clip-08-outro"
      data-start="0"
      data-duration="8.04"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="8.04" data-track-index="0">
          <div id="outro-tilt">
            <div class="z-bg clip" data-start="0" data-duration="8.04" data-track-index="1">
              <div class="ghost-dict clip" data-start="0" data-duration="8.04" data-track-index="2"></div>
            </div>
            <div class="z-mg clip" data-start="0" data-duration="8.04" data-track-index="3">
              <div class="shackle"></div>
              <div class="body">
                <div class="keyhole"></div>
              </div>
            </div>
            <div id="hero-crime" class="clip" data-start="3.52" data-duration="4.52" data-track-index="4">CRIME</div>
            <div id="hero-speak" class="clip" data-start="4.30" data-duration="3.74" data-track-index="5">SPEAK</div>
            <div class="z-fg-1 clip" data-start="0" data-duration="8.04" data-track-index="6">
              <div class="bracket br-tl"></div>
              <div class="bracket br-tr"></div>
              <div class="bracket br-bl"></div>
              <div class="bracket br-br"></div>
              <div id="scanline"></div>
            </div>
            <div id="burst-host" class="clip" data-start="0" data-duration="8.04" data-track-index="7"></div>
          </div>
        </div>
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="8.04" data-track-index="8">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="8.04" data-track-index="9"></div>
        <canvas
          id="grain"
          class="clip"
          data-start="0"
          data-duration="8.04"
          data-track-index="10"
          width="540"
          height="960"
        ></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "ACE-435-clip-08-outro";
      const D = 8.04;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });

      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const gRng = H.mulberry32(0x9ace0008);
      for (let i = 0; i < img.data.length; i += 4) {
        const n = (gRng() * 75) | 0;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      gsap.set("#hero-crime", { scale: 1.9, y: 80, opacity: 0 });
      gsap.set("#hero-speak", { x: -60, opacity: 0 });

      tl.to(
        "#outro-tilt .z-bg",
        { scale: 1.02, x: -6, duration: D, ease: "sine.inOut" },
        0
      );
      tl.to("#outro-tilt", { rotateY: 1, rotateX: -0.3, duration: D, ease: "sine.inOut" }, 0);
      H.lifePulse(tl, ".z-mg", D, { scaleAmp: 0.006, yAmp: 2, rotAmp: 0.2, scalePeriod: 5.2, yPeriod: 3.0, rotPeriod: 5.5 });

      tl.to("#depth-stage", { perspective: 980, duration: 0.4, ease: "power2.inOut" }, 1.04);
      tl.to(".z-bg", { filter: "brightness(0.92)", duration: 0.4, ease: "power2.inOut" }, 1.04);
      tl.to(".z-bg", { filter: "none", duration: 0.45, ease: "power2.inOut" }, 1.44);

      const hit = 3.52;
      tl.fromTo(
        "#hero-crime",
        { scale: 1.9, y: 80, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.2, ease: "springHeavy" },
        hit
      );
      H.snapZoomWithRecover(tl, "#hero-crime", hit + 0.22, {
        peakScale: 1.6,
        peakZ: 160,
        peakDur: 0.2,
        recoverDur: 0.45,
      });
      H.screenShake(tl, "#root-inner", hit, 1.6);
      H.particleBurst(tl, document.getElementById("burst-host"), 540, 960, hit, 18, "#8b0000", 0xace0808);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", hit, 1.4);
      H.bracketPulse(tl, ".bracket", hit);
      tl.to(".bracket", { borderColor: "#d4af37", opacity: 1, duration: 0.12, ease: "power2.out" }, hit);
      tl.to(".bracket", { opacity: 0.6, duration: 1.2, ease: "power1.inOut" }, hit + 0.2);
      tl.to(".z-bg", { filter: "brightness(1.35)", duration: 0.2, ease: "power2.out" }, hit);
      tl.to(".z-bg", { filter: "none", duration: 1.5, ease: "power1.inOut" }, hit + 0.2);

      tl.to("#depth-stage", { perspective: 900, duration: 0.2, ease: "power4.out" }, hit);
      tl.to("#depth-stage", { perspective: 1100, duration: 0.5, ease: "elastic.out(1, 0.38)" }, hit + 0.2);

      tl.to("#hero-speak", { x: 0, opacity: 1, duration: 0.48, ease: "expo.out" }, 4.3);

      tl.to("#vignette", { scale: 1.035, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.inOut" }, 7.5);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
