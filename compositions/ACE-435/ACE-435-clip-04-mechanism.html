<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ACE-435 clip 04 — Mechanism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/ACE-435/ace435-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b192c;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b192c;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1100px;
        perspective-origin: 52% 38%;
        transform-style: preserve-3d;
      }
      #blueprint-tilt {
        position: absolute;
        inset: -3%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-320px) scale(1.58);
        background:
          radial-gradient(ellipse 70% 55% at 65% 22%, rgba(208, 232, 240, 0.22), transparent 55%),
          radial-gradient(ellipse 90% 80% at 50% 60%, #1a3a5c 0%, #0b192c 70%);
      }
      .z-mg {
        position: absolute;
        left: 6%;
        top: 14%;
        width: 88%;
        height: 72%;
        transform: translateZ(0) rotateX(0.6deg) rotateY(-1deg);
        background: linear-gradient(145deg, rgba(226, 241, 231, 0.06) 0%, transparent 40%),
          repeating-linear-gradient(90deg, rgba(226, 241, 231, 0.04) 0 1px, transparent 1px 48px),
          repeating-linear-gradient(0deg, rgba(226, 241, 231, 0.04) 0 1px, transparent 1px 48px),
          #0d2138;
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.6),
          inset 0 0 0 1px rgba(226, 241, 231, 0.08);
        border-radius: 2px;
      }
      .bp-label {
        position: absolute;
        font-family: "Courier Prime", monospace;
        font-size: 15px;
        color: #e2f1e7;
        letter-spacing: 0.08em;
      }
      .bp-ghost {
        position: absolute;
        font-family: "Courier Prime", monospace;
        font-size: 13px;
        color: rgba(212, 175, 55, 0.12);
      }
      .z-fg-1 {
        position: absolute;
        inset: 0;
        transform: translateZ(90px) scale(0.92);
        pointer-events: none;
        mix-blend-mode: screen;
      }
      .script-drift {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        font-family: "Courier Prime", monospace;
        font-size: 22px;
        color: #d4af37;
        white-space: pre;
        padding: 120px 40px;
        line-height: 1.8;
      }
      .z-fg-2 {
        position: absolute;
        inset: 0;
        transform: translateZ(160px) scale(0.9);
        pointer-events: none;
      }
      .glass-tag {
        position: absolute;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(8, 20, 36, 0.35);
        font-family: Inter, sans-serif;
        font-size: 14px;
        color: #e2f1e7;
        letter-spacing: 0.06em;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #tag-dp {
        left: 12%;
        top: 58%;
      }
      #tag-un {
        left: 18%;
        top: 72%;
      }
      #tag-logic {
        right: 10%;
        top: 48%;
      }
      #hero-untraceable {
        position: absolute;
        left: 50%;
        top: 20%;
        transform: translateX(-50%) translateZ(55px);
        font-family: Oswald, sans-serif;
        font-weight: 700;
        font-size: 88px;
        color: #e2f1e7;
        text-shadow: 0 6px 22px rgba(0, 0, 0, 0.55);
        opacity: 0;
      }
      #hero-darkpool {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, 0) translateZ(65px);
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 104px;
        color: #d4af37;
        white-space: nowrap;
        text-shadow:
          0 4px 14px rgba(0, 0, 0, 0.5),
          0 0 26px rgba(212, 175, 55, 0.3);
        opacity: 0;
      }
      #hero-algorithm {
        position: absolute;
        left: 8%;
        bottom: 14%;
        transform: translateZ(45px);
        font-family: "Courier Prime", monospace;
        font-weight: 700;
        font-size: 80px;
        color: #e5b05c;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      .rack-veil {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: rgba(0, 0, 0, 0);
        opacity: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 30;
        background: radial-gradient(ellipse 76% 78% at 50% 45%, transparent 34%, rgba(0, 0, 0, 0.75) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0.2;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ACE-435-clip-04-mechanism"
      data-start="0"
      data-duration="8.91"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="8.91" data-track-index="0">
          <div id="blueprint-tilt">
            <div class="z-bg clip" data-start="0" data-duration="8.91" data-track-index="1"></div>
            <div class="z-mg clip" data-start="0" data-duration="8.91" data-track-index="2">
              <div class="bp-label" style="left: 8%; top: 10%">NODE_ALPHA — ROUTE</div>
              <div class="bp-label" style="right: 10%; top: 18%">NODE_DELTA — SINK</div>
              <div class="bp-ghost" style="left: 8%; top: 13%">lexeme: /kʰa/</div>
              <div class="bp-ghost" style="right: 10%; top: 21%">morph: ABS</div>
              <svg style="position: absolute; inset: 12%; width: 76%; height: 70%" viewBox="0 0 800 600">
                <defs>
                  <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#e2f1e7" />
                  </marker>
                </defs>
                <path
                  d="M 80 300 Q 240 120 400 300 T 720 300"
                  stroke="#e2f1e7"
                  stroke-width="2"
                  fill="none"
                  marker-end="url(#ar)"
                />
              </svg>
            </div>
            <div class="z-fg-1 clip" data-start="0" data-duration="8.91" data-track-index="3">
              <div class="script-drift" id="script-drift">
                ᚠ ᚡ ᚢ ᚣ ᚤ · transliteration stream · field tape 2019
              </div>
            </div>
            <div id="hero-untraceable" class="clip" data-start="2.66" data-duration="6.25" data-track-index="4">
              UNTRACEABLE
            </div>
            <div id="hero-darkpool" class="clip" data-start="3.58" data-duration="5.33" data-track-index="5">
              DARK POOL
            </div>
            <div id="hero-algorithm" class="clip" data-start="8.03" data-duration="0.88" data-track-index="6">
              ALGORITHM
            </div>
            <div class="z-fg-2 clip" data-start="0" data-duration="8.91" data-track-index="7">
              <div class="glass-tag clip" id="tag-dp" data-start="0" data-duration="8.91" data-track-index="8">
                DARK POOL
              </div>
              <div class="glass-tag clip" id="tag-un" data-start="0" data-duration="8.91" data-track-index="9">
                UNTRACEABLE
              </div>
              <div class="glass-tag clip" id="tag-logic" data-start="0" data-duration="8.91" data-track-index="10">
                ROUTING LOGIC
              </div>
            </div>
            <div id="rack-veil" class="rack-veil clip" data-start="0" data-duration="8.91" data-track-index="11"></div>
          </div>
        </div>
        <div id="vignette" class="clip" data-start="0" data-duration="8.91" data-track-index="12"></div>
        <canvas
          id="grain"
          class="clip"
          data-start="0"
          data-duration="8.91"
          data-track-index="13"
          width="540"
          height="960"
        ></canvas>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const CID = "ACE-435-clip-04-mechanism";
      const D = 8.91;
      const H = window.Ace435;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });

      const grain = document.getElementById("grain");
      const ctx = grain.getContext("2d");
      const img = ctx.createImageData(540, 960);
      const gRng = H.mulberry32(0x9ace0004);
      for (let i = 0; i < img.data.length; i += 4) {
        const n = (gRng() * 68) | 0;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      gsap.set(".z-fg-1, .z-fg-2", { scale: 2.5, opacity: 0 });
      gsap.set(".z-bg", { scale: 1.3 });
      gsap.set("#hero-untraceable", { y: -55, opacity: 0 });
      gsap.set("#hero-darkpool", { x: 80, scale: 0.85, opacity: 0 });
      gsap.set("#hero-algorithm", { scale: 1.3, opacity: 0 });
      gsap.set("#script-drift", { x: 200 });

      tl.to(".z-fg-1, .z-fg-2", { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.to(".z-bg", { scale: 1, duration: 0.4, ease: "power2.out" }, 0);
      tl.to("#depth-stage", { perspective: 1080, duration: 0.35, ease: "power2.out" }, 1.96);
      tl.to("#blueprint-tilt .z-bg", { scale: 1.05, x: 12, y: -8, duration: D - 2.0, ease: "sine.inOut" }, 2.0);
      tl.to("#blueprint-tilt", { rotateY: -2, rotateX: 0.8, duration: D, ease: "sine.inOut" }, 0);
      tl.to("#script-drift", { x: -200, duration: D, ease: "none" }, 0);

      tl.to("#hero-untraceable", { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 2.66);
      tl.to("#depth-stage", { perspective: 1020, duration: 0.35, ease: "power2.out" }, 2.66);
      tl.to("#depth-stage", { perspective: 1100, duration: 0.45, ease: "power2.inOut" }, 3.01);
      H.impactResponse(tl, ".z-mg", 2.66, 0.9);
      tl.to(".z-bg", { filter: "brightness(1.12)", duration: 0.12, ease: "power2.out" }, 2.66);
      tl.to(".z-bg", { filter: "none", duration: 0.4, ease: "power2.in" }, 2.78);

      tl.to("#hero-darkpool", { x: 0, scale: 1, opacity: 1, duration: 0.35, ease: "springSnappy" }, 3.58);
      tl.to("#blueprint-tilt", { rotateY: "+=1.8", duration: 0.3, ease: "power2.out" }, 3.58);
      tl.to(".z-bg", { filter: "brightness(1.1)", duration: 0.12, ease: "power2.out" }, 3.58);
      tl.to(".z-bg", { filter: "none", duration: 0.45, ease: "power2.in" }, 3.7);

      tl.to("#rack-veil", { opacity: 0.5, duration: 0.3, ease: "power2.inOut" }, 6.76);
      tl.to(".z-bg, .z-mg", { opacity: 0.55, duration: 0.3, ease: "power2.inOut" }, 6.76);
      tl.to(".glass-tag", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 6.76);
      tl.to("#rack-veil", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 7.26);
      tl.to(".z-bg, .z-mg", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 7.26);

      tl.to("#hero-algorithm", { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 8.03);
      tl.to("#depth-stage", { perspective: 1040, duration: 0.3, ease: "power2.out" }, 8.03);
      tl.to("#depth-stage", { perspective: 1100, duration: 0.4, ease: "power2.inOut" }, 8.33);
      H.impactResponse(tl, "#hero-algorithm", 8.03, 0.8);
      tl.to(".z-bg", { filter: "brightness(1.08)", duration: 0.12, ease: "power2.out" }, 8.03);
      tl.to(".z-bg", { filter: "none", duration: 0.38, ease: "power2.in" }, 8.15);

      tl.to(".z-fg-1, .z-fg-2", { y: 40, opacity: 0, duration: 0.3, ease: "power3.in" }, 8.61);
      tl.to(".z-mg", { y: 30, opacity: 0, duration: 0.3, ease: "power3.in" }, 8.61);
      tl.to(".z-bg", { y: 40, duration: 0.3, ease: "power2.in" }, 8.61);

      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
