<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Obsidian30 Clip 05 — Ignite</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/Obsidian30/obsidian30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0604}
    #root{position:relative;width:1080px;height:1920px}
    .depth-stage{position:absolute;inset:0}
    .plate-stage{position:absolute;inset:0;opacity:0.26}
    .plate{width:100%;height:100%;object-fit:cover}
    #vig{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse 80% 70% at 50% 48%,transparent 20%,#0a0604 85%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:5;opacity:0.15;mix-blend-mode:overlay;pointer-events:none}
    .shock-wrap{position:absolute;inset:0;z-index:2}
    .shock{position:absolute;left:50%;top:48%;border-radius:50%;border:2px solid rgba(255,209,102,0.5);transform:translate(-50%,-50%) scale(0.2);opacity:0}
    .s1{width:200px;height:200px}
    .s2{width:200px;height:200px}
    .s3{width:200px;height:200px}
    #flare{position:absolute;left:50%;top:48%;width:400px;height:400px;margin:-200px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,246,224,0.95),rgba(255,209,102,0.5) 30%,transparent 65%);
      opacity:0;transform:scale(0.3)}
    .ignite-word{position:absolute;left:56px;bottom:280px;font-family:'Cormorant Garamond',serif;font-size:110px;color:#f8f0e6}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Obsidian30-clip-05" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div class="depth-stage clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="plate-stage clip" data-start="0" data-duration="5" data-track-index="1">
        <img class="plate" src="assets/Obsidian30/ref-void-glass.jpg" alt="" width="1080" height="1920" />
      </div>
      <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <div class="shock-wrap clip" data-start="0" data-duration="5" data-track-index="3">
    <div class="shock s1 clip" data-start="0" data-duration="5" data-track-index="4"></div>
    <div class="shock s2 clip" data-start="0" data-duration="5" data-track-index="5"></div>
    <div class="shock s3 clip" data-start="0" data-duration="5" data-track-index="6"></div>
    <div id="flare" class="clip" data-start="0" data-duration="5" data-track-index="7"></div>
    <div class="ignite-word clip" data-start="0" data-duration="5" data-track-index="8">IGNITE</div>
    </div>
    </div>
    <canvas id="grain" width="540" height="960" class="clip" data-start="0" data-duration="5" data-track-index="9"></canvas>
    <div class="leak-layer clip" data-start="0" data-duration="5" data-track-index="10" style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(196,30,58,0.08),transparent 40%);z-index:4;pointer-events:none"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initObsidian05() {
      const CID="Obsidian30-clip-05",C=window.Obsidian30;
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.15,505);
      const tl=gsap.timeline({paused:true});
      tl.to(".plate-stage",{y:-12,duration:5,ease:"sine.inOut"},0);
      gsap.set(".ignite-word",{opacity:0,scale:0.92});
      function ring(sel,t){
        tl.fromTo(sel,{scale:0.15,opacity:0.9},{scale:3.2,opacity:0,duration:1.6,ease:"power2.out"},t);
      }
      ring(".s1",0.5);
      ring(".s2",1.1);
      ring(".s3",1.7);
      tl.to("#flare",{opacity:1,scale:1.15,duration:0.35,ease:"power4.out"},2.4);
      tl.to("#flare",{opacity:0.4,scale:1.35,duration:1.8,ease:"power1.inOut"},2.75);
      tl.to(".ignite-word",{opacity:1,scale:1,duration:0.7,ease:"power3.out"},2.5);
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initObsidian05);
    else initObsidian05();
  </script>
</body>
</html>
