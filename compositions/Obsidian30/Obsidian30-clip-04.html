<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Obsidian30 Clip 04 — Orbit</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/Obsidian30/obsidian30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0604}
    #root{position:relative;width:1080px;height:1920px}
    .depth-stage{position:absolute;inset:0}
    .plate-stage{position:absolute;inset:0;opacity:0.24}
    .plate{width:100%;height:100%;object-fit:cover}
    #vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 15%,#0a0604 75%)}
    #grain{position:absolute;inset:0;z-index:5;opacity:0.14;mix-blend-mode:overlay;pointer-events:none}
    #cam{position:absolute;inset:0;transform-origin:50% 48%;z-index:2}
    #core{position:absolute;left:50%;top:48%;width:120px;height:120px;margin:-60px;
      border-radius:50%;background:radial-gradient(circle,#fff6e0,#ffd166 35%,#ff9a3c 60%,transparent 72%);
      box-shadow:0 0 80px rgba(255,209,102,0.55),0 0 160px rgba(255,154,60,0.25)}
    .ring{position:absolute;left:50%;top:48%;border-radius:50%;border:2px solid rgba(255,209,102,0.45);
      box-shadow:0 0 30px rgba(255,154,60,0.2),inset 0 0 24px rgba(255,209,102,0.08)}
    .r1{width:340px;height:340px;margin:-170px}
    .r2{width:520px;height:520px;margin:-260px;border-color:rgba(255,154,60,0.28)}
    .r3{width:700px;height:700px;margin:-350px;border-color:rgba(196,30,58,0.2)}
    .orbit-title{position:absolute;left:56px;top:150px;font-family:'Cormorant Garamond',serif;font-size:100px;color:#f8f0e6}
    .orbit-sub{position:absolute;right:56px;bottom:200px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.3em;color:rgba(255,209,102,0.75)}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Obsidian30-clip-04" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
    <div class="depth-stage clip" data-start="0" data-duration="6" data-track-index="0">
      <div class="plate-stage clip" data-start="0" data-duration="6" data-track-index="1">
        <img class="plate" src="assets/Obsidian30/ref-eclipse-gold.jpg" alt="" width="1080" height="1920" />
      </div>
      <div id="vig" class="clip" data-start="0" data-duration="6" data-track-index="2"></div>
    <div id="cam" class="clip" data-start="0" data-duration="6" data-track-index="3">
      <div class="ring r3 clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <div class="ring r2 clip" data-start="0" data-duration="6" data-track-index="2"></div>
      <div class="ring r1 clip" data-start="0" data-duration="6" data-track-index="3"></div>
      <div id="core" class="clip" data-start="0" data-duration="6" data-track-index="4"></div>
      <div class="orbit-title clip" data-start="0" data-duration="6" data-track-index="5">ORBIT</div>
      <div class="orbit-sub clip" data-start="0" data-duration="6" data-track-index="6">GOLD · LOCKED</div>
    </div>
    </div>
    <canvas id="grain" width="540" height="960" class="clip" data-start="0" data-duration="6" data-track-index="7"></canvas>
    <div class="leak-layer clip" data-start="0" data-duration="6" data-track-index="8" style="position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,154,60,0.15),transparent 55%);z-index:4;pointer-events:none"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initObsidian04() {
      const CID="Obsidian30-clip-04",C=window.Obsidian30;
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.14,504);
      const tl=gsap.timeline({paused:true});
      tl.to("#core",{scale:1.04,duration:2,yoyo:true,repeat:1,ease:"sine.inOut"},2.5);
      gsap.set(".orbit-title,.orbit-sub",{opacity:0});
      gsap.set(".ring",{scale:0.6,opacity:0});
      gsap.set("#core",{scale:0});
      tl.to("#core",{scale:1,duration:0.7,ease:"back.out(1.4)"},0.2);
      tl.to(".ring",{scale:1,opacity:1,duration:0.9,stagger:0.12,ease:"power2.out"},0.35);
      tl.to(".r1",{rotate:120,duration:6,ease:"none"},0);
      tl.to(".r2",{rotate:-90,duration:6,ease:"none"},0);
      tl.to(".r3",{rotate:60,duration:6,ease:"none"},0);
      tl.to("#cam",{rotate:4,scale:1.05,duration:6,ease:"sine.inOut"},0);
      tl.to(".orbit-title,.orbit-sub",{opacity:1,duration:0.7,stagger:0.1},1.0);
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initObsidian04);
    else initObsidian04();
  </script>
</body>
</html>
