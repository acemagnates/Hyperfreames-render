<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Obsidian30 Clip 03 — Prism</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/Obsidian30/obsidian30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0604}
    #root{position:relative;width:1080px;height:1920px}
    .depth-stage{position:absolute;inset:0}
    .plate-stage{position:absolute;inset:0;opacity:0.2;z-index:0}
    .plate{width:100%;height:100%;object-fit:cover}
    #vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 40%,transparent 20%,#0a0604 90%)}
    #grain{position:absolute;inset:0;z-index:5;opacity:0.13;mix-blend-mode:overlay;pointer-events:none}
    #stage{position:absolute;inset:0;perspective:1200px;perspective-origin:50% 40%;z-index:2}
    #rig{position:absolute;inset:10%;transform-style:preserve-3d;transform-origin:50% 50%}
    .panel{position:absolute;width:280px;height:520px;left:50%;top:50%;margin:-260px -140px;
      background:linear-gradient(135deg,rgba(255,209,102,0.12),rgba(196,30,58,0.08));
      border:1px solid rgba(255,154,60,0.35);backdrop-filter:none;
      box-shadow:12px 24px 48px rgba(0,0,0,0.55),inset 0 0 40px rgba(255,209,102,0.08)}
    .p1{transform:translateZ(80px) rotateY(-28deg) translateX(-200px)}
    .p2{transform:translateZ(20px) rotateY(0deg)}
    .p3{transform:translateZ(80px) rotateY(28deg) translateX(200px)}
    .beam{position:absolute;width:8px;height:140%;left:50%;top:-20%;margin-left:-4px;
      background:linear-gradient(180deg,transparent,rgba(255,209,102,0.9),rgba(255,154,60,0.4),transparent);
      mix-blend-mode:screen;opacity:0;transform-origin:50% 30%}
    .beam.b2{left:35%;transform:rotate(8deg)}
    .beam.b3{left:65%;transform:rotate(-10deg)}
    .label{position:absolute;left:56px;bottom:260px;font-family:'Cormorant Garamond',serif;font-size:88px;color:#f8f0e6;letter-spacing:0.06em}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Obsidian30-clip-03" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
    <div class="depth-stage clip" data-start="0" data-duration="6" data-track-index="0">
      <div class="plate-stage clip" data-start="0" data-duration="6" data-track-index="1">
        <img class="plate" src="assets/Obsidian30/ref-void-glass.jpg" alt="" width="1080" height="1920" />
      </div>
      <div id="vig" class="clip" data-start="0" data-duration="6" data-track-index="2"></div>
    <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="3">
      <div class="beam b1 clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <div class="beam b2 clip" data-start="0" data-duration="6" data-track-index="2"></div>
      <div class="beam b3 clip" data-start="0" data-duration="6" data-track-index="3"></div>
      <div id="rig" class="clip" data-start="0" data-duration="6" data-track-index="4">
        <div class="panel p1 clip" data-start="0" data-duration="6" data-track-index="5"></div>
        <div class="panel p2 clip" data-start="0" data-duration="6" data-track-index="6"></div>
        <div class="panel p3 clip" data-start="0" data-duration="6" data-track-index="7"></div>
      </div>
      <div class="label clip" data-start="0" data-duration="6" data-track-index="8">PRISM</div>
    </div>
    </div>
    <canvas id="grain" width="540" height="960" class="clip" data-start="0" data-duration="6" data-track-index="9"></canvas>
    <div class="leak-layer clip" data-start="0" data-duration="6" data-track-index="10" style="position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,209,102,0.12) 70%,transparent);z-index:4;pointer-events:none"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initObsidian03() {
      const CID="Obsidian30-clip-03",C=window.Obsidian30;
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.13,503);
      const tl=gsap.timeline({paused:true});
      tl.to(".plate-stage",{scale:1.05,duration:6,ease:"sine.inOut"},0);
      gsap.set(".panel",{opacity:0,scale:0.85});
      gsap.set(".label",{opacity:0,y:24});
      tl.to(".panel",{opacity:1,scale:1,duration:0.9,stagger:0.15,ease:"power3.out"},0.2);
      tl.to(".beam",{opacity:0.85,duration:0.6,stagger:0.12},0.8);
      tl.to("#rig",{rotateY:18,duration:5,ease:"sine.inOut"},0.5);
      tl.to(".beam",{scaleY:1.08,duration:2.5,yoyo:true,repeat:1,ease:"sine.inOut"},1.2);
      tl.to(".label",{opacity:1,y:0,duration:0.8,ease:"power2.out"},2.6);
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initObsidian03);
    else initObsidian03();
  </script>
</body>
</html>
