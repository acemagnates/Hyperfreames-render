<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Obsidian30 Clip 01 — Abyss</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/Obsidian30/obsidian30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0604}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    .depth-stage{position:absolute;inset:0}
    .plate-stage{position:absolute;inset:0;opacity:0.22}
    .plate{width:100%;height:100%;object-fit:cover}
    #vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 30%,#0a0604 85%);pointer-events:none;z-index:3}
    #stage{position:absolute;inset:0;transform-origin:50% 45%;z-index:2}
    #embers{position:absolute;inset:0}
    .ember{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffd166,#ff9a3c 40%,transparent 70%);box-shadow:0 0 12px rgba(255,154,60,0.5);opacity:0}
    .hero{position:absolute;left:56px;bottom:300px;font-family:'Cormorant Garamond',serif;font-size:128px;font-weight:700;line-height:0.9;color:#f8f0e6;
      text-shadow:0 2px 0 #2a1f18,0 0 48px rgba(255,209,102,0.35),0 0 120px rgba(255,154,60,0.2)}
    .tag{position:absolute;left:64px;top:140px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.32em;color:rgba(255,154,60,0.75)}
    #grain{position:absolute;inset:0;opacity:0.16;mix-blend-mode:overlay;pointer-events:none;z-index:5}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Obsidian30-clip-01" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div class="depth-stage clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="plate-stage clip" data-start="0" data-duration="5" data-track-index="1">
        <img class="plate" src="assets/Obsidian30/ref-void-glass.jpg" alt="" width="1080" height="1920" />
      </div>
      <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="3">
      <div id="embers" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div class="tag clip" data-start="0" data-duration="5" data-track-index="2">DEPTH // NULL</div>
      <div class="hero clip" data-start="0" data-duration="5" data-track-index="3">OBSIDIAN</div>
    </div>
    </div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="5" width="540" height="960"></canvas>
    <div class="leak-layer clip" data-start="0" data-duration="5" data-track-index="6" style="position:absolute;inset:0;background:linear-gradient(120deg,transparent 60%,rgba(255,154,60,0.08));pointer-events:none;z-index:4"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initObsidian01() {
      const CID="Obsidian30-clip-01",C=window.Obsidian30;
      C.registerEases(gsap);
      const tl=gsap.timeline({paused:true});
      const box=document.getElementById("embers");
      if(!box)return;
      const embers=C.spawnEmbers(box,48,301);
      gsap.set(".hero",{opacity:0,y:48,letterSpacing:"0.2em"});
      gsap.set(".tag",{opacity:0});
      embers.forEach((el,i)=>{
        gsap.set(el,{opacity:0,scale:0});
        tl.to(el,{opacity:0.35+((i%5)*0.08),scale:1,duration:0.6,ease:"power2.out"},0.15+i*0.04);
        tl.to(el,{y:-Number(el.dataset.drift),duration:4.2,ease:"none"},0.2+i*0.05);
      });
      tl.to(".tag",{opacity:1,duration:0.5},0.2);
      tl.to(".hero",{opacity:1,y:0,letterSpacing:"0.04em",duration:1.1,ease:"obsidianSnap"},0.4);
      tl.to("#stage",{y:-28,scale:1.04,duration:4.5,ease:"sine.inOut"},0);
      const grain=document.getElementById("grain");
      if(grain)C.initGrain(grain,0.16,401);
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initObsidian01);
    else initObsidian01();
  </script>
</body>
</html>
