<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Chrysalis30 Clip 01 — Flatland</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/Chrysalis30/chrysalis30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#050508}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    #flat-stage{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 55%}
    .grid-flat{position:absolute;inset:-10%;background-image:
      linear-gradient(rgba(46,232,214,0.12) 1px,transparent 1px),
      linear-gradient(90deg,rgba(46,232,214,0.12) 1px,transparent 1px);
      background-size:48px 48px}
    .scan{position:absolute;left:0;width:100%;height:4px;background:linear-gradient(90deg,transparent,#2ee8d6,transparent);opacity:0.7;box-shadow:0 0 24px #2ee8d6}
    .hud{position:absolute;top:120px;left:64px;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:rgba(123,92,255,0.9)}
    .hero{position:absolute;left:64px;bottom:280px;font-family:'Syne',sans-serif;font-size:118px;font-weight:800;line-height:0.95;color:#f4f2ff;text-shadow:0 0 40px rgba(123,92,255,0.35)}
    .cell{position:absolute;width:46px;height:46px;border:1px solid rgba(123,92,255,0.25);background:rgba(123,92,255,0.06)}
    #grain{position:absolute;inset:0;opacity:0.14;mix-blend-mode:overlay;pointer-events:none;z-index:5}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Chrysalis30-clip-01" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="flat-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="grid-flat clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="cells"></div>
      <div class="scan clip" data-start="0" data-duration="5" data-track-index="2"></div>
      <div class="hud clip" data-start="0" data-duration="5" data-track-index="3">DIMENSION // 0</div>
      <div class="hero clip" data-start="0" data-duration="5" data-track-index="4">FLAT<br/>LAND</div>
    </div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="5" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initChrysalis01() {
      const CID="Chrysalis30-clip-01",D=5,C=window.Chrysalis30;
      C.registerEases(gsap);
      const tl=gsap.timeline({paused:true});
      const cells=document.getElementById("cells");
      if(!cells)return;
      for(let r=0;r<8;r++){
        for(let c=0;c<6;c++){
          const d=document.createElement("div");
          d.className="cell clip";
          d.style.left=(80+c*52)+"px";
          d.style.top=(420+r*52)+"px";
          d.dataset.start="0";d.dataset.duration="5";d.dataset.trackIndex="10";
          cells.appendChild(d);
        }
      }
      gsap.set(".hero",{opacity:0,y:40});
      gsap.set(".hud",{opacity:0});
      gsap.set(".scan",{top:"-10%"});
      gsap.set(".cell",{scale:0,opacity:0});
      tl.to(".hud",{opacity:1,duration:0.5},0.1);
      tl.to(".cell",{scale:1,opacity:1,duration:0.35,stagger:{each:0.03,grid:[6,8],from:"start"}},0.2);
      tl.to(".scan",{top:"110%",duration:2.4,ease:"none"},0.35);
      tl.to(".hero",{opacity:1,y:0,duration:0.9,ease:"power3.out"},0.35);
      tl.to("#flat-stage",{rotateX:12,scale:1.03,duration:0.85,ease:"power2.inOut"},4.15);
      const grain=document.getElementById("grain");
      if(grain)C.initGrain(grain,0.14,101);
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initChrysalis01);
    else initChrysalis01();
  </script>
</body>
</html>
