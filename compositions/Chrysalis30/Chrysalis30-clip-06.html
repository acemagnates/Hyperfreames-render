<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Chrysalis30 Clip 06 — Mirror</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#050508}
    #root{position:relative;width:1080px;height:1920px}
    #mirror-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:50% 50%}
    .half{position:relative;width:100%;height:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .half-bottom{transform:scaleY(-1);opacity:0.45;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent)}
    #orb{position:absolute;width:280px;height:280px;border-radius:50%;
      background:radial-gradient(circle,#2ee8d6,rgba(123,92,255,0.4) 50%,transparent 70%);
      box-shadow:0 0 100px rgba(46,232,214,0.4)}
    .title{font-family:'Syne',sans-serif;font-size:88px;font-weight:700;color:#f4f2ff;letter-spacing:0.08em;z-index:2}
    .tag{font-family:'JetBrains Mono',monospace;font-size:16px;color:rgba(46,232,214,0.8);letter-spacing:0.35em;margin-top:24px;z-index:2}
    #fade{position:absolute;inset:0;background:#050508;opacity:0;pointer-events:none;z-index:10}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Chrysalis30-clip-06" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30">
    <div id="mirror-wrap" class="clip" data-start="0" data-duration="3" data-track-index="0">
      <div class="half half-top">
        <div id="orb" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
        <div>
          <div class="title clip" data-start="0" data-duration="3" data-track-index="2">CHRYSALIS</div>
          <div class="tag clip" data-start="0" data-duration="3" data-track-index="3">2D · 3D · ONE</div>
        </div>
      </div>
      <div class="half half-bottom">
        <div id="orb-ref" class="clip" data-start="0" data-duration="3" data-track-index="4"></div>
      </div>
    </div>
    <div id="fade" class="clip" data-start="0" data-duration="3" data-track-index="5"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initChrysalis06() {
    const CID="Chrysalis30-clip-06";
    const ref=document.getElementById("orb-ref");
    if(!ref)return;
    ref.style.width="280px";ref.style.height="280px";ref.style.borderRadius="50%";
    ref.style.background="radial-gradient(circle,#2ee8d6,rgba(123,92,255,0.4) 50%,transparent 70%)";
    ref.style.boxShadow="0 0 100px rgba(46,232,214,0.4)";
    const tl=gsap.timeline({paused:true});
    gsap.set(".title,.tag",{opacity:0,y:16});
    tl.to(".title,.tag",{opacity:1,y:0,duration:0.7,stagger:0.12,ease:"power2.out"},0.25);
    tl.to("#mirror-wrap",{rotateZ:3,duration:2.4,ease:"sine.inOut"},0);
    tl.to("#orb",{scale:1.06,duration:1.5,yoyo:true,repeat:1,ease:"sine.inOut"},0.4);
    tl.to("#fade",{opacity:1,duration:0.45,ease:"power2.in"},2.55);
    window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
    tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initChrysalis06);
    else initChrysalis06();
  </script>
</body>
</html>
