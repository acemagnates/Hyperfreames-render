<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Chrysalis30 Clip 02 — The Fold</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/Chrysalis30/chrysalis30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#050508}
    #root{position:relative;width:1080px;height:1920px}
    #tunnel{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 42%;transform-style:preserve-3d}
    #rig{position:absolute;inset:-20%;transform-style:preserve-3d;transform-origin:50% 50%}
    .wall{position:absolute;left:10%;width:80%;height:120%;background:
      repeating-linear-gradient(90deg,rgba(123,92,255,0.15) 0 2px,transparent 2px 64px),
      repeating-linear-gradient(0deg,rgba(46,232,214,0.1) 0 2px,transparent 2px 64px);
      transform-origin:center center}
    .wall-floor{top:35%;transform:rotateX(78deg) translateZ(-120px)}
    .wall-ceiling{top:-25%;transform:rotateX(-78deg) translateZ(-80px)}
    .wall-left{top:0;left:-5%;width:120%;height:100%;transform:rotateY(68deg) translateZ(-200px)}
    .wall-right{top:0;left:-5%;width:120%;height:100%;transform:rotateY(-68deg) translateZ(-200px)}
    .vp{position:absolute;left:50%;top:42%;width:12px;height:12px;margin:-6px;background:#2ee8d6;border-radius:50%;box-shadow:0 0 60px 20px rgba(46,232,214,0.5);transform:translateZ(40px)}
    .depth-title{position:absolute;left:64px;top:140px;font-family:'Syne',sans-serif;font-size:72px;color:#f4f2ff;letter-spacing:-0.02em;
      text-shadow:4px 4px 0 #7b5cff,8px 8px 0 rgba(46,232,214,0.4)}
    .label{position:absolute;right:64px;bottom:160px;font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(46,232,214,0.85);letter-spacing:0.25em}
    #mouth{position:absolute;inset:0;background:#050508;clip-path:circle(0% at 50% 42%);pointer-events:none;z-index:4}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Chrysalis30-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="mouth" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
    <div id="tunnel" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div id="rig">
        <div class="wall wall-floor clip" data-start="0" data-duration="5" data-track-index="2"></div>
        <div class="wall wall-ceiling clip" data-start="0" data-duration="5" data-track-index="3"></div>
        <div class="wall wall-left clip" data-start="0" data-duration="5" data-track-index="4"></div>
        <div class="wall wall-right clip" data-start="0" data-duration="5" data-track-index="5"></div>
        <div class="vp clip" data-start="0" data-duration="5" data-track-index="6"></div>
      </div>
      <div class="depth-title clip" data-start="0" data-duration="5" data-track-index="7">DEPTH</div>
      <div class="label clip" data-start="0" data-duration="5" data-track-index="8">PERSPECTIVE ONLINE</div>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Chrysalis30-clip-02",D=5;
    const tl=gsap.timeline({paused:true});
    gsap.set("#mouth",{clipPath:"circle(0% at 50% 42%)"});
    gsap.set(".depth-title",{opacity:0,x:-30});
    gsap.set("#rig",{z:-80,rotateX:8});
    tl.to("#mouth",{clipPath:"circle(140% at 50% 42%)",duration:1.8,ease:"power2.inOut"},0);
    tl.to("#rig",{z:120,rotateX:-4,duration:D,ease:"sine.inOut"},0);
    tl.to(".depth-title",{opacity:1,x:0,duration:0.7,ease:"power3.out"},0.8);
    tl.to(".vp",{scale:2.2,duration:0.4,yoyo:true,repeat:1,ease:"power1.inOut"},2.2);
    window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
    tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
