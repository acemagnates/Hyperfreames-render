<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Chrysalis30 Clip 05 — Fusion Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/Chrysalis30/chrysalis30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#050508}
    #root{position:relative;width:1080px;height:1920px}
    #stage{position:absolute;inset:0;perspective:1400px;transform-style:preserve-3d}
    .shard{position:absolute;left:50%;top:50%;width:80px;height:160px;margin:-80px 0 0 -40px;
      background:linear-gradient(180deg,rgba(46,232,214,0.5),rgba(123,92,255,0.2));
      border:1px solid rgba(46,232,214,0.4);transform-style:preserve-3d}
    #core{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;
      background:radial-gradient(circle at 40% 35%,#fff,rgba(46,232,214,0.9) 25%,rgba(123,92,255,0.6) 55%,transparent 70%);
      box-shadow:0 0 120px rgba(123,92,255,0.55),0 0 240px rgba(46,232,214,0.25);opacity:0;transform:scale(0.3)}
    .fusion{position:absolute;left:50%;top:72%;transform:translateX(-50%);font-family:'Syne',sans-serif;font-size:88px;font-weight:800;color:#fff;opacity:0}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Chrysalis30-clip-05" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="shards"></div>
      <div id="core" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div class="fusion clip" data-start="0" data-duration="5" data-track-index="2">FUSION</div>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function initChrysalis05() {
    const CID="Chrysalis30-clip-05",C=window.Chrysalis30;
    const holder=document.getElementById("shards");
    if(!holder)return;
    const parts=[];
    for(let i=0;i<18;i++){
      const el=document.createElement("div");
      el.className="shard clip";
      el.dataset.start="0";el.dataset.duration="5";el.dataset.trackIndex=String(10+i);
      holder.appendChild(el);
      parts.push(el);
    }
    const tl=gsap.timeline({paused:true});
    parts.forEach((el,i)=>{
      const a=(i/18)*Math.PI*2;
      const r=280+((i*17)%120);
      gsap.set(el,{x:Math.cos(a)*r,y:Math.sin(a)*r,z:-100+(i%5)*40,rotationY:a*57,opacity:1});
    });
    tl.to(parts,{x:0,y:0,z:0,rotationY:0,scale:0,opacity:0,duration:2.2,ease:"power3.in",stagger:0.03},0);
    tl.to("#core",{opacity:1,scale:1,duration:0.85,ease:"back.out(1.6)"},2.1);
    tl.to("#core",{scale:1.08,duration:1.2,yoyo:true,repeat:2,ease:"sine.inOut"},2.4);
    tl.to(".fusion",{opacity:1,y:-20,duration:0.6,ease:"power2.out"},2.35);
    window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
    tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initChrysalis05);
    else initChrysalis05();
  </script>
</body>
</html>
