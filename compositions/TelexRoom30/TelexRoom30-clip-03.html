<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>TelexRoom30 Clip 03 — Tape</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="compositions/TelexRoom30/telexroom30-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1510; color: #EDE6D9; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #root-inner { position: absolute; inset: 0; }
    #depth-stage { position: absolute; inset: 0; perspective: 1000px; transform-style: preserve-3d; }
    .z-bg, .z-mg, .z-fg { position: absolute; inset: 0; transform-style: preserve-3d; }
    .z-bg { transform: translateZ(-300px) scale(1.55); background: radial-gradient(ellipse 85% 50% at 50% 45%, rgba(30,77,58,0.12), #1a1510 70%); }
    .z-mg { transform: translateZ(0); }
    .z-fg { transform: translateZ(90px) scale(0.95); pointer-events: none; }
    #tape-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .footer-cap {
      position: absolute; left: 72px; right: 72px; bottom: 120px;
      font-family: 'Inter', sans-serif; font-size: 14px; color: rgba(237,230,217,0.55);
      letter-spacing: 0.06em;
    }
    #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.48) 100%); z-index: 90; pointer-events: none; }
    #grain { position: absolute; inset: 0; z-index: 100; opacity: 0.2; mix-blend-mode: overlay; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="TelexRoom30-clip-03" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="root-inner">
      <div id="depth-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1"></div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="2">
          <canvas id="tape-canvas" class="clip" data-start="0" data-duration="5" data-track-index="3" width="1080" height="1920"></canvas>
          <div class="footer-cap clip" data-start="0" data-duration="5" data-track-index="4">PHYSICAL AUDIT TRAIL</div>
        </div>
        <div class="z-fg clip" data-start="0" data-duration="5" data-track-index="5"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="6"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="7" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const CID = "TelexRoom30-clip-03";
    const D = 5;
    const M = window.TelexEngine;
    M.registerEases(gsap);
    const tl = gsap.timeline({ paused: true });
    M.initFilmGrain(document.getElementById("grain"), 0.2, 5031);
    tl.fromTo("#depth-stage", { scale: 1 }, { scale: 1.02, duration: D, ease: "none" }, 0);
    tl.fromTo("#depth-stage", { x: -12 }, { x: 12, duration: D, ease: "sine.inOut" }, 0);
    const tc = document.getElementById("tape-canvas");
    window.addEventListener("hf-seek", (e) => {
      const t = e.detail.time;
      tl.seek(t);
      const p = Math.min(1, t / 4.5);
      if (tc) M.drawTapeCurl(tc, p, t);
    });
    if (tc) M.drawTapeCurl(tc, 0, 0);
    tl.seek(0);
    window.__timelines[CID] = tl;
  </script>
</body>
</html>
