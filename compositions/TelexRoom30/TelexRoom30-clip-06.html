<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>TelexRoom30 Clip 06 — Payoff</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="compositions/TelexRoom30/telexroom30-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1510; color: #EDE6D9; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #root-inner { position: absolute; inset: 0; }
    #depth-stage { position: absolute; inset: 0; perspective: 1000px; transform-style: preserve-3d; }
    .z-bg, .z-mg, .z-fg { position: absolute; inset: 0; transform-style: preserve-3d; }
    .z-bg { transform: translateZ(-400px) scale(1.75); }
    .z-mg { transform: translateZ(0); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 160px 64px; text-align: center; }
    .z-fg { transform: translateZ(140px) scale(0.9); pointer-events: none; }
    #halo-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    .hero-line { font-family: 'Oswald', sans-serif; font-size: 56px; font-weight: 700; letter-spacing: 0.04em; color: #EDE6D9; text-shadow: 0 4px 24px rgba(0,0,0,0.45); max-width: 900px; line-height: 1.12; }
    .sub-line { margin-top: 28px; font-family: 'Courier Prime', monospace; font-size: 17px; letter-spacing: 0.14em; color: rgba(237,230,217,0.72); }
    .pilot-dot {
      margin-top: 48px; width: 14px; height: 14px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff4e0, #D4A574 55%, #6a4a22 100%);
      box-shadow: 0 0 28px rgba(212,165,116,0.65);
    }
    #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.58) 100%); z-index: 90; pointer-events: none; }
    #grain { position: absolute; inset: 0; z-index: 100; opacity: 0.21; mix-blend-mode: overlay; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="TelexRoom30-clip-06" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="root-inner">
      <div id="depth-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1">
          <canvas id="halo-canvas" width="1080" height="1920"></canvas>
        </div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="2">
          <div class="hero-line clip" data-start="0" data-duration="5" data-track-index="3" id="hero-line">THE LINE STAYS LIVE</div>
          <div class="sub-line clip" data-start="0" data-duration="5" data-track-index="4" id="sub-line">1973 SHIFT LOG — CLASS B</div>
          <div class="pilot-dot clip" data-start="0" data-duration="5" data-track-index="5" id="pilot-dot"></div>
        </div>
        <div class="z-fg clip" data-start="0" data-duration="5" data-track-index="6"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="7"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="8" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const CID = "TelexRoom30-clip-06";
    const D = 5;
    const M = window.TelexEngine;
    M.registerEases(gsap);
    const tl = gsap.timeline({ paused: true });
    M.initFilmGrain(document.getElementById("grain"), 0.21, 5061);
    gsap.set("#hero-line", { opacity: 0, y: 24 });
    gsap.set("#sub-line", { opacity: 0 });
    gsap.set("#pilot-dot", { opacity: 0.35, scale: 0.9 });
    tl.to("#depth-stage", { scale: 1.045, duration: D, ease: "none" }, 0);
    tl.to("#hero-line", { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }, 0.35);
    tl.to("#sub-line", { opacity: 1, duration: 0.8, ease: "power2.out" }, 1.1);
    tl.to("#pilot-dot", { opacity: 1, scale: 1, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.4);
    tl.to("#vignette", { opacity: 0.88, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);
    const hal = document.getElementById("halo-canvas");
    window.addEventListener("hf-seek", (e) => {
      const t = e.detail.time;
      tl.seek(t);
      const p = Math.min(1, t / 4.8);
      if (hal) M.drawAmberHalo(hal, p, t);
    });
    if (hal) M.drawAmberHalo(hal, 0, 0);
    tl.seek(0);
    window.__timelines[CID] = tl;
  </script>
</body>
</html>
