<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>TelexRoom30 Clip 02 — Rotor</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="compositions/TelexRoom30/telexroom30-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1510; color: #EDE6D9; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #root-inner { position: absolute; inset: 0; }
    #depth-stage { position: absolute; inset: 0; perspective: 1100px; transform-style: preserve-3d; }
    .z-bg, .z-mg, .z-fg { position: absolute; inset: 0; transform-style: preserve-3d; }
    .z-bg { transform: translateZ(-420px) scale(1.7); background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(139,105,20,0.08), #1a1510 75%); }
    .z-mg { transform: translateZ(0); display: flex; align-items: center; justify-content: center; padding: 100px 48px; }
    .z-fg { transform: translateZ(120px) scale(0.92); pointer-events: none; }
    #rotor-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    .bezel {
      position: relative; width: 100%; max-width: 920px; padding: 28px 24px 40px;
      background: linear-gradient(165deg, rgba(45,36,28,0.95), rgba(26,21,16,0.98));
      border: 1px solid rgba(212,165,116,0.25);
      box-shadow: 0 18px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .bezel-cap { font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.22em; color: #D4A574; margin-bottom: 16px; }
    #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.5) 100%); z-index: 90; pointer-events: none; }
    #grain { position: absolute; inset: 0; z-index: 100; opacity: 0.19; mix-blend-mode: overlay; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="TelexRoom30-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="root-inner">
      <div id="depth-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1">
          <canvas id="rotor-canvas" width="1080" height="1920"></canvas>
        </div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="2">
          <div class="bezel clip" data-start="0" data-duration="5" data-track-index="3" id="bezel">
            <div class="bezel-cap clip" data-start="0" data-duration="5" data-track-index="4">INSTRUMENT // DRUM HOUSING</div>
          </div>
        </div>
        <div class="z-fg clip" data-start="0" data-duration="5" data-track-index="5"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="6"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="7" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const CID = "TelexRoom30-clip-02";
    const D = 5;
    const M = window.TelexEngine;
    M.registerEases(gsap);
    const tl = gsap.timeline({ paused: true });
    M.initFilmGrain(document.getElementById("grain"), 0.19, 5021);
    gsap.set("#depth-stage", { scale: 0.96 });
    gsap.set("#bezel", { rotateY: -6, opacity: 0.85 });
    tl.to("#depth-stage", { scale: 1.04, duration: D, ease: "none" }, 0);
    tl.to(".z-bg", { rotateY: 1.8, duration: D, ease: "sine.inOut" }, 0);
    tl.to(".z-mg", { rotateY: -2.2, z: 40, duration: D, ease: "sine.inOut" }, 0);
    tl.to("#bezel", { rotateY: 0, opacity: 1, duration: 1.2, ease: "power2.out" }, 0.1);
    const cv = document.getElementById("rotor-canvas");
    window.addEventListener("hf-seek", (e) => {
      const t = e.detail.time;
      tl.seek(t);
      const p = Math.min(1, t / 4.2);
      if (cv) M.drawRotorDrum(cv, p, t);
    });
    if (cv) M.drawRotorDrum(cv, 0, 0);
    tl.seek(0);
    window.__timelines[CID] = tl;
  </script>
</body>
</html>
