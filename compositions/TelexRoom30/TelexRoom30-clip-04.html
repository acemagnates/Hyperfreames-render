<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>TelexRoom30 Clip 04 — Routing slip</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="compositions/TelexRoom30/telexroom30-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1510; color: #EDE6D9; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #root-inner { position: absolute; inset: 0; }
    #depth-stage { position: absolute; inset: 0; perspective: 1050px; transform-style: preserve-3d; }
    .z-bg, .z-mg, .z-fg { position: absolute; inset: 0; transform-style: preserve-3d; }
    .z-bg { transform: translateZ(-340px) scale(1.6); background: #1a1510; }
    .z-mg { transform: translateZ(0); }
    .z-fg { transform: translateZ(80px); pointer-events: none; }
    #form-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.52) 100%); z-index: 90; pointer-events: none; }
    #grain { position: absolute; inset: 0; z-index: 100; opacity: 0.2; mix-blend-mode: overlay; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="TelexRoom30-clip-04" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="root-inner">
      <div id="depth-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1"></div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="2">
          <canvas id="form-canvas" class="clip" data-start="0" data-duration="5" data-track-index="3" width="1080" height="1920"></canvas>
        </div>
        <div class="z-fg clip" data-start="0" data-duration="5" data-track-index="4"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="5"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="6" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const CID = "TelexRoom30-clip-04";
    const D = 5;
    const M = window.TelexEngine;
    M.registerEases(gsap);
    const tl = gsap.timeline({ paused: true });
    M.initFilmGrain(document.getElementById("grain"), 0.2, 5041);
    gsap.set("#depth-stage", { rotateZ: -3, scale: 0.98 });
    tl.to("#depth-stage", { rotateZ: 0, scale: 1.03, duration: D, ease: "power1.inOut" }, 0);
    tl.to(".z-mg", { z: 30, duration: D, ease: "sine.inOut" }, 0);
    M.screenShake(tl, "#root-inner", 3.15, 0.85);
    const fc = document.getElementById("form-canvas");
    window.addEventListener("hf-seek", (e) => {
      const t = e.detail.time;
      tl.seek(t);
      const p = Math.min(1, t / 4.9);
      if (fc) M.drawRouteForm(fc, p, t);
    });
    if (fc) M.drawRouteForm(fc, 0, 0);
    tl.seek(0);
    window.__timelines[CID] = tl;
  </script>
</body>
</html>
