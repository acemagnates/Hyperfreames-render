<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 02 — Macro Cold (V2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;--accent-rgb:230,0,18}
    .solid-bg{position:absolute;inset:0;background:#0a0204;z-index:0}
    #macro{position:absolute;inset:0;overflow:hidden}
    .plate-base,.matte-reveal{position:absolute;inset:-8%;overflow:hidden}
    .plate-base img,.matte-reveal img{width:100%;height:100%;object-fit:cover;display:block}
    .matte-reveal{clip-path:inset(100% 0 0 0);will-change:clip-path;z-index:2}
    .kenburns{position:absolute;inset:-10%;will-change:transform}
    .spec-sweep{position:absolute;inset:0;z-index:10;background:linear-gradient(105deg,transparent 28%,rgba(200,235,255,0.22) 48%,rgba(255,255,255,0.12) 52%,transparent 68%);mix-blend-mode:screen;opacity:0;transform:translateX(-120%)}
    .rim{position:absolute;inset:0;z-index:5;background:linear-gradient(165deg,rgba(180,220,255,0.08),transparent 40%,rgba(244,0,9,0.06));mix-blend-mode:screen;opacity:0.35}
    .tag{position:absolute;bottom:140px;left:64px;z-index:20;font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:0.35em;color:rgba(220,240,255,0.75)}
    #vig{position:absolute;inset:0;z-index:15;background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,0.68) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:20;mix-blend-mode:overlay;opacity:0.22;pointer-events:none;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="5" data-track-index="0"></div>
    <div id="macro" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="kenburns grade-target clip" data-start="0" data-duration="5" data-track-index="2" id="kb">
        <div class="plate-base clip" data-start="0" data-duration="5" data-track-index="3">
          <img id="img-base" class="clip" data-start="0" data-duration="5" data-track-index="4" src="../../assets/CocaCola40/plates/v2/02-ice-condensation-glass.jpeg" alt="" />
        </div>
        <div class="matte-reveal clip" data-start="0" data-duration="5" data-track-index="5" id="matte">
          <img id="img-reveal" class="clip" data-start="0" data-duration="5" data-track-index="6" src="../../assets/CocaCola40/plates/v2/02b-cola-ice-closeup-marco-verch.jpeg" alt="" />
        </div>
      </div>
      <div class="rim clip" data-start="0" data-duration="5" data-track-index="7"></div>
      <div class="spec-sweep clip" data-start="0" data-duration="5" data-track-index="8"></div>
      <div class="tag clip" data-start="0" data-duration="5" data-track-index="9">MACRO · COLD</div>
    </div>
    <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="10"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="11" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init02(){
      const CID="CocaCola40-clip-02",D=5,C=window.CocaCola40;
      if(!C)return;
      C.setAccentRgb(document.getElementById("root"));
      C.registerEases(gsap);
      const tl=C.makeTimeline(CID);
      const crush=C.applyCrushGrade(document.getElementById("kb"));
      C.wireCrushGrade(tl,crush,D,0.15,{to:{contrast:1.18,saturate:1.22,brightness:1.0},duration:2.2});
      const matte=C.createMatteReveal("#matte");
      matte.reveal.pct=100;
      matte.paint();
      tl.fromTo(matte.reveal,{pct:100},{pct:0,duration:1.4,ease:"power3.inOut",onUpdate:matte.paint},0.35);
      gsap.set(".tag",{opacity:0,x:-36});
      gsap.set("#kb",{scale:1.18});
      tl.to("#kb",{scale:1.05,duration:4.2,ease:"sine.inOut"},0.25);
      tl.fromTo(".spec-sweep",{xPercent:-120,opacity:0},{xPercent:120,opacity:0.38,duration:0.95,ease:"power2.inOut"},0.85);
      tl.to(".tag",{opacity:1,x:0,duration:0.65,ease:"back.out(1.7)"},1.15);
      C.sineBreathe(tl,"#kb",D,{delay:1.8,scaleAmp:0.006,yAmp:3});
      tl.to(".spec-sweep",{opacity:0.15,duration:0.5,ease:"power2.in"},4.2);
      tl.to("#macro",{scale:1.04,duration:0.55,ease:"expo.in"},4.35);
      const g=document.getElementById("grain");
      if(g)C.initGrain(g,0.22,402);
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init02);
    else init02();
  </script>
</body>
</html>
