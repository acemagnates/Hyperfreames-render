<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 02 — Macro Cold</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0c10}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;--accent-rgb:230,0,18}
    .solid-bg{position:absolute;inset:0;background:#0e0c10;z-index:0}
    #macro{position:absolute;inset:0;overflow:hidden}
    .plate-base,.matte-reveal{position:absolute;inset:-8%;overflow:hidden}
    .plate-base img,.matte-reveal img{width:100%;height:100%;object-fit:cover;display:block}
    .matte-reveal{clip-path:inset(100% 0 0 0);will-change:clip-path;z-index:3}
    .kenburns{position:absolute;inset:-10%;will-change:transform}
    .z-light{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0.09;background:radial-gradient(ellipse 55% 50% at 40% 30%,rgba(200,230,255,0.2),transparent 62%)}
    .z-fg{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:overlay;opacity:0.05}
    .z-fg span{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.5em;color:rgba(237,230,223,0.18);position:absolute;right:48px;top:160px}
    .spec-sweep{position:absolute;inset:0;z-index:10;background:linear-gradient(105deg,transparent 28%,rgba(200,235,255,0.22) 48%,rgba(255,255,255,0.12) 52%,transparent 68%);mix-blend-mode:screen;opacity:0;transform:translateX(-120%)}
    .rim{position:absolute;inset:0;z-index:5;background:linear-gradient(165deg,rgba(180,220,255,0.08),transparent 40%,rgba(244,0,9,0.07));mix-blend-mode:screen;opacity:0.32}
    .tag{position:absolute;bottom:140px;left:56px;z-index:20;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:0.42em;color:rgba(220,240,255,0.78)}
    #vig{position:absolute;inset:0;z-index:15;background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,0.7) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:22;mix-blend-mode:overlay;opacity:0.2;pointer-events:none;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="5" data-track-index="0"></div>
    <div id="macro" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="kenburns grade-target clip" data-start="0" data-duration="5" data-track-index="2" id="kb">
        <div class="plate-base clip" data-start="0" data-duration="5" data-track-index="3">
          <img id="img-base" class="clip" data-start="0" data-duration="5" data-track-index="4" src="../../assets/CocaCola40/plates/v2/02-ice-condensation-glass.jpeg" alt="" />
        </div>
        <div class="matte-reveal clip" data-start="0" data-duration="5" data-track-index="5" id="matte">
          <img id="img-reveal" class="clip" data-start="0" data-duration="5" data-track-index="6" src="../../assets/CocaCola40/plates/v2/02b-cola-ice-closeup-marco-verch.jpeg" alt="" />
        </div>
        <div class="z-light clip" data-decorative="ambient" data-start="0" data-duration="5" data-track-index="12"></div>
        <div class="z-fg clip" data-decorative="ambient" data-start="0" data-duration="5" data-track-index="13"><span aria-hidden="true">ICE INDEX</span></div>
      </div>
      <div class="rim clip" data-start="0" data-duration="5" data-track-index="7"></div>
      <div class="spec-sweep clip" data-start="0" data-duration="5" data-track-index="8"></div>
      <div class="tag clip" data-start="0" data-duration="5" data-track-index="9">MACRO · COLD</div>
    </div>
    <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="10"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="11" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    function init02() {
      var CID = "CocaCola40-clip-02", D = 5, C = window.CocaCola40;
      if (!C) return;
      C.setAccentRgb(document.getElementById("root"));
      C.registerEases(gsap);
      var tl = C.makeTimeline(CID);
      C.ambientDecorativePulse(gsap, tl, "[data-decorative=ambient]", { at: 0.14 });
      var crush = C.applyCrushGrade(document.getElementById("kb"));
      C.wireCrushGrade(tl, crush, D, 0.15, { to: { contrast: 1.18, saturate: 1.22, brightness: 1.0 }, duration: 2.2 });
      var matte = C.createMatteReveal("#matte");
      matte.reveal.pct = 100;
      matte.paint();
      tl.fromTo(matte.reveal, { pct: 100 }, { pct: 0, duration: 1.35, ease: "power3.inOut", onUpdate: matte.paint }, 0.32);
      gsap.set(".tag", { autoAlpha: 0, x: -28 });
      gsap.set("#kb", { scale: 1.16 });
      tl.to("#kb", { scale: 1.04, duration: 4.0, ease: "sine.inOut" }, 0.24);
      tl.fromTo(".spec-sweep", { xPercent: -120, autoAlpha: 0 }, { xPercent: 118, autoAlpha: 0.4, duration: 0.9, ease: "power3.inOut" }, 0.82);
      tl.to(".tag", { autoAlpha: 1, x: 0, duration: 0.62, ease: "back.out(1.6)" }, 1.08);
      C.sineBreathe(tl, "#kb", D, { delay: 1.7, scaleAmp: 0.006, yAmp: 3, scalePeriod: 2.2 });
      tl.to(".spec-sweep", { autoAlpha: 0.12, duration: 0.48, ease: "power3.in" }, 4.1);
      tl.to("#macro", { scale: 1.035, duration: 0.52, ease: "expo.in" }, 4.28);
      var g = document.getElementById("grain");
      if (g) C.initGrain(g, 0.2, 502);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init02);
    else init02();
  </script>
</body>
</html>
