<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 02 — Macro</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    .plate{position:absolute;inset:-15%;background:url('../../assets/CocaCola40/plates/ice-abstract.jpg') center/cover;filter:saturate(0.9) contrast(1.15) brightness(0.55) hue-rotate(-8deg)}
    .rim{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(180,220,255,0.15) 48%,transparent 62%);mix-blend-mode:screen;opacity:0}
    .droplet{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(200,230,255,0.5) 40%,transparent 70%);box-shadow:0 0 12px rgba(200,240,255,0.4)}
    .tag{position:absolute;bottom:140px;left:64px;font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:0.35em;color:rgba(220,240,255,0.75)}
    #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,0.65) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:0.22;pointer-events:none}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="macro" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="plate clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div class="rim clip" data-start="0" data-duration="5" data-track-index="2"></div>
      <div id="drops" class="clip" data-start="0" data-duration="5" data-track-index="3"></div>
      <div class="tag clip" data-start="0" data-duration="5" data-track-index="4">MACRO · 01</div>
      <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="5"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="6" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init02(){
      const CID="CocaCola40-clip-02",C=window.CocaCola40;
      if(!C)return;
      const drops=document.getElementById("drops");
      if(!drops)return;
      C.spawnDroplets(drops,22,202);
      const tl=gsap.timeline({paused:true});
      gsap.set(".droplet",{scale:0,opacity:0});
      gsap.set(".tag",{opacity:0,x:-30});
      gsap.set(".plate",{scale:1.45});
      tl.to(".plate",{scale:1.22,duration:4.5,ease:"none"},0.2);
      tl.to(".rim",{opacity:1,x:"100%",duration:2.2,ease:"sine.inOut"},0.4);
      tl.to(".droplet",{scale:1,opacity:1,duration:0.28,stagger:{each:0.04,from:"random"},ease:"back.out(2.5)"},0.35);
      tl.to(".tag",{opacity:1,x:0,duration:0.7,ease:"power2.out"},1.2);
      tl.to(".rim",{opacity:0.4,duration:0.6},3.8);
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.22,402);
      C.addHandheld("#macro",gsap,402,{x:3,y:5});
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init02);
    else init02();
  </script>
</body>
</html>
