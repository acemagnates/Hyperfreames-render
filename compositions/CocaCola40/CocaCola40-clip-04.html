<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 04 — Hero</title>
  <link rel="icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="compositions/_shared/coke-GLTFLoader-bundle.js"></script>
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <script src="compositions/CocaCola40/cocacola40-three-hero.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0c10}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;--accent-rgb:230,0,18}
    .solid-bg{position:absolute;inset:0;background:#0e0c10;z-index:-1}
    .hero-comp{position:absolute;inset:0;z-index:0}
    .hero-comp .z-light{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0.08;background:radial-gradient(ellipse 58% 48% at 50% 28%,rgba(255,220,200,0.22),transparent 58%)}
    .hero-comp .z-fg{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:soft-light;opacity:0.05}
    .hero-comp .z-fg span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.48em;color:rgba(237,230,223,0.16);position:absolute;left:44px;top:132px}
    #hero-plate{
      position:absolute;inset:-12%;
      width:124%;height:124%;
      object-fit:cover;
      object-position:center 42%;
      opacity:0.32;
      transform-origin:50% 55%;
      will-change:transform;
      pointer-events:none;
      z-index:0;
    }
    .hero-comp.is-fallback #hero-plate{opacity:1}
    .hero-comp.is-fallback #canvas3d{opacity:0;visibility:hidden}
    #canvas3d{position:absolute;inset:0;z-index:1;display:block}
    .lens-flare-container{
      position:absolute;inset:0;z-index:3;
      pointer-events:none;overflow:hidden;
      mix-blend-mode:screen;
    }
    .flare-core{
      position:absolute;top:36%;width:140px;height:140px;
      margin-left:-70px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,220,180,0.95) 0%,rgba(230,0,18,0.55) 35%,transparent 72%);
      opacity:0;will-change:left,opacity;
    }
    .flare-streak{
      position:absolute;width:250%;height:6px;left:-75%;top:42%;
      background:linear-gradient(90deg,transparent 0%,
        rgba(230,0,18,0.05) 20%,
        rgba(230,0,18,0.75) 50%,
        rgba(230,0,18,0.05) 80%,transparent 100%);
      transform:translateY(-50%) rotate(-3deg);
      opacity:0;will-change:left,opacity;
    }
    #vig{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,0.72) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:5;mix-blend-mode:overlay;opacity:0.2;pointer-events:none}
    #cap{position:absolute;bottom:110px;width:100%;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.42em;color:rgba(220,235,255,0.72);z-index:6}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-04" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="8" data-track-index="0"></div>
    <div class="hero-comp grade-target clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="z-light clip" data-decorative="ambient" data-start="0" data-duration="8" data-track-index="20"></div>
      <div class="z-fg clip" data-decorative="ambient" data-start="0" data-duration="8" data-track-index="21"><span aria-hidden="true">HERO BUS</span></div>
      <img
        id="hero-plate"
        class="clip"
        src="../../assets/CocaCola40/plates/v2/04-hero-glass-coca-cola.png"
        alt=""
        data-start="0"
        data-duration="8"
        data-track-index="2"
      />
      <canvas id="canvas3d" class="clip" data-start="0" data-duration="8" data-track-index="3" width="1080" height="1920"></canvas>
    </div>
    <div class="lens-flare-container">
      <div class="flare-core clip" data-start="0" data-duration="8" data-track-index="28"></div>
      <div class="flare-streak clip" data-start="0" data-duration="8" data-track-index="29"></div>
    </div>
    <div id="vig" class="clip" data-start="0" data-duration="8" data-track-index="4"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="8" data-track-index="5" width="540" height="960"></canvas>
    <div id="cap" class="clip" data-start="0" data-duration="8" data-track-index="6">HERO GLASS</div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    function init04() {
      const CID = "CocaCola40-clip-04";
      const D = 8;
      const C = window.CocaCola40;
      const H = window.CocaCola40ThreeHero;
      if (!C || !H) return;
      if (window.CokeGLTFLoaderPack && window.THREE && !THREE.GLTFLoader) {
        THREE.GLTFLoader = CokeGLTFLoaderPack.GLTFLoader;
      }

      C.setAccentRgb(document.getElementById("root"));
      C.registerEases(gsap);
      const tl = C.makeTimeline(CID);
      C.ambientDecorativePulse(gsap, tl, "[data-decorative=ambient]", { at: 0.12 });
      const heroComp = document.querySelector(".hero-comp");
      const plate = document.getElementById("hero-plate");
      const canvas = document.getElementById("canvas3d");

      gsap.set("#cap", { autoAlpha: 0, y: 10 });
      tl.to("#cap", { autoAlpha: 1, y: 0, duration: 0.85, ease: "expo.out" }, 1.45);

      gsap.set("#hero-plate", { scale: 1.1, xPercent: -3, yPercent: 0 });
      tl.to("#hero-plate", { scale: 1.22, xPercent: 4, yPercent: -2, duration: D, ease: "none" }, 0.15);

      C.wireOpticalFlare(tl, ".flare-core", ".flare-streak", D, 0.3);

      const crush = C.applyCrushGrade(".grade-target");
      C.wireCrushGrade(tl, crush, D, 0.1, { duration: 2.0, ease: "power3.inOut" });
      C.sineBreathe(tl, "#hero-plate", D, { delay: 1.4, scaleAmp: 0.012, scalePeriod: 2.6 });

      const g = document.getElementById("grain");
      if (g) C.initGrain(g, 0.2, 404);

      const state = H.initHeroScene(canvas);
      if (!state) return;

      let useFallback = !C.isWebGLAvailable();
      function setFallback(on) {
        useFallback = on;
        if (heroComp) heroComp.classList.toggle("is-fallback", on);
        if (plate) plate.style.opacity = on ? "1" : "0.32";
      }
      if (useFallback) setFallback(true);

      function renderHero(t) {
        if (useFallback || !state.glbReady) return;
        H.frameHero(state, t / D);
      }

      window.addEventListener("hf-seek", function (e) {
        renderHero(e.detail.time);
      });

      H.loadBottle(state.scene, "../../assets/CocaCola40/models/bottle.glb", function (bottle, ok) {
        if (ok && bottle) {
          state.bottle = bottle;
          state.glbReady = true;
          setFallback(false);
          renderHero(window.__hfThreeTime || 0);
        } else {
          setFallback(true);
        }
      });

      renderHero(0);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init04);
    } else {
      init04();
    }
  </script>
</body>
</html>
