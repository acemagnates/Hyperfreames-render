<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 04 — Hero</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d{position:absolute;inset:0;z-index:1}
    #vig{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,0.7) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:5;mix-blend-mode:overlay;opacity:0.2;pointer-events:none}
    #cap{position:absolute;bottom:110px;width:100%;text-align:center;font-family:Georgia,serif;font-size:18px;letter-spacing:0.4em;color:rgba(255,210,190,0.65);z-index:6}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-04" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="8" data-track-index="0"></canvas>
    <div id="vig" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="8" data-track-index="2" width="540" height="960"></canvas>
    <div id="cap" class="clip" data-start="0" data-duration="8" data-track-index="3">HERO GLASS</div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init04(){
      const CID="CocaCola40-clip-04",D=8,C=window.CocaCola40;
      if(!C)return;
      const tl=gsap.timeline({paused:true});
      gsap.set("#cap",{opacity:0});
      tl.to("#cap",{opacity:0.85,duration:1,ease:"power2.out"},1.5);
      const g=document.getElementById("grain");
      if(g)C.initGrain(g,0.2,404);
      const renderer=C.createRenderer(document.getElementById("canvas3d"));
      const {scene,camera}=C.createScene();
      C.addColaLights(scene);
      C.addReflectiveFloor(scene);
      const bottle=C.createBottle();
      if(bottle)scene.add(bottle);
      let rise=0;
      function frame(p){
        rise=Math.min(1,p*1.35);
        if(bottle){
          bottle.rotation.y=p*0.45;
          bottle.position.y=-3.2+(1-rise)*4.5;
          bottle.scale.setScalar(0.85+rise*0.2);
        }
        C.orbitBottle(camera,p);
        const base=0.85+rise*0.2;
        const breathe=1+Math.sin(p*Math.PI*4)*0.012;
        if(bottle)bottle.scale.set(base*breathe,base*breathe,base*breathe);
        if(renderer.render)renderer.render(scene,camera);
      }
      window.addEventListener("hf-seek",e=>{
        const t=e.detail.time;
        tl.seek(t);
        frame(t/D);
      });
      frame(0);tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init04);
    else init04();
  </script>
</body>
</html>
