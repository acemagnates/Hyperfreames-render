<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 06 — Lock (V2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;--accent-rgb:230,0,18}
    .solid-bg{position:absolute;inset:0;background:#0a0204;z-index:0}
    #finale{position:absolute;inset:0;overflow:hidden}
    .plate-ken{position:absolute;inset:-10%;will-change:transform}
    .plate-ken img{width:100%;height:100%;object-fit:cover;display:block}
    .leak-hit{position:absolute;inset:-20%;z-index:40;pointer-events:none;mix-blend-mode:screen;opacity:0;background:linear-gradient(118deg,transparent 30%,rgba(var(--accent-rgb),0.5) 48%,rgba(255,180,80,0.3) 52%,transparent 70%);transform:translateX(-40%) rotate(-8deg)}
    .flare-streak-burst{position:absolute;width:250%;height:8px;left:-80%;top:44%;z-index:35;mix-blend-mode:screen;background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),0.8),transparent);opacity:0;transform:rotate(-4deg)}
    #spark{position:absolute;inset:0;z-index:30;pointer-events:none}
    .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 14px #ffd0c0}
    .lockup{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;z-index:50}
    .wave{font-size:0;width:520px;height:120px;margin:0 auto 28px;display:block}
    .wave path{fill:none;stroke:#f40009;stroke-width:14;stroke-linecap:round}
    .logo-stack{position:relative;display:inline-block}
    .logo-stack .ch{position:absolute;left:0;right:0;font-family:'Oswald',sans-serif;font-size:88px;font-weight:700;letter-spacing:0.06em;line-height:1.1}
    .ch-r{color:#ff2a2a;mix-blend-mode:screen}
    .ch-g{color:#2aff9a;mix-blend-mode:screen;opacity:0.75}
    .ch-b{color:#fff;position:relative;text-shadow:0 12px 48px rgba(244,0,9,0.55)}
    .logo-glow{position:absolute;inset:-20%;background:radial-gradient(circle,rgba(244,0,9,0.35),transparent 65%);opacity:0;z-index:-1}
    .sub{font-family:'Oswald',sans-serif;font-size:28px;letter-spacing:0.45em;color:rgba(255,200,190,0.7);margin-top:20px}
    #vig{position:absolute;inset:0;z-index:20;background:radial-gradient(ellipse at center,transparent 14%,rgba(0,0,0,0.78) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:25;mix-blend-mode:overlay;opacity:0.22;pointer-events:none;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-06" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="8" data-track-index="0"></div>
    <div id="finale" class="clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="plate-ken grade-target clip" data-start="0" data-duration="8" data-track-index="2" id="kb">
        <img id="img-fizz" class="clip" data-start="0" data-duration="8" data-track-index="3" src="../../assets/CocaCola40/plates/v2/06-carbonation-foam-bubbles.jpeg" alt="" />
      </div>
      <div class="flare-streak-burst clip" data-start="0" data-duration="8" data-track-index="4" id="flare-burst"></div>
      <div class="leak-hit clip" data-start="0" data-duration="8" data-track-index="5" id="leak-hit"></div>
      <div id="spark" class="clip" data-start="0" data-duration="8" data-track-index="6"></div>
      <div class="lockup clip" data-start="0" data-duration="8" data-track-index="7" id="lockup">
        <svg class="wave clip" data-start="0" data-duration="8" data-track-index="8" viewBox="0 0 520 120"><path id="wave-path" d="M20,60 C120,20 220,100 320,60 S480,40 500,60"/></svg>
        <div class="logo-glow" id="logo-glow"></div>
        <h1 class="logo-stack clip" data-start="0" data-duration="8" data-track-index="9" id="logo-stack">
          <span class="ch ch-r" aria-hidden="true">REAL MAGIC</span>
          <span class="ch ch-g" aria-hidden="true">REAL MAGIC</span>
          <span class="ch ch-b logo-lock">REAL MAGIC</span>
        </h1>
        <div class="sub clip" data-start="0" data-duration="8" data-track-index="10">OPEN HAPPINESS</div>
      </div>
    </div>
    <div id="vig" class="clip" data-start="0" data-duration="8" data-track-index="11"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="8" data-track-index="12" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init06(){
      const CID="CocaCola40-clip-06",D=8,C=window.CocaCola40;
      if(!C)return;
      C.setAccentRgb(document.getElementById("root"));
      C.registerEases(gsap);
      const spark=document.getElementById("spark");
      const sparks=C.spawnSparkles(spark,48,606);
      const path=document.getElementById("wave-path");
      const len=path?path.getTotalLength():400;
      if(path){path.style.strokeDasharray=String(len);path.style.strokeDashoffset=String(len);}
      const tl=C.makeTimeline(CID);
      const crush=C.applyCrushGrade(document.getElementById("kb"));
      C.wireCrushGrade(tl,crush,D,0.1);
      gsap.set(".spark",{opacity:0,scale:0});
      gsap.set("#lockup",{opacity:0});
      gsap.set(".logo-stack .ch-r,.logo-stack .ch-g",{x:-10,opacity:0});
      gsap.set(".logo-lock",{scale:1.4,opacity:0});
      gsap.set(".sub",{opacity:0,y:12});
      gsap.set("#kb",{scale:1.1});
      tl.to("#kb",{scale:1.04,duration:5.5,ease:"sine.inOut"},0.2);
      tl.to(".spark",{opacity:1,scale:1,duration:0.35,stagger:{each:0.018,from:"random"},ease:"power2.out"},0.15);
      if(path)tl.to(path,{strokeDashoffset:0,duration:1.5,ease:"power2.inOut"},0.45);
      C.sineBreathe(tl,"#kb",D,{delay:0.8,scaleAmp:0.008,yAmp:4});
      C.chromaticSplit(document.getElementById("logo-stack"),tl,3.75);
      C.chromaticCollapse(document.getElementById("logo-stack"),tl,3.88);
      tl.fromTo(".logo-lock",{scale:1.35,opacity:0,rotation:-2},{scale:1,opacity:1,rotation:0,duration:0.55,ease:"back.out(2.2)"},4.0);
      tl.fromTo("#logo-glow",{scale:0.8,opacity:0},{scale:1.12,opacity:0.5,duration:0.35,ease:"power2.out"},4.0);
      tl.to(".logo-lock",{scale:1.02,duration:0.22,ease:"sine.inOut"},4.55);
      tl.to("#lockup",{opacity:1,duration:0.4,ease:"expo.out"},3.7);
      tl.fromTo("#flare-burst",{left:"-80%",opacity:0},{left:"-35%",opacity:0.95,duration:0.5,ease:"power4.out"},3.95);
      tl.to("#flare-burst",{opacity:0,duration:0.35,ease:"power2.in"},4.45);
      tl.fromTo("#leak-hit",{xPercent:-40,opacity:0},{xPercent:20,opacity:0.7,duration:0.4,ease:"sine.inOut"},3.92);
      tl.to("#leak-hit",{opacity:0,duration:0.25,ease:"power2.in"},4.32);
      tl.to(crush.grade,{contrast:1.32,saturate:1.5,brightness:1.04,duration:0.25,ease:"power4.out",onUpdate:crush.paint},3.95);
      tl.to(".sub",{opacity:1,y:0,duration:0.6,ease:"expo.out"},4.35);
      const g=document.getElementById("grain");
      if(g)C.initGrain(g,0.22,406);
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init06);
    else init06();
  </script>
</body>
</html>
