<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 05 — Red World</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;perspective:1000px;overflow:hidden}
    .bg{position:absolute;inset:-10%;background:url('../../assets/CocaCola40/plates/cosmic-red.jpg') center/cover;filter:saturate(1.4) brightness(0.45);transform:translateZ(-280px) scale(1.5)}
    .smoke{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 100%,rgba(244,0,9,0.45),transparent 55%);mix-blend-mode:screen}
    .bottle-silhouette{position:absolute;right:-40px;top:320px;width:380px;height:900px;opacity:0.35;filter:drop-shadow(0 0 60px rgba(244,0,9,0.5))}
    .line1{font-family:'Oswald',sans-serif;font-size:72px;font-weight:700;color:#fff;position:absolute;top:280px;left:56px;letter-spacing:0.08em;line-height:1.05}
    .line2{font-family:'Playfair Display',serif;font-style:italic;font-size:88px;color:#f40009;position:absolute;top:480px;left:56px;text-shadow:0 0 60px rgba(244,0,9,0.45)}
    .line1 span,.line2 .magic{display:inline-block}
    svg.bottle-silhouette path{fill:rgba(20,0,4,0.85);stroke:rgba(255,200,180,0.25);stroke-width:2}
    #grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:0.2;pointer-events:none}
    #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,0.68) 100%)}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-05" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
    <div id="rw" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <div class="bg clip" data-start="0" data-duration="8" data-track-index="1"></div>
      <div class="smoke clip" data-start="0" data-duration="8" data-track-index="2"></div>
      <svg class="bottle-silhouette clip" data-start="0" data-duration="8" data-track-index="3" viewBox="0 0 120 280" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 8 C72 8 78 18 76 32 L70 48 C68 58 82 62 88 78 L92 120 C94 150 88 200 82 240 C78 260 68 272 60 272 C52 272 42 260 38 240 C32 200 26 150 28 120 L32 78 C38 62 52 58 50 48 L44 32 C42 18 48 8 60 8 Z"/>
      </svg>
      <div class="line1 clip" data-start="0" data-duration="8" data-track-index="4" id="l1">TASTE THE</div>
      <div class="line2 clip" data-start="0" data-duration="8" data-track-index="5" id="l2"><span class="magic">MOMENT</span></div>
      <div id="vig" class="clip" data-start="0" data-duration="8" data-track-index="6"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="8" data-track-index="7" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init05(){
      const CID="CocaCola40-clip-05",C=window.CocaCola40;
      if(!C)return;
      const l1=document.getElementById("l1");
      if(!l1)return;
      l1.innerHTML="TASTE THE".split(" ").map(w=>'<span>'+w+'</span>').join(" ");
      const tl=gsap.timeline({paused:true});
      gsap.set(".line1 span",{opacity:0,y:80,rotateX:40});
      gsap.set(".magic",{opacity:0,scale:0.5});
      gsap.set(".bottle-silhouette",{opacity:0,x:120});
      gsap.set(".bg",{scale:1.12});
      tl.to(".line1 span",{opacity:1,y:0,rotateX:0,duration:0.75,stagger:0.12,ease:"power3.out"},0.4);
      tl.to(".magic",{opacity:1,scale:1,duration:0.9,ease:"elastic.out(0.65)"},1.1);
      tl.to(".bottle-silhouette",{opacity:0.4,x:0,duration:1.4,ease:"power2.out"},0.6);
      tl.to(".bg",{scale:1.02,duration:6,ease:"none"},0.5);
      tl.to("#rw",{rotateX:-2,y:-20,duration:5,ease:"sine.inOut"},2);
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.2,405);
      C.addHandheld("#rw",gsap,405,{x:5,y:8});
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init05);
    else init05();
  </script>
</body>
</html>
