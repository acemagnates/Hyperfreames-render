<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 01 — Void</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    .depth-stage{position:absolute;inset:0;perspective:1100px;transform-style:preserve-3d}
    .z-bg{position:absolute;inset:-8%;background:url('../../assets/CocaCola40/plates/cosmic-red.jpg') center/cover;transform:translateZ(-320px) scale(1.55);filter:saturate(1.2) brightness(0.35)}
    .z-light{position:absolute;inset:0;pointer-events:none}
    .ray{position:absolute;width:280%;height:420px;left:-90%;top:18%;background:linear-gradient(90deg,transparent,rgba(244,0,9,0.04),rgba(244,0,9,0.12),rgba(244,0,9,0.04),transparent);transform:rotate(-18deg);mix-blend-mode:screen}
    .pulse{position:absolute;inset:0;background:radial-gradient(ellipse 55% 40% at 50% 45%,rgba(244,0,9,0.35),transparent 70%);opacity:0}
    .z-mg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;transform:translateZ(0)}
    .whisper{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:42px;color:rgba(255,220,210,0.55);letter-spacing:0.12em}
    .cold{font-family:'Oswald',sans-serif;font-size:148px;font-weight:700;color:#fff;letter-spacing:0.28em;margin-top:24px;text-shadow:0 0 80px rgba(244,0,9,0.5)}
    .cold span{display:inline-block}
    .z-fg{position:absolute;inset:0;pointer-events:none}
    #vig{background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,0.72) 100%)}
    #grain{mix-blend-mode:overlay;opacity:0.2}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-01" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div id="stage" class="depth-stage clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div class="z-light clip" data-start="0" data-duration="5" data-track-index="2">
        <div class="ray clip" data-start="0" data-duration="5" data-track-index="3"></div>
        <div class="pulse clip" data-start="0" data-duration="5" data-track-index="4"></div>
      </div>
      <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="5">
        <div class="whisper clip" data-start="0" data-duration="5" data-track-index="6">something cold is coming</div>
        <div class="cold clip" data-start="0" data-duration="5" data-track-index="7" id="cold-word">COLD</div>
      </div>
      <div class="z-fg">
        <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="8"></div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="9" width="540" height="960"></canvas>
      </div>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init01(){
      const CID="CocaCola40-clip-01",C=window.CocaCola40;
      if(!C)return;
      C.registerEases(gsap);
      const cold=document.getElementById("cold-word");
      if(!cold)return;
      cold.innerHTML="COLD".split("").map(c=>'<span>'+c+'</span>').join("");
      const tl=gsap.timeline({paused:true});
      gsap.set(".whisper",{opacity:0,y:20});
      gsap.set(".cold span",{opacity:0,rotateX:88,y:60,transformOrigin:"50% 100%"});
      gsap.set(".pulse",{opacity:0});
      gsap.set(".ray",{opacity:0,x:-120});
      tl.to(".pulse",{opacity:0.55,duration:1.1,ease:"sine.inOut",repeat:3,yoyo:true},0.35);
      tl.to(".ray",{opacity:1,x:0,duration:1.4,ease:"expo.out"},0.25);
      tl.to(".whisper",{opacity:1,y:0,duration:1.2,ease:"power2.out"},0.45);
      tl.to(".cold span",{opacity:1,rotateX:0,y:0,duration:0.85,stagger:0.09,ease:"expo.out"},0.55);
      tl.to(".z-bg",{scale:1.08,duration:4.2,ease:"none"},0.3);
      tl.to("#stage",{scale:1.06,z:80,duration:0.9,ease:"power3.in"},4.1);
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.2,401);
      C.addHandheld("#stage",gsap,401,{x:4,y:6});
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init01);
    else init01();
  </script>
</body>
</html>
