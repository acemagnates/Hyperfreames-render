<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 03 — Pour (V2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;--accent-rgb:230,0,18}
    .solid-bg{position:absolute;inset:0;background:#0a0204;z-index:0}
    #pour-stage{position:absolute;inset:0;overflow:hidden}
    .pour-wrap{position:absolute;inset:-6%;clip-path:inset(100% 0 0 0);z-index:2;will-change:clip-path}
    .pour-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .pour-velocity{position:absolute;inset:-8%;z-index:3;pointer-events:none;overflow:hidden}
    .streak{position:absolute;inset:0;opacity:0;pointer-events:none}
    .streak img{width:100%;height:100%;object-fit:cover;opacity:0.55}
    .streak.core{z-index:4;opacity:1}
    .streak.core img{opacity:1}
    .impact-flash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay}
    .hit{font-family:'Oswald',sans-serif;position:absolute;left:56px;bottom:200px;z-index:25;font-size:88px;color:#fff;letter-spacing:0.22em;text-shadow:0 8px 40px rgba(244,0,9,0.55)}
    .grade-target{will-change:transform}
    #vig{position:absolute;inset:0;z-index:18;background:radial-gradient(ellipse 80% 55% at 50% 75%,transparent 20%,rgba(0,0,0,0.65) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:22;mix-blend-mode:overlay;opacity:0.18;pointer-events:none;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-03" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="6" data-track-index="0"></div>
    <div id="pour-stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
      <div class="grade-target kenburns clip" data-start="0" data-duration="6" data-track-index="2" id="kb">
        <div class="pour-wrap clip" data-start="0" data-duration="6" data-track-index="3" id="pour-wrap">
          <img id="img-pour" class="clip" data-start="0" data-duration="6" data-track-index="4" src="../../assets/CocaCola40/plates/v2/03c-cola-pour-into-glass-ice.jpeg" alt="" />
        </div>
        <div class="pour-velocity clip" data-start="0" data-duration="6" data-track-index="5" id="velocity">
          <div class="streak core"><img src="../../assets/CocaCola40/plates/v2/03-pour-liquid-splash.jpeg" alt="" /></div>
        </div>
      </div>
      <div class="impact-flash clip" data-start="0" data-duration="6" data-track-index="6" id="flash"></div>
      <div class="hit clip" data-start="0" data-duration="6" data-track-index="7">POUR</div>
    </div>
    <div id="vig" class="clip" data-start="0" data-duration="6" data-track-index="8"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="6" data-track-index="9" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init03(){
      const CID="CocaCola40-clip-03",D=6,C=window.CocaCola40;
      if(!C)return;
      C.setAccentRgb(document.getElementById("root"));
      C.registerEases(gsap);
      const vel=document.getElementById("velocity");
      const core=vel?vel.querySelector(".streak.core"):null;
      const tl=C.makeTimeline(CID);
      const crush=C.applyCrushGrade(document.getElementById("kb"));
      C.wireCrushGrade(tl,crush,D,0.08);
      const matte=C.createMatteReveal("#pour-wrap");
      C.wireMatteReveal(tl,matte);
      if(vel)C.velocityStreak(vel,C.PLATES.POUR_SPLASH,tl,{start:1.05,count:4,moveParent:false});
      gsap.set(".hit",{opacity:0,scale:0.72});
      gsap.set("#kb",{scale:1.08});
      if(core){
        tl.fromTo(core,{scale:0.65,opacity:0},{scale:1.12,opacity:1,duration:0.14,ease:"power4.out"},1.02);
        tl.to(core,{scale:1,opacity:0.55,duration:0.48,ease:"power2.in"},1.16);
      }
      tl.to(".hit",{opacity:1,scale:1,duration:0.38,ease:"back.out(2.5)"},0.95);
      tl.to("#pour-stage",{scale:1.06,duration:0.22,ease:"power4.inOut"},0.9);
      tl.to("#pour-stage",{scale:1,duration:1.6,ease:"sine.out"},1.2);
      C.sineBreathe(tl,"#kb",D,{delay:2.2,scaleAmp:0.01,yAmp:5});
      tl.to("#flash",{opacity:0.4,duration:0.07,ease:"power4.out"},1.08);
      tl.to("#flash",{opacity:0,duration:0.35,ease:"power2.in"},1.18);
      tl.to("#kb",{scale:1.04,duration:0.6,ease:"expo.in"},5.2);
      const g=document.getElementById("grain");
      if(g)C.initGrain(g,0.18,403);
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init03);
    else init03();
  </script>
</body>
</html>
