<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CocaCola40 Clip 03 — Pour</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/CocaCola40/cocacola40-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0204}
    #root{position:relative;width:1080px;height:1920px;perspective:900px;overflow:hidden}
    .void{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 80%,#3a0010,#0a0204 65%)}
    .pour-wrap{position:absolute;inset:-5%;clip-path:inset(100% 0 0 0)}
    .pour{position:absolute;inset:0;background:url('../../assets/CocaCola40/plates/cosmic-red.jpg') center 30%/cover;filter:saturate(1.8) contrast(1.2) brightness(0.85)}
    .flare{position:absolute;width:140%;height:80px;left:-20%;top:42%;background:linear-gradient(90deg,transparent,rgba(255,200,180,0.5),transparent);opacity:0;mix-blend-mode:screen;transform:rotate(-8deg)}
  #bubbles{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
    .bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,120,140,0.35));box-shadow:0 0 16px rgba(255,80,100,0.35);transform:translateZ(60px)}
    .hit{font-family:'Oswald',sans-serif;position:absolute;left:64px;bottom:200px;font-size:96px;color:#fff;letter-spacing:0.2em;text-shadow:0 8px 40px rgba(244,0,9,0.6);opacity:0}
    #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay}
    #grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:0.18;pointer-events:none}
  </style>
</head>
<body>
  <div id="root" data-composition-id="CocaCola40-clip-03" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
    <div id="pour-stage" class="clip" data-start="0" data-duration="6" data-track-index="0">
      <div class="void clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <div class="pour-wrap clip" data-start="0" data-duration="6" data-track-index="2">
        <div class="pour"></div>
      </div>
      <div class="flare clip" data-start="0" data-duration="6" data-track-index="3"></div>
      <div id="bubbles" class="clip" data-start="0" data-duration="6" data-track-index="4"></div>
      <div class="hit clip" data-start="0" data-duration="6" data-track-index="5">POUR</div>
      <div id="flash" class="clip" data-start="0" data-duration="6" data-track-index="6"></div>
      <canvas id="grain" class="clip" data-start="0" data-duration="6" data-track-index="7" width="540" height="960"></canvas>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    function init03(){
      const CID="CocaCola40-clip-03",C=window.CocaCola40;
      if(!C)return;
      const bub=document.getElementById("bubbles");
      if(!bub)return;
      const bubbles=C.spawnBubbles(bub,40,303);
      const tl=gsap.timeline({paused:true});
      gsap.set(".pour-wrap",{clipPath:"inset(100% 0 0 0)"});
      gsap.set(".hit",{opacity:0,scale:0.7});
      gsap.set(".bubble",{opacity:0});
      tl.to(".pour-wrap",{clipPath:"inset(0% 0 0 0)",duration:1.1,ease:"power4.out"},0.35);
      tl.to(".flare",{opacity:1,duration:0.15,ease:"power2.out"},0.95);
      tl.to(".flare",{opacity:0,duration:0.4},1.2);
      tl.to(".hit",{opacity:1,scale:1,duration:0.35,ease:"back.out(3)"},0.9);
      tl.to("#pour-stage",{scale:1.08,duration:0.28,ease:"power3.inOut"},0.85);
      tl.to("#pour-stage",{scale:1,duration:1.8,ease:"sine.out"},1.2);
      bubbles.forEach((b,i)=>{
        const dur=parseFloat(b.dataset.dur)||1;
        const del=parseFloat(b.dataset.delay)||0;
        const drift=parseFloat(b.dataset.drift)||0;
        tl.fromTo(b,{y:0,opacity:0},{y:-2200,opacity:0.85,x:drift,duration:dur,ease:"power1.in"},1+del+i*0.02);
      });
      tl.to("#flash",{opacity:0.35,duration:0.08},5.75);
      tl.to("#flash",{opacity:0,duration:0.2},5.85);
      const g=document.getElementById("grain");if(g)C.initGrain(g,0.18,403);
      window.addEventListener("hf-seek",e=>tl.seek(e.detail.time));
      tl.seek(0);window.__timelines[CID]=tl;
    }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init03);
    else init03();
  </script>
</body>
</html>
