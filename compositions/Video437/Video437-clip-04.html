<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video437 Clip 04 — Neural Synchronization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      
      /* 3D Perspective Stage Container */
      .depth-stage {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 900px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      
      /* Depth Stack Classes */
      .z-bg, .z-mg, .z-fg {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      
      .z-bg {
        transform: translateZ(-250px) scale(1.4);
      }
      
      .z-mg {
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 180px 90px;
        align-items: center;
      }
      
      .z-fg {
        transform: translateZ(120px) scale(0.88);
      }
      
      /* WebGL transparent layer */
      #three-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
      }
      
      /* Lens & Vignette */
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
        mix-blend-mode: multiply;
      }
      
      /* Animated SVG Sync Chart in Midground */
      .sync-chart-container {
        width: 100%;
        height: 350px;
        margin-top: 150px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .sync-svg {
        width: 100%;
        height: 100%;
      }
      
      /* Glowing framing borders */
      .sync-borders {
        position: absolute;
        inset: 40px;
        border: 1px solid rgba(0, 255, 136, 0.05);
      }
      
      .glow-bar {
        position: absolute;
        background: #00ff88;
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
      }
      
      .bar-l { left: 0; top: 20%; width: 2px; height: 60%; transform: scaleY(0); }
      .bar-r { right: 0; top: 20%; width: 2px; height: 60%; transform: scaleY(0); }
      
      /* Header/Footer styling */
      .hud-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        padding-bottom: 25px;
        font-family: 'Courier Prime', monospace;
        color: #00ff88;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.12em;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
      }
      .hud-footer {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 255, 136, 0.2);
        padding-top: 25px;
        font-family: 'Courier Prime', monospace;
        color: #00ff88;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-04"
         data-start="15.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
         
      <!-- Audio file -->
      <audio id="bg-audio" src="../../test_12.mp3" data-start="15.0" data-duration="5.0" data-track-index="0" data-volume="1"></audio>
      
      <div class="depth-stage">
        
        <!-- L0: Environment Background WebGL Double Helix -->
        <div class="z-bg">
          <canvas id="three-stage"></canvas>
        </div>
        
        <!-- L2: Hero Interface with Drawing Sync Curves -->
        <div class="z-mg">
          <div class="hud-header">
            <div>
              <h1 class="hud-title">NEURAL SYNCHRONIZATION</h1>
              <div style="font-size: 14px; opacity: 0.8; letter-spacing: 0.2em; margin-top: 5px;">SECTOR // SYNCHRONIZATION_PHASE</div>
            </div>
            <div style="text-align: right; line-height: 1.6; font-size: 14px;">
              <div>SYNC_LOCK: <span style="font-weight: 700;">99.88%</span></div>
              <div>INTERVALS: <span style="color: #00ff88;">CALIBRATED</span></div>
            </div>
          </div>
          
          <div class="sync-chart-container">
            <svg class="sync-svg" viewBox="0 0 900 350">
              <path id="sync-wave-1" d="M 50 175 Q 262.5 50 475 175 T 900 175" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" filter="drop-shadow(0 0 10px rgba(0,255,136,0.6))" />
              <path id="sync-wave-2" d="M 50 175 Q 262.5 300 475 175 T 900 175" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.6" />
            </svg>
          </div>
          
          <div class="hud-footer">
            <div style="font-size: 14px;">SYS_INTEGRATION // CALIBRATING</div>
            <div style="font-size: 14px; font-weight: 700;">PHASE_04 // HARMONY</div>
          </div>
        </div>
        
        <!-- L3: Lens Vignette, CRT Overlay, Brackets -->
        <div class="z-fg">
          <div class="lens-vignette"></div>
          <div class="sync-borders">
            <div class="glow-bar bar-l" id="l-border"></div>
            <div class="glow-bar bar-r" id="r-border"></div>
          </div>
        </div>
        
      </div>
    </div>

    <script>
      const duration = 5.0;
      const canvas = document.getElementById("three-stage");
      
      // Initialize Three.js Scene
      const scene = new THREE.Scene();
      
      // Camera matching FOV Perspective
      const fov = 2 * Math.atan((1920 / 2) / 900) * (180 / Math.PI);
      const camera = new THREE.PerspectiveCamera(fov, 1080 / 1920, 0.1, 1000);
      camera.position.set(0, 0, 8);
      
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      const glAvailable = isWebGLAvailable();
      if (glAvailable) {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Dramatic Lighting
      const keyLight = new THREE.DirectionalLight(0x00ff88, 5.0); // Mint
      keyLight.position.set(5, 5, 5);
      scene.add(keyLight);
      
      const fillLight = new THREE.DirectionalLight(0x00d4ff, 3.0); // Cyan
      fillLight.position.set(-5, -3, 3);
      scene.add(fillLight);
      
      // 1. Procedural 3D Malleable Double Helix Particle Structure
      const helixCount = 120;
      const helixGeo = new THREE.BufferGeometry();
      const helixPositions = new Float32Array(helixCount * 2 * 3); // 2 strands
      
      helixGeo.setAttribute("position", new THREE.BufferAttribute(helixPositions, 3));
      const helixMat = new THREE.PointsMaterial({
        color: 0x00ff88,
        size: 0.15,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const helixPoints = new THREE.Points(helixGeo, helixMat);
      scene.add(helixPoints);
      
      // 2. Central Core Sphere of Frosted Glass
      const coreGeo = new THREE.IcosahedronGeometry(1.5, 5);
      const coreMat = new THREE.MeshPhysicalMaterial({
        color: 0x00d4ff,
        roughness: 0.1,
        metalness: 0.1,
        transmission: 0.9,
        thickness: 1.5,
        clearcoat: 1.0,
        transparent: true,
        opacity: 0.9
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      scene.add(coreMesh);
      
      const baseCorePositions = coreGeo.attributes.position.clone();
      
      function renderAt(time) {
        if (!glAvailable) return;
        
        // 1. Update procedural double helix vertex coordinates over time
        const posAttr = helixGeo.attributes.position;
        const coords = posAttr.array;
        
        for (let i = 0; i < helixCount; i++) {
          const t = (i / helixCount) * Math.PI * 4; // 2 full turns
          
          // Strand 1
          const idx1 = i * 3;
          coords[idx1] = Math.sin(t + time * 1.5) * 2.2; // X
          coords[idx1+1] = (i / helixCount - 0.5) * 10;   // Y
          coords[idx1+2] = Math.cos(t + time * 1.5) * 2.2; // Z
          
          // Strand 2 (180deg offset)
          const idx2 = (helixCount + i) * 3;
          coords[idx2] = Math.sin(t + Math.PI + time * 1.5) * 2.2;
          coords[idx2+1] = (i / helixCount - 0.5) * 10;
          coords[idx2+2] = Math.cos(t + Math.PI + time * 1.5) * 2.2;
        }
        posAttr.needsUpdate = true;
        
        // 2. Deform the glass core sphere via breathing waves
        const corePos = coreGeo.attributes.position;
        const tempV = new THREE.Vector3();
        for (let i = 0; i < corePos.count; i++) {
          tempV.fromBufferAttribute(baseCorePositions, i);
          
          const breathing = 1.0 + Math.sin(time * 3.0 + tempV.x * 2.0) * 0.12;
          tempV.multiplyScalar(breathing);
          corePos.setXYZ(i, tempV.x, tempV.y, tempV.z);
        }
        corePos.needsUpdate = true;
        coreGeo.computeVertexNormals();
        
        // mesh rotation
        coreMesh.rotation.y = -time * 0.3;
        coreMesh.rotation.x = Math.sin(time * 0.2) * 0.25;
        
        // Camera orbital sweep pan
        camera.position.x = Math.sin(time * 0.15) * 8;
        camera.position.z = Math.cos(time * 0.15) * 8;
        camera.position.y = Math.cos(time * 0.25) * 0.5;
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      // GSAP Timelines Setup (seeking contract)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Ken burns bg scaling
      tl.fromTo(".z-bg", { scale: 1.35 }, { scale: 1.5, duration: duration, ease: "sine.inOut" }, 0);
      
      // Draw dynamic SVG sync curves
      const path1 = document.getElementById("sync-wave-1");
      const path2 = document.getElementById("sync-wave-2");
      
      let len1 = 0;
      let len2 = 0;
      
      if (path1) {
        len1 = path1.getTotalLength();
        path1.style.strokeDasharray = len1;
        path1.style.strokeDashoffset = len1;
        tl.to(path1, { strokeDashoffset: 0, duration: 2.2, ease: "power2.out" }, 0.2);
      }
      
      if (path2) {
        len2 = path2.getTotalLength();
        path2.style.strokeDasharray = len2;
        path2.style.strokeDashoffset = len2;
        tl.to(path2, { strokeDashoffset: 0, duration: 2.5, ease: "power2.inOut" }, 0.4);
      }
      
      // Sweep and scale glowing borders
      tl.fromTo("#l-border", { scaleY: 0 }, { scaleY: 1, duration: 1.5, ease: "power3.out" }, 0.6);
      tl.fromTo("#r-border", { scaleY: 0 }, { scaleY: 1, duration: 1.5, ease: "power3.out" }, 0.6);
      
      window.addEventListener("hf-seek", (event) => {
        const t = event.detail.time;
        tl.seek(t);
        renderAt(t);
      });
      
      // First frame render
      renderAt(0);
      tl.seek(0);
    </script>
  </body>
</html>
