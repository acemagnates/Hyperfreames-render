<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>Video437 Clip 01 — Synapse Nursery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/Video437/video437-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1000px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-350px) scale(1.6);
        background: radial-gradient(circle at 50% 50%, rgba(0, 212, 255, 0.15), #020306 70%);
      }
      #plexus-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
      }
      .center-orbit-wrap {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%) translateZ(40px);
        width: 600px;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .orbit-svg {
        width: 100%;
        height: 100%;
      }
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(150px) scale(0.85);
        pointer-events: none;
      }
      .hud-brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 255, 170, 0.08);
      }
      .bracket {
        position: absolute;
        width: 45px;
        height: 45px;
        border: 2px solid #00ffaa;
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      
      /* HUD Interface components */
      .hud-header {
        border-bottom: 1px solid rgba(0, 255, 170, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #00ffaa;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 42px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(0, 255, 170, 0.5);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(0, 255, 170, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #00ffaa;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #grain {
        position: absolute;
        inset: 0;
        z-index: 100;
        opacity: 0.15;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-01"
         data-start="0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.0" data-track-index="0">
          
          <!-- L0: Background Parallax Layer -->
          <div class="z-bg clip" data-start="0" data-duration="5.0" data-track-index="1">
            <canvas id="plexus-canvas" width="1080" height="1920"></canvas>
          </div>
          
          <!-- L1: Middle Ground Content Layer -->
          <div class="z-mg clip" data-start="0" data-duration="5.0" data-track-index="2">
            
            <div class="hud-header">
              <div>
                <h1 class="hud-title" id="type-title">NEURO-NET GENESIS</h1>
                <div class="hud-subtitle">SECTOR // SYNAPSE_NURSERY</div>
              </div>
              <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                <div>SYSTEM // <span style="font-weight: 700;">OK</span></div>
                <div>DRIFT // <span>0.001%</span></div>
              </div>
            </div>
            
            <!-- Central Procedural Orbit Rings -->
            <div class="center-orbit-wrap clip" data-start="0" data-duration="5.0" data-track-index="3">
              <svg class="orbit-svg" viewBox="0 0 400 400">
                <!-- Inner glow ring -->
                <circle cx="200" cy="200" r="110" fill="none" stroke="url(#cyanGlow)" stroke-width="1" opacity="0.3" />
                <!-- Core element -->
                <circle cx="200" cy="200" r="30" fill="url(#coreGlow)" />
                <!-- Rotating dashed orbits -->
                <circle id="orbit-dot-1" cx="200" cy="200" r="85" fill="none" stroke="#00ffaa" stroke-dasharray="12, 18, 4, 18" stroke-width="2" stroke-linecap="round" />
                <circle id="orbit-dot-2" cx="200" cy="200" r="130" fill="none" stroke="#00d4ff" stroke-dasharray="25, 45, 10, 45" stroke-width="1.5" stroke-linecap="round" />
                <circle id="orbit-dot-3" cx="200" cy="200" r="160" fill="none" stroke="#00ffaa" stroke-dasharray="6, 6" stroke-width="1" opacity="0.6" />
                
                <defs>
                  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#00d4ff" stop-opacity="1" />
                    <stop offset="100%" stop-color="#020306" stop-opacity="0" />
                  </radialGradient>
                  <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="35%" stop-color="#00ffaa" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#020306" stop-opacity="0" />
                  </radialGradient>
                </defs>
              </svg>
            </div>
            
            <div class="hud-footer">
              <div>SYS_INIT_OK // STABLE</div>
              <div style="font-weight: 700; letter-spacing: 0.15em;">PHASE_01 // DRIFT</div>
            </div>
            
          </div>
          
          <!-- L2: Foreground Overlay Layer -->
          <div class="z-fg clip" data-start="0" data-duration="5.0" data-track-index="4">
            <div class="hud-brackets">
              <div class="bracket tl"></div>
              <div class="bracket tr"></div>
              <div class="bracket bl"></div>
              <div class="bracket br"></div>
            </div>
          </div>
          
        </div>
        
        <!-- Post-Processing Elements -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="5.0" data-track-index="5">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5.0" data-track-index="6" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video437-clip-01";
      const D = 5.0;
      
      const H = window.VisualEngine;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      
      // Initialize Grain Canvas
      const grain = document.getElementById("grain");
      if (grain) {
        H.initFilmGrain(grain, 0.14, 43701);
      }
      
      // Plexus rendering loop bound to GSAP
      const plexusCanvas = document.getElementById("plexus-canvas");
      
      // Seed values for initial positions
      gsap.set(".hud-brackets", { inset: "80px", opacity: 0 });
      gsap.set(".bracket", { scale: 0.65, opacity: 0 });
      gsap.set("#type-title", { opacity: 0 });
      gsap.set(".hud-subtitle", { opacity: 0, x: -30 });
      gsap.set("#orbit-dot-1, #orbit-dot-2, #orbit-dot-3", { transformOrigin: "200px 200px" });
      
      // GSAP Animations
      // 1. Zoom and orbital reveal
      tl.fromTo("#depth-stage", { scale: 0.95 }, { scale: 1.0, duration: D, ease: "sine.out" }, 0);
      
      // 2. Corner brackets drawing in
      tl.to(".hud-brackets", { inset: "60px", opacity: 1, duration: 1.2, ease: "power3.out" }, 0.1);
      tl.to(".bracket", { scale: 1, opacity: 1, duration: 0.8, ease: "springSnappy", stagger: 0.08 }, 0.1);
      
      // 3. Central core rotations
      tl.fromTo("#orbit-dot-1", { rotation: 0 }, { rotation: 120, duration: D, ease: "none" }, 0);
      tl.fromTo("#orbit-dot-2", { rotation: 0 }, { rotation: -90, duration: D, ease: "none" }, 0);
      tl.fromTo("#orbit-dot-3", { rotation: 0 }, { rotation: 60, duration: D, ease: "none" }, 0);
      
      // 4. Typewriter reveal for title
      const titleStr = "NEURO-NET GENESIS";
      const titleEl = document.getElementById("type-title");
      tl.call(() => { titleEl.style.opacity = 1; }, null, 0.4);
      for (let i = 0; i < titleStr.length; i++) {
        tl.call(() => {
          titleEl.textContent = titleStr.substring(0, i + 1);
        }, null, 0.4 + (i / titleStr.length) * 1.2);
      }
      tl.to(".hud-subtitle", { opacity: 0.85, x: 0, duration: 0.8, ease: "power2.out" }, 1.4);
      
      // 5. Heavy impact at start (0.05s)
      H.screenShake(tl, "#root-inner", 0.05, 1.4);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 0.05, 1.6);
      
      // Particle burst inside plexus on impact
      const plexusContainer = document.querySelector(".z-bg");
      H.particleBurst(tl, plexusContainer, 540, 960, 0.05, 20, "#00ffaa", 4371);
      
      // Continuous drift
      H.lifePulse(tl, ".center-orbit-wrap", D, { scaleAmp: 0.012, yAmp: 8, rotAmp: 0.5 });
      
      // Seek logic
      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time);
        
        // Draw Plexus Network on Canvas relative to time
        if (plexusCanvas) {
          H.drawPlexus(plexusCanvas, time, "#00ffaa", "#00d4ff", 437101);
        }
      });
      
      // Initial render
      if (plexusCanvas) {
        H.drawPlexus(plexusCanvas, 0, "#00ffaa", "#00d4ff", 437101);
      }
      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
