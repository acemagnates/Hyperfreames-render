<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video437 Clip 02 — Quantum Data Terrain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      
      /* 3D Perspective Stage Container */
      .depth-stage {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 900px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      
      /* Depth Stack Classes */
      .z-bg, .z-light, .z-mg, .z-fg {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      
      .z-bg {
        transform: translateZ(-250px) scale(1.4);
      }
      
      .z-mg {
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 180px 90px;
      }
      
      .z-fg {
        transform: translateZ(120px) scale(0.88);
      }
      
      /* WebGL transparent layer */
      #three-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: color-dodge;
      }
      
      /* Lens & Vignette */
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
        mix-blend-mode: multiply;
      }
      
      .crt-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.1) 0px,
          rgba(0, 0, 0, 0.1) 1px,
          transparent 1px,
          transparent 4px
        );
        pointer-events: none;
      }
      
      /* Dynamic Stat Panel in L2 */
      .stats-panel {
        background: rgba(3, 7, 13, 0.65);
        border: 1px solid rgba(0, 212, 255, 0.15);
        border-radius: 8px;
        padding: 40px;
        margin-top: 100px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        position: relative;
        overflow: hidden;
      }
      .stats-panel::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 8px;
        padding: 1.5px;
        background: radial-gradient(
          circle 150px at var(--rim-x, 50%) var(--rim-y, -20%),
          rgba(0, 212, 255, 0.8) 0%,
          rgba(0, 212, 255, 0.1) 60%,
          transparent 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      
      .stat-row {
        display: flex;
        justify-content: space-between;
        font-family: 'Courier Prime', monospace;
        font-size: 20px;
        color: #00d4ff;
      }
      
      .stat-val {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
      }
      
      /* Header/Footer styling */
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        padding-bottom: 25px;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.12em;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
      }
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 212, 255, 0.2);
        padding-top: 25px;
        font-family: 'Courier Prime', monospace;
        color: #00d4ff;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-02"
         data-start="5.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
         
      <!-- Audio file -->
      <audio id="bg-audio" src="../../test_12.mp3" data-start="5.0" data-duration="5.0" data-track-index="0" data-volume="1"></audio>
      
      <div class="depth-stage">
        
        <!-- L0: Environment Background WebGL Grid -->
        <div class="z-bg">
          <canvas id="three-stage"></canvas>
        </div>
        
        <!-- L2: Hero Stats Cards -->
        <div class="z-mg">
          <div class="hud-header">
            <div>
              <h1 class="hud-title">QUANTUM DATA TERRAIN</h1>
              <div style="font-size: 14px; opacity: 0.8; letter-spacing: 0.2em; margin-top: 5px;">SECTOR // DEFORMATION_GRID</div>
            </div>
            <div style="text-align: right; line-height: 1.6; font-size: 14px;">
              <div>GRID_LATENCY: <span style="color: #ff6b35;">1.04ms</span></div>
              <div>SYNC: <span style="color: #00ff88;">LOCK</span></div>
            </div>
          </div>
          
          <div class="stats-panel">
            <div class="stat-row">
              <span>TERRAIN_DAMPING:</span>
              <span class="stat-val" id="val-1">0.10</span>
            </div>
            <div class="stat-row">
              <span>VOLUMETRIC_DENSITY:</span>
              <span class="stat-val" id="val-2">4,200</span>
            </div>
            <div class="stat-row">
              <span>FLOW_RATE:</span>
              <span class="stat-val" id="val-3">92.4%</span>
            </div>
          </div>
          
          <div class="hud-footer">
            <div style="font-size: 14px;">SYS_MAPPING // DRIFT</div>
            <div style="font-size: 14px; font-weight: 700;">PHASE_02 // SHIFT</div>
          </div>
        </div>
        
        <!-- L3: Vignette & CRT Overlay -->
        <div class="z-fg">
          <div class="lens-vignette"></div>
          <div class="crt-scanlines"></div>
        </div>
        
      </div>
    </div>

    <script>
      const duration = 5.0;
      const canvas = document.getElementById("three-stage");
      
      // Initialize Three.js Scene
      const scene = new THREE.Scene();
      
      // Camera matching FOV Perspective
      const fov = 2 * Math.atan((1920 / 2) / 900) * (180 / Math.PI);
      const camera = new THREE.PerspectiveCamera(fov, 1080 / 1920, 0.1, 1000);
      camera.position.set(0, 4, 9);
      camera.lookAt(0, 0, 0);
      
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      const glAvailable = isWebGLAvailable();
      if (glAvailable) {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Cinematic Lights
      const keyLight = new THREE.DirectionalLight(0x00d4ff, 6.0); // Cyan Key
      keyLight.position.set(5, 12, 5);
      scene.add(keyLight);
      
      const rimLight = new THREE.DirectionalLight(0xff6b35, 2.0); // Orange Rim behind grid
      rimLight.position.set(-5, 4, -8);
      scene.add(rimLight);
      
      // Kinetic wireframe grid plane deforming via waves
      const gridGeo = new THREE.PlaneGeometry(16, 24, 30, 40);
      const gridMat = new THREE.MeshBasicMaterial({
        color: 0x00d4ff,
        wireframe: true,
        transparent: true,
        opacity: 0.35
      });
      const gridMesh = new THREE.Mesh(gridGeo, gridMat);
      gridMesh.rotation.x = -Math.PI / 2.2;
      gridMesh.position.set(0, -2, 0);
      scene.add(gridMesh);
      
      const baseGridPos = gridGeo.attributes.position.clone();
      
      // Volumetric gold dust field
      const particleCount = 45;
      const partGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];
      
      let pSeed = 7777;
      function prng() {
        let t = pSeed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      
      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (prng() - 0.5) * 12;
        positions[i+1] = (prng() - 0.5) * 16;
        positions[i+2] = (prng() - 0.5) * 6;
        velocities.push((prng() + 0.1) * 0.7);
      }
      
      partGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const partMat = new THREE.PointsMaterial({
        color: 0xffd700,
        size: 0.14,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });
      const dustField = new THREE.Points(partGeo, partMat);
      scene.add(dustField);
      
      function renderAt(time) {
        if (!glAvailable) return;
        // 1. Deform the procedural grid terrain
        const position = gridGeo.attributes.position;
        for (let i = 0; i < position.count; i++) {
          const x = baseGridPos.getX(i);
          const y = baseGridPos.getY(i);
          
          const z = Math.sin(x * 0.45 + time * 1.5) * Math.cos(y * 0.35 + time * 1.2) * 0.8 +
                    Math.sin(x * 0.9 - time * 2.2) * 0.25;
                    
          position.setZ(i, z);
        }
        position.needsUpdate = true;
        
        // 2. Animate dust particles
        const coords = partGeo.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          const idx = i * 3;
          const speed = velocities[i];
          coords[idx+1] = ((positions[idx+1] + time * speed + 8) % 16) - 8;
        }
        partGeo.attributes.position.needsUpdate = true;
        
        // 3. Camera dolly crane drift
        camera.position.z = 9.0 - time * 0.4;
        camera.position.y = 4.0 - Math.sin(time * 0.15) * 0.6;
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      // GSAP Timelines Setup (seeking contract)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Parallax drifting Ken Burns
      tl.fromTo(".z-bg", { scale: 1.3 }, { scale: 1.5, duration: duration, ease: "sine.inOut" }, 0);
      
      // Card Rim Sweep animation using card state variable
      const cardState = { x: 0 };
      tl.to(cardState, {
        x: 100,
        duration: duration,
        ease: "sine.inOut",
        onUpdate: () => {
          document.querySelector(".stats-panel").style.setProperty("--rim-x", `${cardState.x}%`);
        }
      }, 0);
      
      // Animate Stats Values Counting Up
      const counts = { val1: 0.10, val2: 1200, val3: 45.2 };
      tl.to(counts, {
        val1: 1.95,
        val2: 4200,
        val3: 92.4,
        duration: duration * 0.8,
        ease: "power2.out",
        onUpdate: () => {
          document.getElementById("val-1").innerText = counts.val1.toFixed(2);
          document.getElementById("val-2").innerText = Math.floor(counts.val2).toLocaleString();
          document.getElementById("val-3").innerText = `${counts.val3.toFixed(1)}%`;
        }
      }, 0.2);
      
      // entrance slide on stats panel
      tl.fromTo(".stats-panel", { y: 150, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: "back.out(1.2)" }, 0.2);
      
      window.addEventListener("hf-seek", (event) => {
        const t = event.detail.time;
        tl.seek(t);
        renderAt(t);
      });
      
      // First frame render
      renderAt(0);
      tl.seek(0);
    </script>
  </body>
</html>
