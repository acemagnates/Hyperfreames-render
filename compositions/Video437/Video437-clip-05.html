<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video437 Clip 05 — Fractal Light Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      
      /* 3D Perspective Stage Container */
      .depth-stage {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 900px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      
      /* Depth Stack Classes */
      .z-bg, .z-mg, .z-fg {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      
      .z-bg {
        transform: translateZ(-250px) scale(1.4);
      }
      
      .z-mg {
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 180px 90px;
        align-items: center;
      }
      
      .z-fg {
        transform: translateZ(120px) scale(0.88);
      }
      
      /* WebGL transparent layer */
      #three-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
      }
      
      /* Lens & Vignette */
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
        mix-blend-mode: multiply;
      }
      
      /* Speed streak lines for travel simulation */
      .speed-streaks {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .streak {
        position: absolute;
        width: 250px;
        height: 1.5px;
        background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.65), transparent);
        left: -300px;
        opacity: 0.8;
      }
      .str-0 { top: 20%; }
      .str-1 { top: 35%; }
      .str-2 { top: 60%; }
      .str-3 { top: 80%; }
      
      /* Large Speed Dial Telemetry */
      .telemetry-dial {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 150px;
        font-family: 'Oswald', sans-serif;
      }
      
      .velocity-val {
        font-size: 110px;
        font-weight: 700;
        color: #ff6b35;
        text-shadow: 0 0 35px rgba(255, 107, 53, 0.8);
        letter-spacing: 0.05em;
        line-height: 1;
      }
      
      .velocity-label {
        font-family: 'Courier Prime', monospace;
        font-size: 16px;
        letter-spacing: 0.25em;
        color: #ffffff;
        opacity: 0.8;
        margin-top: 10px;
      }
      
      /* Header/Footer styling */
      .hud-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(255, 107, 53, 0.2);
        padding-bottom: 25px;
        font-family: 'Courier Prime', monospace;
        color: #ff6b35;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.12em;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
      }
      .hud-footer {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(255, 107, 53, 0.2);
        padding-top: 25px;
        font-family: 'Courier Prime', monospace;
        color: #ff6b35;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-05"
         data-start="20.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
         
      <!-- Audio file -->
      <audio id="bg-audio" src="../../test_12.mp3" data-start="20.0" data-duration="5.0" data-track-index="0" data-volume="1"></audio>
      
      <div class="depth-stage">
        
        <!-- L0: Environment Background WebGL Starfield & concentric square portals -->
        <div class="z-bg">
          <canvas id="three-stage"></canvas>
        </div>
        
        <!-- L2: Speed Dial HUD -->
        <div class="z-mg">
          <div class="hud-header">
            <div>
              <h1 class="hud-title">FRACTAL LIGHT GATE</h1>
              <div style="font-size: 14px; opacity: 0.8; letter-spacing: 0.2em; margin-top: 5px;">SECTOR // FRACTAL_LIGHT_GATE</div>
            </div>
            <div style="text-align: right; line-height: 1.6; font-size: 14px;">
              <div>VELOCITY: <span style="color: #ff6b35; font-weight: 700;">HYPERDRIVE</span></div>
              <div>WARP_FACTOR: <span style="font-weight: 700;">8.99</span></div>
            </div>
          </div>
          
          <div class="telemetry-dial">
            <div class="velocity-val" id="vel-counter">0.0%</div>
            <div class="velocity-label">LIGHTSPEED_RATIO</div>
          </div>
          
          <div class="hud-footer">
            <div style="font-size: 14px;">WARP_SYNC // STABILIZED</div>
            <div style="font-size: 14px; font-weight: 700;">PHASE_05 // WARP</div>
          </div>
        </div>
        
        <!-- L3: Lens Vignette & Chromatic aberrated Speed Streaks -->
        <div class="z-fg">
          <div class="lens-vignette"></div>
          <div class="speed-streaks">
            <div class="streak str-0" id="streak-0"></div>
            <div class="streak str-1" id="streak-1"></div>
            <div class="streak str-2" id="streak-2"></div>
            <div class="streak str-3" id="streak-3"></div>
          </div>
        </div>
        
      </div>
    </div>

    <script>
      const duration = 5.0;
      const canvas = document.getElementById("three-stage");
      
      // Initialize Three.js Scene
      const scene = new THREE.Scene();
      
      // Camera matching FOV Perspective
      const fov = 2 * Math.atan((1920 / 2) / 900) * (180 / Math.PI);
      const camera = new THREE.PerspectiveCamera(fov, 1080 / 1920, 0.1, 1000);
      camera.position.set(0, 0, 10);
      
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      const glAvailable = isWebGLAvailable();
      if (glAvailable) {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // 1. Concentric Glowing Square Portals in 3D Depth
      const portalCount = 8;
      const portals = [];
      
      for (let i = 0; i < portalCount; i++) {
        // Simple square boundary lines
        const sqGeo = new THREE.RingGeometry(2.0, 2.05, 4);
        const sqMat = new THREE.MeshBasicMaterial({
          color: 0xff6b35,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending
        });
        const sqMesh = new THREE.Mesh(sqGeo, sqMat);
        sqMesh.rotation.z = Math.PI / 4; // Rotate to diamonds/squares
        sqMesh.position.z = -i * 3; // Stack deep along Z
        scene.add(sqMesh);
        portals.push(sqMesh);
      }
      
      // 2. High-speed trailing dust stars
      const starCount = 80;
      const starGeo = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      const starSpeeds = [];
      
      let pSeed = 6666;
      function prng() {
        let t = pSeed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (prng() - 0.5) * 8;      // X
        starPositions[i+1] = (prng() - 0.5) * 12;    // Y
        starPositions[i+2] = -prng() * 20;           // Z
        starSpeeds.push(prng() * 12 + 6);            // Speed
      }
      
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0xffffd4,
        size: 0.08,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });
      const starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);
      
      function renderAt(time) {
        if (!glAvailable) return;
        
        // 1. Zoom the camera through portals along Z axis
        // We travel from Z=10 down to Z=-20 over 5 seconds
        const travelZ = 10.0 - time * 6.0;
        camera.position.set(0, 0, travelZ);
        
        // Slightly rotate portals dynamically
        portals.forEach((p, idx) => {
          p.rotation.z = Math.PI / 4 + time * 0.15 * (idx % 2 === 0 ? 1 : -1);
          // Color shift over time dynamically (orange -> cyan)
          p.material.color.setHSL((0.08 + time * 0.05) % 1.0, 1.0, 0.6);
        });
        
        // 2. Volumetric high-speed stars rushing past
        const coords = starGeo.attributes.position.array;
        for (let i = 0; i < starCount; i++) {
          const idx = i * 3;
          const speed = starSpeeds[i];
          // Move stars toward camera (along Z)
          coords[idx+2] = ((starPositions[idx+2] + time * speed + 20) % 40) - 20;
        }
        starGeo.attributes.position.needsUpdate = true;
        
        renderer.render(scene, camera);
      }
      
      // GSAP Timelines Setup (seeking contract)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Ken burns bg
      tl.fromTo(".z-bg", { scale: 1.35 }, { scale: 1.5, duration: duration, ease: "sine.inOut" }, 0);
      
      // Velocity counter counting to 99.9%
      const velocityState = { val: 0.0 };
      tl.to(velocityState, {
        val: 99.9,
        duration: duration * 0.95,
        ease: "power3.inOut",
        onUpdate: () => {
          document.getElementById("vel-counter").innerText = `${velocityState.val.toFixed(1)}%`;
        }
      }, 0.1);
      
      // High-speed telemetry streaks moving across frame
      tl.fromTo("#streak-0", { left: "-300px" }, { left: "1180px", duration: 1.2, repeat: 3, ease: "none" }, 0);
      tl.fromTo("#streak-1", { left: "-300px" }, { left: "1180px", duration: 0.9, repeat: 4, ease: "none" }, 0.2);
      tl.fromTo("#streak-2", { left: "-300px" }, { left: "1180px", duration: 1.4, repeat: 2, ease: "none" }, 0.1);
      tl.fromTo("#streak-3", { left: "-300px" }, { left: "1180px", duration: 0.8, repeat: 5, ease: "none" }, 0.3);
      
      window.addEventListener("hf-seek", (event) => {
        const t = event.detail.time;
        tl.seek(t);
        renderAt(t);
      });
      
      // First frame render
      renderAt(0);
      tl.seek(0);
    </script>
  </body>
</html>
