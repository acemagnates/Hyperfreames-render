<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="icon" href="data:," />
    <title>Video437 Clip 03 — Cognitive Emission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="compositions/Video437/video437-shared.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root-inner {
        position: absolute;
        inset: 0;
      }
      #depth-stage {
        position: absolute;
        inset: 0;
        perspective: 1000px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .z-bg {
        position: absolute;
        inset: 0;
        transform: translateZ(-320px) scale(1.55);
        background: radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.16), #020306 72%);
      }
      #plexus-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .z-mg {
        position: absolute;
        inset: 0;
        transform: translateZ(0);
        transform-style: preserve-3d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 160px 80px;
      }
      
      /* Central core layout */
      .center-core-wrap {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%) translateZ(80px);
        width: 600px;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .core-svg {
        width: 100%;
        height: 100%;
      }
      .subject-title-wrap {
        position: absolute;
        left: 50%;
        top: 72%;
        transform: translateX(-50%) translateZ(100px);
        width: 900px;
        text-align: center;
        pointer-events: none;
      }
      .main-subject {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        font-size: 82px;
        color: #ff6b35;
        letter-spacing: 0.12em;
        text-shadow: 
          0 0 8px #ff6b35,
          0 0 35px rgba(255, 107, 53, 0.6),
          0 8px 30px rgba(0, 0, 0, 0.7);
        opacity: 0;
      }
      .ghost-subject {
        position: absolute;
        left: 50%;
        top: 72%;
        transform: translateX(-50%) translateZ(60px);
        width: 900px;
        text-align: center;
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        font-size: 82px;
        color: #ff9f1c;
        letter-spacing: 0.12em;
        opacity: 0;
        pointer-events: none;
      }
      
      .z-fg {
        position: absolute;
        inset: 0;
        transform: translateZ(140px) scale(0.9);
        pointer-events: none;
      }
      .shockwave-ring {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        border: 2px solid #ff6b35;
        border-radius: 50%;
        width: 10px;
        height: 10px;
        opacity: 0;
        box-shadow: 0 0 25px rgba(255, 107, 53, 0.6);
      }
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.75) 100%);
      }
      .ambient-flare {
        position: absolute;
        width: 800px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 107, 53, 0.12) 0%, transparent 70%);
        top: 30%;
        left: -100px;
        transform: rotate(-15deg);
      }
      
      .hud-header {
        border-bottom: 1px solid rgba(255, 107, 53, 0.25);
        padding-bottom: 20px;
        font-family: 'Courier Prime', monospace;
        color: #ff6b35;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 42px;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
      }
      .hud-subtitle {
        font-size: 14px;
        letter-spacing: 0.25em;
        margin-top: 6px;
        opacity: 0.85;
      }
      .hud-footer {
        border-top: 1px solid rgba(255, 107, 53, 0.25);
        padding-top: 20px;
        font-family: 'Courier Prime', monospace;
        color: #ff6b35;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      #chrom-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
      }
      #chrom-r, #chrom-b {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #chrom-r { background: rgba(255, 0, 0, 0.15); }
      #chrom-b { background: rgba(0, 100, 255, 0.15); }
      
      #grain {
        position: absolute;
        inset: 0;
        z-index: 100;
        opacity: 0.15;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-03"
         data-start="10.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
      <div id="root-inner">
        <div id="depth-stage" class="clip" data-start="0" data-duration="5.0" data-track-index="0">
          
          <!-- L0: Background Parallax Layer -->
          <div class="z-bg clip" data-start="0" data-duration="5.0" data-track-index="1">
            <canvas id="plexus-canvas" width="1080" height="1920"></canvas>
          </div>
          
          <!-- L1: Interactive HUD and central 3D-feeling knot -->
          <div class="z-mg clip" data-start="0" data-duration="5.0" data-track-index="2">
            
            <div class="hud-header">
              <div>
                <h1 class="hud-title">COGNITIVE EMISSION</h1>
                <div class="hud-subtitle">SECTOR // COGNITIVE_EMISSION</div>
              </div>
              <div style="text-align: right; font-size: 15px; line-height: 1.6;">
                <div>EMISSION // <span style="font-weight: 700; color: #ff6b35;">99.8%</span></div>
                <div>STATUS // <span>PEAK_BURST</span></div>
              </div>
            </div>
            
            <!-- Central Fresnel Torus Knot simulation using SVGs -->
            <div class="center-core-wrap clip" data-start="0" data-duration="5.0" data-track-index="3">
              <svg class="core-svg" viewBox="0 0 400 400" id="torus-knot">
                <defs>
                  <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="40%" stop-color="#ff6b35" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#020306" stop-opacity="0" />
                  </radialGradient>
                  <!-- Fresnel edge glow -->
                  <linearGradient id="fresnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff9f1c" />
                    <stop offset="50%" stop-color="#ff6b35" />
                    <stop offset="100%" stop-color="#ff2e00" />
                  </linearGradient>
                </defs>
                <!-- Outer orbital rings -->
                <circle cx="200" cy="200" r="140" fill="none" stroke="#ff6b35" stroke-dasharray="10, 30" stroke-width="1.5" opacity="0.4" id="outer-circle" />
                <!-- Mathematical Torus Knot representation -->
                <path d="M 200,90 
                         A 110,110 0 0,0 90,200 
                         A 110,110 0 0,0 200,310 
                         A 110,110 0 0,0 310,200 
                         A 110,110 0 0,0 200,90
                         M 200,120
                         A 80,80 0 0,1 280,200
                         A 80,80 0 0,1 200,280
                         A 80,80 0 0,1 120,200
                         A 80,80 0 0,1 200,120 Z" 
                      fill="none" stroke="url(#fresnelGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85" id="torus-path" />
                <!-- Pulsing Core -->
                <circle cx="200" cy="200" r="45" fill="url(#orangeGlow)" id="inner-core" />
              </svg>
            </div>
            
            <!-- Subject Titles and Staggered ghost Afterimages -->
            <div class="subject-title-wrap">
              <h1 class="main-subject" id="subject-main">EMISSION CORE</h1>
            </div>
            
            <div class="ghost-subject" id="ghost-1">EMISSION CORE</div>
            <div class="ghost-subject" id="ghost-2">EMISSION CORE</div>
            
            <div class="hud-footer">
              <div>THERMAL_SHIELD // MAXIMUM</div>
              <div style="font-weight: 700; letter-spacing: 0.15em;">PHASE_03 // EMISSION</div>
            </div>
            
          </div>
          
          <!-- L2: Foreground Shockwaves, Vignette, Flares -->
          <div class="z-fg clip" data-start="0" data-duration="5.0" data-track-index="4">
            <div class="lens-vignette"></div>
            <div class="ambient-flare" id="leak-streak"></div>
            <div class="shockwave-ring" id="impact-wave"></div>
          </div>
          
        </div>
        
        <!-- Post-Processing Elements -->
        <div id="chrom-wrap" class="clip" data-start="0" data-duration="5.0" data-track-index="5">
          <div id="chrom-r"></div>
          <div id="chrom-b"></div>
        </div>
        <canvas id="grain" class="clip" data-start="0" data-duration="5.0" data-track-index="6" width="540" height="960"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CID = "Video437-clip-03";
      const D = 5.0;
      
      const H = window.VisualEngine;
      H.registerEases(gsap);
      const tl = gsap.timeline({ paused: true });
      
      // Initialize Grain
      const grain = document.getElementById("grain");
      if (grain) {
        H.initFilmGrain(grain, 0.14, 43703);
      }
      
      const plexusCanvas = document.getElementById("plexus-canvas");
      
      // Set Initial States
      gsap.set("#subject-main", { y: 60, opacity: 0, scale: 0.8 });
      gsap.set("#ghost-1, #ghost-2", { y: 60, opacity: 0, scale: 0.8 });
      gsap.set("#outer-circle", { transformOrigin: "200px 200px" });
      gsap.set("#torus-path", { transformOrigin: "200px 200px", rotate: 0, scale: 0.9 });
      
      // Animations
      // 1. Ken Burns drift
      tl.fromTo("#depth-stage", { scale: 0.95 }, { scale: 1.0, duration: D, ease: "sine.out" }, 0);
      
      // 2. Slow Torus Knot rotations and core pulse
      tl.fromTo("#outer-circle", { rotation: 0 }, { rotation: 180, duration: D, ease: "none" }, 0);
      tl.fromTo("#torus-path", { rotation: 0 }, { rotation: -120, duration: D, ease: "none" }, 0);
      tl.fromTo("#inner-core", { scale: 0.9 }, { scale: 1.25, duration: 0.8, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      
      // 3. Peak Impact Event at 0.75s (Torus Core explosion)
      // Slam Title
      tl.to("#subject-main", { y: 0, opacity: 1, scale: 1.0, duration: 0.28, ease: "springHeavy" }, 0.75);
      
      // Staggered Ghost Afterimages
      tl.to("#ghost-1", { y: -15, opacity: 0.35, scale: 1.04, duration: 0.1, ease: "power2.out" }, 0.75);
      tl.to("#ghost-1", { y: 0, opacity: 0, scale: 1.0, duration: 0.45, ease: "power2.in" }, 0.85);
      
      // Core pulse expansion
      tl.to("#torus-path", { scale: 1.3, duration: 0.12, ease: "power3.out" }, 0.75);
      tl.to("#torus-path", { scale: 1.0, duration: 0.55, ease: "elastic.out(1, 0.4)" }, 0.87);
      
      // Shockwave ring explosion outwards
      tl.fromTo("#impact-wave", 
        { width: 10, height: 10, opacity: 0.85 },
        { width: 1100, height: 1100, opacity: 0, duration: 0.88, ease: "power3.out" },
        0.75
      );
      
      // Camera shake response
      H.screenShake(tl, "#root-inner", 0.75, 2.2);
      H.chromaticFlash(tl, "#chrom-wrap", "#chrom-r", "#chrom-b", 0.75, 2.4);
      
      // Particle burst on explosion frame
      const burstContainer = document.querySelector(".z-mg");
      H.particleBurst(tl, burstContainer, 540, 864, 0.75, 25, "#ff6b35", 4373);
      
      // Drift organic motion
      H.lifePulse(tl, ".center-core-wrap", D, { scaleAmp: 0.015, yAmp: 8, rotAmp: 0.4 });
      
      // Seek Logic
      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time);
        
        // Draw Plexus Network on Canvas relative to time (with orange tint matching peak explosion)
        if (plexusCanvas) {
          H.drawPlexus(plexusCanvas, time, "#ff6b35", "#ff9f1c", 437303);
        }
      });
      
      // Initial render
      if (plexusCanvas) {
        H.drawPlexus(plexusCanvas, 0, "#ff6b35", "#ff9f1c", 437303);
      }
      tl.seek(0);
      window.__timelines[CID] = tl;
    </script>
  </body>
</html>
