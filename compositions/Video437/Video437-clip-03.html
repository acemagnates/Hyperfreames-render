<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video437 Clip 03 — Cognitive Emission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      
      /* 3D Perspective Stage Container */
      .depth-stage {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 900px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      
      /* Depth Stack Classes */
      .z-bg, .z-light, .z-mg, .z-fg {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      
      .z-bg {
        transform: translateZ(-200px) scale(1.3);
      }
      
      .z-mg {
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 180px 90px;
        align-items: center;
      }
      
      .z-fg {
        transform: translateZ(140px) scale(0.85);
      }
      
      /* WebGL transparent layer */
      #three-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
      }
      
      /* Shockwave Expanding Ring */
      .shockwave-container {
        position: absolute;
        inset: 0;
        z-index: 15;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .shockwave-ring {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 4px solid rgba(255, 107, 53, 0.8); /* Orange shockwave */
        box-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
        transform: scale(0.1);
        opacity: 0;
      }
      
      /* Lens & Vignette */
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
        mix-blend-mode: multiply;
      }
      .ambient-flare {
        position: absolute;
        width: 1000px;
        height: 10px;
        background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.6), transparent);
        top: 50%;
        left: -100px;
        transform: translateY(-50%) rotate(-5deg);
        mix-blend-mode: screen;
        opacity: 0;
      }
      
      /* Ghost Wrapper for Title Slam */
      .ghost-wrapper {
        position: relative;
        text-align: center;
        margin-top: 200px;
      }
      .ghost-copy {
        position: absolute;
        inset: 0;
        opacity: 0;
        color: rgba(255, 107, 53, 0.4);
        -webkit-text-stroke: 1px rgba(255, 107, 53, 0.7);
        font-family: 'Oswald', sans-serif;
        font-size: 80px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .main-subject {
        font-family: 'Oswald', sans-serif;
        font-size: 80px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 30px rgba(255, 107, 53, 0.8);
        opacity: 0;
      }
      
      /* Header/Footer styling */
      .hud-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(255, 107, 53, 0.2);
        padding-bottom: 25px;
        font-family: 'Courier Prime', monospace;
        color: #ff6b35;
      }
      .hud-footer {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(255, 107, 53, 0.2);
        padding-top: 25px;
        font-family: 'Courier Prime', monospace;
        color: #ff6b35;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-03"
         data-start="10.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
         
      <!-- Audio file -->
      <audio id="bg-audio" src="../../test_12.mp3" data-start="10.0" data-duration="5.0" data-track-index="0" data-volume="1"></audio>
      
      <div class="depth-stage">
        
        <!-- L0: Environment Background WebGL Custom Shader -->
        <div class="z-bg">
          <canvas id="three-stage"></canvas>
        </div>
        
        <!-- L2: Hero Shockwave & Ghost Text Slam -->
        <div class="z-mg">
          <div class="hud-header">
            <div>
              <div style="font-family: 'Oswald', sans-serif; font-size: 32px; color: #fff; letter-spacing: 0.1em;">COGNITIVE SYNC</div>
              <div style="font-size: 14px; opacity: 0.8; letter-spacing: 0.2em; margin-top: 5px;">SECTOR // QUANTUM_EMISSION</div>
            </div>
            <div style="text-align: right; line-height: 1.6; font-size: 14px;">
              <div>EMISSION_RATIO: <span style="font-weight: 700;">8.42e5</span></div>
              <div>CELLS: <span style="color: #ff6b35;">9,992</span></div>
            </div>
          </div>
          
          <div class="ghost-wrapper">
            <div class="ghost-copy copy-0">EMISSION CORE</div>
            <div class="ghost-copy copy-1">EMISSION CORE</div>
            <div class="ghost-copy copy-2">EMISSION CORE</div>
            <h1 class="main-subject" id="slam-target">EMISSION CORE</h1>
          </div>
          
          <div class="hud-footer">
            <div style="font-size: 14px;">SYS_STABILIZED // OK</div>
            <div style="font-size: 14px; font-weight: 700;">PHASE_03 // EMISSION</div>
          </div>
        </div>
        
        <!-- L3: Lens Vignette, Ambient Lens Flare, Shockwave Ripple -->
        <div class="z-fg">
          <div class="lens-vignette"></div>
          <div class="ambient-flare" id="leak-streak"></div>
          <div class="shockwave-container">
            <div class="shockwave-ring" id="impact-wave"></div>
          </div>
        </div>
        
      </div>
    </div>

    <script>
      const duration = 5.0;
      const canvas = document.getElementById("three-stage");
      
      // Initialize Three.js Scene
      const scene = new THREE.Scene();
      
      // Camera matching FOV Perspective
      const fov = 2 * Math.atan((1920 / 2) / 900) * (180 / Math.PI);
      const camera = new THREE.PerspectiveCamera(fov, 1080 / 1920, 0.1, 1000);
      camera.position.set(0, 0, 7.5);
      
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      const glAvailable = isWebGLAvailable();
      if (glAvailable) {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Custom seekable 3D ShaderMaterial (Fresnel Glow + Dynamic Vertex Displace)
      const customShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: new THREE.Color(0xff6b35) } // Orange emissive glow
        },
        vertexShader: `
          uniform float uTime;
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            // Dynamic vertex displace waves
            vec3 displaced = position + normal * sin(position.x * 2.0 + position.y * 2.0 + uTime * 2.5) * 0.15;
            vPosition = displaced;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            // Glow calculation based on viewing angle (Fresnel)
            float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
            vec3 glowColor = uColor * intensity * 2.0;
            gl_FragColor = vec4(glowColor, intensity);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending
      });
      
      // Geometry: Detailed TorusKnot
      const knotGeo = new THREE.TorusKnotGeometry(1.6, 0.45, 120, 16);
      const knotMesh = new THREE.Mesh(knotGeo, customShaderMaterial);
      scene.add(knotMesh);
      
      // seek-driven render loop
      function renderAt(time) {
        if (!glAvailable) return;
        // Update shader time uniforms deterministically
        customShaderMaterial.uniforms.uTime.value = time;
        
        // mesh rotations
        knotMesh.rotation.y = time * 0.4;
        knotMesh.rotation.x = Math.cos(time * 0.3) * 0.35;
        
        // Camera slow orbit breathing
        camera.position.x = Math.sin(time * 0.1) * 7.5;
        camera.position.z = Math.cos(time * 0.1) * 7.5;
        camera.position.y = Math.sin(time * 0.2) * 0.6;
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      // GSAP Timelines Setup (seeking contract)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Ken burns background
      tl.fromTo(".z-bg", { scale: 1.25 }, { scale: 1.45, duration: duration, ease: "sine.inOut" }, 0);
      
      // Impact Frame Slam (t=0.6s)
      tl.fromTo(".main-subject", 
        { y: -300, scale: 2.0, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 1.0, duration: 0.5, ease: "power4.out" },
        0.6
      );
      
      // Afterimages (Ghost trail) staggered
      tl.fromTo(".copy-0", 
        { y: -300, scale: 2.0, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 0.4, duration: 0.4, ease: "power3.out" },
        0.62
      );
      tl.to(".copy-0", { opacity: 0, duration: 0.2 }, 1.02);
      
      tl.fromTo(".copy-1", 
        { y: -300, scale: 2.0, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 0.25, duration: 0.3, ease: "power3.out" },
        0.64
      );
      tl.to(".copy-1", { opacity: 0, duration: 0.2 }, 0.94);
      
      tl.fromTo(".copy-2", 
        { y: -300, scale: 2.0, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 0.15, duration: 0.25, ease: "power3.out" },
        0.66
      );
      tl.to(".copy-2", { opacity: 0, duration: 0.2 }, 0.91);
      
      // Shockwave ring explosion trigger at t=1.1s (slam impact hits zero)
      tl.fromTo("#impact-wave",
        { scale: 0.1, opacity: 0.9, borderWidth: "5px" },
        { scale: 6.0, opacity: 0, borderWidth: "0.5px", duration: 0.8, ease: "power3.out" },
        1.1
      );
      
      // Ambient lens flare flash on impact
      tl.fromTo("#leak-streak", 
        { opacity: 0, left: "-150px" },
        { opacity: 0.85, left: "50px", duration: 1.5, ease: "power2.out" },
        1.1
      );
      
      window.addEventListener("hf-seek", (event) => {
        const t = event.detail.time;
        tl.seek(t);
        renderAt(t);
      });
      
      // First frame render
      renderAt(0);
      tl.seek(0);
    </script>
  </body>
</html>
