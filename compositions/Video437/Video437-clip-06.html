<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video437 Clip 06 — Genesis Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020306;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      
      /* 3D Perspective Stage Container */
      .depth-stage {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 900px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      
      /* Depth Stack Classes */
      .z-bg, .z-mg, .z-fg {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      
      .z-bg {
        transform: translateZ(-200px) scale(1.3);
      }
      
      .z-mg {
        transform: translateZ(0);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 180px 90px;
        align-items: center;
      }
      
      .z-fg {
        transform: translateZ(100px) scale(0.9);
      }
      
      /* WebGL transparent layer */
      #three-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
      }
      
      /* Lens & Vignette */
      .lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
        mix-blend-mode: multiply;
      }
      
      /* Glowing grid texture in foreground */
      .hud-grid-overlay {
        position: absolute;
        inset: 0;
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(0, 255, 136, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 255, 136, 0.02) 1px, transparent 1px);
        mix-blend-mode: screen;
      }
      
      /* Final System Complete Reveal */
      .completion-card {
        background: rgba(3, 7, 13, 0.75);
        border: 1px solid rgba(0, 255, 136, 0.3);
        box-shadow: 0 0 45px rgba(0, 255, 136, 0.2);
        border-radius: 12px;
        padding: 60px 40px;
        text-align: center;
        margin-top: 150px;
        opacity: 0;
        transform: scale(0.8) translateY(100px);
        width: 100%;
      }
      
      .completion-status {
        font-family: 'Courier Prime', monospace;
        font-size: 16px;
        letter-spacing: 0.3em;
        color: #00ff88;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      }
      
      .completion-headline {
        font-family: 'Oswald', sans-serif;
        font-size: 54px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.08em;
        margin-top: 20px;
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
      }
      
      /* Brackets in foreground */
      .brackets {
        position: absolute;
        inset: 60px;
        border: 1px solid rgba(0, 255, 136, 0.05);
      }
      .bracket {
        position: absolute;
        width: 35px;
        height: 35px;
        border: 2.5px solid #00ff88;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
      }
      .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      
      /* Header/Footer styling */
      .hud-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        padding-bottom: 25px;
        font-family: 'Courier Prime', monospace;
        color: #00ff88;
      }
      .hud-title {
        font-family: 'Oswald', sans-serif;
        font-size: 38px;
        letter-spacing: 0.12em;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
      }
      .hud-footer {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(0, 255, 136, 0.2);
        padding-top: 25px;
        font-family: 'Courier Prime', monospace;
        color: #00ff88;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="Video437-clip-06"
         data-start="25.0"
         data-duration="5.0"
         data-width="1080"
         data-height="1920"
         data-fps="60">
         
      <!-- Audio file -->
      <audio id="bg-audio" src="../../test_12.mp3" data-start="25.0" data-duration="5.0" data-track-index="0" data-volume="1"></audio>
      
      <div class="depth-stage">
        
        <!-- L0: Environment Background WebGL Crystalbrain core -->
        <div class="z-bg">
          <canvas id="three-stage"></canvas>
        </div>
        
        <!-- L2: Grand final Complete Card HUD -->
        <div class="z-mg">
          <div class="hud-header">
            <div>
              <h1 class="hud-title">GENESIS ARCHITECTURE</h1>
              <div style="font-size: 14px; opacity: 0.8; letter-spacing: 0.2em; margin-top: 5px;">SECTOR // GENESIS_ARCHITECTURE</div>
            </div>
            <div style="text-align: right; line-height: 1.6; font-size: 14px;">
              <div>ARCH_CORE: <span style="font-weight: 700;">SYNTHESIZED</span></div>
              <div>STABILITY: <span style="color: #00ff88;">100.00%</span></div>
            </div>
          </div>
          
          <div class="completion-card">
            <div class="completion-status">SYSTEM_INTEGRATION_OK</div>
            <h2 class="completion-headline">GENESIS COMPLETE</h2>
          </div>
          
          <div class="hud-footer">
            <div style="font-size: 14px;">NEURAL_NET // RUNNING</div>
            <div style="font-size: 14px; font-weight: 700;">PHASE_06 // COMPLETE</div>
          </div>
        </div>
        
        <!-- L3: Lens Vignette, Grid Overlay, corner brackets -->
        <div class="z-fg">
          <div class="lens-vignette"></div>
          <div class="hud-grid-overlay"></div>
          <div class="brackets">
            <div class="bracket tl"></div>
            <div class="bracket tr"></div>
            <div class="bracket bl"></div>
            <div class="bracket br"></div>
          </div>
        </div>
        
      </div>
    </div>

    <script>
      const duration = 5.0;
      const canvas = document.getElementById("three-stage");
      
      // Initialize Three.js Scene
      const scene = new THREE.Scene();
      
      // Camera matching FOV Perspective
      const fov = 2 * Math.atan((1920 / 2) / 900) * (180 / Math.PI);
      const camera = new THREE.PerspectiveCamera(fov, 1080 / 1920, 0.1, 1000);
      camera.position.set(0, 0, 7.5);
      
      let renderer;
      function isWebGLAvailable() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }
      
      const glAvailable = isWebGLAvailable();
      if (glAvailable) {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(1080, 1920);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
      } else {
        renderer = { render: () => {}, setSize: () => {} };
      }
      
      // Dramatic PBR Lighting rig
      const keyLight = new THREE.SpotLight(0x00ff88, 30); // Neon Mint Key
      keyLight.position.set(6, 6, 6);
      keyLight.angle = Math.PI / 6;
      keyLight.penumbra = 0.8;
      scene.add(keyLight);
      
      const fillLight = new THREE.DirectionalLight(0x00d4ff, 5.0); // Cyan Fill
      fillLight.position.set(-6, -2, 4);
      scene.add(fillLight);
      
      const rimLight = new THREE.SpotLight(0xffffff, 40); // Rim spotlight behind crystal
      rimLight.position.set(0, 6, -8);
      scene.add(rimLight);
      
      // Procedural 3D Malleable Crystal Core (High transmission & Clearcoat)
      const crystalGeo = new THREE.IcosahedronGeometry(2.0, 3); // faceted look
      const crystalMat = new THREE.MeshPhysicalMaterial({
        color: 0x00ff88,
        roughness: 0.05,
        metalness: 0.1,
        transmission: 0.9,
        thickness: 2.0,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        transparent: true,
        opacity: 0.95
      });
      const crystalMesh = new THREE.Mesh(crystalGeo, crystalMat);
      scene.add(crystalMesh);
      
      const baseCrystalPos = crystalGeo.attributes.position.clone();
      
      // Star field surrounding core
      const particleCount = 70;
      const partGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];
      
      let pSeed = 5555;
      function prng() {
        let t = pSeed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      
      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (prng() - 0.5) * 8;
        positions[i+1] = (prng() - 0.5) * 12;
        positions[i+2] = (prng() - 0.5) * 6;
        velocities.push((prng() + 0.1) * 0.4);
      }
      
      partGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const partMat = new THREE.PointsMaterial({
        color: 0xffd700,
        size: 0.1,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending
      });
      const sparkField = new THREE.Points(partGeo, partMat);
      scene.add(sparkField);
      
      function renderAt(time) {
        if (!glAvailable) return;
        
        // 1. Slow, malleable crystal facet deformation breathing
        const posAttr = crystalGeo.attributes.position;
        const tempV = new THREE.Vector3();
        
        for (let i = 0; i < posAttr.count; i++) {
          tempV.fromBufferAttribute(baseCrystalPos, i);
          
          const noise = Math.sin(tempV.x * 1.5 + time * 1.2) * 
                        Math.cos(tempV.y * 1.5 + time * 1.0) * 0.15;
                        
          const normal = tempV.clone().normalize();
          tempV.addScaledVector(normal, noise);
          posAttr.setXYZ(i, tempV.x, tempV.y, tempV.z);
        }
        posAttr.needsUpdate = true;
        crystalGeo.computeVertexNormals();
        
        // mesh rotations
        crystalMesh.rotation.y = time * 0.25;
        crystalMesh.rotation.x = Math.cos(time * 0.15) * 0.2;
        
        // Spark floating animation
        const coords = partGeo.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          const idx = i * 3;
          const speed = velocities[i];
          coords[idx+1] = ((positions[idx+1] + time * speed + 6) % 12) - 6;
        }
        partGeo.attributes.position.needsUpdate = true;
        
        // Slow camera crane up/in
        camera.position.x = Math.sin(time * 0.08) * 7.5;
        camera.position.z = Math.cos(time * 0.08) * 7.5;
        camera.position.y = 1.0 - time * 0.25; // Crane down slowly
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      // GSAP Timelines Setup (seeking contract)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Ken burns scaling
      tl.fromTo(".z-bg", { scale: 1.25 }, { scale: 1.45, duration: duration, ease: "sine.inOut" }, 0);
      
      // Grand final complete card entrance slam (hits at t=1.2s)
      tl.fromTo(".completion-card",
        { opacity: 0, scale: 0.75, y: 100 },
        { opacity: 1.0, scale: 1.0, y: 0, duration: 1.5, ease: "elastic.out(1, 0.75)" },
        1.0
      );
      
      // Pulse brackets on completion impact
      tl.fromTo(".brackets",
        { inset: "80px", opacity: 0.1 },
        { inset: "60px", opacity: 0.8, duration: 0.8, ease: "power4.out" },
        1.0
      );
      
      window.addEventListener("hf-seek", (event) => {
        const t = event.detail.time;
        tl.seek(t);
        renderAt(t);
      });
      
      // First frame render
      renderAt(0);
      tl.seek(0);
    </script>
  </body>
</html>
