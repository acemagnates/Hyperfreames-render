<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Fusion30 Clip 01</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="compositions/Fusion30/fusion30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d,#canvas2d{position:absolute;inset:0;width:1080px;height:1920px}
    #canvas3d{z-index:1}#canvas2d{z-index:2;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 35%,transparent 30%,rgba(0,0,0,.55) 100%);pointer-events:none}
    #grain{position:absolute;inset:0;z-index:4;opacity:.2;mix-blend-mode:overlay;pointer-events:none}
    #cap{position:absolute;top:88px;left:64px;z-index:5;font-family:'Oswald',sans-serif;font-size:32px;color:#F4F1EA;letter-spacing:.1em;text-shadow:0 4px 12px rgba(0,0,0,.5)}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Fusion30-clip-01" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <canvas id="canvas2d" class="clip" data-start="0" data-duration="5" data-track-index="1" width="1080" height="1920"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="3" width="540" height="960"></canvas>
    <div id="cap" class="clip" data-start="0" data-duration="5" data-track-index="4">FUSION // BLUEPRINT + OBELISK</div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Fusion30-clip-01",D=5,F=window.Fusion30;
    F.registerEases(gsap);
    const tl=gsap.timeline({paused:true});
    gsap.set("#cap",{opacity:0,y:-20});tl.to("#cap",{opacity:1,y:0,duration:.8,ease:"springSnappy"},.25);
    F.initFilmGrain(document.getElementById("grain"),.2,401);
    const r3=F.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=F.createSceneCamera();
    F.addLights(scene);F.addFloor(scene);
    const g=new THREE.Group();scene.add(g);
    const ob=new THREE.Mesh(new THREE.CylinderGeometry(.85,1.3,6.5,6),F.goldMat(.4));
    ob.position.y=1;g.add(ob);
    const st={bp:0};
    tl.to(st,{bp:1,duration:2.8,ease:"power2.inOut"},.4);
    function seek(p){
      const scale=p<.3?THREE.MathUtils.lerp(.08,1,p/.3):1;
      g.scale.setScalar(scale);g.rotation.y=p*Math.PI*1.1;
      F.orbitCamera(camera,p,{radius0:22,radius1:13,y0:8,y1:3.5,turns:.75});
      r3.render(scene,camera);
      F.drawBlueprint(document.getElementById("canvas2d"),st.bp,p*D);
    }
    window.addEventListener("hf-seek",e=>{const t=e.detail.time;tl.seek(t);seek(t/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
