<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Fusion30 Clip 02</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Fusion30/fusion30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d,#canvas2d{position:absolute;inset:0;width:1080px;height:1920px}
    #canvas3d{z-index:1}#canvas2d{z-index:2;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 32%,rgba(0,0,0,.5) 100%)}
    #grain{position:absolute;inset:0;z-index:4;opacity:.2;mix-blend-mode:overlay}
    #cap{position:absolute;bottom:110px;left:64px;z-index:5;font-family:'Oswald',sans-serif;font-size:28px;color:#F4F1EA}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Fusion30-clip-02" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <canvas id="canvas2d" class="clip" data-start="0" data-duration="5" data-track-index="1" width="1080" height="1920"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="3" width="540" height="960"></canvas>
    <div id="cap" class="clip" data-start="0" data-duration="5" data-track-index="4">2D MAP + 3D GLOBE</div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Fusion30-clip-02",D=5,F=window.Fusion30;
    const tl=gsap.timeline({paused:true});
    gsap.set("#cap",{opacity:0});tl.to("#cap",{opacity:1,duration:.7},1.2);
    F.initFilmGrain(document.getElementById("grain"),.2,402);
    const r3=F.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=F.createSceneCamera();
    F.addLights(scene);F.addFloor(scene);
    const globe=new THREE.Group();scene.add(globe);
    globe.add(new THREE.Mesh(new THREE.SphereGeometry(2.8,28,28),new THREE.MeshStandardMaterial({color:0x2a2218,wireframe:true})));
    const ring=new THREE.Mesh(new THREE.TorusGeometry(2.9,.05,8,64),new THREE.MeshStandardMaterial({color:0xe56b6f,emissive:0x662222,emissiveIntensity:.5}));
    ring.rotation.y=Math.PI/2;globe.add(ring);
    const st={m:0};tl.to(st,{m:1,duration:3,ease:"power2.inOut"},.2);
    function seek(p){globe.rotation.y=p*Math.PI*1.6;F.orbitCamera(camera,p,{radius0:17,radius1:10,y0:5,y1:2.5,turns:1});r3.render(scene,camera);F.drawMapOverlay(document.getElementById("canvas2d"),st.m,p*D);}
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
