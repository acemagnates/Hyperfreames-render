<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Fusion30 Clip 06</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Fusion30/fusion30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d{position:absolute;inset:0;z-index:1}
    #payoff{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;text-align:center;max-width:900px;pointer-events:none}
    #payoff h1{font-family:'Playfair Display',serif;font-size:56px;color:#F4F1EA;line-height:1.08;text-shadow:0 4px 16px rgba(0,0,0,.55)}
    #payoff em{font-style:italic;color:#E56B6F}
    #payoff p{margin-top:22px;font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:.24em;color:#BB9457}
    #vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,.62) 100%)}
    #grain{position:absolute;inset:0;z-index:4;opacity:.2;mix-blend-mode:overlay}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Fusion30-clip-06" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <div id="payoff" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <h1 id="l1">Ink and<br><em>geometry.</em></h1>
      <p id="l2">FUSION30</p>
    </div>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="3" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Fusion30-clip-06",D=5,F=window.Fusion30;
    F.registerEases(gsap);
    const tl=gsap.timeline({paused:true});
    gsap.set("#l1,#l2",{opacity:0,y:28});
    tl.to("#l1",{opacity:1,y:0,duration:.85,ease:"springHeavy"},.85);
    tl.to("#l2",{opacity:.9,y:0,duration:.6},1.35);
    F.initFilmGrain(document.getElementById("grain"),.2,406);
    const r3=F.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=F.createSceneCamera();
    F.addLights(scene);F.addFloor(scene);
    const chamber=new THREE.Group();scene.add(chamber);
    for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.65,8,8),new THREE.MeshStandardMaterial({color:0x3d342c,roughness:.95}));const a=(i/4)*Math.PI*2+Math.PI/4;c.position.set(Math.cos(a)*6.5,-.2,Math.sin(a)*6.5);chamber.add(c);}
    const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.3,.3,100,14),F.goldMat(.45));
    knot.position.y=1.4;chamber.add(knot);
    function seek(p){
      const rev=p<.35?THREE.MathUtils.lerp(.15,1,p/.35):1;
      chamber.scale.setScalar(rev);chamber.rotation.y=p*Math.PI*.55;
      F.orbitCamera(camera,p,{radius0:24,radius1:15,y0:7,y1:4,turns:.5});
      r3.render(scene,camera);
    }
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
