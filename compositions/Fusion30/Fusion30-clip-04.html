<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Fusion30 Clip 04</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Fusion30/fusion30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d,#canvas2d{position:absolute;inset:0;width:1080px;height:1920px}
    #canvas3d{z-index:1}#canvas2d{z-index:2;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.52) 100%)}
    #grain{position:absolute;inset:0;z-index:4;opacity:.2;mix-blend-mode:overlay}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Fusion30-clip-04" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <canvas id="canvas2d" class="clip" data-start="0" data-duration="5" data-track-index="1" width="1080" height="1920"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="3" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Fusion30-clip-04",D=5,F=window.Fusion30;
    const tl=gsap.timeline({paused:true});
    F.initFilmGrain(document.getElementById("grain"),.2,404);
    const r3=F.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=F.createSceneCamera();
    F.addLights(scene);F.addFloor(scene);
    const tablets=[];const mat=new THREE.MeshStandardMaterial({color:0xF4F1EA,roughness:.9});
    for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(1,1.4,.15),mat);m.userData.i=i;scene.add(m);tablets.push(m);}
    const st={c:0};tl.to(st,{c:1,duration:3.5,ease:"power2.inOut"},.1);
    function seek(p){
      tablets.forEach((m,i)=>{const a=(i/8)*Math.PI*2+p*1.5;const r=5.2;m.position.set(Math.cos(a)*r,Math.sin(p*2+i)*.6,Math.sin(a)*r);m.rotation.y=-a;});
      F.orbitCamera(camera,p,{radius0:19,radius1:12,y0:6,y1:3,turns:.95});
      r3.render(scene,camera);
      F.drawCoordOverlay(document.getElementById("canvas2d"),st.c);
    }
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
