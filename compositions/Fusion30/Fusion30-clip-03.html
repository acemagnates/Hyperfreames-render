<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>Fusion30 Clip 03</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/Fusion30/fusion30-shared.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#14100e}
    #root{position:relative;width:1080px;height:1920px}
    #canvas3d,#canvas2d{position:absolute;inset:0;width:1080px;height:1920px}
    #canvas3d{z-index:1}#canvas2d{z-index:2;pointer-events:none}
    #vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.58) 100%)}
    #grain{position:absolute;inset:0;z-index:4;opacity:.22;mix-blend-mode:overlay}
  </style>
</head>
<body>
  <div id="root" data-composition-id="Fusion30-clip-03" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <canvas id="canvas3d" class="clip" data-start="0" data-duration="5" data-track-index="0"></canvas>
    <canvas id="canvas2d" class="clip" data-start="0" data-duration="5" data-track-index="1" width="1080" height="1920"></canvas>
    <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="3" width="540" height="960"></canvas>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const CID="Fusion30-clip-03",D=5,F=window.Fusion30;
    const tl=gsap.timeline({paused:true});
    F.initFilmGrain(document.getElementById("grain"),.22,403);
    const r3=F.createRenderer(document.getElementById("canvas3d"));
    const {scene,camera}=F.createSceneCamera();
    F.addLights(scene);F.addFloor(scene);
    const arm=new THREE.Group();scene.add(arm);
    [0,Math.PI/2,Math.PI/3].forEach((rx,i)=>{const t=new THREE.Mesh(new THREE.TorusGeometry(3+i*.3,.07,10,64),F.goldMat(.2));t.rotation.x=rx;arm.add(t);});
    const st={t:0};tl.to(st,{t:1,duration:3.2,ease:"power1.inOut"},.15);
    function seek(p){arm.rotation.y=p*Math.PI*2;F.orbitCamera(camera,p,{radius0:16,radius1:11,y0:5,y1:3,turns:1});r3.render(scene,camera);F.drawTelegramOverlay(document.getElementById("canvas2d"),st.t);}
    window.addEventListener("hf-seek",e=>{tl.seek(e.detail.time);seek(e.detail.time/D);});
    seek(0);tl.seek(0);window.__timelines[CID]=tl;
  </script>
</body>
</html>
