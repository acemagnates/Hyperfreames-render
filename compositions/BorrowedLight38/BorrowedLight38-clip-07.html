<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>BorrowedLight38 Clip 07 — LADDER CLIMB REACH</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="compositions/_shared/gsap.min.js"></script>
  <script src="compositions/_shared/CustomEase.min.js"></script>
  <script src="compositions/_shared/motion-engine-utils.js"></script>
  <script src="compositions/BorrowedLight38/borrowedlight38-shared.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #121816; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .solid-bg { position: absolute; inset: 0; background: #121816; z-index: 0; }
    .depth-stage {
      position: absolute; inset: 0; z-index: 1;
      perspective: 1100px; perspective-origin: 50% 38%;
      transform-style: preserve-3d;
    }
    #cam.camera-rig {
      position: absolute; inset: 0;
      transform-style: preserve-3d; transform-origin: 50% 38%;
    }
    .plate-stage { position: absolute; inset: 0; z-index: 1; }
    .plate { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; }
    .z-bg {
      position: absolute; inset: -8%;
      transform: translateZ(-280px) scale(1.52);
      transform-style: preserve-3d; z-index: 1;
      pointer-events: none;
    }
    .moon-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(110, 127, 140, 0.55) 0%, rgba(110, 127, 140, 0.18) 22%, transparent 48%);
      mix-blend-mode: screen;
    }
    .z-mg {
      position: absolute; inset: 0; z-index: 2;
      transform: translateZ(0); transform-style: preserve-3d;
    }
    .ladder-rails {
      position: absolute; left: 50%; top: 0; width: 420px; height: 100%;
      transform: translateX(-50%);
      overflow: visible;
    }
    .rail-line {
      fill: none; stroke: #E6DFD2; stroke-width: 4;
      stroke-linecap: round; opacity: 0.72;
    }
    .rail-rung {
      fill: none; stroke: #2A332E; stroke-width: 3;
      stroke-linecap: round; opacity: 0.55;
    }
    .chapter-tag {
      position: absolute; left: 56px; top: 108px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px; font-weight: 600; letter-spacing: 0.36em;
      color: #6E7F8C;
    }
    .z-fg-decor {
      position: absolute; inset: 0; z-index: 3;
      transform: translateZ(88px); transform-style: preserve-3d;
      pointer-events: none; overflow: hidden;
    }
    .cloud-layer {
      position: absolute; width: 140%; height: 38%;
      opacity: 0.22;
      background: radial-gradient(ellipse 45% 80% at 30% 50%, rgba(230, 223, 210, 0.35), transparent 70%);
    }
    .cloud-a { top: 18%; left: -20%; }
    .cloud-b {
      top: 52%; left: -30%;
      background: radial-gradient(ellipse 50% 70% at 70% 40%, rgba(110, 127, 140, 0.28), transparent 68%);
      opacity: 0.18;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="BorrowedLight38-clip-07" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
    <div class="solid-bg clip" data-start="0" data-duration="5" data-track-index="0"></div>
    <div class="depth-stage clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="plate-stage clip" data-start="0" data-duration="5" data-track-index="2">
        <img class="plate grade-target" src="assets/BorrowedLight38/plates/ladder-vertical.jpg" alt="" width="1080" height="1920" />
      </div>
      <div id="cam" class="camera-rig clip" data-start="0" data-duration="5" data-track-index="3">
        <div class="z-bg clip" data-start="0" data-duration="5" data-track-index="4">
          <div class="moon-gradient clip" data-decorative="ambient" data-start="0" data-duration="5" data-track-index="4a"></div>
        </div>
        <div class="z-mg clip" data-start="0" data-duration="5" data-track-index="5">
          <div class="chapter-tag clip" data-start="0" data-duration="5" data-track-index="6">LADDER · REACH</div>
          <svg class="ladder-rails clip" data-start="0" data-duration="5" data-track-index="7" viewBox="0 0 420 1920" aria-hidden="true">
            <line class="rail-line" x1="118" y1="80" x2="118" y2="1840" />
            <line class="rail-line" x1="302" y1="80" x2="302" y2="1840" />
            <g id="rungs">
              <line class="rail-rung" x1="118" y1="280" x2="302" y2="280" />
              <line class="rail-rung" x1="118" y1="480" x2="302" y2="480" />
              <line class="rail-rung" x1="118" y1="680" x2="302" y2="680" />
              <line class="rail-rung" x1="118" y1="880" x2="302" y2="880" />
              <line class="rail-rung" x1="118" y1="1080" x2="302" y2="1080" />
              <line class="rail-rung" x1="118" y1="1280" x2="302" y2="1280" />
              <line class="rail-rung" x1="118" y1="1480" x2="302" y2="1480" />
              <line class="rail-rung" x1="118" y1="1680" x2="302" y2="1680" />
            </g>
          </svg>
          <div id="kest-host"></div>
          <div id="lantern-host"></div>
        </div>
        <div class="z-fg-decor clip" data-start="0" data-duration="5" data-track-index="8">
          <div class="cloud-layer cloud-a clip" data-start="0" data-duration="5" data-track-index="9"></div>
          <div class="cloud-layer cloud-b clip" data-start="0" data-duration="5" data-track-index="10"></div>
        </div>
      </div>
    </div>
    <div id="vig" class="clip" data-start="0" data-duration="5" data-track-index="80"
      style="position:absolute;inset:0;z-index:80;pointer-events:none;background:radial-gradient(ellipse 78% 68% at 50% 36%,transparent 24%,rgba(18,24,22,0.9) 100%)"></div>
    <canvas id="grain" class="clip" data-start="0" data-duration="5" data-track-index="91" width="540" height="960"
      style="position:absolute;inset:0;z-index:90;width:100%;height:100%;opacity:0.18;mix-blend-mode:overlay;pointer-events:none"></canvas>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    function initClip07() {
      const CID = "BorrowedLight38-clip-07";
      const D = 5;
      const ME = window.MotionEngine;
      const BL = window.BorrowedLight38;
      if (!ME || !BL) return;

      BL.registerEases(gsap);
      ME.registerEases(gsap);
      const tl = ME.makeTimeline(CID);
      const crush = ME.applyCrushGrade(document.querySelector(".grade-target"));

      ME.initGrain(document.getElementById("grain"), 0.18, 3807);
      ME.wireCrushGrade(tl, crush, D, 0.12, {
        from: { contrast: 0.94, saturate: 0.88, brightness: 0.92 },
        to: { contrast: 1.12, saturate: 1.08, brightness: 1.02 },
        duration: 2.4,
      });
      ME.ambientDecorativePulse(tl, "[data-decorative=ambient]", D, { at: 0.2, repeats: 4 });
      BL.wireCamera(tl, "#cam", D);

      const mg = document.querySelector(".z-mg");
      const kest = BL.silhouette("kest", "reach", {
        x: 540, y: 1000, w: 132, h: 176,
        start: 0, duration: 5, trackIndex: 11,
      });
      const lantern = BL.lantern({
        x: 540, y: 640, w: 76, h: 100,
        start: 0, duration: 5, trackIndex: 12,
      });
      if (kest && mg) mg.appendChild(kest);
      if (lantern && mg) mg.appendChild(lantern);

      gsap.set(".chapter-tag", { opacity: 0, y: -12 });
      tl.to(".chapter-tag", { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.08);

      gsap.set(".rail-line", { scaleY: 0.92, transformOrigin: "50% 0%", opacity: 0.35 });
      tl.to(".rail-line", { scaleY: 1, opacity: 0.85, duration: 1.1, ease: "power2.inOut" }, 0.15);
      tl.to(".ladder-rails", { y: "-=140", duration: D - 0.6, ease: "power1.inOut" }, 0.3);
      gsap.set("#rungs line", { scaleX: 0, transformOrigin: "50% 50%", opacity: 0 });
      tl.to("#rungs line", {
        scaleX: 1, opacity: 0.6, duration: 0.45, stagger: 0.06, ease: "power2.out",
      }, 0.28);

      if (kest) {
        gsap.set(kest, { y: 1020 });
        tl.to(kest, { y: 1000, duration: 1.2, ease: "sine.inOut" }, 0.2);
        tl.to(kest, { rotateZ: -2, duration: 0.8, ease: "sine.inOut" }, 0.85);
        tl.to(kest, { rotateZ: 0, duration: 0.6, ease: "sine.inOut" }, 1.65);
      }

      if (lantern) {
        gsap.set(lantern, { y: 560 });
        tl.to(lantern, { y: 720, duration: 1.0, ease: "blSnap" }, 1.0);
        tl.to(".lantern-glass", { boxShadow: "0 0 56px rgba(212,180,131,0.65)", duration: 0.35, ease: "power2.out" }, 1.0);
        tl.to(".lantern-seed", { scale: 1.35, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.05);
      }

      tl.fromTo(".cloud-a", { x: 48 }, { x: -72, duration: D, ease: "none" }, 0);
      tl.fromTo(".cloud-b", { x: -36 }, { x: 88, duration: D * 0.98, ease: "none" }, 0.06);
      tl.fromTo(".moon-gradient", { opacity: 0.55 }, { opacity: 0.92, duration: 2.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.4);

      ME.sineBreathe(tl, ".plate-stage", D, { delay: 1.4, scalePeriod: 2.6, scaleAmp: 0.007 });
      ME.sineBreathe(tl, lantern || ".lantern-prop", D, { delay: 1.8, scalePeriod: 2.1, scaleAmp: 0.014 });

      tl.seek(0);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initClip07);
    else initClip07();
  </script>
</body>
</html>
