# Fallback / stability path: Dockerized Chromium + low matrix parallelism (less CPU contention).
# Dispatch from GitHub Actions when the default matrix is flaky on hosted runners.
name: Render CALENDAR-654 clips (fast / stable)

on:
  workflow_dispatch:
    inputs:
      render_quality:
        description: "hyperframes --quality"
        type: choice
        options: [draft, standard]
        default: draft
      render_fps:
        description: "hyperframes --fps"
        type: choice
        options: ["30", "60"]
        default: "30"

concurrency:
  group: render-calendar-654-fast
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PROJECT_ID: "CALENDAR-654"
  HF_VERSION: "0.5.5"
  RENDER_RETRIES: "2"
  RENDER_RETRY_SLEEP_SEC: "3"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RENDER_QUALITY: ${{ inputs.render_quality }}
      RENDER_FPS: ${{ inputs.render_fps }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        clip:
          - compositions/CALENDAR-654/CALENDAR-654-clip-01-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-02-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-03-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-04-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-05-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-06-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-07-MG.html
          - compositions/CALENDAR-654/CALENDAR-654-clip-08-MG.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-hf-${{ env.HF_VERSION }}-${{ hashFiles('.github/workflows/render-calendar-654-fast.yml') }}
      - name: Install FFmpeg (apt; avoids flaky third-party release downloads)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install HyperFrames CLI
        run: npm install -g hyperframes@${{ env.HF_VERSION }}

      - name: Render clip (Docker)
        id: render
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -u
          BASENAME=$(basename "${{ matrix.clip }}" .html)
          OUTDIR="renders/out/${PROJECT_ID}"
          mkdir -p "$OUTDIR"
          OUT="$OUTDIR/${BASENAME}.mp4"
          ok=0
          max="${RENDER_RETRIES:-2}"
          sleep_sec="${RENDER_RETRY_SLEEP_SEC:-3}"
          for attempt in $(seq 1 "$max"); do
            echo "=== Render attempt ${attempt}/${max}: ${{ matrix.clip }} (quality=${RENDER_QUALITY} fps=${RENDER_FPS}) ==="
            if hyperframes render . --docker --composition "${{ matrix.clip }}" \
              --fps "${RENDER_FPS}" --quality "${RENDER_QUALITY}" --workers 1 --output "$OUT"; then
              ok=1
              break
            fi
            echo ">>> Attempt ${attempt} failed — retrying in ${sleep_sec}s…"
            if [[ "$attempt" -lt "$max" ]]; then
              sleep "$sleep_sec"
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "All render attempts failed for ${{ matrix.clip }}"
            exit 1
          fi
          echo "outpath=$OUT" >> "$GITHUB_OUTPUT"
          echo "artname=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Upload clip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.render.outputs.artname }}
          path: ${{ steps.render.outputs.outpath }}
          retention-days: 7
