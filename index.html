<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video434 — The Glass Prison</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      #composition-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      #global-hud {
        position: absolute; inset: 0; z-index: 100; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 88px 64px; font-family: 'Courier Prime', monospace; color: #c9a84c;
      }
      .hud-row { display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 0.16em; }
      .hud-clock { color: #ffffff; font-size: 18px; }
      .letterbox { position: absolute; left: 0; width: 1080px; height: 36px; background: #000000; z-index: 110; }
      .lb-top { top: 0; }
      .lb-bottom { bottom: 0; }
    </style>
  </head>
  <body>
    <div
      id="composition-root"
      data-composition-id="Video434"
      data-start="0"
      data-duration="61.50"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div class="letterbox lb-top"></div>
      <div class="letterbox lb-bottom"></div>

      <!-- Audio Track -->
      <audio
        id="narration"
        src="Test_14.mp3"
        data-start="0"
        data-duration="58.50"

      ></audio>

      <!-- Video Clips -->
      <iframe
        class="clip"

        data-composition-src="compositions/Video434/Video434-clip-01.html"
        data-start="0"

        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>
      <iframe

        data-start="10.00"

      ></iframe>

        data-composition-src="compositions/Video434/Video434-clip-03.html"

        data-duration="8.50"

      ></iframe>

        data-duration="10.50"
        data-track-index="7"

      ></iframe>

      <div id="global-hud">
        <div class="hud-row">
          <span>VIDEO434 // THE GLASS PRISON</span>
          <span id="hud-time" class="hud-clock">00:00.0</span>
        </div>
        <div class="hud-row">
          <span id="hud-chapter">I — THE HOOK</span>
          <span>61.50s CINEMATIC</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["Video434"] = gsap.timeline({ paused: true });
      const chapters = [
        [0, "I — THE HOOK"],
        [10.00, "II — DOME RECONSTRUCT"],
        [14.50, "III — RESPIRATION CRISIS"],
        [23.00, "IV — THE TRILLIONS SWARM"],
        [35.00, "V — CONCRETE ABSORPTION"],
        [45.99, "VI — PRISTINE PRISON"],
        [51.00, "VII — THE DIRT WINS"],
      ];
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        const sec = Math.floor(t).toString().padStart(2, "0");
        const dec = Math.floor((t % 1) * 10);
        document.getElementById("hud-time").textContent = `00:${sec}.${dec}`;
        let ch = chapters[0][1];
        for (let i = chapters.length - 1; i >= 0; i--) {
          if (t >= chapters[i][0]) {
            ch = chapters[i][1];
            break;
          }
        }
        document.getElementById("hud-chapter").textContent = ch;
      });
    </script>
