<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>TelexRoom30 — Night Relay Hall</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1510; }
      #composition-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1a1510; }
      #global-hud {
        position: absolute; inset: 0; z-index: 100; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 88px 64px; font-family: 'Courier Prime', monospace; color: #D4A574;
      }
      .hud-row { display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 0.16em; }
      .hud-clock { color: #EDE6D9; font-size: 18px; }
      .letterbox { position: absolute; left: 0; width: 1080px; height: 36px; background: #0f0c09; z-index: 110; }
      .lb-top { top: 0; }
      .lb-bottom { bottom: 0; }
    </style>
  </head>
  <body>
    <div
      id="composition-root"
      data-composition-id="TelexRoom30"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div class="letterbox lb-top"></div>
      <div class="letterbox lb-bottom"></div>

      <iframe
        class="clip"
        data-composition-id="TelexRoom30-clip-01"
        data-composition-src="compositions/TelexRoom30/TelexRoom30-clip-01.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>
      <iframe
        class="clip"
        data-composition-id="TelexRoom30-clip-02"
        data-composition-src="compositions/TelexRoom30/TelexRoom30-clip-02.html"
        data-start="5"
        data-duration="5"
        data-track-index="2"
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>
      <iframe
        class="clip"
        data-composition-id="TelexRoom30-clip-03"
        data-composition-src="compositions/TelexRoom30/TelexRoom30-clip-03.html"
        data-start="10"
        data-duration="5"
        data-track-index="3"
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>
      <iframe
        class="clip"
        data-composition-id="TelexRoom30-clip-04"
        data-composition-src="compositions/TelexRoom30/TelexRoom30-clip-04.html"
        data-start="15"
        data-duration="5"
        data-track-index="4"
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>
      <iframe
        class="clip"
        data-composition-id="TelexRoom30-clip-05"
        data-composition-src="compositions/TelexRoom30/TelexRoom30-clip-05.html"
        data-start="20"
        data-duration="5"
        data-track-index="5"
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>
      <iframe
        class="clip"
        data-composition-id="TelexRoom30-clip-06"
        data-composition-src="compositions/TelexRoom30/TelexRoom30-clip-06.html"
        data-start="25"
        data-duration="5"
        data-track-index="6"
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; border: none; z-index: 1"
      ></iframe>

      <div id="global-hud">
        <div class="hud-row">
          <span>TELEXROOM30 // NIGHT RELAY</span>
          <span id="hud-time" class="hud-clock">00:00.0</span>
        </div>
        <div class="hud-row">
          <span id="hud-chapter">I — COLD OPEN</span>
          <span>30.00s CINEMATIC</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["TelexRoom30"] = gsap.timeline({ paused: true });
      const chapters = [
        [0, "I — COLD OPEN"],
        [5, "II — ROTOR"],
        [10, "III — TAPE"],
        [15, "IV — ROUTING"],
        [20, "V — TRACE"],
        [25, "VI — HOLD"],
      ];
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        const sec = Math.floor(t).toString().padStart(2, "0");
        const dec = Math.floor((t % 1) * 10);
        document.getElementById("hud-time").textContent = `00:${sec}.${dec}`;
        let ch = chapters[0][1];
        for (let i = chapters.length - 1; i >= 0; i--) {
          if (t >= chapters[i][0]) {
            ch = chapters[i][1];
            break;
          }
        }
        document.getElementById("hud-chapter").textContent = ch;
      });
    </script>
  </body>
</html>
