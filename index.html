<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Chrono-Fracture: The Metamorphosis of Time</title>
    <script src="compositions/_shared/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070709; }
      #composition-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070709; }
    </style>
  </head>
  <body>
    <div
      id="composition-root"
      data-composition-id="OriginalSpot"
      data-start="0"
      data-duration="30.00"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <iframe class="clip" data-composition-id="OriginalSpot-clip-01" data-composition-src="compositions/OriginalSpot/OriginalSpot-clip-01.html" data-start="0" data-duration="10" data-track-index="1" style="position:absolute;inset:0;width:1080px;height:1920px;border:none;z-index:1"></iframe>
      <iframe class="clip" data-composition-id="OriginalSpot-clip-02" data-composition-src="compositions/OriginalSpot/OriginalSpot-clip-02.html" data-start="10" data-duration="10" data-track-index="2" style="position:absolute;inset:0;width:1080px;height:1920px;border:none;z-index:1"></iframe>
      <iframe class="clip" data-composition-id="OriginalSpot-clip-03" data-composition-src="compositions/OriginalSpot/OriginalSpot-clip-03.html" data-start="20" data-duration="10" data-track-index="3" style="position:absolute;inset:0;width:1080px;height:1920px;border:none;z-index:1"></iframe>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["OriginalSpot"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
